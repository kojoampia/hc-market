      # This service's identity in Consul and on the shared bus. The rest of the Consul
      # settings are on the x-service anchor above; only these three differ per service.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-quality-messaging
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-quality-messaging
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-messaging
      OTEL_SERVICE_NAME: hc-market-messaging
      # An explicit consumer group. Without one an anonymous group is generated per
      # instance: no committed offsets, so a restart resumes at the end of the log and
      # everything published in between is gone. Worse, two applications landing in the
      # same generated group split the partitions and each sees about half, silently —
      # and five services in one stack makes that a near certainty rather than a risk.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-messaging
      SPRING_DATASOURCE_URL: jdbc:postgresql://messaging-db:5432/healthconnectMessaging
      SPRING_DATASOURCE_USERNAME: healthconnectMessaging
      SPRING_LIQUIBASE_CONTEXTS: dev
      HEALTHCONNECT_SEED_ENABLED: "true"
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      HEALTHCONNECT_SEED_ANCHOR_DATES: "true"
    # Long form, not "${SEED_DIR:-./seed}:/app/seed:ro". The short syntax is split on colons,
    # and an uninterpolated ${VAR:-default} source carries two of its own — so
    # `docker compose config --no-interpolate`, which .github/checks/pepper-wiring.sh needs in
    # order to read each service's merged environment without evaluating the `:?` guards it is
    # checking for, fails the whole file with "too many colons". Newer compose tolerates it;
    # the CI runner's does not. Long form has nothing to split.
    volumes:
      - type: bind
        source: ${SEED_DIR:-./seed}
        target: /app/seed
        read_only: true
    depends_on:
      messaging-db: { condition: service_healthy }

  payout:
    <<: *service
    image: ${REGISTRY:-healthconnect}${IMAGE_SEP:-/}payout:${TAG:?set by startup.sh}
    container_name: hc-market-quality-payout
    ports: ["127.0.0.1:${PAYOUT_PORT:-18103}:8080"]
    environment:
      <<: *service-env
      # This service's identity in Consul and on the shared bus. The rest of the Consul
      # settings are on the x-service anchor above; only these three differ per service.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-quality-payout
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-quality-payout
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-payout
      OTEL_SERVICE_NAME: hc-market-payout
      # An explicit consumer group. Without one an anonymous group is generated per
      # instance: no committed offsets, so a restart resumes at the end of the log and
      # everything published in between is gone. Worse, two applications landing in the
      # same generated group split the partitions and each sees about half, silently —
      # and five services in one stack makes that a near certainty rather than a risk.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-payout
      SPRING_DATASOURCE_URL: jdbc:postgresql://payout-db:5432/healthconnectPayout
      SPRING_DATASOURCE_USERNAME: healthconnectPayout
      # Overview's "next up" card. Degrades to nextUpAvailable=false if booking is down.
      HEALTHCONNECT_BOOKING_BASE_URL: http://booking:8080
      SPRING_LIQUIBASE_CONTEXTS: dev
      HEALTHCONNECT_SEED_ENABLED: "true"
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      HEALTHCONNECT_SEED_ANCHOR_DATES: "true"
      # --- The founding brokerage terms (decisions.md D57, backlog NEW-18) -------------------------
      #
      # BrokerageBootstrap writes ONE brokerage_config row from these, only into an EMPTY table, on
      # every environment INCLUDING prod. Before D57 nothing outside the seed could write one, and
      # production does not seed -- so the table was empty, the first booking.completed threw and the
      # consumer retried it for ever with no ledger row and no earnings, and every receipt was a 503.
      # THIS IS NOT THE SEED and shares none of the three variables above.
      #
      # THE QUALITY BOX CANNOT DEMONSTRATE THE DEFECT OR ITS FIX, which is a large part of why it
      # survived: this stack seeds, so brokerage_config was never empty here. What quality does prove
      # is the other half -- that the bootstrap stands down against a table that already holds a row.
      #
      # All five may be left unset and an estate that sets none is priced correctly; the defaults are
      # the prototype's own, held in FoundingTerms. Passed anyway, because a variable this repository
      # documents and no compose file carries silently does nothing (D46, D50). Blank is absent.
      HC_BROKERAGE_COMMISSION_RATE: ${HC_BROKERAGE_COMMISSION_RATE:-}
      HC_BROKERAGE_PAYOUT_LAG_DAYS: ${HC_BROKERAGE_PAYOUT_LAG_DAYS:-}
      HC_BROKERAGE_FREE_CANCELLATION_HOURS: ${HC_BROKERAGE_FREE_CANCELLATION_HOURS:-}
      HC_BROKERAGE_LATE_CANCELLATION_PCT: ${HC_BROKERAGE_LATE_CANCELLATION_PCT:-}
      HC_BROKERAGE_CURRENCY: ${HC_BROKERAGE_CURRENCY:-}
    # Long form, not "${SEED_DIR:-./seed}:/app/seed:ro". The short syntax is split on colons,
    # and an uninterpolated ${VAR:-default} source carries two of its own — so
    # `docker compose config --no-interpolate`, which .github/checks/pepper-wiring.sh needs in
    # order to read each service's merged environment without evaluating the `:?` guards it is
    # checking for, fails the whole file with "too many colons". Newer compose tolerates it;
    # the CI runner's does not. Long form has nothing to split.
    volumes:
      - type: bind
        source: ${SEED_DIR:-./seed}
        target: /app/seed
        read_only: true
    depends_on:
      payout-db: { condition: service_healthy }

networks:
  quality:
    name: hc-market-quality
  # The observability plane, owned by the quality monitoring stack in ~/work/infra
  # (infrastructure/quality/monitoring/services) — decisions.md D64, backlog NEW-24. Its compose
  # states the contract: `qualitynet` is what lets Alloy reach these containers and lets these
  # containers resolve `otel-collector`. The collector publishes on 127.0.0.1:4327/4328, which is the
  # HOST's loopback and not a container's, so without this network the agent could be attached and
  # would export into nothing — a service that starts, serves, reports healthy and says nothing.
  #
  # EXTERNAL, and created by startup.sh when it is missing. Both halves are deliberate and they pull
  # opposite ways, which is why they are written down (D64 §3):
  #
  #   external, because several application stacks join it and none of them owns it. Without it,
  #   ownership of the collector's network becomes a function of START ORDER — measured on a
  #   throwaway project, and narrower than D64 first claimed. With `name:` kept, as it is below, a
  #   non-external declaration ADOPTS a network that already exists: no error, no label written, and
  #   `down` leaves it standing. (The decoy `hc-market-quality_qualitynet` appears only if `name:` is
  #   dropped as well, which is a mutation this file does not admit.) The branch that bites is the
  #   one this whole decision is about: monitoring downed and the network ABSENT, where compose
  #   creates `qualitynet` carrying THIS project's `com.docker.compose.project` label, and `down`
  #   then tries to remove it — refused with "Resource is still in use" while a sibling endpoint is
  #   attached, and succeeding the moment the siblings are stopped too, which is what a reboot or a
  #   full estate restart looks like. `external: true` gives the same answer on every host.
  #
  #   created rather than merely required, because `docker compose up` refuses outright on a missing
  #   external network (measured: exit 1, "declared as external, but could not be found"), and that
  #   would make hc-market's quality stack unstartable whenever somebody had `down`ed a monitoring
  #   project in a different repository. `config` and `down` are unaffected (both exit 0).
  #
  # This is the OPPOSITE call to hcnet below, and the difference is what absence means. No hcnet
  # means the estate's broker and Consul are down, and a stack that starts anyway publishes into
  # nowhere in silence — so that one is checked and refused. No qualitynet means only that nothing is
  # collecting, which costs this stack nothing at all while no agent is attached.
  qualitynet:
    external: true
    name: ${HC_OTEL_NETWORK:-qualitynet}
  # The application plane: where the shared Kafka and Consul live. External because hc-infra owns it
  # and every stack joins it — a network compose owns is a network compose deletes, and a
  # `docker compose down` here must not take the estate's event bus with it.
  # Created by hc-infra/startup.sh; this stack will not start without it.
  #
  # HC_SHARED_NETWORK is read here and by startup.sh, the third of D66's trio and the only one of
  # them that names a network rather than a container. startup.sh exports it on every action,
  # teardown included, so a `--down` cannot address a different plane from the `up` that made the
  # containers — the same property `qualitynet` above relies on.
  #
  # NOTHING IS CREATED HERE, and that stays the opposite call to qualitynet. A missing hcnet means
  # the estate's broker and Consul are down, and a stack that starts anyway publishes into nowhere
  # in silence (D27), so preflight refuses and prints hc-infra's start command. It refuses on
  # MEMBERSHIP too, since D66: an override naming a network that exists and does not carry the
  # broker used to pass every check this file's start depends on, and the success line then claimed
  # a plane it had never looked for.
  hcnet:
    external: true
    name: ${HC_SHARED_NETWORK:-hcnet}

volumes:
  gateway-data:
  catalog-data:
  booking-data:
  messaging-data:
  payout-data:
