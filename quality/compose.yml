# The hc-market stack on jacserver: seeded, at a hostname, behind the same proxy chain as production.
#
# Started by ./startup.sh, which generates the .env this file reads. Shaped after
# hc-admin/quality/compose.yml deliberately, so the two read side by side; the differences below are
# the ones that matter.
#
# --- THE FRONT DOOR IS THE GATEWAY, NOT A WEB CONTAINER ---------------------------------------
#
# Every sibling quality stack has a `web` container that serves an Angular app and proxies the API
# paths onward. hc-market has none, and will not: spec §2 settled that this product is API-only and
# JHipster generates no SPA for it. So jacserver's nginx proxies straight to the gateway, and the
# chain is one hop shorter than the siblings'. That is a real difference in what this stack can
# rehearse — the class of bug that lives between two nginxes cannot appear here, because there is
# only one.
#
# --- CONSUL REGISTERS, AND IT DOES NOT ROUTE ---------------------------------------------------
#
# Two separate statements, and this section read "CONSUL IS OFF" until 2026-08-31. What changed is
# registration, and only registration: these five services now register with hc-shared-quality-consul
# and appear in its catalog with health checks, as every sibling quality stack does.
#
# The gateway still routes STATICALLY — DISCOVERY_LOCATOR_ENABLED stays "false" and the four
# hand-written routes below are what it uses, for the same reason production does it. Discovery-based
# routing is a development convenience; turning it on here would mean testing a routing mechanism
# production does not use, and would replace those four routes with whatever happens to be registered
# on the host.
name: hc-market-quality

x-service: &service
  restart: unless-stopped
  # hcnet is where the shared broker and Consul live. The DATABASES deliberately stay on `quality`
  # alone — nothing on the shared plane should reach a product's Postgres, and keeping them off is
  # also what keeps `gateway-db`, `catalog-db` and the rest unambiguous without rewriting them.
  networks: [quality, hcnet]
  environment: &service-env
    # BOTH profiles, and that is load-bearing rather than habit. SeedDataLoader is
    # @Profile("test & dev") — it requires both, never one alone — so `dev,test` is precisely what
    # makes this stack seeded. Change it to `dev` and the estate comes up correct and empty.
    SPRING_PROFILES_ACTIVE: dev,test
    SERVER_PORT: "8080"
    # --- The shared plane ----------------------------------------------------------------------
    #
    # THE SHARED BROKER, by container name, and BOTH property names. hc-market talks to Kafka through
    # Spring Kafka directly and reads SPRING_KAFKA_BOOTSTRAP_SERVERS; its siblings bind through
    # Spring Cloud Stream and read SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS. Setting only the one a
    # service happens to use today is how the other quietly keeps pointing somewhere else.
    #
    # Never `kafka`. These containers are on hcnet with every other stack; a short name resolves
    # across every network a container is on and answers with whichever docker picks.
    SPRING_KAFKA_BOOTSTRAP_SERVERS: hc-shared-quality-kafka:9092
    SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: hc-shared-quality-kafka:9092
    # --- Shared Consul: REGISTERS, does not ROUTE ------------------------------------------------
    #
    # Two separate statements. These five services now register with hc-shared-quality-consul and
    # appear in its catalog with health checks. The gateway still routes STATICALLY — see
    # DISCOVERY_LOCATOR_ENABLED on it, which stays false, and the four hand-written routes beneath
    # that would otherwise be replaced by whatever happens to be registered on the host. Production
    # routes statically; discovery here would rehearse a mechanism production does not use.
    #
    # PREFER_IP_ADDRESS false, and each service sets its own DISCOVERY_HOSTNAME to its container
    # name below. These containers are on two networks and so have two addresses; Spring picks one
    # and Consul health-checks whatever it was handed. Pick the wrong one and the service registers,
    # then flaps critical — and the registration reads as the broken thing rather than the address.
    SPRING_CLOUD_CONSUL_HOST: hc-shared-quality-consul
    SPRING_CLOUD_CONSUL_PORT: "8500"
    SPRING_CLOUD_CONSUL_ENABLED: "true"
    SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED: "true"
    SPRING_CLOUD_CONSUL_DISCOVERY_REGISTER: "true"
    SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "false"
    SPRING_CLOUD_CONSUL_DISCOVERY_HEALTH_CHECK_PATH: /management/health
    SPRING_CLOUD_CONSUL_DISCOVERY_HEALTH_CHECK_INTERVAL: 10s
    # KV-backed config stays OFF: the prefix is empty, and an application reading config from a store
    # with nothing in it starts identically to one that does not — until somebody adds a key.
    SPRING_CLOUD_CONSUL_CONFIG_ENABLED: "false"
    # Never fail-fast: a Consul merely slow to elect a leader would otherwise take all five services
    # down at startup, making the shared plane a hard dependency. It is meant to be an optional one.
    SPRING_CLOUD_CONSUL_CONFIG_FAIL_FAST: "false"
    # One signing key across the estate, as in production. A per-service override silently wins and
    # presents as a successful login followed by 401s from the services — a broken route, seemingly.
    JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:?set by startup.sh}
    # The erasure pepper — decisions.md D35. Keys the HMAC behind an erased customer's alias; one
    # value across booking, catalog and messaging or one person acquires three of them. Generated
    # and persisted by startup.sh alongside the signing key, and required here rather than defaulted
    # because a value written into a public repository is not a pepper.
    HEALTHCONNECT_PRIVACY_PEPPER: ${HC_PRIVACY_PEPPER:?set by startup.sh}
    JAVA_OPTS: -Xmx512m -Xms256m
  # The images are built by Jib and contain NO curl and NO wget — a CMD-based HTTP healthcheck fails
  # with "executable file not found" on every attempt and the container never leaves `starting`.
  # They do contain bash, so this speaks HTTP over bash's /dev/tcp with no external tools at all.
  healthcheck: &health
    test:
      - CMD
      - bash
      - -c
      - 'exec 3<>/dev/tcp/localhost/8080 && printf "GET /management/health HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3'
    interval: 10s
    timeout: 5s
    retries: 40
    start_period: 60s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-postgres: &postgres
  image: postgres:17
  restart: unless-stopped
  networks: [quality]
  environment: &pg-env
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 10s

services:
  # ------------------------------------------------------------------ infrastructure --
  # --- THERE IS NO BROKER HERE, AND THAT IS THE POINT ------------------------------------------
  #
  # This stack ran its own single-node Kafka (`hc-market-quality-kafka`) until 2026-08-31. No
  # deployment in this estate declares its own broker or its own Consul any more: both live once, in
  # hc-infra, and every stack points at them by container name. hc-market was the last exception.
  #
  # Four brokers is the same as no broker — four disjoint logs, every cross-product event path
  # configured and never once exercised, and every stack green while it was wrong.
  #
  # Bring the shared plane up first; these services depend on it and it is not in this file:
  #     cd /home/kojo/webroot/01-healthconnect/hc-infra && ./startup.sh
  #
  # The five `depends_on: kafka: service_healthy` entries went with it — they cannot be expressed
  # once the broker is not a service in this project. `restart: unless-stopped` plus the client's own
  # retry covers a broker that starts second; nothing covers a broker that is not running at all, so
  # `./startup.sh --status` is the check when something looks wrong.

  # The gateway owns users on MongoDB (decisions.md D1) — a SQL gateway is forced to Spring Boot 3
  # by JHipster's springBoot4 rule, and this estate is uniformly Boot 4.
  gateway-db:
    image: mongo:8
    container_name: hc-market-quality-gateway-db
    restart: unless-stopped
    networks: [quality]
    volumes: [gateway-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  catalog-db:
    <<: *postgres
    container_name: hc-market-quality-catalog-db
    environment: { <<: *pg-env, POSTGRES_USER: healthconnectCatalog, POSTGRES_DB: healthconnectCatalog }
    volumes: [catalog-data:/var/lib/postgresql/data]

  booking-db:
    <<: *postgres
    container_name: hc-market-quality-booking-db
    environment: { <<: *pg-env, POSTGRES_USER: healthconnectBooking, POSTGRES_DB: healthconnectBooking }
    volumes: [booking-data:/var/lib/postgresql/data]

  messaging-db:
    <<: *postgres
    container_name: hc-market-quality-messaging-db
    environment: { <<: *pg-env, POSTGRES_USER: healthconnectMessaging, POSTGRES_DB: healthconnectMessaging }
    volumes: [messaging-data:/var/lib/postgresql/data]

  payout-db:
    <<: *postgres
    container_name: hc-market-quality-payout-db
    environment: { <<: *pg-env, POSTGRES_USER: healthconnectPayout, POSTGRES_DB: healthconnectPayout }
    volumes: [payout-data:/var/lib/postgresql/data]

  # ----------------------------------------------------------------------- services --
  #
  # The gateway is the edge. jacserver's nginx proxies to GATEWAY_PORT and nothing else needs to be
  # reachable — but the four domain services publish on 127.0.0.1 anyway, because diagnosing "the
  # gateway returns 502" without being able to ask the service directly is guesswork.
  #
  # IMAGE_SEP is "/" for local images (healthconnect/gateway) and "-" for ghcr
  # (ghcr.io/kojoampia/hc-market-gateway). GHCR has no nested-path namespaces, so
  # ghcr.io/kojoampia/hc-market/gateway is not a name that can exist — the separator is not
  # cosmetic. deploy-prod.sh switches the same way for the same reason.
  gateway:
    <<: *service
    image: ${REGISTRY:-healthconnect}${IMAGE_SEP:-/}gateway:${TAG:?set by startup.sh}
    container_name: hc-market-quality-gateway
    ports: ["127.0.0.1:${GATEWAY_PORT:-15509}:8080"]
    environment:
      <<: *service-env
      # This service's identity in Consul and on the shared bus. The rest of the Consul
      # settings are on the x-service anchor above; only these three differ per service.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-quality-gateway
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-quality-gateway
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-gateway
      # An explicit consumer group. Without one an anonymous group is generated per
      # instance: no committed offsets, so a restart resumes at the end of the log and
      # everything published in between is gone. Worse, two applications landing in the
      # same generated group split the partitions and each sees about half, silently —
      # and five services in one stack makes that a near certainty rather than a risk.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-gateway
      # SPRING_MONGODB_URI, not SPRING_DATA_MONGODB_URI: Spring Boot 4 moved the MongoDB properties,
      # and the old name sets something nothing reads — the gateway then dies inside Mongock with
      # "Connection refused ... localhost:27017", pointing at the database rather than the variable.
      SPRING_MONGODB_URI: mongodb://gateway-db:27017/healthconnectGateway
      # Static routes, because the discovery LOCATOR is off — not because Consul is (it is on, for
      # registration; see the header). Without these the gateway starts, answers /management
      # perfectly, and 404s every /services/** path — a healthy edge in front of nothing.
      #
      # --- `/api/**`, NOT `/**`, AND THAT IS A SECURITY CONTROL ------------------------------
      #
      # These four predicates are the only thing keeping catalog's /internal/** off the internet
      # (decisions.md D28). It answers "who owns professional ref p1?" for the booking service, with
      # no token, because this estate has no service-to-service authentication — so what protects it
      # is that no gateway route matches it. Widen these back to `/**` and it is public.
      #
      # Nothing is lost by narrowing: every consumer in the repository already goes through /api/**,
      # and /management is reached per-container rather than through the edge.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_ENABLED: "false"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: healthconnectcatalog
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://catalog:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/services/healthconnectcatalog/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: healthconnectbooking
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://booking:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: Path=/services/healthconnectbooking/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: healthconnectmessaging
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://messaging:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: Path=/services/healthconnectmessaging/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID: healthconnectpayout
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI: http://payout:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0: Path=/services/healthconnectpayout/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_FILTERS_0: StripPrefix=2
    depends_on:
      gateway-db: { condition: service_healthy }

  catalog:
    <<: *service
    image: ${REGISTRY:-healthconnect}${IMAGE_SEP:-/}catalog:${TAG:?set by startup.sh}
    container_name: hc-market-quality-catalog
    ports: ["127.0.0.1:${CATALOG_PORT:-18100}:8080"]
    environment:
      <<: *service-env
      # This service's identity in Consul and on the shared bus. The rest of the Consul
      # settings are on the x-service anchor above; only these three differ per service.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-quality-catalog
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-quality-catalog
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-catalog
      # An explicit consumer group. Without one an anonymous group is generated per
      # instance: no committed offsets, so a restart resumes at the end of the log and
      # everything published in between is gone. Worse, two applications landing in the
      # same generated group split the partitions and each sees about half, silently —
      # and five services in one stack makes that a near certainty rather than a risk.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-catalog
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/healthconnectCatalog
      SPRING_DATASOURCE_USERNAME: healthconnectCatalog
      # 'faker' omitted deliberately: it loads 30 nonsense rows per entity, and because the seed
      # loader is idempotent on "are there any professionals yet?", those rows make it SKIP the real
      # seed and log "seed already present". The symptom is 30 professionals instead of 18.
      SPRING_LIQUIBASE_CONTEXTS: dev
      HEALTHCONNECT_SEED_ENABLED: "true"
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      # Dates loaded exactly as written, so the figures this stack shows are the prototype's own and
      # can be compared against it directly. A shifting seed is right for a demo and wrong for a
      # place whose purpose is catching drift.
      HEALTHCONNECT_SEED_ANCHOR_DATES: "true"
      HEALTHCONNECT_BOOKING_BASE_URL: http://booking:8080
    volumes: ["${SEED_DIR:-./seed}:/app/seed:ro"]
    depends_on:
      catalog-db: { condition: service_healthy }

  booking:
    <<: *service
    image: ${REGISTRY:-healthconnect}${IMAGE_SEP:-/}booking:${TAG:?set by startup.sh}
    container_name: hc-market-quality-booking
    ports: ["127.0.0.1:${BOOKING_PORT:-18101}:8080"]
    environment:
      <<: *service-env
      # This service's identity in Consul and on the shared bus. The rest of the Consul
      # settings are on the x-service anchor above; only these three differ per service.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-quality-booking
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-quality-booking
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-booking
      # An explicit consumer group. Without one an anonymous group is generated per
      # instance: no committed offsets, so a restart resumes at the end of the log and
      # everything published in between is gone. Worse, two applications landing in the
      # same generated group split the partitions and each sees about half, silently —
      # and five services in one stack makes that a near certainty rather than a risk.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-booking
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/healthconnectBooking
      SPRING_DATASOURCE_USERNAME: healthconnectBooking
      # POST /api/bookings prices the booking from the catalogue and establishes who owns the
      # professional reference (decisions.md D22, D28). Both calls FAIL CLOSED, so without this the
      # create path 503s every time — which is exactly what it did in this stack until 2026-08-31,
      # in silence: the ITs mock CatalogClient, and the read paths every health check exercises are
      # unaffected. Found by driving a real booking from the prototype.
      HEALTHCONNECT_CATALOG_BASE_URL: http://catalog:8080
      # The receipt modal asks payout for the brokerage split. Fails closed by design.
      HEALTHCONNECT_PAYOUT_BASE_URL: http://payout:8080
      SPRING_LIQUIBASE_CONTEXTS: dev
      HEALTHCONNECT_SEED_ENABLED: "true"
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      HEALTHCONNECT_SEED_ANCHOR_DATES: "true"
    volumes: ["${SEED_DIR:-./seed}:/app/seed:ro"]
    depends_on:
      booking-db: { condition: service_healthy }

  messaging:
    <<: *service
    image: ${REGISTRY:-healthconnect}${IMAGE_SEP:-/}messaging:${TAG:?set by startup.sh}
    container_name: hc-market-quality-messaging
    ports: ["127.0.0.1:${MESSAGING_PORT:-18102}:8080"]
    environment:
      <<: *service-env
      # This service's identity in Consul and on the shared bus. The rest of the Consul
      # settings are on the x-service anchor above; only these three differ per service.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-quality-messaging
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-quality-messaging
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-messaging
      # An explicit consumer group. Without one an anonymous group is generated per
      # instance: no committed offsets, so a restart resumes at the end of the log and
      # everything published in between is gone. Worse, two applications landing in the
      # same generated group split the partitions and each sees about half, silently —
      # and five services in one stack makes that a near certainty rather than a risk.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-messaging
      SPRING_DATASOURCE_URL: jdbc:postgresql://messaging-db:5432/healthconnectMessaging
      SPRING_DATASOURCE_USERNAME: healthconnectMessaging
      SPRING_LIQUIBASE_CONTEXTS: dev
      HEALTHCONNECT_SEED_ENABLED: "true"
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      HEALTHCONNECT_SEED_ANCHOR_DATES: "true"
    volumes: ["${SEED_DIR:-./seed}:/app/seed:ro"]
    depends_on:
      messaging-db: { condition: service_healthy }

  payout:
    <<: *service
    image: ${REGISTRY:-healthconnect}${IMAGE_SEP:-/}payout:${TAG:?set by startup.sh}
    container_name: hc-market-quality-payout
    ports: ["127.0.0.1:${PAYOUT_PORT:-18103}:8080"]
    environment:
      <<: *service-env
      # This service's identity in Consul and on the shared bus. The rest of the Consul
      # settings are on the x-service anchor above; only these three differ per service.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-quality-payout
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-quality-payout
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-payout
      # An explicit consumer group. Without one an anonymous group is generated per
      # instance: no committed offsets, so a restart resumes at the end of the log and
      # everything published in between is gone. Worse, two applications landing in the
      # same generated group split the partitions and each sees about half, silently —
      # and five services in one stack makes that a near certainty rather than a risk.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-payout
      SPRING_DATASOURCE_URL: jdbc:postgresql://payout-db:5432/healthconnectPayout
      SPRING_DATASOURCE_USERNAME: healthconnectPayout
      # Overview's "next up" card. Degrades to nextUpAvailable=false if booking is down.
      HEALTHCONNECT_BOOKING_BASE_URL: http://booking:8080
      SPRING_LIQUIBASE_CONTEXTS: dev
      HEALTHCONNECT_SEED_ENABLED: "true"
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      HEALTHCONNECT_SEED_ANCHOR_DATES: "true"
    volumes: ["${SEED_DIR:-./seed}:/app/seed:ro"]
    depends_on:
      payout-db: { condition: service_healthy }

networks:
  quality:
    name: hc-market-quality
  # The application plane: where the shared Kafka and Consul live. External because hc-infra owns it
  # and every stack joins it — a network compose owns is a network compose deletes, and a
  # `docker compose down` here must not take the estate's event bus with it.
  # Created by hc-infra/startup.sh; this stack will not start without it.
  hcnet:
    external: true
    name: hcnet

volumes:
  gateway-data:
  catalog-data:
  booking-data:
  messaging-data:
  payout-data:
