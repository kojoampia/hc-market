# The hc-market stack on jacserver: seeded, at a hostname, behind the same proxy chain as production.
#
# Started by ./startup.sh, which generates the .env this file reads. Shaped after
# hc-admin/quality/compose.yml deliberately, so the two read side by side; the differences below are
# the ones that matter.
#
# --- THE FRONT DOOR IS THE GATEWAY, NOT A WEB CONTAINER ---------------------------------------
#
# Every sibling quality stack has a `web` container that serves an Angular app and proxies the API
# paths onward. hc-market has none, and will not: spec §2 settled that this product is API-only and
# JHipster generates no SPA for it. So jacserver's nginx proxies straight to the gateway, and the
# chain is one hop shorter than the siblings'. That is a real difference in what this stack can
# rehearse — the class of bug that lives between two nginxes cannot appear here, because there is
# only one.
#
# --- CONSUL REGISTERS, AND IT DOES NOT ROUTE ---------------------------------------------------
#
# Two separate statements, and this section read "CONSUL IS OFF" until 2026-08-31. What changed is
# registration, and only registration: these five services now register with hc-shared-quality-consul
# and appear in its catalog with health checks, as every sibling quality stack does.
#
# The gateway still routes STATICALLY — DISCOVERY_LOCATOR_ENABLED stays "false" and the four
# hand-written routes below are what it uses, for the same reason production does it. Discovery-based
# routing is a development convenience; turning it on here would mean testing a routing mechanism
# production does not use, and would replace those four routes with whatever happens to be registered
# on the host.
name: hc-market-quality

x-service: &service
  restart: unless-stopped
  # THREE networks, and each is a different plane with a different owner (decisions.md D64).
  #
  #   quality     this project's own — the five databases and nothing else share it
  #   qualitynet  the quality MONITORING stack's, in another repository. `otel-collector` resolves
  #               here and nowhere else, and Alloy reaches these containers over it. hc-market was
  #               the only quality stack on this host not joined to it (backlog NEW-24); all three
  #               siblings declare exactly this list.
  #   hcnet       the shared broker and Consul (hc-infra, D27)
  #
  # The DATABASES deliberately stay on `quality` alone — nothing on either shared plane should reach
  # a product's Postgres, and keeping them off is also what keeps `gateway-db`, `catalog-db` and the
  # rest unambiguous without rewriting them. This anchor is applied by the five app services only,
  # which is what makes that true by construction rather than by five separate edits.
  #
  # JOINING qualitynet ADDED NO NEW NAME COLLISION, and that was measured rather than assumed
  # (D64 §2). Compose publishes the service name as a DNS alias on every network a container joins,
  # so these five now answer to `gateway`, `catalog`, `booking`, `messaging` and `payout` there too.
  # Every application container on qualitynet is ALSO on hcnet — it is a subset — so every name pair
  # that could collide already collided, and `gateway` was already claimed by four stacks on hcnet
  # before this line changed. Re-measure with `getent hosts <name>` from inside a container if the
  # monitoring stack ever puts something new there; none of its eight service names is one of ours.
  networks: [quality, qualitynet, hcnet]
  environment: &service-env
    # BOTH profiles, and that is load-bearing rather than habit. SeedDataLoader is
    # @Profile("test & dev") — it requires both, never one alone — so `dev,test` is precisely what
    # makes this stack seeded. Change it to `dev` and the estate comes up correct and empty.
    SPRING_PROFILES_ACTIVE: dev,test
    SERVER_PORT: "8080"
    # --- The shared plane ----------------------------------------------------------------------
    #
    # THE SHARED BROKER, by container name, and BOTH property names. hc-market talks to Kafka through
    # Spring Kafka directly and reads SPRING_KAFKA_BOOTSTRAP_SERVERS; its siblings bind through
    # Spring Cloud Stream and read SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS. Setting only the one a
    # service happens to use today is how the other quietly keeps pointing somewhere else.
    #
    # Never `kafka`. These containers are on hcnet with every other stack; a short name resolves
    # across every network a container is on and answers with whichever docker picks.
    #
    # HC_SHARED_KAFKA IS READ HERE AND BY startup.sh, AND THAT PAIRING IS THE WHOLE OF D66. It was
    # read by the script alone until then (backlog NEW-25): `check_shared_plane` inspected whatever
    # the variable named while this line kept the literal, so an override preflight-checked one
    # broker and addressed another — worse than a variable that does nothing, because the check went
    # green against the plane you asked for. `docker-compose.dev.yml` has always had it this way and
    # is the shape being copied; CI asserts the two defaults below are the same string and, by
    # rendering this file a second time with the variable set, that the interpolation is real.
    #
    # THE VALUE NAMES A CONTAINER, not merely a resolvable name, because startup.sh `docker exec`s
    # it to ask Consul for a leader and Kafka for its api versions. That costs nothing: compose
    # publishes a container's OWN name as a DNS alias on every network it joins, so a container name
    # is always an address. The converse is false and is the trap — `shared-kafka`, hc-infra's
    # compose SERVICE name, resolves from inside these containers (measured: 172.21.0.5) and is not
    # a container `docker exec` can find. Preflight refuses it before compose renders anything.
    SPRING_KAFKA_BOOTSTRAP_SERVERS: ${HC_SHARED_KAFKA:-hc-shared-quality-kafka}:9092
    SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: ${HC_SHARED_KAFKA:-hc-shared-quality-kafka}:9092
    # --- Shared Consul: REGISTERS, does not ROUTE ------------------------------------------------
    #
    # Two separate statements. These five services now register with hc-shared-quality-consul and
    # appear in its catalog with health checks. The gateway still routes STATICALLY — see
    # DISCOVERY_LOCATOR_ENABLED on it, which stays false, and the four hand-written routes beneath
    # that would otherwise be replaced by whatever happens to be registered on the host. Production
    # routes statically; discovery here would rehearse a mechanism production does not use.
    #
    # PREFER_IP_ADDRESS false, and each service sets its own DISCOVERY_HOSTNAME to its container
    # name below. These containers are on two networks and so have two addresses; Spring picks one
    # and Consul health-checks whatever it was handed. Pick the wrong one and the service registers,
    # then flaps critical — and the registration reads as the broken thing rather than the address.
    #
    # HC_SHARED_CONSUL, like the broker above, is read here AND by startup.sh (D66, backlog NEW-25),
    # and the same container-name rule applies to it. The PORT is deliberately not overridable and
    # never has been: inside the containers Consul is always 8500 and the broker always 9092, and
    # hc-infra is the only thing that publishes either to the host. A value carrying its own port —
    # `other-consul:8501` — is refused by preflight rather than rendered, because it is not a
    # container name.
    SPRING_CLOUD_CONSUL_HOST: ${HC_SHARED_CONSUL:-hc-shared-quality-consul}
    SPRING_CLOUD_CONSUL_PORT: "8500"
    SPRING_CLOUD_CONSUL_ENABLED: "true"
    SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED: "true"
    SPRING_CLOUD_CONSUL_DISCOVERY_REGISTER: "true"
    SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: "false"
    SPRING_CLOUD_CONSUL_DISCOVERY_HEALTH_CHECK_PATH: /management/health
    SPRING_CLOUD_CONSUL_DISCOVERY_HEALTH_CHECK_INTERVAL: 10s
    # KV-backed config stays OFF: the prefix is empty, and an application reading config from a store
    # with nothing in it starts identically to one that does not — until somebody adds a key.
    SPRING_CLOUD_CONSUL_CONFIG_ENABLED: "false"
    # Never fail-fast: a Consul merely slow to elect a leader would otherwise take all five services
    # down at startup, making the shared plane a hard dependency. It is meant to be an optional one.
    SPRING_CLOUD_CONSUL_CONFIG_FAIL_FAST: "false"
    # One signing key across the estate, as in production. A per-service override silently wins and
    # presents as a successful login followed by 401s from the services — a broken route, seemingly.
    JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:?set by startup.sh}
    # The erasure pepper — decisions.md D35. Keys the HMAC behind an erased customer's alias; one
    # value across booking, catalog and messaging or one person acquires three of them. Generated
    # and persisted by startup.sh alongside the signing key, and required here rather than defaulted
    # because a value written into a public repository is not a pepper.
    HEALTHCONNECT_PRIVACY_PEPPER: ${HC_PRIVACY_PEPPER:?set by startup.sh}
    # Retention policy and controller registration — decisions.md D42, counsel 2026-09-03. Optional,
    # unlike the two above: counsel's ratified figures are the committed fallback in application.yml,
    # so quality runs the real policy without startup.sh having to know anything about it.
    #
    # HC_DPC_REGISTRATION stays unset here on purpose. Quality is the last gate before production and
    # its job is to look like production, but a registration number is a claim about a real
    # organisation and quality has no business asserting one. The desk reporting null is correct.
    HC_RETENTION_FINANCIAL_DAYS: ${HC_RETENTION_FINANCIAL_DAYS:-2190}
    HC_RETENTION_OPERATIONAL_DAYS: ${HC_RETENTION_OPERATIONAL_DAYS:-365}
    HC_DPC_REGISTRATION: ${HC_DPC_REGISTRATION:-}
    # --- OpenTelemetry: the agent is IN the image and is NOT attached here ----------------------
    #
    # decisions.md D63, backlog NEW-23. `/app/otel-javaagent.jar` is present in all five images at
    # 24,665,598 bytes — the Jib `combine.self="override"` wiring works and CI guards it by name —
    # and until D63 the line below read a hardcoded `-Xmx512m -Xms256m`, so no JVM in this estate
    # had ever been started with `-javaagent`. Not attaching it is now a decision rather than an
    # omission, and reversing it is one variable.
    #
    # WHY IT IS OFF, measured rather than assumed. This host DOES have a collector — the
    # `monitoring-quality` compose project in ~/work/infra, with otel-collector/grafana/mimir/loki/
    # tempo/alloy — and every container in it has been EXITED for days. Attached against a dead
    # OTLP endpoint the agent is loud, permanently: 35 ERROR lines with full stack traces in 150
    # seconds at the agent's OWN default intervals (18 logs, 13 spans, 3 metrics; nothing forced),
    # from io.opentelemetry.exporter.otlp.internal.HttpExporter. All five services on this box
    # currently carry ZERO ERROR lines across their entire life — a few hundred to a few thousand
    # log lines each, and the ZERO is the load-bearing half; the counts move with uptime and were
    # 271-2,821 when this was written. So attaching it unconditionally would replace the estate's
    # one free signal with about 840 ERROR lines an hour per service, for ever, and bury a real
    # one inside known noise.
    #
    # The siblings agree, and it is worth knowing they do: no hc-admin, hc-patient or
    # hc-professional QUALITY JVM carries `-javaagent` either, nor does either hc-vendor one —
    # eight sibling containers, read off /proc/1/cmdline.
    #
    # TO TURN IT ON: start the monitoring stack first, then
    #
    #   HC_OTEL_JAVA_OPTS='-javaagent:/app/otel-javaagent.jar -Dotel.exporter.otlp.endpoint=http://otel-collector:4317' \
    #     ./quality/startup.sh --local
    #
    # ONE VARIABLE, since D64. It was one variable plus one network until then — `otel-collector`
    # resolves on `qualitynet` and nothing else, and this was the only quality stack on this host not
    # joined to it (backlog NEW-24, now closed). The endpoint stays inside HC_OTEL_JAVA_OPTS rather
    # than becoming an OTEL_EXPORTER_OTLP_ENDPOINT beside the two variables below, deliberately: the
    # per-service name genuinely cannot go into one shared variable and the endpoint genuinely can,
    # and writing it in both places is how the two would eventually disagree (D64 §4).
    #
    # MEASURED 2026-09-10, and the agent is QUIET against a live collector (D73). D63's 35 ERROR
    # lines per 150 seconds were a DEAD-endpoint number; with `monitoring-quality` up and
    # `otel-collector` resolving on `qualitynet`, all five services ran with the agent attached at
    # **ERROR=0 and zero export failures**, and the collector accepted **73,566 spans** — 1,927 of
    # them from twenty deliberate requests — forwarding to Tempo and Mimir, where all five
    # `hc-market-*` service names now appear.
    #
    # THE DEFAULT STAYS EMPTY ANYWAY, and that is a decision rather than an oversight (D73 §3).
    # `monitoring-quality` is another repository's stack: it was exited from 2026-09-05 to
    # 2026-09-10 and can go down again, and the day it does an attached estate is back to 35 ERROR
    # lines per 150 seconds per service. An operator setting one variable is the right interface for
    # a dependency this repository does not control. Turning it on is the line below; leaving it on
    # across rolls is not something a compose default should decide.
    #
    # TWO variables, not one, copied from docker-compose.prod.yml deliberately. Folding the agent
    # flag into HC_JAVA_OPTS's default would mean an operator raising the heap silently detaches
    # the agent, and that failure is invisible: the service starts, serves, reports healthy and
    # goes quiet on the dashboards.
    JAVA_OPTS: ${HC_JAVA_OPTS:--Xmx512m -Xms256m} ${HC_OTEL_JAVA_OPTS:-}
    # Inert while no agent is attached — nothing in these services reads an OTEL_* variable. They
    # are set anyway because they are the only part of the switch that CANNOT go into one shared
    # variable, and without them a reversal reports five services as `unknown_service:java`.
    # `deployment.environment` is what keeps this estate separable from production's if they ever
    # reach one tenant; the service names match production's, exactly as this stack's Consul
    # service names already do.
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment=quality
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    # THE MICROMETER BRIDGE IS OPT-IN AND OFF BY DEFAULT, so this is set here rather than left to an
    # operator — decisions.md D85, backlog NEW-44. MEASURED with
    # `deploy/verify-micrometer-otlp-bridge.sh`: without this variable the agent attaches NO registry to
    # `Metrics.globalRegistry` and not one Micrometer meter is exported, while its own `jvm.*` series go
    # out regardless. With it, a counter and a gauge both cross. So `HC_OTEL_JAVA_OPTS` alone would
    # attach the agent and carry no `gateway_identity_*` at all — the documented switch silently doing
    # half the job, which is this repository's own recurring shape. Inert while no agent is attached:
    # nothing in these services reads an OTEL_* variable.
    OTEL_INSTRUMENTATION_MICROMETER_ENABLED: 'true'
  # The images are built by Jib and contain NO curl and NO wget — a CMD-based HTTP healthcheck fails
  # with "executable file not found" on every attempt and the container never leaves `starting`.
  # They do contain bash, so this speaks HTTP over bash's /dev/tcp with no external tools at all.
  healthcheck: &health
    test:
      - CMD
      - bash
      - -c
      - 'exec 3<>/dev/tcp/localhost/8080 && printf "GET /management/health HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3'
    interval: 10s
    timeout: 5s
    retries: 40
    # start_period COVERS THE JVM AND AGENT PHASE, and 60s did not -- decisions.md D89, backlog NEW-46.
    #
    # MEASURED on the roll to 4b18ac6, container start to Spring's own "Started" line: gateway 528s,
    # catalog 492s, messaging 561s, booking 592s, payout 641s. Spring's own figure is only 321-410s of
    # that, so 170-230s goes on the JVM and on the agent rewriting classes before Spring's clock starts
    # -- which is exactly the phase start_period exists for and exactly what nothing had budgeted.
    #
    # docker's ceiling was start_period + retries x interval = 60 + 400 = 460s, BELOW the 641s payout
    # actually took. Failures inside start_period do not count at all, so widening it is the right knob:
    # it buys time for a slow start without making a genuinely broken service look healthy for longer.
    # 300 + 400 = 700s now, above the measured worst case with headroom.
    #
    # CLAUDE.md said "startup takes ~2 minutes" and that was true before the agent was attached.
    start_period: 300s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-postgres: &postgres
  image: postgres:17
  restart: unless-stopped
  networks: [quality]
  environment: &pg-env
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
    interval: 10s
    timeout: 5s
    retries: 20
    start_period: 10s

services:
  # ------------------------------------------------------------------ infrastructure --
  # --- THERE IS NO BROKER HERE, AND THAT IS THE POINT ------------------------------------------
  #
  # This stack ran its own single-node Kafka (`hc-market-quality-kafka`) until 2026-08-31. No
  # deployment in this estate declares its own broker or its own Consul any more: both live once, in
  # hc-infra, and every stack points at them by container name. hc-market was the last exception.
  #
  # Four brokers is the same as no broker — four disjoint logs, every cross-product event path
  # configured and never once exercised, and every stack green while it was wrong.
  #
  # Bring the shared plane up first; these services depend on it and it is not in this file:
  #     cd /home/kojo/webroot/01-healthconnect/hc-infra && ./startup.sh
  #
  # The five `depends_on: kafka: service_healthy` entries went with it — they cannot be expressed
  # once the broker is not a service in this project. `restart: unless-stopped` plus the client's own
  # retry covers a broker that starts second; nothing covers a broker that is not running at all, so
  # `./startup.sh --status` is the check when something looks wrong.

  # The gateway owns users on MongoDB (decisions.md D1) — a SQL gateway is forced to Spring Boot 3
  # by JHipster's springBoot4 rule, and this estate is uniformly Boot 4.
  gateway-db:
    image: mongo:8
    container_name: hc-market-quality-gateway-db
    restart: unless-stopped
    networks: [quality]
    volumes: [gateway-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  catalog-db:
    <<: *postgres
    container_name: hc-market-quality-catalog-db
    environment: { <<: *pg-env, POSTGRES_USER: healthconnectCatalog, POSTGRES_DB: healthconnectCatalog }
    volumes: [catalog-data:/var/lib/postgresql/data]

  booking-db:
    <<: *postgres
    container_name: hc-market-quality-booking-db
    environment: { <<: *pg-env, POSTGRES_USER: healthconnectBooking, POSTGRES_DB: healthconnectBooking }
    volumes: [booking-data:/var/lib/postgresql/data]

  messaging-db:
    <<: *postgres
    container_name: hc-market-quality-messaging-db
    environment: { <<: *pg-env, POSTGRES_USER: healthconnectMessaging, POSTGRES_DB: healthconnectMessaging }
    volumes: [messaging-data:/var/lib/postgresql/data]

  payout-db:
    <<: *postgres
    container_name: hc-market-quality-payout-db
    environment: { <<: *pg-env, POSTGRES_USER: healthconnectPayout, POSTGRES_DB: healthconnectPayout }
    volumes: [payout-data:/var/lib/postgresql/data]

  # ----------------------------------------------------------------------- services --
  #
  # The gateway is the edge. jacserver's nginx proxies to GATEWAY_PORT and nothing else needs to be
  # reachable — but the four domain services publish on 127.0.0.1 anyway, because diagnosing "the
  # gateway returns 502" without being able to ask the service directly is guesswork.
  #
  # IMAGE_SEP is "/" for local images (healthconnect/gateway) and "-" for ghcr
  # (ghcr.io/kojoampia/hc-market-gateway). GHCR has no nested-path namespaces, so
  # ghcr.io/kojoampia/hc-market/gateway is not a name that can exist — the separator is not
  # cosmetic. deploy-prod.sh switches the same way for the same reason.
  gateway:
    <<: *service
    image: ${REGISTRY:-healthconnect}${IMAGE_SEP:-/}gateway:${TAG:?set by startup.sh}
    container_name: hc-market-quality-gateway
    ports: ["127.0.0.1:${GATEWAY_PORT:-15509}:8080"]
    environment:
      <<: *service-env
      # This service's identity in Consul and on the shared bus. The rest of the Consul
      # settings are on the x-service anchor above; only these three differ per service.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-quality-gateway
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-quality-gateway
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-gateway
      OTEL_SERVICE_NAME: hc-market-gateway
      # An explicit consumer group. Without one an anonymous group is generated per
      # instance: no committed offsets, so a restart resumes at the end of the log and
      # everything published in between is gone. Worse, two applications landing in the
      # same generated group split the partitions and each sees about half, silently —
      # and five services in one stack makes that a near certainty rather than a risk.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-gateway
      # SPRING_MONGODB_URI, not SPRING_DATA_MONGODB_URI: Spring Boot 4 moved the MongoDB properties,
      # and the old name sets something nothing reads — the gateway then dies inside Mongock with
      # "Connection refused ... localhost:27017", pointing at the database rather than the variable.
      SPRING_MONGODB_URI: mongodb://gateway-db:27017/healthconnectGateway
      # No GATEWAY_ADMIN_PASSWORD, deliberately — decisions.md D61. This box runs `dev,test`, so the
      # seeder creates `admin` and `user` with passwords derived from their own logins by a rule
      # written in InitialSetupMigration, in a public repository. That is the same bargain the rest of
      # this stack already makes: `dev,test` on one private LAN box, and the whole security story is
      # that it is not reachable from anywhere else. Production requires the variable instead.
      #
      # The accounts on the RUNNING box predate this and were written by the generated Mongock
      # changeunit, so they still hold the generator's published hashes until the volume is recreated
      # — `./quality/startup.sh --local --clean`. Nothing rewrites an existing account: the seeder
      # only creates what is missing, which is what lets a rotated password survive a restart.
      # Static routes, because the discovery LOCATOR is off — not because Consul is (it is on, for
      # registration; see the header). Without these the gateway starts, answers /management
      # perfectly, and 404s every /services/** path — a healthy edge in front of nothing.
      #
      # --- `/api/**`, NOT `/**`, AND THAT IS A SECURITY CONTROL ------------------------------
      #
      # These four predicates are the only thing keeping catalog's /internal/** off the internet
      # (decisions.md D28). It answers "who owns professional ref p1?" for the booking service, with
      # no token, because this estate has no service-to-service authentication — so what protects it
      # is that no gateway route matches it. Widen these back to `/**` and it is public.
      #
      # Nothing is lost by narrowing: every consumer in the repository already goes through /api/**,
      # and /management is reached per-container rather than through the edge.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_ENABLED: "false"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: healthconnectcatalog
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://catalog:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/services/healthconnectcatalog/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: healthconnectbooking
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://booking:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: Path=/services/healthconnectbooking/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: healthconnectmessaging
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://messaging:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: Path=/services/healthconnectmessaging/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID: healthconnectpayout
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI: http://payout:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0: Path=/services/healthconnectpayout/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_FILTERS_0: StripPrefix=2
      #
      # --- ROUTE 4 IS THE ONE EXCEPTION, AND IT IS DELIBERATE (decisions.md D45) -------------
      #
      # booking's payment webhook is NOT under /api, on purpose: D43 put it outside so that the
      # four predicates above would keep it off the internet while there was no provider to call
      # it. A provider that cannot reach it cannot confirm a payment, so WP-13 routes it -- and
      # routing it is TWO changes, not one. The gateway's generated security chain ends with
      # `.pathMatchers("/services/**").authenticated()` and authenticates BEFORE routing, so
      # without the permit in gateway/config/PaymentWebhookRouteConfiguration.java this route is a
      # webhook that silently never arrives: 401 at the edge, nothing in booking's log, and a
      # provider that retries until it files the payment as undelivered.
      #
      # Nothing else moves. The path stays /webhooks/** rather than /**, so booking's own API is
      # not published to anonymous callers, and catalog's /internal/** is untouched. What
      # authenticates a callback is the provider's signature over the raw body, checked inside
      # booking -- today every caller gets 401, because no adapter in the estate can verify one.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_ID: healthconnectbooking-webhooks
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_URI: http://booking:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_PREDICATES_0: Path=/services/healthconnectbooking/webhooks/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_FILTERS_0: StripPrefix=2
    depends_on:
      gateway-db: { condition: service_healthy }

  catalog:
    <<: *service
    image: ${REGISTRY:-healthconnect}${IMAGE_SEP:-/}catalog:${TAG:?set by startup.sh}
    container_name: hc-market-quality-catalog
    ports: ["127.0.0.1:${CATALOG_PORT:-18100}:8080"]
    environment:
      <<: *service-env
      # This service's identity in Consul and on the shared bus. The rest of the Consul
      # settings are on the x-service anchor above; only these three differ per service.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-quality-catalog
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-quality-catalog
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-catalog
      OTEL_SERVICE_NAME: hc-market-catalog
      # An explicit consumer group. Without one an anonymous group is generated per
      # instance: no committed offsets, so a restart resumes at the end of the log and
      # everything published in between is gone. Worse, two applications landing in the
      # same generated group split the partitions and each sees about half, silently —
      # and five services in one stack makes that a near certainty rather than a risk.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-catalog
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/healthconnectCatalog
      SPRING_DATASOURCE_USERNAME: healthconnectCatalog
      # 'faker' omitted deliberately: it loads 30 nonsense rows per entity, and because the seed
      # loader is idempotent on "are there any professionals yet?", those rows make it SKIP the real
      # seed and log "seed already present". The symptom is 30 professionals instead of 18.
      SPRING_LIQUIBASE_CONTEXTS: dev
      HEALTHCONNECT_SEED_ENABLED: "true"
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      # Dates loaded exactly as written, so the figures this stack shows are the prototype's own and
      # can be compared against it directly. A shifting seed is right for a demo and wrong for a
      # place whose purpose is catching drift.
      HEALTHCONNECT_SEED_ANCHOR_DATES: "true"
      HEALTHCONNECT_BOOKING_BASE_URL: http://booking:8080
    # Long form, not "${SEED_DIR:-./seed}:/app/seed:ro". The short syntax is split on colons,
    # and an uninterpolated ${VAR:-default} source carries two of its own — so
    # `docker compose config --no-interpolate`, which .github/checks/pepper-wiring.sh needs in
    # order to read each service's merged environment without evaluating the `:?` guards it is
    # checking for, fails the whole file with "too many colons". Newer compose tolerates it;
    # the CI runner's does not. Long form has nothing to split.
    volumes:
      - type: bind
        source: ${SEED_DIR:-./seed}
        target: /app/seed
        read_only: true
    depends_on:
      catalog-db: { condition: service_healthy }

  booking:
    <<: *service
    image: ${REGISTRY:-healthconnect}${IMAGE_SEP:-/}booking:${TAG:?set by startup.sh}
    container_name: hc-market-quality-booking
    ports: ["127.0.0.1:${BOOKING_PORT:-18101}:8080"]
    environment:
      <<: *service-env
      # This service's identity in Consul and on the shared bus. The rest of the Consul
      # settings are on the x-service anchor above; only these three differ per service.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-quality-booking
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-quality-booking
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-booking
      OTEL_SERVICE_NAME: hc-market-booking
      # An explicit consumer group. Without one an anonymous group is generated per
      # instance: no committed offsets, so a restart resumes at the end of the log and
      # everything published in between is gone. Worse, two applications landing in the
      # same generated group split the partitions and each sees about half, silently —
      # and five services in one stack makes that a near certainty rather than a risk.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-booking
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/healthconnectBooking
      SPRING_DATASOURCE_USERNAME: healthconnectBooking
      # POST /api/bookings prices the booking from the catalogue and establishes who owns the
      # professional reference (decisions.md D22, D28). Both calls FAIL CLOSED, so without this the
      # create path 503s every time — which is exactly what it did in this stack until 2026-08-31,
      # in silence: the ITs mock CatalogClient, and the read paths every health check exercises are
      # unaffected. Found by driving a real booking from the prototype.
      HEALTHCONNECT_CATALOG_BASE_URL: http://catalog:8080
      # The receipt modal asks payout for the brokerage split. Fails closed by design.
      HEALTHCONNECT_PAYOUT_BASE_URL: http://payout:8080
      # The erasure fan-out — decisions.md D38. Booking calls messaging's desk endpoint with a token
      # it mints from the estate signing key, so a complete erasure is one operator action.
      #
      # The CONTAINER name, not the short service name the two lines above use. `hcnet` is shared
      # with three sibling products and hc-market's dev stack, compose publishes a service name as a
      # DNS alias on every network it joins, and a duplicate does not error — Docker answers with
      # whichever it likes. The two above predate that rule and are load-bearing enough that changing
      # them belongs in its own change; a new one has no reason to be written the risky way.
      HEALTHCONNECT_MESSAGING_BASE_URL: http://hc-market-quality-messaging:8080
      # The customer's email address, for a payment provider that needs one — decisions.md D72 §3,
      # D74. Booking asks the gateway's GET /internal/customers/{login}/email with a second
      # short-lived token (ContactLookupToken, NOT the erasure one).
      #
      # The CONTAINER name, for the reason given in the note above: `gateway` on hcnet is a four-way
      # claim across this workspace's products, and a new address has no reason to be written the
      # risky way. Note also what this stack CANNOT demonstrate: the eighteen seeded customers are
      # rows in catalog, booking, messaging and payout and are NOT gateway accounts, so a lookup for
      # one of them is a legitimate 404. `admin` and `user` are the only logins here with an email.
      HEALTHCONNECT_GATEWAY_BASE_URL: http://hc-market-quality-gateway:8080
      # --- Payment providers, and the third estate-wide secret (decisions.md D37/D45/D50) ---------
      #
      # D37 chose Paystack, Hubtel and MTN MoMo, with the customer choosing between them. Each
      # adapter is registered only when its own `enabled` flag is true, and ALL THREE ARE OFF here
      # and everywhere else in this repository.
      #
      # PAYSTACK IS IMPLEMENTED (D50); HUBTEL AND MTN MOMO ARE STILL SEAMS. Nobody here has an
      # account or credentials for those two, so writing a signature scheme or a field path for one
      # would be invention on the one path where a customer's money is already committed. See
      # net.jojoaddison.service.payment.provider's package documentation.
      #
      # TURNING ONE ON STILL MAKES EVERY PRICED BOOKING THAT NAMES IT ANSWER 502 -- PAYSTACK
      # INCLUDED, for a different reason. Its /transaction/initialize requires the customer's email
      # address; this estate holds none it may hand to a provider, and where one may legitimately
      # come from is an open disclosure decision (CustomerContacts, D50). Booking says which of the
      # two situations it is in, per enabled provider, at startup.
      #
      # The secret is what the provider signs its callbacks with. It is handled exactly like
      # JWT_BASE64_SECRET and HC_PRIVACY_PEPPER -- required where it is used, NEVER committed,
      # because this repository is public -- with one difference: it is optional, because a provider
      # nobody turned on needs none. Absent, callbacks addressed to that provider are REFUSED rather
      # than trusted, which is D35's rule for the pepper applied to a provider's key. Blank counts as
      # absent.
      #
      # ON THE QUALITY BOX these come from the environment startup.sh runs in. It does not mint or
      # persist them the way it does the pepper: a provider secret is issued by somebody else, so
      # there is nothing to generate, and an absent one costs a refusal rather than an orphaned
      # alias.
      #
      # base-url and timeout-ms are Paystack's only other knobs and both have working defaults
      # (api.paystack.co, 10s), so neither needs setting. They are passed anyway because a variable
      # this repository documents and no compose file carries is a variable that silently does
      # nothing, which D46 found the hard way in the two end-to-end scripts.
      HC_PAYSTACK_ENABLED: ${HC_PAYSTACK_ENABLED:-false}
      HC_PAYSTACK_SECRET: ${HC_PAYSTACK_SECRET:-}
      HC_PAYSTACK_BASE_URL: ${HC_PAYSTACK_BASE_URL:-}
      HC_PAYSTACK_TIMEOUT_MS: ${HC_PAYSTACK_TIMEOUT_MS:-0}
      # Off by default: a refund call written from a published API and never watched work (D86).
      HC_PAYSTACK_REFUNDS_ENABLED: ${HC_PAYSTACK_REFUNDS_ENABLED:-false}
      HC_HUBTEL_ENABLED: ${HC_HUBTEL_ENABLED:-false}
      HC_HUBTEL_SECRET: ${HC_HUBTEL_SECRET:-}
      HC_MOMO_ENABLED: ${HC_MOMO_ENABLED:-false}
      HC_MOMO_SECRET: ${HC_MOMO_SECRET:-}
      SPRING_LIQUIBASE_CONTEXTS: dev
      HEALTHCONNECT_SEED_ENABLED: "true"
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      HEALTHCONNECT_SEED_ANCHOR_DATES: "true"
    # Long form, not "${SEED_DIR:-./seed}:/app/seed:ro". The short syntax is split on colons,
    # and an uninterpolated ${VAR:-default} source carries two of its own — so
    # `docker compose config --no-interpolate`, which .github/checks/pepper-wiring.sh needs in
    # order to read each service's merged environment without evaluating the `:?` guards it is
    # checking for, fails the whole file with "too many colons". Newer compose tolerates it;
    # the CI runner's does not. Long form has nothing to split.
    volumes:
      - type: bind
        source: ${SEED_DIR:-./seed}
        target: /app/seed
        read_only: true
    depends_on:
      booking-db: { condition: service_healthy }

  messaging:
    <<: *service
    image: ${REGISTRY:-healthconnect}${IMAGE_SEP:-/}messaging:${TAG:?set by startup.sh}
    container_name: hc-market-quality-messaging
    ports: ["127.0.0.1:${MESSAGING_PORT:-18102}:8080"]
    environment:
