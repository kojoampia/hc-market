# The jacserver edge, as a HOST NGINX SITE: market.healthconnect.local on port 80.
#
#   sudo ln -sfn "$PWD/host-site.conf" /etc/nginx/sites-enabled/market.healthconnect.local.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Symlinked from the repository rather than copied, so editing it here is editing the live site
# (after a reload). The alternative is a copy in /etc that silently drifts from this one.
#
# Stands where the production edge stands. That edge is no longer hypothetical: since 2026-09-05 it
# is deploy/prod-server/market.abofonsa.com.conf plus the hc-market-app.conf snippet it includes, and
# the two files are worth reading side by side. They agree on the security headers, the three
# proxy_hide_header lines and the CSP; they differ in TLS (certbot's, there), in the /prototype
# location (absent there, deliberately) and in the upstream port. See decisions.md D49.
#
# ONE HOP, NOT TWO — AND THAT IS A REAL DIFFERENCE FROM THE SIBLINGS
#
# hc-admin, hc-patient and hc-professional each put a `web` container behind this vhost: their
# nginx proxies to another nginx which serves an Angular app and forwards the API paths. Two hops,
# deliberately, because the bugs that hide in a proxy chain only appear when there is a chain.
#
# hc-market is API-only — spec §2 settled that JHipster generates no SPA for it — so there is no web
# container to put in front of, and this proxies straight to the gateway. The consequence is worth
# stating rather than discovering: the class of defect those stacks exist to catch, where a header
# or a scheme is mangled between two nginxes, CANNOT be rehearsed here. This stack catches CSP
# failures, wrong-image deploys and hostname theft; it does not catch the second-hop bugs.
#
# No TLS. A local certificate would be self-signed, every browser would object, and the one thing it
# would exercise — HSTS and the certbot splice — is precisely what cannot be rehearsed off the
# server anyway.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve the scheme the *outer* caller used rather than the one this hop was reached on. Locally
# the answer is always `http`, so this map changes nothing today — it is here so this file and the
# siblings' do not diverge, because a workstation that behaves differently from production is worth
# less than no workstation copy at all.
map $http_x_forwarded_proto $abf_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    # Both, and the second line is NOT redundant.
    #
    # nginx selects the server block by the most specific listen ADDRESS before it ever looks at
    # server_name. A block declaring `127.0.0.1:80` owns every connection arriving on loopback, and
    # a block declaring only `*:80` is not even a candidate for it. On this machine
    # admin.healthconnect.conf, patient.healthconnect.local.conf, professional.abofonsa.local.conf
    # and monitoring.jojoaddison.local.conf ALL declare 127.0.0.1:80 — so with a wildcard alone
    # here, every request to market.healthconnect.local from jacserver itself (where the name
    # resolves to 127.0.0.1) would be served by one of those instead, answering 200 with somebody
    # else's application.
    #
    # That is not hypothetical: hc-admin/quality/host-site.conf records admin.healthconnect.local
    # serving the patient app for exactly this reason. It is inherited here rather than
    # rediscovered.
    #
    # `listen 80` is the one that makes this reachable from the LAN, which is the point of running
    # on jacserver behind a hostname rather than on a laptop. Only the published CONTAINER ports
    # bind 127.0.0.1 — that is what makes this vhost the sole way in.
    listen 80;
    listen 127.0.0.1:80;

    # Both names. healthconnect.local is what the hc-admin and hc-patient quality sites use;
    # abofonsa.local is the brand domain. A request arriving on the name this file does not claim
    # falls through to whichever sibling owns the address — the failure above, wearing a hat.
    server_name market.healthconnect.local market.abofonsa.local;

    # THE SAME POLICY PRODUCTION SENDS, since 2026-09-05. This said "STRICTER THAN PRODUCTION, WHICH
    # SENDS NO CSP AT ALL — deliberately, so a violation surfaces here rather than after somebody
    # finally adds a policy to the server", and that stopped being true when
    # deploy/prod-server/hc-market-app.conf was written: production carries this line character for
    # character (decisions.md D49).
    #
    # The differences are now in the other direction and there is exactly one of them. Production has
    # NO /prototype location and therefore no relaxed policy scoped to one — see the block below, and
    # the header of prod-server/market.abofonsa.com.conf for why that difference is deliberate and
    # must not be closed by making production match this file.
    #
    # This is an API, so the policy can be far tighter than the siblings' need to be: there is no
    # Angular bundle, no inline critical CSS and no web font to accommodate. `default-src 'none'`
    # is the truthful policy for something that only ever returns JSON, and anything that starts
    # needing more is a sign this stack has quietly grown a front end nobody decided on.
    # THE UPSTREAM ALREADY SENDS THREE OF THESE, AND add_header DOES NOT REPLACE — IT APPENDS.
    #
    # Every sibling proxies to a `web` container whose nginx sets no security headers, so their
    # add_header lines are the only source and each header appears once. hc-market proxies straight
    # to the GATEWAY, and JHipster's Spring Security already emits X-Content-Type-Options,
    # X-Frame-Options: DENY and Referrer-Policy: no-referrer.
    #
    # Adding them here too produced two of each, and — worse — two DIFFERENT Referrer-Policy values
    # (`no-referrer` from the gateway, `same-origin` from here). A duplicated header with conflicting
    # values is resolved differently by different user agents, which is the kind of defect that
    # behaves one way in the browser you tested and another way in the one that matters.
    #
    # So the upstream's copies are dropped and this file is the single authority. Written this way
    # round, rather than deleting the add_header lines, so the whole policy stays readable in one
    # place and matches how the sibling vhosts read.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    add_header X-Frame-Options        "DENY"              always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "same-origin"       always;
    add_header X-Robots-Tag           "noindex, nofollow" always;
    add_header Content-Security-Policy
        "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
        always;

    # Kept closed here because they are closed in production, so a change that depends on them being
    # unreachable fails on the workstation rather than on the server.
    location = /management/prometheus { return 404; }
    location = /management/heapdump   { return 404; }

    # --- THE PROTOTYPE, SERVED SAME-ORIGIN ---------------------------------------------------
    #
    # http://market.healthconnect.local/prototype
    #
    # Same origin as /services/** and /api/**, which means NO CORS at all: the page's live mode can
    # be opened with `?api=` (empty — same origin) and it reaches the gateway directly, including
    # /api/stream. Opening it from any other origin needs the gateway's dev CORS allow-list, which
    # names http://localhost:8100 and nothing else.
    #
    # The file is served from the repository rather than copied, for the same reason this vhost is
    # symlinked rather than copied: a copy in /var/www drifts from the one the seed is extracted
    # from, and those two must never disagree.
    #
    # THE CSP HERE IS DELIBERATELY WEAKER THAN THE SITE'S, AND THAT IS THE EXCEPTION THE COMMENT
    # ABOVE WARNS ABOUT. `default-src 'none'` is the truthful policy for something that only returns
    # JSON; the prototype is a single HTML file with inline <script> and inline <style>, so it needs
    # 'unsafe-inline' for both and 'self' for connect-src to reach the API and the SSE stream.
    #
    # Scoped to this one path on purpose. The API keeps the strict policy — check by reading the
    # header on /services/healthconnectcatalog/api/professionals/count, which must still say
    # default-src 'none'. If the strict policy ever starts failing there, this block is the first
    # thing to suspect: nginx's add_header does not merge, it REPLACES, so a policy defined in a
    # location silently drops everything the server block set.
    location = /prototype {
        alias /home/kojo/work/health-connect/workspace/hc-market/docs/Abofonsa_BridgeCare_Marketplace.html;
        default_type text/html;
        add_header X-Frame-Options        "DENY"              always;
        add_header X-Content-Type-Options "nosniff"           always;
        add_header Referrer-Policy        "same-origin"       always;
        add_header X-Robots-Tag           "noindex, nofollow" always;
        add_header Content-Security-Policy
            "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
            always;
    }

    location / {
        # The GATEWAY's published port — hc-market has no web container. Keep this in step with
        # GATEWAY_PORT in compose.yml: nginx cannot read the environment, so the number is written
        # twice and there is no way around that. startup.sh checks the two agree rather than letting
        # them drift into a 502.
        proxy_pass http://127.0.0.1:15509;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $abf_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Only the gateway may set this: it is the one component that knows what it stripped.
        # Blanking anything a caller sends stops an injected value steering absolute URLs.
        proxy_set_header X-Forwarded-Prefix "";

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # BOTH OF THESE ARE NOW LOAD-BEARING FOR SSE, which they were not written for.
        #
        # /api/stream (decisions.md D25/D29) is a Server-Sent Events stream that is idle most of the
        # time and never completes. With proxy_buffering on, nginx holds each frame until its buffer
        # fills — so events arrive in clumps, minutes late, or not until the connection closes; and
        # with the default 60s proxy_read_timeout it would cut an idle stream every minute. The
        # gateway sends a keep-alive comment every 20s, which covers the default, but an hour here
        # means a quiet connection is never dropped by this hop at all.
        #
        # Neither failure looks like a failure: the browser reconnects silently and the only symptom
        # is a live channel that misses things.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
