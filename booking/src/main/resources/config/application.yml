---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

# ===================================================================
# HealthConnect Marketplace
# NOTE: `jhipster jdl --force` rewrites this file and drops this block.
# ===================================================================
healthconnect:
  seed:
    enabled: false
    file: demo/seed-data.json
    anchor-dates: false
  booking:
    free-cancellation-hours: 24
  # The receipt modal asks payout for the brokerage split. Fails closed: a receipt is a financial
  # statement, and no receipt beats a plausible wrong one.
  payout:
    base-url: http://healthconnectpayout
    timeout-ms: 3000
  # Retention -- decisions.md D24. Deliberately absent rather than set to a plausible number: a
  # default here would be a legal position taken by whoever typed it. Counsel supplies the number,
  # this supplies the mechanism. Nothing sweeps on it yet -- there is no scheduler in this estate.
  #
  # `pepper` is absent for a different reason -- decisions.md D35. It keys the HMAC that turns an
  # erased customer's login into the alias their rows carry, and this repository is public, so a
  # committed pepper is not a pepper. It is injected exactly as the JWT signing key is: all three
  # compose files require HEALTHCONNECT_PRIVACY_PEPPER, and the value must be the SAME in booking,
  # catalog and messaging or one person acquires three aliases.
  #
  # Absent, this service still starts and everything except the erasure desk works -- that endpoint
  # answers 503. See SubjectPseudonym for why refusing to start would be the worse trade.
  privacy: {}
  #   retention-days: 365
  #   pepper: injected, never written here

# ===================================================================
# Liquibase must finish BEFORE the seed loader runs.
#
# JHipster defaults application.liquibase.async-start to true, which starts Liquibase on a
# background executor and lets the application finish booting without it. An ApplicationRunner then
# races the schema: SeedDataLoader queries a table Liquibase has not created yet and the seed is
# skipped with "relation does not exist" -- the app comes up healthy and empty, which reads as a
# broken seed file rather than a race.
# ===================================================================
application:
  liquibase:
    async-start: false
