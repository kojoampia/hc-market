# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

spring:
  application:
    name: healthconnectBooking
  cloud:
    consul:
      discovery:
        enabled: false
        instanceId: ${spring.application.name}:${spring.application.instance-id:${random.value}}
      config:
        enabled: false
      enabled: false
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  jackson2:
    serialization:
      write-durations-as-timestamps: false
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: healthconnect-booking-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: healthconnect-booking-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  mail:
    from: healthconnectBooking@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
        base64-secret: YjkyODRjYmMzMTJjMmNkMGIwOTkzYzZlNzBkZjNiNDFiYTk5YzcwMGUzN2EwZjMxMmI1YTBlYzVkMDQ0ZjZhYTU1ZTJhOWVmZGJmYWY1ODM2NGRiMTcwMDk2MWU5YjFiNWRiNzBhZWYyMTVmOTQ1YWM5NTUxZmUyZGYxZjdlOTM=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
management:
  health:
    mail:
      enabled: false

# ===================================================================
# HealthConnect Marketplace — test-only privacy configuration.
#
# NOTE: `jhipster jdl --force` rewrites this file and drops this block. The ITs then fail at the
# erasure endpoint with a 503, which reads as a broken test rather than as a lost config block.
#
# This pepper is a TEST FIXTURE, not a secret. It is committed on purpose and must never be used by
# a real deployment: it keys the HMAC behind the erased-subject alias, and the same literal appears
# in booking, catalog and messaging so SubjectPseudonymUnitTest's known answer is one value across
# the three — which is what proves the three copies of SubjectPseudonym have not drifted apart.
#
# A real deployment injects HEALTHCONNECT_PRIVACY_PEPPER; nothing that runs outside a test carries a
# default. See decisions.md D35.
# ===================================================================
healthconnect:
  privacy:
    pepper: hc-market-test-pepper-not-a-real-one
    # The retention periods are repeated here, and they must stay equal to the main config's
    # fallbacks — decisions.md D42.
    #
    # THIS FILE SHADOWS src/main/resources/config/application.yml RATHER THAN MERGING WITH IT. Both
    # sit at `config/application.yml` on the classpath and test resources come first, so the main
    # file is not read at all under test. That is the same mechanism that makes a lost `pepper` block
    # above fail the ITs with a 503, and it is why these three lines are not redundant: without them
    # the periods bind to null under test and PrivacyResourceIT fails asserting counsel's figures
    # against nothing — which reads as a broken assertion rather than as a shadowed config file.
    #
    # They are written as literals rather than as ${HC_RETENTION_*:...} placeholders on purpose: a
    # test must assert what counsel ratified, not whatever happens to be exported into the shell
    # running the build. An environment variable set on a developer's machine should not be able to
    # turn this suite green or red.
    retention:
      financial-days: 2190
      operational-days: 365
      care-summary-days: 90
    # controller-registration is deliberately UNSET. PrivacyResourceIT asserts the desk reports null
    # for it, and a real registration number has no business in a public repository — see D42.
