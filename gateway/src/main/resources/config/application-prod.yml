# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    net.jojoaddison: INFO

management:
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin: # Use the "zipkin" Maven profile to have the Spring Cloud Zipkin dependencies
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0 # report 100% of traces

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  cloud:
    consul:
      discovery:
        prefer-ip-address: true
      host: localhost
      port: 8500
  # --- NO DEFAULT, AND THAT IS THE FIX (decisions.md D94, backlog NEW-47) -----------------------
  #
  # This was `host: localhost` and `port: 25`, which is a value that looks configured and mails
  # nowhere: inside a container that is the container's own loopback, and no compose file in any of
  # the three environments passed a single SPRING_MAIL_* variable. Registration answers 201 without
  # waiting for the mail, MailService catches MailException and logs WARN, and the unactivated
  # account is then deleted by the sweep — so a customer registered, received nothing, could never
  # log in, and disappeared.
  #
  # Both placeholders are DELIBERATELY DEFAULTLESS. An unresolved placeholder fails the context while
  # Spring evaluates the mail autoconfiguration's condition, and the message names the variable —
  # which is the loudest available failure and the opposite of what a default does. A default is
  # exactly how `http://my-server-url-to-change` survived in the base-url below.
  #
  # docker-compose.prod.yml requires both as `:?` variables, so a production deploy refuses to
  # interpolate before a container is created; deploy-prod.sh checks both by name on the host before
  # it touches the stack; and service/MailDeliveryGuard refuses the values a placeholder cannot see
  # (present-and-empty, and loopback under prod). The port is required rather than defaulted because
  # 25, 465 and 587 are three different sets of assumptions and a wrong one fails exactly as
  # silently as a wrong host.
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
  mongodb:
    uri: mongodb://localhost:27017/healthconnectGateway
  thymeleaf:
    cache: true

# ===================================================================
# To enable TLS in production, generate a certificate using:
# keytool -genkey -alias healthconnectgateway -storetype PKCS12 -keyalg RSA -keysize 2048 -keystore keystore.p12 -validity 3650
#
# You can also use Let's Encrypt:
# See details in topic "Create a Java Keystore (.JKS) from Let's Encrypt Certificates" on https://maximilian-boehm.com/en-gb/blog
#
# Then, modify the server.ssl properties so your "server" configuration looks like:
#
# server:
#   port: 443
#   ssl:
#     key-store: classpath:config/tls/keystore.p12
#     key-store-password: password
#     key-store-type: PKCS12
#     key-alias: selfsigned
#     # The ciphers suite enforce the security by deactivating some old and deprecated SSL cipher, this list was tested against SSL Labs (https://www.ssllabs.com/ssltest/)
#     ciphers: TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_DHE_RSA_WITH_AES_128_GCM_SHA256 ,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_DHE_RSA_WITH_AES_128_CBC_SHA256,TLS_DHE_RSA_WITH_AES_128_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA256,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_CBC_SHA256,TLS_RSA_WITH_AES_256_CBC_SHA256,TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_128_CBC_SHA,TLS_RSA_WITH_CAMELLIA_128_CBC_SHA
# ===================================================================
server:
  port: 8080
  shutdown: graceful # see https://docs.spring.io/spring-boot/reference/web/graceful-shutdown.html#web.graceful-shutdown
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  http:
    cache: # Used by the CachingHttpHeadersFilter
      timeToLiveInDays: 1461
  security:
    authentication:
      jwt:
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  mail: # specific JHipster mail property, for standard properties see MailProperties
    # REQUIRED, with no default — decisions.md D94. This line read
    # `base-url: http://my-server-url-to-change`, JHipster's own placeholder and the only occurrence
    # of that string in any .yml in this repository. It is the origin every activation and
    # password-reset link is composed against, so a wrong one produces a mail that is DELIVERED and
    # whose link is dead — the one value here that fails silently after delivery works, which is why
    # it must be stated rather than defaulted. MailDeliveryGuard refuses the placeholder on every
    # profile, refuses a blank one under prod, and refuses anything that is not an absolute http(s)
    # URL without a trailing slash.
    #
    # It points at the ORIGIN A PERSON BROWSES, not at the API: the templates compose
    # `${baseUrl}/account/activate?key=…`, which is a frontend route. This estate has no frontend yet
    # (NEW-48), so today that link 404s at the edge while the account activates perfectly well
    # through `GET /api/activate?key=…`. Named in D94 §5 and opened as NEW-60 rather than papered
    # over by rewriting a generated template.
    base-url: ${JHIPSTER_MAIL_BASE_URL}
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
