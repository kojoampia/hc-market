<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abofonsa BridgeCare — Wellbeing Marketplace</title>
<style>
/* ============ TOKENS (carried from Abofonsa BridgeCare) ============ */
:root{
  --navy:#0D3058; --navy-2:#12406F; --navy-3:#1B5390; --navy-ink:#08213D;
  --gold:#C59437; --gold-2:#E0B45B; --gold-soft:#F3E6CB;
  --cream:#F7F4EE; --bg:#F2F0EA; --white:#fff;
  --ink:#16202B; --ink-2:#41505F; --ink-3:#6B7A89; --line:#E2DED4; --line-2:#EDEAE2;
  --green:#1BAF7A; --green-bg:#E4F6EF; --green-ink:#0C6A4A;
  --amber:#D48806; --amber-bg:#FDF1DC; --amber-ink:#8A5A03;
  --red:#C6392F; --red-bg:#FBE9E7; --red-ink:#8E241C;
  --blue:#256ABF; --blue-bg:#E7F0FB;
  --c1:#256ABF; --c2:#EDA100; --c3:#1BAF7A; --c4:#7A5AA8;
  --r-s:8px; --r-m:12px; --r-l:18px; --r-xl:26px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(13,48,88,.06), 0 1px 3px rgba(13,48,88,.05);
  --sh-2:0 2px 6px rgba(13,48,88,.07), 0 6px 18px rgba(13,48,88,.07);
  --sh-3:0 10px 30px rgba(13,48,88,.13), 0 2px 8px rgba(13,48,88,.08);
  --sh-in:inset 0 0 0 1px var(--line);
  --topbar:64px; --side:250px;
  --f:'Inter','Lato',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f); font-size:15px; line-height:1.55; color:var(--ink);
  background:var(--bg); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0; font-weight:800; letter-spacing:-.02em; line-height:1.2; color:var(--navy-ink)}
h1{font-size:31px} h2{font-size:22px} h3{font-size:17px} h4{font-size:15px}
p{margin:0 0 10px}
a{color:var(--navy-3); text-decoration:none}
button{font-family:inherit; font-size:inherit; cursor:pointer}
img{max-width:100%}
::selection{background:var(--gold-soft)}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.tiny{font-size:12px}
.micro{font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; font-weight:800; color:var(--ink-3)}
.strong{font-weight:700}
.center{text-align:center}
.nowrap{white-space:nowrap}
.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ LAYOUT ============ */
.app{min-height:100vh; display:flex; flex-direction:column}
.wrap{width:100%; max-width:1240px; margin:0 auto; padding:0 22px}
.main{flex:1; padding:26px 0 90px}
.row{display:flex; align-items:center; gap:10px}
.row.wrap-r{flex-wrap:wrap}
.spread{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.stack{display:flex; flex-direction:column; gap:14px}
.grid{display:grid; gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.split{grid-template-columns:1.45fr 1fr; align-items:start}
.split-n{grid-template-columns:1fr 300px; align-items:start}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.sec{margin-bottom:30px}
.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:14px}
.sec-head p{margin:4px 0 0; color:var(--ink-3); font-size:13.5px}

/* ============ TOPBAR ============ */
.topbar{
  position:sticky; top:0; z-index:60; height:var(--topbar);
  background:rgba(247,244,238,.88); backdrop-filter:saturate(1.6) blur(14px);
  -webkit-backdrop-filter:saturate(1.6) blur(14px); border-bottom:1px solid var(--line);
}
.topbar .wrap{height:100%; display:flex; align-items:center; gap:16px}
.brand{display:flex; align-items:center; gap:10px; flex-shrink:0}
.brand .mark{
  width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,var(--navy) 10%,var(--navy-3));
  display:grid;place-items:center;color:var(--gold-2);font-weight:800;font-size:15px;letter-spacing:-.04em;
  box-shadow:0 2px 8px rgba(13,48,88,.28)
}
.brand b{font-size:15.5px; letter-spacing:-.03em; color:var(--navy-ink); font-weight:800; line-height:1.05; display:block}
.brand span{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--gold); font-weight:800}
.tnav{display:flex; gap:2px; margin-left:8px}
.tnav a{
  padding:8px 13px; border-radius:var(--r-pill); font-size:13.5px; font-weight:600; color:var(--ink-2);
}
.tnav a:hover{background:rgba(13,48,88,.06)}
.tnav a.on{background:var(--navy); color:#fff}
.tspace{flex:1}
.tsearch{
  display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:var(--r-pill); padding:7px 14px; flex:0 1 230px; min-width:0; box-shadow:var(--sh-1)
}
.roleswitch,.iconbtn,.uavatar{flex-shrink:0}
.tsearch input{border:0;outline:0;font-family:inherit;font-size:13.5px;width:100%;background:transparent;color:var(--ink)}
.roleswitch{display:flex; background:#EBE7DD; border-radius:var(--r-pill); padding:3px; gap:2px; border:1px solid var(--line)}
.roleswitch button{
  border:0; background:transparent; padding:6px 13px; border-radius:var(--r-pill);
  font-size:12.5px; font-weight:700; color:var(--ink-2); white-space:nowrap
}
.roleswitch button.on{background:var(--navy); color:#fff; box-shadow:0 1px 4px rgba(13,48,88,.3)}
.iconbtn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;
  display:grid;place-items:center;color:var(--navy);position:relative;box-shadow:var(--sh-1)
}
.iconbtn:hover{background:var(--cream)}
.iconbtn .dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.uavatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12.5px;background:linear-gradient(150deg,var(--navy-2),var(--navy));border:2px solid #fff;box-shadow:var(--sh-1);cursor:pointer}
.burger{display:none}

/* ============ BUTTONS / PILLS ============ */
.btn{
  border:1px solid transparent; border-radius:var(--r-pill); padding:9px 18px; font-size:13.5px;
  font-weight:700; display:inline-flex; align-items:center; gap:7px; justify-content:center;
  transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
}
.btn:active{transform:translateY(1px)}
.btn-p{background:var(--navy); color:#fff; box-shadow:0 2px 8px rgba(13,48,88,.24)}
.btn-p:hover{background:var(--navy-2)}
.btn-g{background:var(--gold); color:#2A1D02; box-shadow:0 2px 8px rgba(197,148,55,.35)}
.btn-g:hover{background:var(--gold-2)}
.btn-o{background:#fff; color:var(--navy); border-color:var(--line); box-shadow:var(--sh-1)}
.btn-o:hover{background:var(--cream); border-color:#D6D0C2}
.btn-t{background:transparent;color:var(--navy);border-color:transparent}
.btn-t:hover{background:rgba(13,48,88,.07)}
.btn-d{background:var(--red-bg); color:var(--red-ink); border-color:#F3D4D0}
.btn-d:hover{background:#F7DAD6}
.btn-sm{padding:6px 13px; font-size:12.5px}
.btn-lg{padding:13px 26px; font-size:15px}
.btn-blk{width:100%}
.btn[disabled]{opacity:.45; pointer-events:none}
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--r-pill);
  font-size:11.5px;font-weight:700;background:var(--cream);color:var(--ink-2);border:1px solid var(--line-2)
}
.pill.ok{background:var(--green-bg);color:var(--green-ink);border-color:#CBEDE0}
.pill.warn{background:var(--amber-bg);color:var(--amber-ink);border-color:#F6E2BC}
.pill.bad{background:var(--red-bg);color:var(--red-ink);border-color:#F3D4D0}
.pill.info{background:var(--blue-bg);color:#164B8A;border-color:#CFE0F5}
.pill.gold{background:var(--gold-soft);color:#77551A;border-color:#E7D3A9}
.pill.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;border-radius:var(--r-pill);
  background:var(--navy);color:#fff;font-size:12px;font-weight:700
}
.chip button{border:0;background:rgba(255,255,255,.2);color:#fff;width:17px;height:17px;border-radius:50%;line-height:1;display:grid;place-items:center;font-size:12px}
.chip button:hover{background:rgba(255,255,255,.36)}
.demobadge{
  position:fixed; right:16px; bottom:16px; z-index:70; background:var(--navy); color:var(--gold-2);
  padding:8px 15px; border-radius:var(--r-pill); font-size:11.5px; font-weight:800; letter-spacing:.06em;
  text-transform:uppercase; box-shadow:var(--sh-3); display:flex; align-items:center; gap:8px
}
.demobadge i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ CARDS ============ */
.card{background:#fff; border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--sh-1)}
.card.pad{padding:20px}
.card.hov{transition:box-shadow .18s ease, transform .18s ease, border-color .18s ease; cursor:pointer}
.card.hov:hover{box-shadow:var(--sh-3); transform:translateY(-3px); border-color:#D8D2C4}
.card-h{padding:16px 20px; border-bottom:1px solid var(--line-2); display:flex; align-items:center; justify-content:space-between; gap:12px}
.card-b{padding:18px 20px}
.card-f{padding:13px 20px; border-top:1px solid var(--line-2); background:var(--cream); border-radius:0 0 var(--r-l) var(--r-l)}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:15px 17px;box-shadow:var(--sh-1);position:relative;overflow:hidden}
.stat .k{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--navy-ink);line-height:1.1}
.stat .l{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--ink-3);margin-top:3px}
.stat .d{font-size:12px;margin-top:7px;color:var(--ink-3)}
.stat .spk{position:absolute;right:0;bottom:0;opacity:.9}
.stat.clk{cursor:pointer;transition:box-shadow .18s,transform .18s}
.stat.clk:hover{box-shadow:var(--sh-2);transform:translateY(-2px)}

/* ============ HERO ============ */
.hero{
  border-radius:var(--r-xl); padding:44px 40px; color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(135deg,var(--navy-ink) 0%,var(--navy) 42%,var(--navy-3) 100%);
  box-shadow:var(--sh-3);
}
.hero:before{content:"";position:absolute;inset:0;
  background:radial-gradient(680px 300px at 88% -18%,rgba(197,148,55,.34),transparent 62%),
             radial-gradient(420px 260px at 8% 118%,rgba(27,175,122,.20),transparent 65%)}
.hero>*{position:relative}
.hero h1{color:#fff; font-size:37px; max-width:660px}
.hero p{color:rgba(255,255,255,.82); max-width:560px; margin-top:11px; font-size:15.5px}
.hero .eyebrow{color:var(--gold-2); font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:800; margin-bottom:12px}
.searchbar{
  margin-top:24px; background:#fff; border-radius:var(--r-xl); padding:8px; display:flex; gap:6px;
  box-shadow:0 14px 40px rgba(8,33,61,.3); max-width:720px; flex-wrap:wrap
}
.searchbar .f{flex:1 1 180px; padding:6px 14px; border-right:1px solid var(--line-2); min-width:0}
.searchbar .f:last-of-type{border-right:0}
.searchbar label{display:block; font-size:10px; letter-spacing:.11em; text-transform:uppercase; font-weight:800; color:var(--ink-3)}
.searchbar input,.searchbar select{border:0;outline:0;font-family:inherit;font-size:14px;font-weight:600;width:100%;background:transparent;color:var(--ink);padding:1px 0}
.herostats{display:flex;gap:30px;margin-top:26px;flex-wrap:wrap}
.herostats div b{display:block;font-size:23px;font-weight:800;color:#fff;letter-spacing:-.02em}
.herostats div span{font-size:11.5px;color:rgba(255,255,255,.7);letter-spacing:.07em;text-transform:uppercase;font-weight:700}

/* ============ CATEGORY TILES ============ */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.cat{
  background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:18px;cursor:pointer;
  box-shadow:var(--sh-1);transition:.18s;position:relative;overflow:hidden
}
.cat:hover{transform:translateY(-3px);box-shadow:var(--sh-3);border-color:#D8D2C4}
.cat .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;margin-bottom:12px}
.cat h4{font-size:15.5px;margin-bottom:3px}
.cat p{font-size:12.5px;color:var(--ink-3);margin:0;line-height:1.45}
.cat .n{position:absolute;top:16px;right:16px;font-size:11.5px;font-weight:800;color:var(--ink-3)}

/* ============ PRO CARD ============ */
.procard{display:flex;flex-direction:column;overflow:hidden}
.procard .top{padding:17px 17px 13px;display:flex;gap:13px}
.procard .body{padding:0 17px 14px;flex:1}
.procard .foot{padding:12px 17px;border-top:1px solid var(--line-2);background:var(--cream);display:flex;align-items:center;justify-content:space-between;gap:8px}
.avatar{
  border-radius:15px;display:grid;place-items:center;color:#fff;font-weight:800;letter-spacing:-.02em;
  flex-shrink:0; box-shadow:0 2px 8px rgba(13,48,88,.18); position:relative
}
.avatar.s{width:38px;height:38px;font-size:13px;border-radius:11px}
.avatar.m{width:54px;height:54px;font-size:18px}
.avatar.l{width:92px;height:92px;font-size:31px;border-radius:22px}
.avatar .vf{position:absolute;bottom:-4px;right:-4px;width:19px;height:19px;border-radius:50%;background:var(--blue);border:2.5px solid #fff;display:grid;place-items:center;color:#fff;font-size:10px}
.avatar.l .vf{width:26px;height:26px;font-size:13px;bottom:-3px;right:-3px}
.stars{display:inline-flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.stars .s{color:var(--gold);letter-spacing:-1px;font-size:13px}
.rate{font-size:17px;font-weight:800;color:var(--navy-ink);letter-spacing:-.02em}
.rate small{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.fav{border:0;background:transparent;color:var(--ink-3);font-size:17px;line-height:1;padding:2px}
.fav.on{color:var(--red)}

/* ============ FILTERS ============ */
.layout-f{display:grid;grid-template-columns:252px 1fr;gap:22px;align-items:start}
.filters{position:sticky;top:calc(var(--topbar) + 18px)}
.fgroup{padding:15px 17px;border-bottom:1px solid var(--line-2)}
.fgroup:last-child{border-bottom:0}
.fgroup h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.opt{display:flex;align-items:center;gap:9px;padding:5px 0;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.opt input{accent-color:var(--navy);width:15px;height:15px;cursor:pointer}
.opt:hover{color:var(--navy)}
.opt .c{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:700}
input[type=range]{width:100%;accent-color:var(--gold)}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--ink-3);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-s);font-family:inherit;
  font-size:14px;color:var(--ink);background:#fff;outline:0
}
.field textarea{min-height:88px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy-3);box-shadow:0 0 0 3px rgba(27,83,144,.13)}
.srch{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 15px;box-shadow:var(--sh-1)}
.srch input{border:0;outline:0;font-family:inherit;font-size:13.5px;width:100%;background:transparent}

/* ============ TABS / TABLE / PAGER ============ */
.tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{
  border:0;background:transparent;padding:10px 15px;font-size:13.5px;font-weight:700;color:var(--ink-3);
  border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap
}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
.tabs button:hover{color:var(--navy)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{
  text-align:left;padding:9px 13px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:800;color:var(--ink-3);border-bottom:1px solid var(--line);background:var(--cream);white-space:nowrap
}
.tbl th:first-child{border-radius:var(--r-s) 0 0 0}
.tbl th:last-child{border-radius:0 var(--r-s) 0 0}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#FBFAF7}
.tblwrap{overflow-x:auto}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;font-size:12.5px;color:var(--ink-3)}
.pager .pg{display:flex;gap:4px}
.pager .pg button{
  border:1px solid var(--line);background:#fff;width:29px;height:29px;border-radius:8px;font-size:12.5px;
  font-weight:700;color:var(--ink-2)
}
.pager .pg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pager .pg button[disabled]{opacity:.4}
.lrow{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.lrow:last-child{border-bottom:0}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3)}
.empty .ic{font-size:38px;opacity:.35;margin-bottom:10px}

/* ============ STEPS / BOOKING ============ */
.steps{display:flex;align-items:center;gap:0;margin-bottom:24px;overflow-x:auto;padding-bottom:4px}
.step{display:flex;align-items:center;gap:9px;flex-shrink:0}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:#fff;border:1.5px solid var(--line);color:var(--ink-3)}
.step .t{font-size:12.5px;font-weight:700;color:var(--ink-3);white-space:nowrap}
.step.on .n{background:var(--navy);border-color:var(--navy);color:#fff}
.step.on .t{color:var(--navy)}
.step.done .n{background:var(--green);border-color:var(--green);color:#fff}
.step.done .t{color:var(--ink-2)}
.step .bar{width:38px;height:2px;background:var(--line);margin:0 11px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.slot{
  border:1px solid var(--line);background:#fff;border-radius:var(--r-s);padding:10px 6px;font-size:13px;
  font-weight:700;color:var(--ink-2);text-align:center
}
.slot:hover:not([disabled]){border-color:var(--navy-3);background:var(--cream)}
.slot.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.slot[disabled]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.day{
  min-width:66px;border:1px solid var(--line);background:#fff;border-radius:var(--r-m);padding:9px 4px;text-align:center;flex-shrink:0
}
.day b{display:block;font-size:17px;font-weight:800;color:var(--navy-ink)}
.day span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:var(--ink-3)}
.day.on{background:var(--navy);border-color:var(--navy)}
.day.on b,.day.on span{color:#fff}
.day[disabled]{opacity:.35;cursor:not-allowed}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:13.5px;border-bottom:1px dashed var(--line-2)}
.sumrow:last-child{border-bottom:0}
.sumrow.total{font-size:16px;font-weight:800;color:var(--navy-ink);padding-top:12px;border-top:1.5px solid var(--line);border-bottom:0;margin-top:5px}

/* ============ SIDEBAR (pro dashboard) ============ */
.dash{display:grid;grid-template-columns:var(--side) 1fr;gap:0;min-height:calc(100vh - var(--topbar))}
.side{

.thread{display:flex;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line-2);cursor:pointer}
.thread:hover{background:#FBFAF7}
.thread.on{background:var(--cream);box-shadow:inset 3px 0 0 var(--gold)}
.thread .tx{min-width:0;flex:1}
.thread b{font-size:13.5px;display:block;color:var(--navy-ink)}

.msg.me{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.msg .t{font-size:10.5px;opacity:.62;margin-top:4px;display:block}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal{

/* ------------------------- availability (deterministic) ----------------- */
/* every professional gets a repeatable 21-day slot map generated from a seed */
const SLOT_TIMES = ['07:00','08:30','10:00','11:30','13:00','14:30','16:00','17:30','19:00'];
function availabilityFor(proId){
  const seed = proId.split('').reduce((a,c)=>a+c.charCodeAt(0),17) * 7919;
  const rnd = LCG(seed); const out = [];
  for(let i=0;i<21;i++){
    const d = addDays(TODAY,i); const dow = d.getDay();
    const open = dow===0 ? rnd()<.25 : (dow===6 ? rnd()<.7 : rnd()<.94);
    const times = open ? SLOT_TIMES.filter(()=> rnd()<.55) : [];
    out.push({date:iso(d), dow, times});
  }
  if(!out.some(x=>x.times.length)) out[1].times = ['10:00','14:30'];
  return out;
}
const AVAIL = {}; PROS.forEach(p=> AVAIL[p.id] = availabilityFor(p.id));
function nextAvailable(proId){
  const a = AVAIL[proId].find(x=>x.times.length);
  return a ? {date:a.date, time:a.times[0]} : null;
}

function toast(msg, kind){

let modalStack = [];
function modal(html, opts){
  opts = opts||{};
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = '<div class="modal '+(opts.size||'')+'" role="dialog" aria-modal="true">'+html+'</div>';
  o.addEventListener('mousedown', e=>{ if(e.target===o) closeModal(); });
  $('#modalRoot').appendChild(o); modalStack.push(o);
  document.body.style.overflow='hidden';
  return o;
}
function closeModal(){
  const o = modalStack.pop(); if(o) o.remove();
  if(!modalStack.length) document.body.style.overflow='';
}
function closeAllModals(){ while(modalStack.length) closeModal(); }
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modalStack.length) closeModal(); });

const pendingCharts = [];
function queueChart(id, fn){ pendingCharts.push({id, fn}); }
function flushCharts(){
  while(pendingCharts.length){
    const c = pendingCharts.shift();
    const cv = document.getElementById(c.id);
    if(cv) try{ c.fn(cv); }catch(e){ console.warn('chart',c.id,e); }
  }
}
function prep(cv){
  const dpr = window.devicePixelRatio||1;
  const w = cv.clientWidth||600, h = cv.clientHeight||230;
  cv.width = w*dpr; cv.height = h*dpr;
  const g = cv.getContext('2d'); g.scale(dpr,dpr);
  g.clearRect(0,0,w,h);
  g.font = '600 11px '+getComputedStyle(document.body).fontFamily;
  return {g,w,h};
}
function barChart(cv, labels, values, color, fmt){
  const {g,w,h} = prep(cv);
  const padL=44,padR=12,padT=22,padB=28;
  const max = Math.max.apply(null, values.concat([1]))*1.15;
  const iw = w-padL-padR, ih = h-padT-padB;
  g.strokeStyle='#EDEAE2'; g.fillStyle='#6B7A89'; g.textAlign='right';
  for(let i=0;i<=4;i++){
    const y = padT + ih - (ih*i/4);
    g.beginPath(); g.moveTo(padL,y); g.lineTo(w-padR,y); g.stroke();
    g.fillText(fmt? fmt(max*i/4,true) : Math.round(max*i/4), padL-8, y+4);
  }
  const bw = iw/values.length;
  values.forEach((v,i)=>{
    const bh = ih*(v/max), x = padL+bw*i+bw*.20, y = padT+ih-bh;
    g.fillStyle=color; g.beginPath();
    const r=4, ww=bw*.6;
    g.moveTo(x,y+bh); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y);
    g.lineTo(x+ww-r,y); g.quadraticCurveTo(x+ww,y,x+ww,y+r); g.lineTo(x+ww,y+bh); g.closePath(); g.fill();
    g.fillStyle='#41505F'; g.textAlign='center';
    g.fillText(fmt? fmt(v) : v, x+ww/2, y-6);
    g.fillStyle='#6B7A89'; g.fillText(labels[i], x+ww/2, h-9);
  });
}
function lineChart(cv, labels, series, fmt){
  const {g,w,h} = prep(cv);
  const padL=44,padR=14,padT=22,padB=28;
  const all = series.reduce((a,s)=>a.concat(s.v),[]);
  const max = Math.max.apply(null, all.concat([1]))*1.2;
  const iw=w-padL-padR, ih=h-padT-padB;
  g.strokeStyle='#EDEAE2'; g.fillStyle='#6B7A89'; g.textAlign='right';
  for(let i=0;i<=4;i++){ const y=padT+ih-(ih*i/4);
    g.beginPath(); g.moveTo(padL,y); g.lineTo(w-padR,y); g.stroke();
    g.fillText(fmt? fmt(max*i/4,true):Math.round(max*i/4), padL-8, y+4); }
  const X = i => padL + (iw*(labels.length===1?0.5:i/(labels.length-1)));
  const Y = v => padT + ih - ih*(v/max);
  series.forEach(s=>{
    g.strokeStyle=s.c; g.lineWidth=2.4; g.beginPath();
    s.v.forEach((v,i)=> i? g.lineTo(X(i),Y(v)) : g.moveTo(X(i),Y(v)));
    g.stroke();
    g.fillStyle=s.c;
    s.v.forEach((v,i)=>{ g.beginPath(); g.arc(X(i),Y(v),3.4,0,6.3); g.fill(); });
  });
  /* direct end-labels, pushed apart so converging series stay legible */
  const li = labels.length-1;
  const marks = series.map(s=>({s, y:Y(s.v[li])-9})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<marks.length;i++) if(marks[i].y - marks[i-1].y < 15) marks[i].y = marks[i-1].y + 15;
  g.textAlign='right'; g.font='800 11px '+getComputedStyle(document.body).fontFamily;
  marks.forEach(m=>{
    const y = Math.max(padT+9, Math.min(h-padB-2, m.y));
    g.fillStyle=m.s.c;
    g.fillText(m.s.n+' '+(fmt?fmt(m.s.v[li]):m.s.v[li]), X(li), y);
  });
  g.font='600 11px '+getComputedStyle(document.body).fontFamily;
  g.fillStyle='#6B7A89'; g.textAlign='center';
  labels.forEach((l,i)=>{ if(labels.length>8 && i%2) return; g.fillText(l, X(i), h-9); });
}
function donutChart(cv, items){
  const {g,w,h} = prep(cv);
  const cx = Math.min(120, w*.28), cy=h/2, R=Math.min(cy-12,84), r=R*.6;
  const tot = sum(items.map(i=>i.v))||1;
  let a = -Math.PI/2;
  items.forEach(it=>{
    const s = (it.v/tot)*Math.PI*2;
    g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,R,a,a+s); g.closePath();
    g.fillStyle=it.c; g.fill();
    a+=s;
  });
  g.globalCompositeOperation='destination-out';
  g.beginPath(); g.arc(cx,cy,r,0,6.3); g.fill();
  g.globalCompositeOperation='source-over';
  g.fillStyle='#08213D'; g.textAlign='center'; g.font='800 19px '+getComputedStyle(document.body).fontFamily;
  g.fillText(tot, cx, cy+3);
  g.font='700 9.5px '+getComputedStyle(document.body).fontFamily; g.fillStyle='#6B7A89';
  g.fillText('TOTAL', cx, cy+17);
  /* direct labels to the right */
  g.textAlign='left'; g.font='600 12px '+getComputedStyle(document.body).fontFamily;
  const lx = cx+R+26; let ly = cy - (items.length*20)/2 + 12;
  items.forEach(it=>{
    g.fillStyle=it.c; g.fillRect(lx,ly-9,10,10);
    g.fillStyle='#41505F';
    const pct = Math.round(it.v/tot*100);
    g.fillText(it.n+' — '+it.v+' ('+pct+'%)', lx+16, ly);
    ly+=20;
  });
}
function sparkline(cv, values, color){
  const {g,w,h} = prep(cv);
  const max=Math.max.apply(null,values), min=Math.min.apply(null,values), rng=(max-min)||1;
  g.strokeStyle=color; g.lineWidth=1.8; g.beginPath();
  values.forEach((v,i)=>{ const x=(w-4)*(i/(values.length-1))+2, y=h-4-((v-min)/rng)*(h-10);
    i?g.lineTo(x,y):g.moveTo(x,y); });
  g.stroke();
  g.lineTo(w,h); g.lineTo(0,h); g.closePath();
  g.globalAlpha=.10; g.fillStyle=color; g.fill(); g.globalAlpha=1;
}

/* ------------------------------ search engine --------------------------- */
function matches(p){
  const f = state.filters;
  if(f.cats.length && f.cats.indexOf(p.cat)<0) return false;
  if(f.subs.length && f.subs.indexOf(p.sub)<0) return false;
  if(f.modes.length && !f.modes.some(m=>p.modes.indexOf(m)>=0)) return false;
  if(f.cities.length && f.cities.indexOf(p.city)<0) return false;
  if(p.rate > f.maxPrice) return false;
  if(p.rating < f.minRating) return false;
  if(f.verifiedOnly && !p.verified) return false;
  if(f.q){
    const q = f.q.toLowerCase();
    const hay = [p.name,p.title,p.sub,p.city,p.bio,p.highlights.join(' '),p.services.map(s=>s.name).join(' '),catOf(p.cat).name].join(' ').toLowerCase();
    if(hay.indexOf(q)<0) return false;
  }
  return true;
}
function sorted(list){
  const l = list.slice();
  const na = p => { const a=nextAvailable(p.id); return a? daysBetween(iso(TODAY),a.date) : 99; };
  if(state.sort==='rating')     l.sort((a,b)=> b.rating-a.rating || b.reviewCount-a.reviewCount);
  else if(state.sort==='price') l.sort((a,b)=> a.rate-b.rate);
  else if(state.sort==='priced')l.sort((a,b)=> b.rate-a.rate);
  else if(state.sort==='soon')  l.sort((a,b)=> na(a)-na(b));
  else if(state.sort==='reviews')l.sort((a,b)=> b.reviewCount-a.reviewCount);
  else l.sort((a,b)=> (b.rating*Math.log(1+b.reviewCount)) - (a.rating*Math.log(1+a.reviewCount)));
  return l;
}
function activeChips(){
  const f = state.filters, out=[];
  f.cats.forEach(c=> out.push(['cat',c,catOf(c).name]));
  f.subs.forEach(s=> out.push(['sub',s,s]));
  f.modes.forEach(m=> out.push(['mode',m,m]));
  f.cities.forEach(c=> out.push(['city',c,c]));
  if(f.verifiedOnly) out.push(['verified','','Verified only']);
  if(f.minRating>0) out.push(['rating','',f.minRating+'★ and up']);
  if(f.maxPrice<3500) out.push(['price','','Up to '+money(f.maxPrice)]);
  if(f.q) out.push(['q','','“'+f.q+'”']);
  return out;
}
function dropChip(kind,val){
  const f = state.filters;
  if(kind==='cat') f.cats = f.cats.filter(x=>x!==val);
  if(kind==='sub') f.subs = f.subs.filter(x=>x!==val);
  if(kind==='mode') f.modes = f.modes.filter(x=>x!==val);
  if(kind==='city') f.cities = f.cities.filter(x=>x!==val);
  if(kind==='verified') f.verifiedOnly=false;
  if(kind==='rating') f.minRating=0;
  if(kind==='price') f.maxPrice=3500;
  if(kind==='q'){ f.q=''; const t=$('#topSearch'); if(t) t.value=''; }
  state.browsePage=1; render();
}
function clearFilters(){
  state.filters = { cats:[], subs:[], modes:[], cities:[], maxPrice:3500, minRating:0, verifiedOnly:false, q:'' };
  state.browsePage=1; const t=$('#topSearch'); if(t) t.value=''; render();
}
function toggleArr(key,val){
  const a = state.filters[key], i = a.indexOf(val);
  if(i>=0) a.splice(i,1); else a.push(val);
  state.browsePage=1; render();
}

/* count helper: how many would match if we ignored one facet */
function matchesExcept(p, facet){
  const saved = state.filters[facet];
  state.filters[facet] = Array.isArray(saved)? [] : saved;
  const r = matches(p);
  state.filters[facet] = saved;
  return r;
}
function renderKeepFocus(id){
  const el = document.getElementById(id);
  const pos = el? el.selectionStart : 0;
  render();
  const el2 = document.getElementById(id);
  if(el2){ el2.focus(); try{ el2.setSelectionRange(pos,pos); }catch(e){} }
}

/* ------------------------------ BOOKING WIZARD -------------------------- */
function startBooking(proId, svcId, date, time){
  const p = proById(proId);
  state.booking = { pro:proId, svc: svcId || p.services[0].id, date: date||'', time: time||'',
    mode: p.modes[0], forWhom:'me', who:'', addr: ME.address, notes:'', step: (date&&time)?3:1 };
  go('#/book/'+proId);
}
function bkSet(k,v){ state.booking[k]=v; render(); }
function bkStep(n){
  const b = state.booking;
  if(n===2 && !b.svc) return toast('Choose a service first','warn');
  if(n===3 && (!b.date||!b.time)) return toast('Pick a date and a time','warn');
  b.step=n; render(); window.scrollTo(0,0);
}

function confirmBooking(){
  const b = state.booking, p = proById(b.pro), s = svcById(p,b.svc);
  const id = 'b'+(BOOKINGS.length+1)+'x';
  BOOKINGS.unshift({id, pro:b.pro, svc:b.svc, date:b.date, time:b.time, mode:b.mode,
    status:'pending', price:s.price, note:b.notes, forWhom:b.forWhom==='other'? (b.who||'A person in my care') : null});
  NOTIFICATIONS.unshift({id:'n'+(NOTIFICATIONS.length+1), icon:'🕒', t:'Request sent',
    x:'Waiting for '+p.name+' to confirm '+fmtD(b.date)+' at '+b.time+'.', when:iso(TODAY), read:false});
  /* if the request is for our own pro persona, it lands in her inbox too */
  if(b.pro==='p1'){
    PRO_REQUESTS.unshift({id:'q'+(PRO_REQUESTS.length+1)+'x', client:ME.name, ini:ME.ini, svc:b.svc,
      date:b.date, time:b.time, mode:b.mode, note:b.notes||'—', made:iso(TODAY), status:'pending'});
  }
  state.booking=null;
  closeAllModals();
  modal('<div class="modal-b" style="text-align:center;padding:34px 30px">'
   + '<div style="font-size:46px">📩</div><h2 style="margin:10px 0 6px">Request sent to '+esc(p.name)+'</h2>'
   + '<p class="muted small" style="max-width:400px;margin:0 auto">'+esc(p.name.split(' ')[0])+' typically replies within '+p.responseMins+' minutes. '
   + 'Nothing is charged until the session is confirmed and completed.</p>'
   + '<div class="card pad" style="margin-top:20px;text-align:left;background:var(--cream)">'
   + '<div class="sumrow"><span class="muted">Service</span><span class="strong">'+esc(s.name)+'</span></div>'
   + '<div class="sumrow"><span class="muted">When</span><span class="strong">'+fmtDS(b.date)+' at '+b.time+'</span></div>'
   + '<div class="sumrow"><span class="muted">Format</span><span class="strong">'+esc(b.mode)+'</span></div>'
   + '<div class="sumrow total"><span>Total on completion</span><span>'+money(s.price)+'</span></div></div>'
   + '</div><div class="modal-f"><button class="btn btn-o" onclick="closeModal();go(\'#/discover\')">Back to Discover</button>'
   + '<button class="btn btn-p" onclick="closeModal();go(\'#/bookings\')">View my bookings</button></div>', {size:'narrow'});
  toast('Booking request sent to '+p.name);
  render();
}

/* -------------------------------- BOOKINGS ------------------------------ */
function viewBookings(){
  const tabs = [['upcoming','Upcoming'],['pending','Awaiting confirmation'],['completed','Past'],['cancelled','Cancelled']];
  const now = iso(TODAY);
  const sets = {
    upcoming: BOOKINGS.filter(b=>b.status==='confirmed'&&b.date>=now),
    pending:  BOOKINGS.filter(b=>b.status==='pending'),
    completed:BOOKINGS.filter(b=>b.status==='completed'||(b.status==='confirmed'&&b.date<now)),
    cancelled:BOOKINGS.filter(b=>b.status==='cancelled')
  };
  const list = sets[state.bookingsTab].slice().sort((a,b)=> state.bookingsTab==='completed'? (a.date<b.date?1:-1) : (a.date<b.date?-1:1));
  const spend = sum(sets.completed.map(b=>b.price));

  return '<main class="main"><div class="wrap">'
  + '<div class="spread sec"><div><h1>My bookings</h1>'
    + '<p class="muted small" style="margin:4px 0 0">'+BOOKINGS.length+' bookings with '+uniq(BOOKINGS.map(b=>b.pro)).length+' professionals</p></div>'
    + '<button class="btn btn-p" onclick="go(\'#/browse\')">Book someone new</button></div>'

  + '<div class="grid g4 sec">'
    + '<div class="stat"><div class="k">'+sets.upcoming.length+'</div><div class="l">Upcoming</div><div class="d">'
      + (sets.upcoming.length? 'Next '+relD(sets.upcoming.sort((a,b)=>a.date<b.date?-1:1)[0].date).toLowerCase() : 'Nothing booked') +'</div></div>'
    + '<div class="stat"><div class="k">'+sets.pending.length+'</div><div class="l">Awaiting reply</div><div class="d">Professionals typically reply same day</div></div>'
    + '<div class="stat"><div class="k">'+sets.completed.length+'</div><div class="l">Completed</div><div class="d">'
      + sets.completed.filter(b=>!b.reviewed).length+' still to review</div></div>'
    + '<div class="stat"><div class="k">'+money(spend)+'</div><div class="l">Spent to date</div><div class="d">Across all professionals</div></div>'
  + '</div>'

  + '<div class="tabs">'+tabs.map(t=>'<button class="'+(state.bookingsTab===t[0]?'on':'')+'" onclick="state.bookingsTab=\''+t[0]+'\';render()">'
      + t[1]+' <span class="pill" style="margin-left:4px">'+sets[t[0]].length+'</span></button>').join('')+'</div>'

  + (list.length? '<div class="stack">'+list.map(bookingRow).join('')+'</div>'
     : '<div class="card"><div class="empty"><div class="ic">📅</div><h3>Nothing here</h3>'
       + '<p class="small">Bookings in this state will appear here.</p>'
       + '<button class="btn btn-p" onclick="go(\'#/browse\')">Browse professionals</button></div></div>')
  + '</div></main>';
}

function sendMsg(){
  const inp = $('#msgIn'); if(!inp) return;

  const t = THREADS.find(x=>x.id===state.threadId);
  const now = iso(TODAY)+' '+d2(TODAY.getHours()||9)+':'+d2((new Date()).getMinutes());
  t.msgs.push({from:'me', t:now, x:v});
  inp.value='';
  render();
  const cb = $('#convoBody'); if(cb) cb.scrollTop = cb.scrollHeight;
  const p = proById(t.pro);
  setTimeout(()=>{
    t.msgs.push({from:'them', t:now, x:'Thank you — noted. I will come back to you properly within the hour.'});
    if(state.route==='#/messages' && state.threadId===t.id){ render(); const c=$('#convoBody'); if(c) c.scrollTop=c.scrollHeight; }
    else { t.unread++; renderNav(); }
    toast(p.name+' replied');
  }, 1600);

<script>
/* ==========================================================================
   PROFESSIONAL WORKSPACE (you are Akosua Mensah, p1)
   Every figure below is computed from PRO_HISTORY / PRO_SCHEDULE / REVIEWS.
   ========================================================================== */
const proSvc = id => svcById(ME_PRO,id);
function monthKey(d){ return d.slice(0,7); }
function monthsBack(n){
  const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-i,1);
    out.push({key:d.getFullYear()+'-'+d2(d.getMonth()+1), label:MON[d.getMonth()]}); }
  return out;
}
function proStats(){
  const h = PRO_HISTORY;
  const months = monthsBack(7);
  const byMonth = months.map(m=>{
    const rows = h.filter(x=>monthKey(x.date)===m.key);
    return {...m, n:rows.length, gross:sum(rows.map(r=>r.price))};
  });
  const thisM = byMonth[byMonth.length-1], prevM = byMonth[byMonth.length-2];
  const bySvc = ME_PRO.services.map((s,i)=>({
    n:s.name.replace(/ \(.*\)/,''), v:h.filter(x=>x.svc===s.id).length,
    c:[ 'var(--c1)','var(--c2)','var(--c3)','var(--c4)' ][i%4].replace('var(--c1)','#256ABF').replace('var(--c2)','#EDA100').replace('var(--c3)','#1BAF7A').replace('var(--c4)','#7A5AA8'),
    gross: sum(h.filter(x=>x.svc===s.id).map(x=>x.price))
  }));
  const byMode = MODES.map((m,i)=>({n:m, v:h.filter(x=>x.mode===m).length, c:['#256ABF','#EDA100','#1BAF7A'][i]}));
  const clients = uniq(h.map(x=>x.client));
  const repeatClients = clients.filter(c=> h.filter(x=>x.client===c).length>1);
  const rs = REVIEWS.filter(r=>r.pro===ME_PRO.id);
  const grossAll = sum(h.map(x=>x.price));
  /* like-for-like: the same slice of days in the previous month */
  const dayCut = TODAY.getDate()-1;   /* history runs to yesterday */
  const inSlice = (key)=> h.filter(x=> monthKey(x.date)===key && +x.date.slice(8) <= dayCut);
  const mtd = inSlice(thisM.key), prevSlice = inSlice(prevM.key);
  return { h, months:byMonth, thisM, prevM, bySvc, byMode, clients, repeatClients, rs,
           mtdGross: sum(mtd.map(r=>r.price)), mtdN: mtd.length,
           prevSliceGross: sum(prevSlice.map(r=>r.price)), dayCut,
           grossAll, netAll: Math.round(grossAll*(1-COMMISSION)) };
}
function pctDelta(a,b){ if(!b) return '—'; const d=Math.round((a-b)/b*100); return (d>=0?'+':'')+d+'%'; }

function acceptRequest(id){
  const r = PRO_REQUESTS.find(x=>x.id===id); if(!r||r.status!=='pending') return;
  r.status='accepted';
  PRO_SCHEDULE.push({id:'a'+(PRO_SCHEDULE.length+1)+'x', client:r.client, ini:r.ini, svc:r.svc,
    date:r.date, time:r.time, mode:r.mode, status:'confirmed', note:r.note});
  PRO_SCHEDULE.sort((a,b)=> a.date===b.date ? (a.time<b.time?-1:1) : (a.date<b.date?-1:1));
  const mine = BOOKINGS.find(b=>b.pro==='p1'&&b.date===r.date&&b.time===r.time&&b.status==='pending');
  if(mine) mine.status='confirmed';
  render(); toast('Accepted — '+r.client+' has been notified');
}
function declineRequest(id){
  const r = PRO_REQUESTS.find(x=>x.id===id); if(!r) return;
  modal('<div class="modal-h"><h3>Decline this request?</h3><button class="x" onclick="closeModal()">×</button></div>'
   + '<div class="modal-b"><p>'+esc(r.client)+' asked for '+esc(proSvc(r.svc).name)+' on '+fmtDS(r.date)+' at '+r.time+'.</p>'

   + '<div class="field"><label>Add a note (optional)</label><textarea id="dcNote" placeholder="Suggest an alternative if you can…"></textarea></div>'
   + '<div class="note">Declining is free. Your response rate is currently 100% — declining does not affect it, but ignoring requests does.</div></div>'
   + '<div class="modal-f"><button class="btn btn-o" onclick="closeModal()">Keep it</button>'

}
function doDecline(id){
  const r = PRO_REQUESTS.find(x=>x.id===id);
  r.status='declined';

    const last = new Date(TODAY.getFullYear(), +m.key.slice(5)-0, 0);
    const paid = m.key !== monthKey(iso(TODAY));
    return {m, gross, fee, net, ref:'PAY-'+m.key.replace('-','')+'-AM', date: iso(addDays(last,PAYOUT_LAG)), paid};

<script>
/* ==========================================================================
   LIVE MODE — decisions.md D29
   ==========================================================================

   Everything above this line is the closed demo, unchanged: no network, all state in memory. This
   block is the only part of the prototype that has ever spoken to a server, and it is deliberately
   the LAST script block in the file for two reasons.

   THE SEED IS EXTRACTED FROM THE FIRST SCRIPT BLOCK, AND ONLY THAT ONE.
   deploy/demo/extract-seed.mjs slices from the first script open tag to the first close tag,
   evaluates it in a bare vm sandbox with no fetch and no window, and reads eighteen consts out of
   it. (Those tags are spelled out in words here on purpose: a literal close tag inside a comment
   ends the element, and the browser then renders the rest of this block as text. Cost one run of
   `node --check` to find, which is the only reason it is not still in the file.) So nothing
   here may move, rename or wrap any of that — and nothing there may start depending on a network.
   The two halves are kept apart by that seam rather than by good intentions, and CI regenerates the
   seed on every push to prove it.

   That is also why the data below is mutated IN PLACE (PROS.length = 0; PROS.push(...)) rather than
   reassigned: CATS, PROS, REVIEWS and AVAIL are consts in a block this file must not touch.

   DEMO REMAINS THE DEFAULT. Open this file with no query string and it behaves exactly as it always
   has — that matters, because it is still the acceptance target and still the seed's source. Live
   mode is opt-in:

       ?api=                       same origin (served behind the estate's nginx — no CORS)
       ?api=http://localhost:15509 an explicit gateway
       &token=<jwt>                unlocks the live channel; public reads need none
       &svc=/services/healthconnectcatalog   the gateway route prefix, if it ever changes

   WHAT IS LIVE, AND WHAT IS NOT. Reads: categories, professionals, their services, reviews and
   availability come from catalog, and ratings are recomputed from the reviews that arrived — the
   same derivation the demo does, so a rating that disagrees with its reviews is as impossible here
   as it is there. WITH A TOKEN, the customer's own bookings come from booking as well, and two
   writes go to the estate: creating a booking and publishing a review.

   MESSAGING IS LIVE TOO, and its override is a REWRITE rather than a wrapper. The demo's sendMsg
   fabricates a reply from the professional 1.6 seconds later; against a real estate that would put
   words into a real person's mouth in a real conversation, so it is gone and the thread is re-read
   from the server instead.

   The writes deliberately do NOT send priceMinor, currency or professionalLogin. The server
   establishes all three (decisions.md D22, D28), and sending them would mean the prototype was
   testing its own arithmetic rather than the estate's.
   ========================================================================== */
(function live(){
  const params = new URLSearchParams(location.search);
  if(!params.has('api')) return;                       // demo, exactly as before

  /* Discover's "Sessions brokered" tile, switched off before anything else happens.

     It is the only figure on the page with NO live source, and it was the last one still being
     rendered from the demo's own arrays under a LIVE banner: PRO_HISTORY is never repopulated here
     and BOOKINGS only is behind a token, so demo and live both showed 269 while the estate holds
     256 completed sessions and 286 bookings. The p.rate / ₵NaN class exactly, and worse to find,
     because a plausible number looks like it is working.

     Null, not a fetch. Nothing the estate publishes counts bookings for an anonymous reader, and
     adding an endpoint that does is a decision about disclosing estate-wide volume — not something
     a prototype should take on its own. viewDiscover omits the tile on null. Set here, at the top,
     so the figure is gone from the first live render rather than from the second; the paint before
     this block is parsed still shows the demo's figures, exactly as every other stat on the page
     does until load() finishes, and the banner says "Loading …" rather than LIVE for that window. */
  sessionsBrokered = function(){ return null; };

  const BASE    = params.get('api') || '';             // '' = same origin
  const CATALOG = BASE + (params.get('svc') ?? '/services/healthconnectcatalog');
  /* The gateway routes by service id, so writes to booking go through a different prefix than reads
     from catalog. Both are `/services/<id>/api/**` — the gateway matches nothing else (D28). */
  const BOOKING = BASE + (params.get('svcBooking') ?? '/services/healthconnectbooking');
  const MESSAGING = BASE + (params.get('svcMessaging') ?? '/services/healthconnectmessaging');
  const TOKEN   = params.get('token') || '';
  const headers = TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {};

  /* ------------------------------------------------------------------ mapping -- */
  /* The API speaks minor units and SCREAMING_CASE; this file speaks cedis and prose. Every
     difference is deliberate on the API's side, so the translation lives here rather than there. */
  const MODE  = { IN_PERSON:'In person', ONLINE:'Online', HOME_VISIT:'Home visit' };
  const cedis = minorUnits => Math.round(Number(minorUnits||0)) / 100;
  const modes = list => (list||[]).map(m=>MODE[m]).filter(Boolean);

  const banner = (text, tone) => {
    let el = document.getElementById('liveBanner');
    if(!el){
      el = document.createElement('div');
      el.id = 'liveBanner';
      el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:6px 12px;' +
        'font:600 12px/1.5 system-ui,sans-serif;text-align:center;color:#fff';
      document.body.appendChild(el);
    }
    /* Navy for live, gold for trouble. Never white on gold — 2.74:1, fails AA — so the warning
       state uses navy text on gold, which is the brand's own rule. */
    el.style.background = tone === 'warn' ? '#C59437' : '#0D3058';
    el.style.color      = tone === 'warn' ? '#0D3058' : '#fff';
    el.textContent = text;
  };

  const get = async path => {
    const res = await fetch(CATALOG + path, { headers });
    if(!res.ok) throw new Error(path + ' → ' + res.status);
    return res.json();
  };

  /* ------------------------------------------------------------------ loading -- */
  async function load(){
    banner('Loading from ' + (BASE || location.origin) + ' …');

    const cats = await get('/api/categories');
    CATS.forEach(c => {                                 /* keep the demo's icon and palette: the API
                                                           carries an icon but no colours, and the
                                                           tiles are part of the brand, not the data */
      const live = cats.find(x => x.code.toLowerCase() === c.id);
      if(live){ c.name = live.name; c.blurb = live.blurb; c.subs = live.specialities || c.subs; }
    });

    /* size=200 rather than paging: eighteen professionals fit in one answer and a demo that pages
       invisibly would hide a change in the catalogue's size, which is exactly what this is for. */
    const page  = await get('/api/professionals?size=200');
    const cards = page.content || [];

    /* One detail call each, in parallel. The card has no bio, credentials, highlights or services,
       and Browse needs the "from" price that only the services carry. Eighteen requests against a
       local estate is a second; against anything slower this is the first thing to make lazy. */
    const details = await Promise.all(cards.map(c => get('/api/professionals/' + c.ref)));
    const reviews = await Promise.all(cards.map(c => get('/api/professionals/' + c.ref + '/reviews?page=0&size=200')));

    /* 21 days from the demo's TODAY, which is what the calendar strip renders. */
    const from = iso(TODAY), to = iso(addDays(TODAY, 20));
    const avail = await Promise.all(cards.map(c => get('/api/professionals/' + c.ref + '/availability?from=' + from + '&to=' + to)));

    PROS.length = 0;
    cards.forEach((c, i) => {
      const d = details[i] || {};
      PROS.push({
        id:c.ref, name:c.displayName, ini:c.initials,
        c:[c.avatarGradientFrom || '#0D3058', c.avatarGradientTo || '#256ABF'],
        cat:(c.categoryCode||'').toLowerCase(), sub:c.speciality, title:c.headline, city:c.city,
        modes:modes(c.deliveryModes), years:c.yearsPractising,
        /* The API has four verification states; this screen has a boolean badge. Only VERIFIED
           earns it — PENDING and SUSPENDED must not read as verified, which a truthiness test on
           the string would have done. */
        verified:c.verification === 'VERIFIED',
        insured:!!c.insured, dbs:!!c.policeClearance,
        langs:c.languages || [], responseMins:c.responseMinutes, repeat:c.rebookRatePct,
        creds:d.credentials || [], bio:d.bio || '', highlights:d.highlights || [],
        services:(d.services || []).filter(s => s.active !== false).map(s => ({
          id:s.ref, name:s.name, dur:s.durationMinutes, price:cedis(s.priceMinor), desc:s.description || ''
        })),
        zoneId:c.zoneId || null,
        /* Date only. The reviewer and the evidence reference stay on the desk endpoint (D16/D31). */
        verifiedOn:d.verifiedOn || null
      });
    });

    REVIEWS.length = 0;
    cards.forEach((c, i) => {
      const rows = reviews[i];
      /* Field names taken from the API, not guessed at. The first version of this used
         customerName/postedOn/reply and produced reviews with a blank author and no date — which
         renders as a plausible-looking card with an empty byline rather than as an error, and would
         have shipped. Checked against the live response instead. */
      (rows.content || rows || []).forEach(r => REVIEWS.push({
        id:r.ref, pro:c.ref, author:r.authorName, ini:r.authorInitials,
        stars:r.stars, date:r.publishedOn, text:r.body || '', reply:r.professionalReply || ''
      }));
    });

    /* The indicative "from" price, recomputed with block 1's formula verbatim.
       
       Block 1 derives `rate` once, at load, from the demo's own services. Replacing PROS wholesale
       leaves it undefined, and `money(undefined)` renders "₵NaN" on the profile and on every browse
       card — which is exactly what it did until a browser was finally pointed at this page. Nothing
       threw, no check caught it, and the headless verifier was asserting `services[0].price` while
       the figure actually on screen came from a different field.
       
       Same formula rather than a tidier one, deliberately: live and demo must agree on the same
       data, including on the edge where a professional's services are all free. */
    PROS.forEach(p => { p.rate = Math.min.apply(null, p.services.filter(s => s.price > 0).map(s => s.price)); });

    /* Recomputed here for the same reason block 1 computes them: a rating that can disagree with
       its own reviews is a bug the file should make impossible. The API derives them from a view
       over the same rows, so the two agree by construction rather than by luck. */
    PROS.forEach(p => {
      const rs = REVIEWS.filter(r => r.pro === p.id);
      p.reviewCount = rs.length;
      p.rating = rs.length ? Math.round(avg(rs.map(r => r.stars)) * 10) / 10 : 0;
    });

    Object.keys(AVAIL).forEach(k => delete AVAIL[k]);
    cards.forEach((c, i) => {
      /* `slots`, not `times`. AvailabilityDay(date, slots) — checked in the DTO, not guessed.
         This read `day.times` first, which is undefined, so every day arrived with an empty slot
         list: the calendar rendered three weeks of a fully-booked professional and nothing errored.
         The phase-4 verifier passed it too, because it asserted only that DAYS existed. It now
         asserts free times exist, which is what actually makes the screen usable. */
      AVAIL[c.ref] = (avail[i] || []).map(day => ({
        date:day.date, dow:new Date(day.date + 'T00:00:00').getDay(), times:day.slots || []
      }));
    });

    render();

    /* The demo's calendar is anchored to 2026-08-10 and cannot be moved — TODAY is a const in the
       block this file must not touch. An estate seeded with anchor-dates=false shifts every date to
       real time, and the strip then renders three weeks with nothing in them. Saying so is cheaper
       than the twenty minutes it otherwise costs to work out why the live catalogue looks closed. */
    const firstLive = Object.values(AVAIL).flat().map(d => d.date).sort()[0];
    const drift = firstLive ? Math.abs(new Date(firstLive + 'T00:00:00') - TODAY) / 86400000 : 0;
    if(drift > 21){
      banner('Live — but availability starts ' + firstLive + ', and this calendar is fixed to ' +
             iso(TODAY) + '. Reseed with anchor-dates=true.', 'warn');
    } else {
      banner('LIVE — ' + PROS.length + ' professionals, ' + REVIEWS.length + ' reviews from ' +
             (BASE || location.origin) + (TOKEN ? ' · streaming' : ' · public reads only'));
    }
  }

  /* ------------------------------------------------------------- live channel -- */
  /* GET /api/stream, decisions.md D25/D29.

     fetch + ReadableStream rather than EventSource, and not by preference: EventSource cannot send
     an Authorization header, and /api/stream is authenticated at the gateway. The alternative would
     be accepting the token in the query string, which puts a credential into every access log and
     every Referer — so the client does the small amount of frame parsing instead. */
  async function stream(){
    if(!TOKEN) return;
    const res = await fetch(BASE + '/api/stream', { headers:{ ...headers, Accept:'text/event-stream' } });
    if(!res.ok || !res.body) return;
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for(;;){
      const { value, done } = await reader.read();
      if(done) return;
      buf += dec.decode(value, { stream:true });
      let i;
      while((i = buf.indexOf('\n\n')) >= 0){            /* frames are blank-line separated */
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        const type = (frame.match(/^event:\s*(.*)$/m) || [,''])[1];
        /* Comment-only frames are the 20-second keep-alive the gateway sends so no proxy in the
           path decides an idle stream has stalled. They carry no event line and are dropped here,
           which is exactly what EventSource would do with them. */
        if(!type) continue;
        toast('Live: ' + type.replace('healthconnect.', '').replace(/\./g, ' '));
      }
    }
  }


  /* --------------------------------------------------------------- writes -- */
  /* All of this needs a token; without one live mode stays read-only, which is why the banner
     says so. The pattern for both writes is the same and the ORDER is the point:

         POST  ->  original()  ->  reload from the server

     POST first, so a refusal never shows a success modal. Then the ORIGINAL demo function, which
     owns the confirmation UI and does an optimistic in-memory update. Then a reload, which replaces
     that optimistic row with what the estate actually stored. The demo's screens are reused whole
     rather than reimplemented, and the last word belongs to the server. */

  const send = async (base, path, body) => {
    const res = await fetch(base + path, {
      method:'POST',
      headers:{ ...headers, 'Content-Type':'application/json' },
      body:JSON.stringify(body)
    });
    if(!res.ok){
      /* The estate's refusals are specific and worth showing rather than flattening to "failed":
         409 is a stale price, a stale professional, or an already-reviewed booking; 503 is catalog
         unreachable, which is a retry rather than a mistake. */
      const detail = await res.text().catch(() => '');
      throw new Error(res.status + (detail ? ' — ' + detail.slice(0, 200) : ''));
    }
    return res.status === 204 ? null : res.json();
  };

  /* API status -> the demo's four buckets. NO_SHOW and DECLINED both land in `cancelled` because
     that is all the screen has; lossy, and better than inventing a tab the prototype never had. */
  const STATUS = {
    REQUESTED:'pending', RESCHEDULE_PROPOSED:'pending', CONFIRMED:'confirmed',
    COMPLETED:'completed', CANCELLED:'cancelled', DECLINED:'cancelled', NO_SHOW:'cancelled'
  };
  const ENUM_MODE = { 'In person':'IN_PERSON', 'Online':'ONLINE', 'Home visit':'HOME_VISIT' };

  /* The customer's real bookings. Note what this quietly fixes: the demo's booking ids are
     'b1','b2x'…, and in live mode they become the estate's own references — which is the only
     reason submitReview below can pass one to the API and have it mean anything. */
  async function loadBookings(){
    if(!TOKEN) return;
    const rows = await (await fetch(BOOKING + '/api/bookings/mine', { headers })).json();
    BOOKINGS.length = 0;
    (rows || []).forEach(b => BOOKINGS.push({
      id:b.reference, pro:b.professionalRef, svc:b.serviceRef, date:b.scheduledDate,
      time:b.scheduledTime, mode:MODE[b.deliveryMode] || 'Online',
      status:STATUS[b.status] || 'pending', price:cedis(b.priceMinor),
      note:b.customerNote || '', forWhom:b.onBehalfOf || null, reviewed:!!b.reviewed
    }));
  }

  /* Threads and their messages. One detail call per thread — there are four, and the list endpoint
     carries no bodies. */
  async function loadThreads(){
    if(!TOKEN) return;
    const list = await (await fetch(MESSAGING + '/api/threads', { headers })).json();
    const details = await Promise.all((list || []).map(t =>
      fetch(MESSAGING + '/api/threads/' + t.reference, { headers }).then(r => r.json())));
    THREADS.length = 0;
    (list || []).forEach((t, i) => THREADS.push({
      id:t.reference, pro:t.professionalRef, unread:t.unread || 0,
      msgs:((details[i] || {}).messages || []).map(m => ({
        /* Direction, not authorship: the API says CUSTOMER_TO_PROFESSIONAL, and this page is the
           customer's side (ME). A professional's token would need the opposite mapping — live mode
           does not offer the professional workspace, and this is where that assumption lives. */
        from:m.direction === 'CUSTOMER_TO_PROFESSIONAL' ? 'me' : 'them',
        t:stamp(m.sentAt), x:m.body || ''
      }))
    }));
  }

  /* 'YYYY-MM-DD HH:MM', which is what the demo's message list renders. The API sends an Instant. */
  const stamp = iso8601 => {
    if(!iso8601) return '';
    const d = new Date(iso8601);
    const p2 = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  };

  async function refreshThread(ref){
    const d = await (await fetch(MESSAGING + '/api/threads/' + ref, { headers })).json();
    const t = THREADS.find(x => x.id === ref);
    if(!t) return;
    t.msgs = (d.messages || []).map(m => ({
      from:m.direction === 'CUSTOMER_TO_PROFESSIONAL' ? 'me' : 'them', t:stamp(m.sentAt), x:m.body || ''
    }));
    t.unread = (d.thread || {}).unread || 0;
  }

  async function refreshReviewsFor(ref){
    const rows = await (await fetch(CATALOG + '/api/professionals/' + ref + '/reviews?page=0&size=200', { headers })).json();
    for(let i = REVIEWS.length - 1; i >= 0; i--) if(REVIEWS[i].pro === ref) REVIEWS.splice(i, 1);
    (rows.content || []).forEach(r => REVIEWS.push({
      id:r.ref, pro:ref, author:r.authorName, ini:r.authorInitials,
      stars:r.stars, date:r.publishedOn, text:r.body || '', reply:r.professionalReply || ''
    }));
    const p = PROS.find(x => x.id === ref);
    if(p){
      const rs = REVIEWS.filter(r => r.pro === ref);
      p.reviewCount = rs.length;
      p.rating = rs.length ? Math.round(avg(rs.map(r => r.stars)) * 10) / 10 : 0;
    }
  }

  if(TOKEN){
    const demoConfirm = confirmBooking;
    confirmBooking = async function(){
      const b = state.booking;
      try {
        await send(BOOKING, '/api/bookings', {
          professionalRef:b.pro, serviceRef:b.svc, customerName:ME.name,
          scheduledDate:b.date, scheduledTime:b.time, deliveryMode:ENUM_MODE[b.mode],
          customerNote:b.notes || null,
          onBehalfOf:b.forWhom === 'other' ? (b.who || 'A person in my care') : null,
          careSummaryShared:false
        });
      } catch(e){
        /* No modal, no optimistic row, no toast claiming success. */
        return toast('The estate refused this booking: ' + e.message, 'warn');
      }
      demoConfirm();
      await loadBookings();
      render();
    };

    /* sendMsg is REWRITTEN rather than wrapped, unlike confirmBooking and submitReview above.
       The demo's version pushes the message, then after 1.6s pushes a reply from the professional
       and toasts "<name> replied". That is a scripted demo beat and it is fine in a demo. Against a
       live estate it would put words into a real professional's mouth on a real conversation — the
       one place where reusing the original would have been actively dishonest rather than merely
       optimistic. So the fabricated reply is gone, and the thread is re-read from the server. */
    sendMsg = async function(){
      const inp = $('#msgIn'); if(!inp) return;
      const v = inp.value.trim(); if(!v) return;
      const t = THREADS.find(x => x.id === state.threadId); if(!t) return;
      try {
        await send(MESSAGING, '/api/threads/' + t.id + '/messages', { body:v });
      } catch(e){
        return toast('The estate refused this message: ' + e.message, 'warn');
      }
      inp.value = '';
      await refreshThread(t.id);
      render();
      const cb = $('#convoBody'); if(cb) cb.scrollTop = cb.scrollHeight;
    };

    const demoReview = submitReview;
    submitReview = async function(id){
      const stars = window._rv || 5;
      const text = ($('#rvText') && $('#rvText').value.trim()) || 'Booked through BridgeCare. A good session.';
      const booking = BOOKINGS.find(x => x.id === id);
      try {
        /* `id` is the estate's booking reference in live mode — see loadBookings. The API proves a
           COMPLETED booking backs the review and that it is the caller's, so a review that would be
           refused there is refused here rather than appearing and vanishing on the next reload. */
        await send(CATALOG, '/api/reviews', { bookingReference:id, stars, body:text });
      } catch(e){
        return toast('The estate refused this review: ' + e.message, 'warn');
      }
      /* demoReview(id), not demoReview(). It looks up the booking by that id, and calling it bare
         throws on `undefined.pro` AFTER the POST has already succeeded — leaving a review published
         on the server and an error on the screen. demoConfirm above takes no argument, which is the
         only reason the same slip did not happen twice. */
      demoReview(id);
      if(booking) await refreshReviewsFor(booking.pro);
      await loadBookings();
      render();
    };
  }

  load().then(loadBookings).then(loadThreads).then(stream).catch(e => banner('Live mode failed: ' + e.message, 'warn'));
})();
</script>
</body>
</html>
