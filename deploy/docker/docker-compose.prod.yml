# ==============================================================================
#  HealthConnect Marketplace — production stack
#
#  Uploaded to the production host by ../deploy-prod.sh, which also generates the .env this file
#  reads. Do not edit on the host: deploy-prod.sh overwrites it, and the outgoing .env is kept as
#  .env.previous, which is what makes rollback possible.
#
#  Image coordinates come from the channel the deploy used:
#     default channel  docker.jojoaddison.net/healthconnect/<service>:<tag>
#     github channel   ghcr.io/<owner>/healthconnect-<service>:<tag>
#  HC_IMAGE_SEP is "/" or "-" accordingly — GHCR has no nested-path namespaces.
# ==============================================================================
name: healthconnect

x-service-base: &service-base
  restart: unless-stopped
  environment: &service-env
    # Uniform internal port, overriding the per-service serverPort the JDL assigns. See the dev
    # compose file for why.
    SERVER_PORT: 8080
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    SPRING_CLOUD_CONSUL_HOST: ${HC_CONSUL_HOST:-consul}
    SPRING_CLOUD_CONSUL_PORT: ${HC_CONSUL_PORT:-8500}
    SPRING_KAFKA_BOOTSTRAP_SERVERS: ${HC_KAFKA_BOOTSTRAP:-kafka:9092}
    # One signing key across the estate. Never set a per-service override: a local value silently
    # wins and the symptom is a successful login followed by 401s from the services.
    #
    # Supplied from $REMOTE_PATH/secrets.env on the host, NOT from the .env deploy-prod.sh writes —
    # see the note on the pepper below, which applies to both. Until 2026-09-02 nothing supplied it
    # at all: render_env emitted neither secret and the deploy ran `docker compose up` with no
    # environment, so every production deploy would have died right here on the :? message.
    #
    # THAT MESSAGE SAID "platform JWT secret is required" UNTIL 2026-09-05, and it is the one string
    # an operator meets at the moment of failure — so it was the last copy of the defect D49 records,
    # sending whoever hit it looking for "the platform" key. That key is the one hc-admin, hc-patient
    # and hc-professional share, and hc-market is deliberately not in that set (decisions.md D37);
    # every other hint was corrected while this one was left pointing the wrong way. It now says what
    # to generate, and says what not to copy, in the place the question is actually asked.
    JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:?this estate's own signing key is required — generate one fresh with `head -c 64 /dev/urandom | base64 -w0` into secrets.env. It is NOT the platform key in ~/webroot/01-healthconnect/.env, which hc-market does not share — decisions.md D37}
    # The erasure pepper — decisions.md D35. Keys the HMAC behind an erased customer's alias, and is
    # required for the same reason the signing key is: a committed default in a public repository is
    # not a secret, and here it is the only thing standing between a database dump and re-identifying
    # every erased row from a list of guessable logins.
    #
    # One value across booking, catalog and messaging, and it MUST NOT CHANGE once anything has been
    # erased in production: aliases are written into rows in place, nothing re-keys them, and a new
    # pepper leaves messaging unable to recognise its own erased subjects. It belongs with the
    # platform's other long-lived secrets, not in a per-deploy .env that deploy-prod.sh regenerates.
    #
    # That sentence described an intention nothing implemented, which is how it survived: there was
    # no such file, this variable came from nowhere, and the first real deploy would have stopped
    # here. It now names something real — `secrets.env`, created once by hand next to the generated
    # .env, passed to every compose invocation as a second --env-file, and rewritten by no deploy and
    # no rollback. deploy-prod.sh checks both keys are in it during preflight, before the running
    # stack is touched, and never reads their values.
    #
    # ALL REPLICAS OF MESSAGING MUST SHARE THIS VALUE, or none may run. ErasureRegisterGuard decides
    # once, at startup, per process: an instance started without the pepper against a database whose
    # register is still empty passes its guard and then answers `isErased` = false for the rest of
    # its life, writing real logins for people a peppered sibling has erased. Scaling any of the
    # three services means scaling this variable with them.
    HEALTHCONNECT_PRIVACY_PEPPER: ${HC_PRIVACY_PEPPER:?erasure pepper is required — see decisions.md D35}
    # Retention policy and controller registration — decisions.md D42, counsel 2026-09-03.
    #
    # UNLIKE the two secrets above these are NOT required, and the difference is deliberate. A missing
    # secret must stop a deploy; a missing retention figure must not, because counsel's ratified values
    # are the committed fallback in application.yml and a stack that refused to start over a number it
    # already knows would be failing for no reason. Set them here only to correct a deployment without
    # cutting a release.
    #
    # The registration number has no fallback anywhere — absent it, the service starts, logs a warning
    # and reports null from GET /api/desk/privacy. It is a real identifier belonging to a real
    # organisation, so a placeholder would be a false claim rather than a harmless default, and this
    # repository is public. It belongs in secrets.env beside the two keys — not because it is secret,
    # but because it is not ours to publish on the organisation's behalf.
    HC_RETENTION_FINANCIAL_DAYS: ${HC_RETENTION_FINANCIAL_DAYS:-2190}
    HC_RETENTION_OPERATIONAL_DAYS: ${HC_RETENTION_OPERATIONAL_DAYS:-365}
    HC_RETENTION_CARE_SUMMARY_DAYS: ${HC_RETENTION_CARE_SUMMARY_DAYS:-90}
    HC_DPC_REGISTRATION: ${HC_DPC_REGISTRATION:-}
    # The seed loader is unreachable under prod regardless; this is the second, explicit lock.
    HEALTHCONNECT_SEED_ENABLED: ${HEALTHCONNECT_SEED_ENABLED:-false}
    # --- OpenTelemetry -----------------------------------------------------------------------
    #
    # PUSH, not scrape. The `monitoring` network below carries the host's shared collector; every
    # other product in this workspace borrows the same one rather than shipping its own. That stack
    # deliberately has NO application scrape targets, so the /management/prometheus endpoint these
    # services expose is read by nothing.
    #
    # Nothing needs changing in the monitoring stack for this to appear: its service:* recording
    # rules aggregate `sum by (service_name)` with no allow-list, so setting OTEL_SERVICE_NAME per
    # service below is what puts hc-market on the existing dashboards.
    OTEL_EXPORTER_OTLP_ENDPOINT: ${HC_OTEL_ENDPOINT:-http://otel-collector:4317}
    OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    # deployment.environment ONLY. Adding service.version=${HC_TAG} is tempting -- a deploy would
    # show as a series change -- and it is wrong: the collector turns every resource attribute into
    # a metric label, so a version that changes each deploy starts a whole new series set and
    # orphans the old one for the full retention period. The agent picks up a stable version from
    # the jar manifest by itself.
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production

    # Two variables, not one. If the agent flag were folded into HC_JAVA_OPTS's default, an
    # operator raising the heap would silently switch telemetry off for that service and nothing
    # would report an error -- the app would start, serve, and go quiet on the dashboards.
    JAVA_OPTS: ${HC_JAVA_OPTS:--Xmx512m -Xms256m} ${HC_OTEL_JAVA_OPTS:--javaagent:/app/otel-javaagent.jar}
  # Jib images have no curl and no wget, but they do have bash -- so this speaks HTTP over
  # bash's /dev/tcp rather than shelling out to a tool that is not there.
  healthcheck:
    test:
      - CMD
      - bash
      - -c
      - 'exec 3<>/dev/tcp/localhost/8080 && printf "GET /management/health/readiness HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3'
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 120s
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }
  # `default` is infranet (Kafka and Consul); `hcmarketnet` reaches this product's five databases;
  # `monitoring` reaches the shared otel-collector. All three are external -- see the note above the
  # networks block.
  #
  # hcmarketnet was added on 2026-09-05 with deploy/prod-server/. Until then this comment said
  # infranet carried "the databases" and no compose file in this repository declared a production
  # database at all, so every HC_*_DB_URL was a `:?` variable pointing at a hostname nothing on the
  # host provided. The stores are now a second compose project on this network, and they are NOT on
  # infranet: three sibling products share that one, and a database another product can resolve is
  # exactly what decisions.md D27 keeps off a shared network.
  networks: [default, hcmarketnet, monitoring]

services:
  hc-market-gateway:
    container_name: hc-market-gateway
    <<: *service-base
    image: ${HC_IMAGE_PREFIX}${HC_IMAGE_SEP}gateway:${HC_TAG}
    ports:
      # LOOPBACK ONLY, and 8086 rather than 8080. Both halves changed on 2026-09-05.
      #
      # `'${HC_GATEWAY_PORT:-8080}:8080'` binds 0.0.0.0, so on the production host the gateway would
      # have answered the internet directly on port 8080, beside the nginx that terminates TLS. That
      # is not a routing hole — D28's four route predicates are the control and they apply either way
      # — but it bypasses TLS, the security headers, the CSP, the robots policy and the webhook rate
      # limit, all of which live at the edge. Every sibling binds 127.0.0.1 for exactly this reason,
      # and quality/README.md states the property this restores: the vhost is the only way in.
      #
      # 8086 because 8080 is the most contested port on a host running six products, and a collision
      # here presents as a gateway that will not start with a message about an address, not about a
      # plan. It sits in the same family as the siblings' loopback ports (hc-admin 8083, hc-patient
      # 8085, hc-professional 5503). NOT VERIFIED FREE ON webserver — nothing in this repository has
      # ever contacted that host — so confirming it is the operator's first step in the README.
      #
      # Written twice, here and in prod-server/hc-market-app.conf, because nginx cannot read the
      # environment. CI checks the two agree rather than letting them drift into a 502.
      - '127.0.0.1:${HC_GATEWAY_PORT:-8086}:8080'
    environment:
      <<: *service-env
      # The identity label every dashboard and recording rule groups by, so it must stay stable
      # across deploys. Matches the published image name, and distinguishes hc-market from the
      # sibling stacks that push to the same collector.
      OTEL_SERVICE_NAME: hc-market-gateway
      # SPRING_MONGODB_URI: Spring Boot 4 renamed spring.data.mongodb.* to spring.mongodb.*
      SPRING_MONGODB_URI: ${HC_GATEWAY_MONGODB_URI:?gateway mongodb uri is required}
      # --- STATIC ROUTES. Production did not have these, and every document said it did ---------
      #
      # Found on 2026-08-31 while narrowing the routes for decisions.md D28. This file set nothing
      # about routing at all, so the generated application.yml won — and it ships
      # `discovery.locator.enabled: true`. Production was therefore routing DYNAMICALLY through a
      # Consul on infranet shared with hc-admin, hc-patient and hc-professional, while CLAUDE.md,
      # decisions.md D27, the spec and both other compose files all asserted it routed statically
      # and used that as the justification for their own configuration.
      #
      # Two things that cost. A locator-derived route is `/services/{serviceId}/**` — the UNNARROWED
      # form — so catalog's /internal/** would have been reachable from the internet through the
      # very gateway D28 relies on. And the gateway would publish routes to whatever else happened
      # to be registered on that Consul, which is three other products.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_ENABLED: 'false'
      # `/api/**`, not `/**` — see D28 and the identical note in quality/compose.yml. This is the
      # only thing keeping /internal/** off the internet.
      #
      # These are CONTAINER names now, not service names, and that is the D28 fix.
      #
      # Compose publishes a service NAME as a DNS alias on every network it joins, and infranet is
      # shared with hc-admin, hc-patient and hc-professional. Services called `gateway`, `catalog`
      # and `booking` would therefore claim those aliases there — the exact collision D27 had to fix
      # on hcnet, where `catalog` and `booking` were already taken and docker answered with whichever
      # container it felt like. Nothing logs that; the gateway simply routes a share of its traffic
      # into another product.
      #
      # Whether those names are in fact already taken on infranet could not be checked from a
      # workstation, so the collision is made impossible rather than investigated: every service is
      # `hc-market-<name>` with an explicit container_name, and these hosts point at those. The
      # aliases the services still publish are now unique to this product.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: healthconnectcatalog
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://${HC_CATALOG_HOST:-hc-market-catalog}:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/services/healthconnectcatalog/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: healthconnectbooking
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://${HC_BOOKING_HOST:-hc-market-booking}:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: Path=/services/healthconnectbooking/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: healthconnectmessaging
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://${HC_MESSAGING_HOST:-hc-market-messaging}:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: Path=/services/healthconnectmessaging/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID: healthconnectpayout
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI: http://${HC_PAYOUT_HOST:-hc-market-payout}:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0: Path=/services/healthconnectpayout/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_FILTERS_0: StripPrefix=2
      #
      # --- ROUTE 4 IS THE ONE EXCEPTION, AND IT IS DELIBERATE (decisions.md D45) -------------
      #
      # booking's payment webhook is NOT under /api, on purpose: D43 put it outside so that the
      # four predicates above would keep it off the internet while there was no provider to call
      # it. A provider that cannot reach it cannot confirm a payment, so WP-13 routes it -- and
      # routing it is TWO changes, not one. The gateway's generated security chain ends with
      # `.pathMatchers("/services/**").authenticated()` and authenticates BEFORE routing, so
      # without the permit in gateway/config/PaymentWebhookRouteConfiguration.java this route is a
      # webhook that silently never arrives: 401 at the edge, nothing in booking's log, and a
      # provider that retries until it files the payment as undelivered.
      #
      # Nothing else moves. The path stays /webhooks/** rather than /**, so booking's own API is
      # not published to anonymous callers, and catalog's /internal/** is untouched. What
      # authenticates a callback is the provider's signature over the raw body, checked inside
      # booking -- today every caller gets 401, because no adapter in the estate can verify one.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_ID: healthconnectbooking-webhooks
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_URI: http://${HC_BOOKING_HOST:-hc-market-booking}:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_PREDICATES_0: Path=/services/healthconnectbooking/webhooks/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_FILTERS_0: StripPrefix=2

  hc-market-catalog:
    container_name: hc-market-catalog
    <<: *service-base
    image: ${HC_IMAGE_PREFIX}${HC_IMAGE_SEP}catalog:${HC_TAG}
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: hc-market-catalog
      # POST /api/reviews proves a COMPLETED booking backs the review before accepting it (spec §9),
      # which means catalog calls booking. Fails closed: without this it answers 503 "cannot verify
      # the booking right now" for every review, in production only.
      HEALTHCONNECT_BOOKING_BASE_URL: http://${HC_BOOKING_HOST:-hc-market-booking}:8080
      SPRING_DATASOURCE_URL: ${HC_CATALOG_DB_URL:?catalog datasource url is required}
      SPRING_DATASOURCE_USERNAME: ${HC_CATALOG_DB_USER:-healthconnectCatalog}
      SPRING_DATASOURCE_PASSWORD: ${HC_CATALOG_DB_PASSWORD:?catalog datasource password is required}

  hc-market-booking:
    container_name: hc-market-booking
    <<: *service-base
    image: ${HC_IMAGE_PREFIX}${HC_IMAGE_SEP}booking:${HC_TAG}
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: hc-market-booking
      # POST /api/bookings prices the booking from the catalogue and establishes who owns the
      # professional reference (decisions.md D22, D28). Both calls FAIL CLOSED, so without this the
      # create path 503s every time. It was unset in all three compose files until 2026-08-31 and
      # nothing noticed: the ITs mock CatalogClient, and no health check exercises a write.
      HEALTHCONNECT_CATALOG_BASE_URL: http://${HC_CATALOG_HOST:-hc-market-catalog}:8080
      HEALTHCONNECT_PAYOUT_BASE_URL: http://${HC_PAYOUT_HOST:-hc-market-payout}:8080
      # The erasure fan-out — decisions.md D38. Booking calls messaging's and catalog's desk endpoints
      # with a token it mints from the estate signing key, so a complete erasure is one operator
      # action rather than three that each look successful on their own.
      HEALTHCONNECT_MESSAGING_BASE_URL: http://${HC_MESSAGING_HOST:-hc-market-messaging}:8080
      # --- Payment providers, and the third estate-wide secret (decisions.md D37/D45/D50) ---------
      #
      # D37 chose Paystack, Hubtel and MTN MoMo, with the customer choosing between them. Each
      # adapter is registered only when its own `enabled` flag is true, and ALL THREE ARE OFF here
      # and everywhere else in this repository.
      #
      # PAYSTACK IS IMPLEMENTED (D50); HUBTEL AND MTN MOMO ARE STILL SEAMS. Nobody here has an
      # account or credentials for those two, so writing a signature scheme or a field path for one
      # would be invention on the one path where a customer's money is already committed. See
      # net.jojoaddison.service.payment.provider's package documentation.
      #
      # TURNING ONE ON STILL MAKES EVERY PRICED BOOKING THAT NAMES IT ANSWER 502 -- PAYSTACK
      # INCLUDED, for a different reason. Its /transaction/initialize requires the customer's email
      # address; this estate holds none it may hand to a provider, and where one may legitimately
      # come from is an open disclosure decision (CustomerContacts, D50). Booking says which of the
      # two situations it is in, per enabled provider, at startup.
      #
      # The secret is what the provider signs its callbacks with. It is handled exactly like
      # JWT_BASE64_SECRET and HC_PRIVACY_PEPPER -- required where it is used, NEVER committed,
      # because this repository is public -- with one difference: it is optional, because a provider
      # nobody turned on needs none. Absent, callbacks addressed to that provider are REFUSED rather
      # than trusted, which is D35's rule for the pepper applied to a provider's key. Blank counts as
      # absent.
      #
      # ON PRODUCTION these belong in $REMOTE_PATH/secrets.env beside the other two, which
      # deploy-prod.sh passes with --env-file and never rewrites. They are NOT in that script's
      # required-secret list, deliberately: an estate with no provider configured needs none, and
      # making them required would fail every deploy for a value nothing reads.
      #
      # base-url and timeout-ms are Paystack's only other knobs and both have working defaults
      # (api.paystack.co, 10s), so neither needs setting. They are passed anyway because a variable
      # this repository documents and no compose file carries is a variable that silently does
      # nothing, which D46 found the hard way in the two end-to-end scripts.
      HC_PAYSTACK_ENABLED: ${HC_PAYSTACK_ENABLED:-false}
      HC_PAYSTACK_SECRET: ${HC_PAYSTACK_SECRET:-}
      HC_PAYSTACK_BASE_URL: ${HC_PAYSTACK_BASE_URL:-}
      HC_PAYSTACK_TIMEOUT_MS: ${HC_PAYSTACK_TIMEOUT_MS:-0}
      HC_HUBTEL_ENABLED: ${HC_HUBTEL_ENABLED:-false}
      HC_HUBTEL_SECRET: ${HC_HUBTEL_SECRET:-}
      HC_MOMO_ENABLED: ${HC_MOMO_ENABLED:-false}
      HC_MOMO_SECRET: ${HC_MOMO_SECRET:-}
      SPRING_DATASOURCE_URL: ${HC_BOOKING_DB_URL:?booking datasource url is required}
      SPRING_DATASOURCE_USERNAME: ${HC_BOOKING_DB_USER:-healthconnectBooking}
      SPRING_DATASOURCE_PASSWORD: ${HC_BOOKING_DB_PASSWORD:?booking datasource password is required}

  hc-market-messaging:
    container_name: hc-market-messaging
    <<: *service-base
    image: ${HC_IMAGE_PREFIX}${HC_IMAGE_SEP}messaging:${HC_TAG}
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: hc-market-messaging
      SPRING_DATASOURCE_URL: ${HC_MESSAGING_DB_URL:?messaging datasource url is required}
      SPRING_DATASOURCE_USERNAME: ${HC_MESSAGING_DB_USER:-healthconnectMessaging}
      SPRING_DATASOURCE_PASSWORD: ${HC_MESSAGING_DB_PASSWORD:?messaging datasource password is required}

  hc-market-payout:
    container_name: hc-market-payout
    <<: *service-base
    image: ${HC_IMAGE_PREFIX}${HC_IMAGE_SEP}payout:${HC_TAG}
    environment:
      <<: *service-env
      OTEL_SERVICE_NAME: hc-market-payout
      # The Overview screen's "next up" card reads this professional's schedule from booking. Unlike
      # the two above this one DEGRADES rather than failing closed — nextUpAvailable=false costs one
      # card, not the screen — which is exactly why it would have gone unnoticed indefinitely.
      HEALTHCONNECT_BOOKING_BASE_URL: http://${HC_BOOKING_HOST:-hc-market-booking}:8080
      SPRING_DATASOURCE_URL: ${HC_PAYOUT_DB_URL:?payout datasource url is required}
      SPRING_DATASOURCE_USERNAME: ${HC_PAYOUT_DB_USER:-healthconnectPayout}
      SPRING_DATASOURCE_PASSWORD: ${HC_PAYOUT_DB_PASSWORD:?payout datasource password is required}

# Kafka and Consul are HOST-WIDE infrastructure borrowed over an external network, not bundled here —
# the same convention every other product in this workspace follows (decisions.md D27). A missing
# broker is silent: the app starts, serves, and reports healthy while everything produced goes
# nowhere, which is why deploy-prod.sh checks reachability explicitly rather than relying on
# depends_on (which cannot express a host-wide container).
#
# The DATABASES are not in that sentence any more, and were never true in it. There is no host-wide
# PostgreSQL for four products to share; hc-market owns its schema, and D27's own closing paragraph
# keeps the databases off every shared network so no other product can reach them. They are declared
# in deploy/prod-server/compose.yml as a second compose project on hcmarketnet — bundled,
# deliberately, which is the opposite call from the broker and for the opposite reason.
networks:
  default:
    name: ${HC_NETWORK:-infranet}
    external: true
  # This product's own, created by deploy/prod-server/infra.sh — NOT by compose, because two
  # separate projects attach to it and a compose-created network would give each of them a different
  # one. `external: true` also means a missing network fails loudly at `up`.
  hcmarketnet:
    name: ${HC_DATA_NETWORK:-hcmarketnet}
    external: true
  # The host's observability stack (~/webroot/02-monitoring/services). External for the same reason
  # infranet is: it is shared with every other product on the box and is not this stack's to create.
  monitoring:
    name: ${HC_MONITORING_NETWORK:-monitoring}
    external: true
