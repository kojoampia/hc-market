# ==============================================================================
#  HealthConnect Marketplace — dev / test estate
#
#  MongoDB for the gateway, one PostgreSQL per domain service, and the five applications. Started by
#  ../deploy-dev.sh, which is the only supported entry point — it does the preflight, topic creation,
#  health gating and seed verification this file cannot express.
#
#  --- THERE IS NO BROKER AND NO CONSUL HERE, AND THAT IS THE POINT ---------------------------
#
#  This file declared its own single-node Kafka and its own `consul agent -dev` until 2026-08-31.
#  It does not any more, and neither does any other deployment in this estate: both live once, in
#  hc-infra (~/webroot/01-healthconnect/hc-infra), and every stack points at them by CONTAINER NAME
#  over the shared `hcnet` network. hc-market's dev estate was the last holdout — the quality stack
#  moved first, and leaving dev on a private broker would have preserved in miniature exactly the
#  thing the migration was for.
#
#  Four brokers is the same as no broker: four disjoint logs, every cross-service event path
#  configured and never once exercised, and every stack green while it was wrong.
#
#  Bring the shared plane up FIRST — these services depend on it, `hcnet` is external, and compose
#  refuses to start a stack whose external network does not exist:
#
#      cd ~/webroot/01-healthconnect/hc-infra && ./startup.sh
#
#  --- WHY EVERY SERVICE NAME HERE STARTS `dev-` ---------------------------------------------
#
#  Compose publishes a service's NAME as a DNS alias on every network it joins, and this stack now
#  joins the network four other stacks are on. `catalog` and `booking` are ALREADY aliases on hcnet,
#  claimed by hc-market's quality stack — verified by resolving them from an unrelated container.
#  A second `catalog` there does not error: docker answers with whichever it likes, so the QUALITY
#  gateway starts routing a share of its traffic into the DEV catalog, and vice versa. Nothing logs
#  anything. The names are therefore unique across the host, and every intra-stack address below is
#  a CONTAINER name rather than a short service name for the same reason.
#
#  The databases deliberately stay OFF hcnet. Another product has no business reaching this stack's
#  Postgres, and keeping them off the shared plane is also what lets them keep the short, obvious
#  names (`catalog-db`, `gateway-db`) without ambiguity.
#
#  --- ONE BUS, TWO ESTATES, SEPARATED BY A TOPIC PREFIX ---------------------------------------
#
#  Topic names used to be compiled in (`@KafkaListener(topics = "healthconnect.booking.completed")`),
#  so dev and quality shared a topic set. Consumer groups were already distinct — `hc-market-dev-*`
#  here against `hc-market-*` in quality/compose.yml — which stopped the two estates stealing each
#  other's partitions, and meant the opposite thing for delivery: BOTH received every event either
#  one published, and completing a booking here wrote a ledger row over there.
#
#  Closed by decisions.md D29. HEALTHCONNECT_TOPICS_PREFIX below is `dev.`, and it is the only place
#  in the repository that sets one — the property defaults to empty in every application.yml, so
#  production and quality keep the names they already use.
#
#  The consumer groups stay distinct anyway. They cost nothing and they are the second line if a
#  prefix is ever cleared by mistake.
# ==============================================================================
name: healthconnect-dev

x-service-base: &service-base
  restart: unless-stopped
  # `default` is this project's own network — the databases and nothing else. `hcnet` is the shared
  # application plane where hc-infra's Consul and Kafka live; it is external, and this stack will
  # not start without it.
  networks: [default, hcnet]
  environment: &service-env
    # Every service listens on 8080 INSIDE its container, overriding the per-service serverPort
    # the JDL assigns (catalog 8081, booking 8082, ...). Those numbers exist so the apps can run
    # side by side on a developer machine; in separate containers they only create opportunities to
    # map the wrong one. Host ports still differ -- see the `ports:` entries.
    SERVER_PORT: 8080
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test,dev}
    # --- The shared broker, by container name, and BOTH property names -------------------------
    #
    # hc-market talks to Kafka through Spring Kafka directly and reads SPRING_KAFKA_BOOTSTRAP_SERVERS;
    # its siblings bind through Spring Cloud Stream and read the binder property. Both are set so
    # that a binding added later cannot quietly point somewhere else.
    #
    # NEVER `kafka`. These containers are on hcnet with every other stack, and a short name resolves
    # across every network a container is on — the broker's own compose file advertises itself as
    # hc-shared-quality-kafka for precisely this reason.
    SPRING_KAFKA_BOOTSTRAP_SERVERS: ${HC_SHARED_KAFKA:-hc-shared-quality-kafka}:9092
    SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: ${HC_SHARED_KAFKA:-hc-shared-quality-kafka}:9092
    # --- Shared Consul: REGISTERS, does not ROUTE ----------------------------------------------
    #
    # Two separate statements, and the second is the one that changed. These five register with
    # hc-infra's Consul and appear in its catalog with health checks. They no longer ROUTE through
    # it: see DISCOVERY_LOCATOR_ENABLED on the gateway, which is now false with four static routes
    # beneath it.
    #
    # That is not a preference, it is forced. The generated gateway ships
    # `discovery.locator.enabled: true`, which was harmless while this stack had a private Consul
    # holding only its own five services. On the shared one the catalog also holds hc-admin,
    # hc-patient, hc-professional and hc-market's QUALITY estate — so the locator would mint routes
    # into other people's running services. Production routes statically anyway, so static routes
    # here rehearse production rather than diverging from it.
    #
    # PREFER_IP_ADDRESS false, and each service sets DISCOVERY_HOSTNAME to its container name below.
    # These containers are on two networks and so have two addresses; Spring picks one and Consul
    # health-checks whatever it was handed. Pick the wrong one and the service registers, then flaps
    # critical — and the registration reads as the broken thing rather than the address.
    SPRING_CLOUD_CONSUL_HOST: ${HC_SHARED_CONSUL:-hc-shared-quality-consul}
    SPRING_CLOUD_CONSUL_PORT: 8500
    SPRING_CLOUD_CONSUL_ENABLED: 'true'
    SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED: 'true'
    SPRING_CLOUD_CONSUL_DISCOVERY_REGISTER: 'true'
    SPRING_CLOUD_CONSUL_DISCOVERY_PREFER_IP_ADDRESS: 'false'
    SPRING_CLOUD_CONSUL_DISCOVERY_HEALTH_CHECK_PATH: /management/health
    SPRING_CLOUD_CONSUL_DISCOVERY_HEALTH_CHECK_INTERVAL: 10s
    # KV-backed config stays OFF: the prefix is empty, and an application reading config from a store
    # with nothing in it starts identically to one that does not — until somebody adds a key.
    SPRING_CLOUD_CONSUL_CONFIG_ENABLED: 'false'
    # Never fail-fast. A Consul merely slow to elect a leader would otherwise take all five services
    # down at startup, making the shared plane a hard dependency. It is meant to be an optional one:
    # losing it must cost visibility, not the estate.
    SPRING_CLOUD_CONSUL_CONFIG_FAIL_FAST: 'false'
    # --- The topic prefix that separates this estate from quality ------------------------------
    #
    # decisions.md D29. One broker serves the whole estate since D27, and hc-market runs on it
    # twice. Topic names were compiled into the @KafkaListener annotations, so dev and quality
    # shared a topic set: distinct consumer groups meant BOTH received every event either one
    # published, and completing a booking here wrote a ledger row over there.
    #
    # `dev.` is set ONLY here. The property defaults to empty in every application.yml, so
    # production and quality keep the names they already use — renaming a live topic resets every
    # consumer offset keyed to it. deploy-dev.sh creates the prefixed topics using this same value.
    #
    # The trailing dot is part of it: the property is concatenated, not joined.
    HEALTHCONNECT_TOPICS_PREFIX: ${HC_TOPIC_PREFIX-dev.}
    # One signing key across the estate. A per-service override here silently wins and the symptom
    # is a successful login followed by 401s from the services — see the workspace guide.
    JHIPSTER_SECURITY_AUTHENTICATION_JWT_BASE64_SECRET: ${JWT_BASE64_SECRET:?set JWT_BASE64_SECRET in deploy/.env}
    # --- The erasure pepper ---------------------------------------------------------------------
    #
    # decisions.md D35. Keys the HMAC that turns an erased customer's login into the alias their
    # rows carry. Required rather than defaulted, exactly like the signing key and for the same
    # reason: this repository is public, so any value committed here is a value an attacker holding
    # a database dump can use to re-identify every erased row.
    #
    # ONE value for the whole estate. booking, catalog and messaging must agree or one person
    # acquires three aliases and messaging's erased-subject register stops matching either sibling —
    # which nothing detects, because each service goes on working perfectly by itself.
    #
    # Changing it does not re-key anything already written. Aliases from the old pepper stay in the
    # rows and stop matching anything recomputed, so a dev estate that has erased somebody wants
    # `down --clean` rather than a new pepper.
    HEALTHCONNECT_PRIVACY_PEPPER: ${HC_PRIVACY_PEPPER:?set HC_PRIVACY_PEPPER in deploy/.env}
    # Retention policy and controller registration — decisions.md D42, counsel 2026-09-03. Optional
    # here, unlike the pepper above: counsel's ratified figures are the committed fallback in
    # application.yml, so an unset variable runs the correct policy rather than none. Set them in
    # deploy/.env only to try a different one.
    #
    # HC_DPC_REGISTRATION has no fallback and is expected to be absent in dev — the service starts,
    # logs a warning, and the desk reports null. That is the honest answer on a developer machine.
    HC_RETENTION_FINANCIAL_DAYS: ${HC_RETENTION_FINANCIAL_DAYS:-2190}
    HC_RETENTION_OPERATIONAL_DAYS: ${HC_RETENTION_OPERATIONAL_DAYS:-365}
    HC_RETENTION_CARE_SUMMARY_DAYS: ${HC_RETENTION_CARE_SUMMARY_DAYS:-90}
    HC_DPC_REGISTRATION: ${HC_DPC_REGISTRATION:-}
  # The Jib images contain no curl and no wget -- a CMD-based HTTP check fails with "executable
  # file not found" forever and the container sits in `health: starting` for its whole life. They
  # DO contain bash, so this uses bash's /dev/tcp to speak HTTP with no external tools at all.
  # deploy-dev.sh additionally gates from the host, which proves the port mapping too.
  healthcheck:
    test:
      - CMD
      - bash
      - -c
      - 'exec 3<>/dev/tcp/localhost/8080 && printf "GET /management/health HTTP/1.0\r\n\r\n" >&3 && grep -q UP <&3'
    interval: 10s
    timeout: 5s
    retries: 30
    start_period: 90s

services:
  # ------------------------------------------------------------- infrastructure --
  # Databases only. The broker and Consul are hc-infra's — see the header.
  #
  # These keep short names because they are on `default` alone: nothing outside this project can
  # resolve them, so `catalog-db` cannot collide with anybody else's.
  #
  # The gateway owns users on MongoDB — decisions.md D1. Every domain service is PostgreSQL.
  gateway-db:
    image: mongo:8.0
    volumes:
      - gateway-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ping:1}).ok']
      interval: 10s
      timeout: 5s
      retries: 20

  catalog-db: &postgres
    image: postgres:17
    environment:
      POSTGRES_USER: healthconnectCatalog
      POSTGRES_DB: healthconnectCatalog
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 5s
      timeout: 5s
      retries: 20

  booking-db:
    <<: *postgres
    environment:
      POSTGRES_USER: healthconnectBooking
      POSTGRES_DB: healthconnectBooking
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - booking-data:/var/lib/postgresql/data

  messaging-db:
    <<: *postgres
    environment:
      POSTGRES_USER: healthconnectMessaging
      POSTGRES_DB: healthconnectMessaging
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - messaging-data:/var/lib/postgresql/data

  payout-db:
    <<: *postgres
    environment:
      POSTGRES_USER: healthconnectPayout
      POSTGRES_DB: healthconnectPayout
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - payout-data:/var/lib/postgresql/data

  # ------------------------------------------------------------------ services --
  # Every published port is overridable. A workstation running several of these products at once
  # WILL collide otherwise -- this one already has abofonsa_api on 8080. Defaults are the spec's
  # ports; deploy-dev.sh reads the same variables for its health gates.
  #
  # Nothing here publishes a Consul or Kafka port any more: this stack no longer runs either, and
  # hc-infra publishes them once, on 18510 and 19192.
  dev-gateway:
    <<: *service-base
    container_name: hc-market-dev-gateway
    image: healthconnect/gateway:local
    ports:
      - '${HC_GATEWAY_PORT:-8080}:8080'
    environment:
      <<: *service-env
      # This service's identity in Consul. `hc-market-dev-` and not `hc-market-`, which is the
      # quality estate's prefix: registering both under one name would present two estates as
      # instances of one service, and the health of either would read as the health of both.
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-dev-gateway
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-dev-gateway
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-dev-gateway
      # An explicit consumer group. Without one an anonymous group is generated per instance: no
      # committed offsets, so a restart resumes at the end of the log and everything published in
      # between is gone. Worse, two applications landing in the same generated group split the
      # partitions and each sees about half, silently.
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-dev-gateway
      # SPRING_MONGODB_URI, not SPRING_DATA_MONGODB_URI. Spring Boot 4 moved MongoDB config from
      # spring.data.mongodb.* to spring.mongodb.*, and JHipster 9.2.0 generates the new form. The old
      # variable sets a property nobody reads, so application-dev.yml's localhost:27017 wins and the
      # gateway dies in Mongock with "Connection refused ... localhost:27017" -- a message that points
      # at the database, not at the variable name. The sibling stacks use SPRING_MONGODB_URI too.
      SPRING_MONGODB_URI: mongodb://gateway-db:27017/healthconnectGateway
      # Static routes, and the locator OFF. See the long note on the anchor above: the generated
      # default is `true`, and on a SHARED Consul that would route this gateway into whatever else
      # is registered on the host.
      #
      # --- `/api/**`, NOT `/**`, AND THAT IS A SECURITY CONTROL ------------------------------
      #
      # These four predicates are the only thing keeping catalog's /internal/** off the internet
      # (decisions.md D28). It answers "who owns professional ref p1?" for the booking service, with
      # no token, because this estate has no service-to-service authentication — so what protects it
      # is that no gateway route matches it. Widen these back to `/**` and it is public.
      #
      # Nothing is lost by narrowing: every consumer in the repository already goes through /api/**,
      # and /management is reached per-container rather than through the edge.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_ENABLED: 'false'
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_ID: healthconnectcatalog
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_URI: http://hc-market-dev-catalog:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_PREDICATES_0: Path=/services/healthconnectcatalog/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_0_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_ID: healthconnectbooking
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_URI: http://hc-market-dev-booking:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_PREDICATES_0: Path=/services/healthconnectbooking/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_1_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_ID: healthconnectmessaging
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_URI: http://hc-market-dev-messaging:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_PREDICATES_0: Path=/services/healthconnectmessaging/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_2_FILTERS_0: StripPrefix=2
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_ID: healthconnectpayout
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_URI: http://hc-market-dev-payout:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_PREDICATES_0: Path=/services/healthconnectpayout/api/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_FILTERS_0: StripPrefix=2
      #
      # --- ROUTE 4 IS THE ONE EXCEPTION, AND IT IS DELIBERATE (decisions.md D45) -------------
      #
      # booking's payment webhook is NOT under /api, on purpose: D43 put it outside so that the
      # four predicates above would keep it off the internet while there was no provider to call
      # it. A provider that cannot reach it cannot confirm a payment, so WP-13 routes it -- and
      # routing it is TWO changes, not one. The gateway's generated security chain ends with
      # `.pathMatchers("/services/**").authenticated()` and authenticates BEFORE routing, so
      # without the permit in gateway/config/PaymentWebhookRouteConfiguration.java this route is a
      # webhook that silently never arrives: 401 at the edge, nothing in booking's log, and a
      # provider that retries until it files the payment as undelivered.
      #
      # Nothing else moves. The path stays /webhooks/** rather than /**, so booking's own API is
      # not published to anonymous callers, and catalog's /internal/** is untouched. What
      # authenticates a callback is the provider's signature over the raw body, checked inside
      # booking -- today every caller gets 401, because no adapter in the estate can verify one.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_ID: healthconnectbooking-webhooks
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_URI: http://hc-market-dev-booking:8080
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_PREDICATES_0: Path=/services/healthconnectbooking/webhooks/**
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_4_FILTERS_0: StripPrefix=2
    depends_on:
      gateway-db: { condition: service_healthy }

  dev-catalog:
    <<: *service-base
    container_name: hc-market-dev-catalog
    image: healthconnect/catalog:local
    ports:
      - '${HC_CATALOG_PORT:-8081}:8080'
    environment:
      <<: *service-env
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-dev-catalog
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-dev-catalog
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-dev-catalog
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-dev-catalog
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-db:5432/healthconnectCatalog
      SPRING_DATASOURCE_USERNAME: healthconnectCatalog
      # 'faker' is deliberately absent — it loads 30 nonsense rows per entity and makes the seed
      # loader's idempotency check skip the real seed. See catalog/config/application-dev.yml.
      SPRING_LIQUIBASE_CONTEXTS: dev
      HEALTHCONNECT_SEED_ENABLED: 'true'
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      HEALTHCONNECT_SEED_ANCHOR_DATES: ${HEALTHCONNECT_SEED_ANCHOR_DATES:-false}
      # POST /api/reviews verifies the booking before accepting a review. The CONTAINER name, not
      # `booking` — that short name belongs to the quality stack on hcnet as well as to this one.
      HEALTHCONNECT_BOOKING_BASE_URL: http://hc-market-dev-booking:8080
    # Long form — see the note in quality/compose.yml. The short syntax is split on colons and
    # an uninterpolated ${VAR:-default} source carries two of its own, so the file fails to
    # parse under `docker compose config --no-interpolate` on the CI runner's compose.
    volumes:
      - type: bind
        source: ${SEED_HOST_PATH:-../demo}
        target: /app/seed
        read_only: true
    depends_on:
      catalog-db: { condition: service_healthy }

  dev-booking:
    <<: *service-base
    container_name: hc-market-dev-booking
    image: healthconnect/booking:local
    ports:
      - '${HC_BOOKING_PORT:-8082}:8080'
    environment:
      <<: *service-env
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-dev-booking
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-dev-booking
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-dev-booking
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-dev-booking
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/healthconnectBooking
      SPRING_DATASOURCE_USERNAME: healthconnectBooking
      SPRING_LIQUIBASE_CONTEXTS: dev
      # POST /api/bookings prices the booking from the catalogue and establishes who owns the
      # professional reference (decisions.md D22, D28). Both calls FAIL CLOSED, so without this the
      # create path 503s every time — which is exactly what it did in this stack until 2026-08-31,
      # in silence: the ITs mock CatalogClient, and the read paths every health check exercises are
      # unaffected. Found by driving a real booking from the prototype.
      HEALTHCONNECT_CATALOG_BASE_URL: http://hc-market-dev-catalog:8080
      # The receipt modal asks payout for the brokerage split. Fails closed by design.
      HEALTHCONNECT_PAYOUT_BASE_URL: http://hc-market-dev-payout:8080
      # The erasure fan-out (decisions.md D38) calls messaging's and catalog's desk endpoints with a
      # token booking mints from the estate signing key. Catalog is addressed by the variable above;
      # this is the only place booking talks to messaging. Unset, the fan-out reports messaging as
      # unreachable on every call — visibly, in the receipt, which is the whole point of the package,
      # so this one fails loudly rather than the way HEALTHCONNECT_CATALOG_BASE_URL failed silently.
      HEALTHCONNECT_MESSAGING_BASE_URL: http://hc-market-dev-messaging:8080
      HEALTHCONNECT_SEED_ENABLED: 'true'
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      HEALTHCONNECT_SEED_ANCHOR_DATES: ${HEALTHCONNECT_SEED_ANCHOR_DATES:-false}
      # --- Payment providers, and the third estate-wide secret (decisions.md D37/D45/D50) ---------
      #
      # D37 chose Paystack, Hubtel and MTN MoMo, with the customer choosing between them. Each
      # adapter is registered only when its own `enabled` flag is true, and ALL THREE ARE OFF here
      # and everywhere else in this repository.
      #
      # PAYSTACK IS IMPLEMENTED (D50); HUBTEL AND MTN MOMO ARE STILL SEAMS. Nobody here has an
      # account or credentials for those two, so writing a signature scheme or a field path for one
      # would be invention on the one path where a customer's money is already committed. See
      # net.jojoaddison.service.payment.provider's package documentation.
      #
      # TURNING ONE ON TODAY STILL MAKES EVERY PRICED BOOKING THAT NAMES IT ANSWER 502 -- PAYSTACK
      # INCLUDED, for a different reason. Its /transaction/initialize requires the customer's email
      # address; this estate holds none it may hand to a provider, and where one may legitimately
      # come from is an open disclosure decision (CustomerContacts, D50). Booking says which of the
      # two situations it is in, per enabled provider, at startup.
      #
      # The secret is what the provider signs its callbacks with. It is handled exactly like
      # JWT_BASE64_SECRET and HC_PRIVACY_PEPPER above -- required where it is used, NEVER committed,
      # because this repository is public -- with one difference: it is optional, because a provider
      # nobody turned on needs none. Absent, callbacks addressed to that provider are REFUSED rather
      # than trusted, which is D35's rule for the pepper applied to a provider's key. Blank counts as
      # absent. Put the values in deploy/.env, which deploy-dev.sh sources with `set -a`.
      #
      # base-url and timeout-ms are Paystack's only other knobs and both have working defaults
      # (api.paystack.co, 10s), so neither needs setting. They are passed anyway because a variable
      # this repository documents and no compose file carries is a variable that silently does
      # nothing, which D46 found the hard way in the two end-to-end scripts.
      HC_PAYSTACK_ENABLED: ${HC_PAYSTACK_ENABLED:-false}
      HC_PAYSTACK_SECRET: ${HC_PAYSTACK_SECRET:-}
      HC_PAYSTACK_BASE_URL: ${HC_PAYSTACK_BASE_URL:-}
      HC_PAYSTACK_TIMEOUT_MS: ${HC_PAYSTACK_TIMEOUT_MS:-0}
      HC_HUBTEL_ENABLED: ${HC_HUBTEL_ENABLED:-false}
      HC_HUBTEL_SECRET: ${HC_HUBTEL_SECRET:-}
      HC_MOMO_ENABLED: ${HC_MOMO_ENABLED:-false}
      HC_MOMO_SECRET: ${HC_MOMO_SECRET:-}
    # Long form — see the note in quality/compose.yml. The short syntax is split on colons and
    # an uninterpolated ${VAR:-default} source carries two of its own, so the file fails to
    # parse under `docker compose config --no-interpolate` on the CI runner's compose.
    volumes:
      - type: bind
        source: ${SEED_HOST_PATH:-../demo}
        target: /app/seed
        read_only: true
    depends_on:
      booking-db: { condition: service_healthy }

  dev-messaging:
    <<: *service-base
    container_name: hc-market-dev-messaging
    image: healthconnect/messaging:local
    ports:
      - '${HC_MESSAGING_PORT:-8083}:8080'
    environment:
      <<: *service-env
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-dev-messaging
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-dev-messaging
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-dev-messaging
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-dev-messaging
      SPRING_DATASOURCE_URL: jdbc:postgresql://messaging-db:5432/healthconnectMessaging
      SPRING_DATASOURCE_USERNAME: healthconnectMessaging
      SPRING_LIQUIBASE_CONTEXTS: dev
      HEALTHCONNECT_SEED_ENABLED: 'true'
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      HEALTHCONNECT_SEED_ANCHOR_DATES: ${HEALTHCONNECT_SEED_ANCHOR_DATES:-false}
    # Long form — see the note in quality/compose.yml. The short syntax is split on colons and
    # an uninterpolated ${VAR:-default} source carries two of its own, so the file fails to
    # parse under `docker compose config --no-interpolate` on the CI runner's compose.
    volumes:
      - type: bind
        source: ${SEED_HOST_PATH:-../demo}
        target: /app/seed
        read_only: true
    depends_on:
      messaging-db: { condition: service_healthy }

  dev-payout:
    <<: *service-base
    container_name: hc-market-dev-payout
    image: healthconnect/payout:local
    ports:
      - '${HC_PAYOUT_PORT:-8084}:8080'
    environment:
      <<: *service-env
      SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME: hc-market-dev-payout
      SPRING_CLOUD_CONSUL_DISCOVERY_INSTANCE_ID: hc-market-dev-payout
      SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME: hc-market-dev-payout
      SPRING_CLOUD_STREAM_DEFAULT_GROUP: hc-market-dev-payout
      SPRING_DATASOURCE_URL: jdbc:postgresql://payout-db:5432/healthconnectPayout
      SPRING_DATASOURCE_USERNAME: healthconnectPayout
      SPRING_LIQUIBASE_CONTEXTS: dev
      # The Overview screen's "next up" card reads this professional's schedule from booking. A
      # failure degrades the card (nextUpAvailable=false) rather than the screen.
      HEALTHCONNECT_BOOKING_BASE_URL: http://hc-market-dev-booking:8080
      HEALTHCONNECT_SEED_ENABLED: 'true'
      HEALTHCONNECT_SEED_FILE: /app/seed/seed-data.json
      HEALTHCONNECT_SEED_ANCHOR_DATES: ${HEALTHCONNECT_SEED_ANCHOR_DATES:-false}
    # Long form — see the note in quality/compose.yml. The short syntax is split on colons and
    # an uninterpolated ${VAR:-default} source carries two of its own, so the file fails to
    # parse under `docker compose config --no-interpolate` on the CI runner's compose.
    volumes:
      - type: bind
        source: ${SEED_HOST_PATH:-../demo}
        target: /app/seed
        read_only: true
    depends_on:
      payout-db: { condition: service_healthy }

networks:
  # The application plane, carrying hc-infra's Consul and Kafka. External because four product
  # stacks join it and none of them owns it: a network compose owns is a network compose deletes,
  # and `docker compose down` here would then tear the estate's event bus out from under stacks that
  # are still running. Created by hc-infra/startup.sh; this stack will not start without it.
  hcnet:
    external: true
    name: ${HC_SHARED_NETWORK:-hcnet}

volumes:
  gateway-data:
  catalog-data:
  booking-data:
  messaging-data:
  payout-data:
