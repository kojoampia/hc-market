# Deployed as /etc/nginx/sites-available/hc-market.conf on webserver, symlinked into sites-enabled.
# Named after the app, matching hc-patient.conf / hc-professional.conf / hc-crowdfunding.conf, not
# after the literal domain — the filename here carries the domain so it is obvious what it serves.
#
# THIS FILE IS WRITTEN ONCE, AT BOOTSTRAP, AND NEVER SHIPPED AGAIN.
#
# It is the pre-Certbot form: HTTP only, one server block, no ssl_certificate. Once DNS points here
# and the site is enabled, a person with sudo runs
#
#     sudo certbot --nginx -d market.abofonsa.com
#
# which rewrites THIS FILE IN PLACE, adding the TLS server block and the HTTP->HTTPS redirect. From
# that moment the server's copy is certbot's and no longer matches this one — it has two server
# blocks where this has one, and paths under /etc/letsencrypt that do not exist until certbot has
# run.
#
# Copying this file over certbot's is silently destructive, and both siblings record it: the TLS
# config is replaced by an HTTP-only one, `nginx -t` PASSES because that is valid nginx, the reload
# succeeds, and the site stops serving HTTPS with every check still green. So nothing in this
# repository installs it after bootstrap, and the README's deploy path does not mention it.
#
# Do NOT hand-write the `listen 443 ssl` block instead. hc-professional tried that and recorded why
# it is the wrong shape: certbot's --nginx installer expects to own those lines, and a hand-written
# block referencing /etc/letsencrypt paths that do not exist yet stops nginx from starting at all —
# so the site cannot be enabled to serve the ACME challenge that would create them. Bootstrap over
# HTTP and let certbot do the rewrite; that is also what keeps automatic renewal working.
#
# Everything that changes with a release lives in hc-market-app.conf, the snippet included below.
#
# --- market.abofonsa.com IS API-ONLY, AND THE PROTOTYPE IS NOT HERE -------------------------------
#
# This is the difference from every other hc-market edge, and it is deliberate rather than
# unfinished. quality/host-site.conf serves docs/Abofonsa_BridgeCare_Marketplace.html at
# /prototype, same-origin, so the page's live mode can reach the estate without CORS. There is no
# such location in this file and there must not be one.
#
# The prototype is populated with the seed: 18 invented professionals presented as real people, with
# names, photographs, credentials, association registration numbers, prices and reviews. On
# market.healthconnect.local — a private LAN box, plaintext, reachable from one office — that is a
# demo. On a public health-services domain under the BridgeCare brand it is eighteen fabricated
# practitioner listings published to the internet, findable, quotable, and indistinguishable from
# the real thing to anyone who arrives at the URL.
#
# So the reason it is absent is not that it was awkward to serve. Adding a /prototype location here
# would be a decision to publish invented professionals, and whoever adds one back "for parity with
# quality" should have to disagree with this paragraph first. Parity with quality is the wrong
# target: quality exists to rehearse production, not the other way round.
#
# The other consequence, which follows and is fine: the ONE surface a browser is offered on this
# hostname is a JSON API, so the CSP in the snippet can be `default-src 'none'` with no exception
# for inline script. That is the truthful policy for something that only ever returns JSON, and it
# is the same policy quality carries at the site level — the /prototype exception there is exactly
# what is not needed here.
#
# --- What this edge does NOT do -------------------------------------------------------------------
#
# It does not decide what is reachable. The gateway's route predicates do that, and they are a
# security control (decisions.md D28): `/services/<service>/api/**` plus the one webhook path, and
# nothing else. catalog's /internal/professionals/{ref}/login authenticates NOBODY, and the only
# thing keeping it off the internet is that no route matches it.
#
# So do not add a location here that proxies a path the gateway does not route, and do not add one
# that blocks a path the gateway does — the first publishes something by accident, the second makes
# a security control depend on two files agreeing. The `location /` below is a dumb pipe on purpose.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve the scheme the OUTER caller used rather than the one this hop was reached on. After
# certbot has run there are two server blocks and the redirect one is reached over http; this keeps
# X-Forwarded-Proto honest for anything upstream that builds an absolute URL. Identical to the map
# in quality/host-site.conf, which is there so the workstation copy and this one do not diverge.
map $http_x_forwarded_proto $abf_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name market.abofonsa.com;

    # Everything application-specific — headers, the CSP, robots, the rate limit and every location.
    # It depends on /etc/nginx/conf.d/hc-market-webhook.conf for its limit_req zone, which is
    # http-scope and cannot live in a server block. INSTALL THAT FILE FIRST or `nginx -t` fails with
    # "unknown limit_req zone" and refuses the reload for every other site on this host, not just
    # this one.
    include /etc/nginx/snippets/hc-market-app.conf;

    access_log /var/log/nginx/hc-market.access.log;
    error_log  /var/log/nginx/hc-market.error.log;
}
