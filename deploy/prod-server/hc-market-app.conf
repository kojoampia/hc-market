# Installs to /etc/nginx/snippets/hc-market-app.conf, and is `include`d from inside the server block
# in sites-available/hc-market.conf.
#
# THIS IS THE FILE THAT SHIPS WHEN THE EDGE CHANGES. Its sibling, market.abofonsa.com.conf, is
# written to the server ONCE at bootstrap and never again — certbot rewrites that file in place to
# add the TLS block and the HTTP->HTTPS redirect, so the server's copy stops matching this
# repository's the moment TLS is configured. Shipping the repository's copy over it would delete the
# certificate wiring and the redirect, `nginx -t` would report success, and the site would drop to
# plain HTTP with every check still green. hc-patient met that first and hc-professional inherited
# it; this is the same split for the same reason.
#
# WHAT CANNOT LIVE HERE. This file is included inside `server { }`, so `limit_req_zone`, `log_format`
# and `map` are all invalid in it — they are http-scope directives. The one rate-limit zone this file
# references lives in nginx-conf.d/hc-market-webhook.conf and installs to /etc/nginx/conf.d/; the two
# `map` blocks stay in the vhost. INSTALL ORDER MATTERS: the zone file must be in place before this
# snippet is enabled, or `nginx -t` fails with "unknown limit_req zone" and refuses the reload for
# every other site on the host.
#
# NOTHING HERE IS INSTALLED BY ANY SCRIPT IN THIS REPOSITORY. /etc/nginx belongs to the architect on
# both machines, and being on the box is not the same as being authorised to reconfigure its edge.
# The README prints the sudo lines and runs none of them, exactly as quality/startup.sh does.
#
# AND THE INSTALLED FILE DRIFTS FROM THIS ONE, sometimes deliberately. Read the installed copy before
# concluding anything from this one.

    # --- Body size ---------------------------------------------------------------------------
    #
    # 1m, which is nginx's own default, stated rather than inherited so that changing it is a
    # decision. The siblings set 8m because they accept document uploads through a multipart form;
    # hc-market accepts no file of any kind — the verification desk stores an `evidenceRef`, which is
    # a string, and the care summary is three short lists. The largest body this API takes is a
    # review, and the largest one a stranger can send it is a payment callback, capped far lower in
    # its own location below.
    client_max_body_size 1m;

    # --- Compression -------------------------------------------------------------------------
    #
    # nginx.conf sets `gzip on` globally but leaves `gzip_types` commented out, so the default applies
    # and only text/html is compressed — which for an API that returns nothing but JSON means nothing
    # is compressed at all. `gzip_proxied any` is the other load-bearing half: nginx does not compress
    # a proxied response without it, and every response on this vhost is proxied.
    #
    # The type list is short because the surface is: JSON, and the problem+json a ProblemDetail
    # refusal carries. text/event-stream is DELIBERATELY ABSENT — see the SSE note on `location /`.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/problem+json;

    # --- Security headers, and why three of them are hidden first ------------------------------
    #
    # THE UPSTREAM ALREADY SENDS THREE OF THESE, AND add_header DOES NOT REPLACE — IT APPENDS.
    #
    # Every sibling proxies to a `web` container whose nginx sets no security headers, so their
    # add_header lines are the only source and each header appears once. hc-market has no web
    # container and proxies straight to the GATEWAY, and JHipster's Spring Security already emits
    # X-Content-Type-Options, X-Frame-Options: DENY and Referrer-Policy: no-referrer.
    #
    # Adding them here too produces two of each, and — worse — two DIFFERENT Referrer-Policy values
    # (`no-referrer` from the gateway, `same-origin` from here). A duplicated header with conflicting
    # values is resolved differently by different user agents, which is the kind of defect that
    # behaves one way in the browser you tested and another way in the one that matters. Measured on
    # the quality box, which is where this was found; the fix is inherited rather than rediscovered.
    #
    # Written this way round, rather than by deleting the add_header lines, so the whole policy stays
    # readable in one place and matches how the sibling vhosts read.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    add_header X-Frame-Options        "DENY"        always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "same-origin" always;

    # Nothing on this hostname is a page. The marketing surface is web.abofonsa.com; this is a JSON
    # API, and an indexed API endpoint is an invitation to crawl a catalogue of real people.
    #
    # This header is the half that actually works. robots.txt below governs CRAWLING only: a URL
    # someone links to from elsewhere can still be indexed as a bare result, and Disallow forbids the
    # fetch that would reveal a noindex directive. The header is attached to every response, needs no
    # fetch of a separate file, and covers the API paths a crawler reaches directly. `always` so it
    # survives error responses too.
    add_header X-Robots-Tag           "noindex, nofollow" always;

    # --- Content-Security-Policy ---------------------------------------------------------------
    #
    # `default-src 'none'` is the truthful policy for something that only ever returns JSON, and it
    # is the SAME policy quality/host-site.conf carries at the site level. Quality's file used to say
    # this was "STRICTER THAN PRODUCTION, WHICH SENDS NO CSP AT ALL"; that stopped being true with
    # this file, and quality's comment was corrected in the same commit.
    #
    # Quality carries one exception this file deliberately does not: a weaker policy scoped to
    # /prototype, because that page is inline script and inline style. There is no /prototype here
    # (see the vhost's header for why), so there is no exception here either — and anything that
    # starts needing one is a sign this hostname has quietly grown a front end nobody decided on.
    #
    # nginx's add_header REPLACES rather than merges when a location sets its own, so a policy added
    # inside any location below silently drops everything set here. Check the header on a real API
    # path after touching this file, not on `/`.
    add_header Content-Security-Policy
        "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
        always;

    # A blanket disallow, served from nginx rather than from the application so the answer does not
    # depend on the gateway being up. Deliberately NOT a per-path list: a list of Disallow lines
    # enumerates the interesting routes to anyone who reads it while leaving everything else
    # crawlable, which is the shape hc-professional replaced for exactly that reason.
    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # --- /management is NOT proxied ------------------------------------------------------------
    #
    # Actuator carries health detail, metrics, env, loggers and the build's git SHA. The gateway
    # already requires ROLE_ADMIN for all of it except health and info, but there is no reason for
    # any of it to be reachable from the internet, and `info` in particular hands a stranger the
    # exact build a CVE would be matched against.
    #
    # This block returns 404 rather than falling through to `location /`, which would proxy it.
    #
    # THE CONSEQUENCE IS IN deploy-prod.sh AND WAS TAKEN DELIBERATELY. Its smoke test used to read
    # the deployed version from `$HC_PUBLIC_URL/management/info`, which this makes a 404 for ever —
    # so that check now asks the gateway CONTAINER over ssh instead, the same way the health gate
    # already does. That is strictly better: it reports what the deployed container believes it is,
    # rather than what the edge happens to route.
    #
    # Prometheus and heapdump are covered by this block, and they are also 404 on the quality vhost
    # even though nothing there blocks the rest of /management — so a change that depends on them
    # being unreachable fails on the workstation rather than here.
    location /management {
        return 404;
    }

    # --- The payment webhook -------------------------------------------------------------------
    #
    # POST /services/healthconnectbooking/webhooks/payments/{provider} — decisions.md D43 and D45.
    #
    # This is the ONLY unauthenticated public write path in the estate. Everything else under
    # /services/**/api/** is authenticated at the gateway before it is routed; this one is permitted
    # anonymously on purpose, because a payment provider cannot hold a token. What authenticates it
    # is the provider's own signature over the RAW body, checked inside booking, and today every
    # caller gets a flat 401 because no adapter in the estate can verify one.
    #
    # THIS LOCATION DOES NOT DECIDE WHETHER THE PATH IS REACHABLE. `location /` below would proxy it
    # anyway; the gateway's fifth route predicate and PaymentWebhookRouteConfiguration's permit are
    # what make it reachable, and they are the security control (decisions.md D28). This block only
    # narrows: a rate limit, a body cap, and POST.
    #
    #   limit_req              10 r/s per source IP, burst 50. THE TRADE IS EXPLICIT: rate-limiting a
    #                          payment provider risks dropping a confirmation, and a booking whose
    #                          callback never arrives waits in PENDING_PAYMENT for ever with no
    #                          expiry sweep (D43). Against that, an unauthenticated public POST that
    #                          does an HMAC and takes a row lock, with no ceiling at all, is a
    #                          denial-of-service vector on the one path where money is committed.
    #                          Sized so a real provider cannot reach it: all three of D37's providers
    #                          callback from a small set of source addresses, so the per-IP key is
    #                          the WRONG shape for legitimate traffic and the right one for a flood —
    #                          which is why the ceiling is set orders of magnitude above real volume
    #                          rather than snugly. All three retry a 429.
    #   client_max_body_size   64k, overriding the 1m set above. A provider callback is a few hundred
    #                          bytes of JSON.
    #   limit_except POST      the gateway permit is already restricted to POST, so this agrees with
    #                          it by construction and can only narrow. A prober gets 403 here instead
    #                          of 401 there; both are refusals and neither says anything.
    #
    # THE PATH IS WRITTEN OUT IN FULL and must stay character-for-character identical to the
    # compose file's ROUTES_4 predicate prefix. CI compares the two, because a path that drifts here
    # is silent in the worst way: `location /` still proxies the callback, everything keeps working,
    # and the rate limit and the body cap have simply stopped applying with nothing to show for it.
    #
    # Note the trailing slash and the prefix match. This is the WEBHOOKS namespace, not booking's
    # API — /services/healthconnectbooking/ without `webhooks/` would put every booking, dispute and
    # erasure endpoint under a `limit_except POST` and a 64k cap, which is D28's defect arriving
    # through the door D45 opened, wearing an nginx hat.
    location /services/healthconnectbooking/webhooks/ {
        limit_req            zone=payment_webhook burst=50 nodelay;
        limit_req_status     429;
        client_max_body_size 64k;
        limit_except POST { deny all; }

        proxy_pass                          http://127.0.0.1:8086;
        proxy_http_version                  1.1;
        proxy_set_header  Host              $http_host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $abf_forwarded_proto;
        proxy_set_header  X-Forwarded-Host  $http_host;
        proxy_set_header  X-Forwarded-Prefix "";

        # A signature is computed over the RAW body. Nothing here may transform it — no
        # `proxy_set_body`, no charset rewrite, no sub_filter — or every callback fails verification
        # and the failure looks like a forgery rather than like a proxy.
        proxy_request_buffering on;
    }

    # --- Everything else -----------------------------------------------------------------------
    #
    # A dumb pipe to the gateway, on purpose. What is reachable is decided by the gateway's four
    # narrowed route predicates plus the one webhook route (decisions.md D28), and nothing here may
    # duplicate that decision: a location that blocks a path the gateway routes makes a security
    # control depend on two files agreeing, and a location that proxies a path the gateway does not
    # route publishes something by accident.
    #
    # 8086 is the gateway's LOOPBACK-published port. Keep it in step with HC_GATEWAY_PORT's default
    # in ../docker/docker-compose.prod.yml: nginx cannot read the environment, so the number is
    # written twice and there is no way around that. CI checks the two agree rather than letting them
    # drift into a 502, which is the same check quality/host-site.conf already has.
    location / {
        proxy_pass                          http://127.0.0.1:8086;
        proxy_http_version                  1.1;

        proxy_set_header  Host              $http_host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $abf_forwarded_proto;
        proxy_set_header  X-Forwarded-Host  $http_host;

        # Only the gateway may set this: it is the one component that knows what it stripped.
        # Blanking anything a caller sends stops an injected value steering absolute URLs.
        proxy_set_header  X-Forwarded-Prefix "";

        proxy_set_header  Upgrade           $http_upgrade;
        proxy_set_header  Connection        $connection_upgrade;

        # --- BOTH OF THESE ARE LOAD-BEARING FOR SSE ---------------------------------------------
        #
        # GET /api/stream (decisions.md D25/D29) is a Server-Sent Events stream on the gateway — the
        # one reactive app in the estate. It is idle most of the time and never completes.
        #
        # With proxy_buffering on, nginx holds each frame until its buffer fills, so events arrive in
        # clumps, minutes late, or not until the connection closes. With the default 60s
        # proxy_read_timeout an idle stream is cut every minute; the gateway sends a keep-alive
        # comment every 20s, which covers the default, but an hour here means a quiet connection is
        # never dropped by this hop at all.
        #
        # Neither failure looks like a failure: the browser reconnects silently and the only symptom
        # is a live channel that misses things. Identical to quality/host-site.conf, for the same
        # reason, and it is why text/event-stream is absent from gzip_types above — a compressed SSE
        # stream buffers in the compressor even with proxy_buffering off.
        proxy_buffering     off;
        proxy_read_timeout  1h;

        # Downstream calls through the gateway — booking asking catalog to price a session, catalog
        # asking booking whether a review is backed by a completed one — can outlast a default 60s.
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
    }
