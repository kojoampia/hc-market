# ===================================================================
# Rate-limit zone for the payment webhook on market.abofonsa.com.
#
# Installs to /etc/nginx/conf.d/hc-market-webhook.conf.
#
# It lives here rather than in hc-market-app.conf because `limit_req_zone` is
# only valid in nginx's `http` context, and a snippet included inside a `server`
# block is not it. Putting it in the snippet fails `nginx -t` with "directive is
# not allowed here"; enabling the snippet without this file fails with "unknown
# limit_req zone payment_webhook".
#
# EITHER INSTALL BOTH OR NEITHER, and note that a failed `nginx -t` refuses the
# reload for EVERY site on this host, not only this one. That is why it is
# installed first:
#
#   scp deploy/prod-server/nginx-conf.d/hc-market-webhook.conf webserver:/tmp/
#   ssh webserver 'sudo mv /tmp/hc-market-webhook.conf /etc/nginx/conf.d/ \
#     && sudo nginx -t && sudo systemctl reload nginx'
#
# Same arrangement as hc-professional's auth and rum zones and hc-patient's rum
# zone; this is the hc-market instance of it.
#
# --- WHY THE CEILING IS SO HIGH, WHICH IS THE UNUSUAL PART ---------
#
# POST /services/healthconnectbooking/webhooks/payments/{provider} is the only
# unauthenticated public write path in the estate (decisions.md D43, D45). A
# provider cannot hold a token, so the gateway permits the path anonymously and
# what authenticates a callback is the provider's signature over the raw body,
# checked inside booking.
#
# That makes it worth a ceiling: an anonymous POST that performs an HMAC and
# takes a `findByReferenceForUpdate` row lock, with no limit at all, is a
# denial-of-service vector aimed at the one path where a customer's money is
# already committed.
#
# It also makes a TIGHT ceiling dangerous in a way the sibling zones are not.
# The key is $binary_remote_addr, and all three of the providers D37 chose —
# Paystack, Hubtel, MTN MoMo — call back from a small, fixed set of source
# addresses. So legitimate traffic is concentrated on a handful of keys and
# abusive traffic is not, which is the opposite of the shape per-IP limiting is
# good at. A snug limit would throttle the provider and nobody else.
#
# The cost of getting that wrong is asymmetric and does not self-correct: a
# dropped confirmation leaves the booking in PENDING_PAYMENT, D43 deliberately
# gave that state no expiry sweep, the professional is never told, and the
# customer's money is with the provider. All three providers retry a 429, so a
# throttled callback is usually recovered — "usually" is the word doing the work.
#
# So: 10 r/s with burst 50, which is orders of magnitude above any plausible
# real volume for this estate and still a hard ceiling against a flood. Sized to
# be unreachable by a provider rather than snug against one.
#
# 1m of shared memory holds roughly 16k source-address states, far more than this
# host will ever track on this one path.
# ===================================================================

limit_req_zone $binary_remote_addr zone=payment_webhook:1m rate=10r/s;
