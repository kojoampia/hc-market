# ===================================================================
# Rate-limit zones for the ACCOUNT LIFECYCLE on market.abofonsa.com.
#
# Installs to /etc/nginx/conf.d/hc-market-account.conf.
# decisions.md D94, backlog NEW-47.
#
# A second file beside hc-market-webhook.conf rather than two zones in one,
# matching hc-professional's auth and rum files: these zones protect a different
# thing for a different reason, and the day one of them is retuned the commit
# should not touch the payment webhook's ceiling.
#
# It lives here rather than in hc-market-app.conf because `limit_req_zone` is
# only valid in nginx's `http` context, and a snippet included inside a `server`
# block is not it. Putting it in the snippet fails `nginx -t` with "directive is
# not allowed here"; enabling the snippet without this file fails too.
#
# WHAT IT FAILS WITH WAS MEASURED, and it is not what this repository's other two
# headers say. Against nginx/1.28.3 with this file's include removed and the
# snippet's `limit_req` lines in place:
#
#   nginx: the configuration file ... syntax is ok
#   [emerg] zero size shared memory zone "hc_market_login"
#   nginx: configuration file ... test failed
#
# "unknown limit_req zone", which hc-market-webhook.conf and hc-market-app.conf
# both quote, is what older nginx said and may be what the production host's
# version says — the version here is not the version there. The half that matters
# is the same either way and is the half to remember: SYNTAX IS OK AND THE TEST
# FAILS, so a reload is refused for every site on the host and the message names
# a zone rather than a missing file.
#
# EITHER INSTALL BOTH OR NEITHER, and note that a failed `nginx -t` refuses the
# reload for EVERY site on this host, not only this one. So this file goes first:
#
#   scp deploy/prod-server/nginx-conf.d/hc-market-account.conf webserver:/tmp/
#   ssh webserver 'sudo mv /tmp/hc-market-account.conf /etc/nginx/conf.d/ \
#     && sudo nginx -t && sudo systemctl reload nginx'
#
# `limit_req_status` IS DELIBERATELY NOT HERE. It is valid at http scope, but
# hc-patient's copy of this file carried it there for six days and made the whole
# file unshippable for a different reason; it lives in the vhost, inside this
# application's own server block, so that a status this product chooses cannot
# become every other site's.
#
# --- WHY THESE PATHS AND NOT THE OTHER TWO -------------------------
#
# Five paths are `permitAll` in the gateway's security chain
# (gateway/.../config/SecurityConfiguration.java): /api/authenticate,
# /api/register, /api/activate, /api/account/reset-password/init and
# /api/account/reset-password/finish. NEW-47 named three of them and this file
# limits exactly those three. /api/activate and .../finish are deliberately not
# limited yet, and that is a question surfaced in D94 §5 rather than an oversight
# — hc-patient's equivalent file limits all four of its account paths, so the
# widening is house practice and is one line in each map below. CI refuses a
# SIXTH permitAll path that is neither limited here nor argued there, so the next
# public door cannot arrive unnoticed.
#
# --- WHY A `map` AND NOT MORE `location` BLOCKS --------------------
#
# Borrowed wholesale from hc-patient's hc-patient-rum.conf, including the reason:
# hc-market-app.conf proxies everything through a single `location /`, and
# rate-limiting specific paths the obvious way means a location per path, each
# duplicating the proxy_pass and five proxy_set_header lines. A copy that drifts
# is how X-Forwarded-Proto goes missing and every emailed activation link
# silently becomes http://.
#
# nginx does not account a request whose limit_req key evaluates to the empty
# string, so a map yielding $binary_remote_addr for the paths we care about and
# "" for everything else limits exactly those paths while leaving the one
# location intact. Adding a path is a one-line change and cannot break proxying.
#
# $request_uri carries the query string, so these are anchored PREFIXES and not
# exact matches — which is what makes `/api/register?x=1` accounted too.
# ===================================================================

map $request_uri $hc_market_login_key {
    default                     "";
    ~^/api/authenticate         $binary_remote_addr;
}

map $request_uri $hc_market_account_key {
    default                                     "";
    ~^/api/register                             $binary_remote_addr;
    ~^/api/account/reset-password/init          $binary_remote_addr;
}

# 1 r/s, burst 5. A human logs in once; the burst absorbs a mistyped password and
# a client's own retry. Sustained guessing hits the wall immediately. The same
# numbers as hc-patient's login zone, on the same argument — and the gateway
# counts what gets through, since D84: gateway_identity_logins_failures_total
# splits bad-credentials from never-activated, so a wall being hit is visible
# rather than inferred.
limit_req_zone $hc_market_login_key zone=hc_market_login:10m rate=1r/s;

# 10 r/min, burst 3. Both paths in this zone SEND AN EMAIL, which is the whole
# reason the zone exists and is a stronger argument here than in the sibling
# products: this estate has no mail relay of its own (D94), so an unlimited
# /api/register is a way to make somebody else's provider send mail on our
# reputation, at whatever rate one address can manage — and each request also
# writes an account row that the unactivated-account sweep will not remove for
# three days. The legitimate rate is a handful per person per day.
#
# 10m of shared memory holds roughly 160k source-address states across both
# zones, far more than this host will ever track on three paths.
limit_req_zone $hc_market_account_key zone=hc_market_account:10m rate=10r/m;
