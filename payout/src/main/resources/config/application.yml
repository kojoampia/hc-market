jhipster:
  mail:
    from: healthconnectPayout@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Healthconnect Payout API
    description: Healthconnect Payout API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:


# jhipster-needle-add-application-yaml-document
---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:

# ===================================================================
# HealthConnect Marketplace
# NOTE: `jhipster jdl --force` rewrites this file and drops this block. Re-add it after any
# regeneration. SeedProperties itself is @Component-annotated so it needs no App-class edit.
# ===================================================================
healthconnect:
  # --- Kafka topic names, and the prefix that separates two estates on one broker ---------------
  #
  # decisions.md D29. Since D27 there is ONE broker for the whole estate, and hc-market runs on it
  # twice — dev and quality. Topic names were compiled into the @KafkaListener annotations, so the
  # two shared a topic set: distinct consumer groups meant BOTH received every event either
  # published, and completing a booking in dev wrote a ledger row in quality.
  #
  # The prefix is EMPTY here and stays empty in production and quality, so neither moves off the
  # names it already uses — consumer offsets are keyed by (group, topic, partition) and renaming a
  # live topic resets every one of them. Only docker-compose.dev.yml sets one.
  #
  # The names below are the transport addresses. The event TYPE inside the envelope is never
  # prefixed, which is why every consumer's switch is untouched by this.
  topics:
    prefix: ''
    booking-completed: ${healthconnect.topics.prefix}healthconnect.booking.completed
    booking-cancelled: ${healthconnect.topics.prefix}healthconnect.booking.cancelled
    dispute-resolved: ${healthconnect.topics.prefix}healthconnect.dispute.resolved

  seed:
    enabled: false
    file: demo/seed-data.json
    anchor-dates: false

  # --- The founding brokerage terms (decisions.md D57, backlog NEW-18) ---------------------------
  #
  # NOT the seed, and nothing here travels through the seed's switches. brokerage_config was empty on
  # every estate that does not seed -- which is production -- so the first booking.completed threw and
  # payout retried it for ever, and every receipt was a 503. BrokerageBootstrap writes ONE row from
  # these values, only into an EMPTY table, on every environment including prod.
  #
  # EVERY ONE OF THESE MAY BE LEFT UNSET, AND AN ESTATE THAT SETS NONE IS PRICED CORRECTLY. The
  # defaults live in FoundingTerms as Java constants -- the prototype's own 12% and 3-day lag -- so a
  # regeneration that drops this block costs the ability to OVERRIDE the founding terms and not the
  # terms themselves. Blank counts as absent, exactly as a payment provider's secret does (D45),
  # because compose's `${X:-}` sets an empty variable rather than leaving it unset.
  #
  # There is no effective-from here on purpose: the founding row is dated to the epoch, which is the
  # only value that predates every booking this estate could ever be asked to price. A well-formed
  # wrong one silently reintroduces "no config in force" -- NEW-18 through its own fix. See
  # FoundingTerms.EFFECTIVE_FROM.
  brokerage:
    founding:
      commission-rate: ${HC_BROKERAGE_COMMISSION_RATE:}
      payout-lag-days: ${HC_BROKERAGE_PAYOUT_LAG_DAYS:}
      free-cancellation-hours: ${HC_BROKERAGE_FREE_CANCELLATION_HOURS:}
      late-cancellation-pct: ${HC_BROKERAGE_LATE_CANCELLATION_PCT:}
      currency: ${HC_BROKERAGE_CURRENCY:}

  # Where the booking service lives. The Overview screen's "next up" card reads the professional's
  # schedule from it; a failure there degrades the card rather than the screen.
  booking:
    base-url: http://healthconnectbooking
    # Short on purpose: this call decorates one card. See BookingScheduleClient.
    timeout-ms: 2000

# ===================================================================
# Liquibase must finish BEFORE the seed loader runs.
#
# JHipster defaults application.liquibase.async-start to true, which starts Liquibase on a
# background executor and lets the application finish booting without it. An ApplicationRunner then
# races the schema: SeedDataLoader queries a table Liquibase has not created yet and the seed is
# skipped with "relation does not exist" -- the app comes up healthy and empty, which reads as a
# broken seed file rather than a race.
# ===================================================================
application:
  liquibase:
    async-start: false
