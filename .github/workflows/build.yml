# Build, test and check hc-market.
#
# There was no CI in this repository before this file. That is how the whole suite came to be
# skipped for a week of work: D9 switched local builds to -DskipTests because Cucumber plus
# Testcontainers cost minutes per app, and nothing else was running them. When they were finally run
# again, booking had 137 failures and two services were violating an architecture rule. Everything
# compiled the entire time.
#
# So the point of this file is narrow and specific: run the things that only fail when somebody
# remembers to look.
#
# Shaped after hc-patient/api/.github/workflows/build.yml. The differences are all consequences of
# hc-market being ONE repository holding FIVE standalone Maven projects with no aggregator pom — so
# the build is a matrix rather than a single ./mvnw, and there are repo-level checks the siblings
# have no equivalent of.
name: Build and check

on:
  push:
    branches: [main]
  # EVERY pull request, not just those targeting main.
  #
  # This carried `branches: [main]`, so a PR based on another branch got NO CHECKS AT ALL — and a PR
  # with no CI is worse than one with failing CI: GitHub shows nothing, which reads as "nothing to
  # worry about" rather than "never ran". Found when a stacked PR sat green-looking and unverified.
  #
  # Stacking is the normal shape here now that work goes on branches: a follow-up based on an open
  # PR should be gated exactly as hard as one based on main.
  #
  # release.yml is deliberately NOT widened. It publishes five images to GHCR and must stay on
  # `push: branches: [main]` — the point of a PR is to get the gate without the publish.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # The five services. A matrix rather than a reactor because each app is a standalone project with
  # its own ./mvnw — decisions.md D6, matching every sibling product.
  #
  # fail-fast is OFF: when a change breaks more than one service, seeing all of them in one run is
  # worth more than saving a few minutes. The booking/payout/messaging breakage was exactly that
  # shape, and finding it one service at a time would have taken three rounds.
  # ---------------------------------------------------------------------------------------------
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, catalog, booking, messaging, payout]
    steps:
      - uses: actions/checkout@v4

      # Java 25, because that is what the poms target (decisions.md D2) and what the images run.
      # NOT 21, which is what JHipster 9.2.0 generates by default and what a careless regeneration
      # would put back.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # The wrapper fetches Maven itself, and setup-java's `cache: maven` does not cover it: that
      # option caches ~/.m2/repository only, while the distribution lands in ~/.m2/wrapper/dists.
      # So every job downloaded apache-maven-<version>-bin.zip from repo.maven.apache.org — five
      # times a run, with no retry anywhere in the wrapper script.
      #
      # On 2026-08-31 that single fetch failed on one runner and turned a DOCS-ONLY pull request
      # red, seven seconds in, before a line of Java was compiled. A red check that has nothing to
      # do with the change is worse than a slow one: it trains whoever sees it to re-run rather than
      # to read, which is exactly the habit that lets a real failure through.
      #
      # Keyed on maven-wrapper.properties, so a wrapper upgrade misses the cache and fetches once
      # rather than being served a stale distribution.
      - name: Cache the Maven wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('**/maven-wrapper.properties') }}
          restore-keys: maven-wrapper-

      # `verify`, never `test`. Surefire EXCLUDES **/*IT* and failsafe includes it, so `test` runs no
      # integration test at all — and the ITs are where Testcontainers, the ArchUnit layer rule and
      # the Liquibase changelogs actually get exercised. A green `test` proves very little here.
      #
      # The ITs bring up PostgreSQL and Kafka through Testcontainers, so the runner's Docker daemon
      # is the only service dependency.
      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # verify also runs spotless, checkstyle and modernizer, and those fire AFTER the tests pass —
      # so a run can read "Tests run: 64, Failures: 0" and still fail. Uploading the reports makes
      # the difference visible without re-running anything.
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Checks with no sibling equivalent, because no sibling has these artefacts. Each one guards a
  # class of drift that has already happened in this repository at least once.
  # ---------------------------------------------------------------------------------------------
  consistency:
    name: Seed, appendices and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The seed is REGENERATED from the prototype, never edited (decisions.md D4). The extractor
      # asserts the prototype's own figures — 18 professionals, 52 services, 63 reviews, 256
      # sessions, ₵81,620 — and refuses to write if any of them drift.
      #
      # Running it here catches two different things: a prototype change that moves a figure, and a
      # seed-data.json that was hand-edited despite the rule. The second is why the file is compared
      # afterwards rather than just regenerated.
      - name: Regenerate the seed from the prototype
        run: node deploy/demo/extract-seed.mjs

      - name: The committed seed must match what the extractor produces
        run: |
          if ! git diff --quiet -- deploy/demo/seed-data.json; then
            echo "::error::deploy/demo/seed-data.json differs from what extract-seed.mjs produces."
            echo "The seed is regenerated, never hand-edited — run: node deploy/demo/extract-seed.mjs"
            git --no-pager diff --stat -- deploy/demo/seed-data.json
            exit 1
          fi

      # Spec Appendices A and B ARE deploy-dev.sh and deploy-prod.sh — the same bytes in two places.
      # Two copies drift unless something enforces it, and a spec describing a script that no longer
      # exists is worse than no appendix.
      - name: The spec appendices must match the scripts
        run: ./deploy/sync-appendices.sh --check

      # Both compose files parse, with the variables they demand actually supplied. A missing
      # required variable presents at deploy time as a stack that will not start, and finding that
      # on the quality box rather than here is the whole thing the quality box exists to avoid.
      - name: Compose files must be valid
        run: |
          JWT_BASE64_SECRET=ci-placeholder HC_PRIVACY_PEPPER=ci-placeholder \
            docker compose -f deploy/docker/docker-compose.dev.yml config >/dev/null
          # TAG is normally supplied by quality/startup.sh, which is the only supported entry
          # point. It is required rather than defaulted on purpose — an image tag that silently
          # falls back to `latest` is how a quality box ends up running something nobody chose.
          JWT_BASE64_SECRET=ci-placeholder HC_PRIVACY_PEPPER=ci-placeholder TAG=ci \
            docker compose -f quality/compose.yml config >/dev/null
          env HC_IMAGE_PREFIX=example HC_IMAGE_SEP=/ HC_TAG=ci JWT_BASE64_SECRET=ci-placeholder \
              HC_PRIVACY_PEPPER=ci-placeholder \
              HC_GATEWAY_MONGODB_URI=mongodb://x/y \
              HC_CATALOG_DB_URL=jdbc:x HC_CATALOG_DB_PASSWORD=x \
              HC_BOOKING_DB_URL=jdbc:x HC_BOOKING_DB_PASSWORD=x \
              HC_MESSAGING_DB_URL=jdbc:x HC_MESSAGING_DB_PASSWORD=x \
              HC_PAYOUT_DB_URL=jdbc:x HC_PAYOUT_DB_PASSWORD=x \
            docker compose -f deploy/docker/docker-compose.prod.yml config >/dev/null
          # The production DATA TIER — the four PostgreSQL instances and the gateway's MongoDB,
          # installed on the host once and never rolled by a deploy. A fourth compose file, and the
          # only one that is not a copy of another: nothing in it appears in the application stack
          # and nothing in the application stack appears in it (decisions.md D49).
          #
          # Deliberately NOT added to the gateway-route checks below, which iterate a fixed list of
          # three. It declares no route, no cross-service base URL and no application secret, so it
          # would fail "expected 4 narrowed gateway routes, found 0" — and the reason it would is the
          # reason the split exists: there is exactly ONE place in this repository where a production
          # gateway route is written.
          env HC_MONGO_ROOT_USERNAME=x HC_MONGO_ROOT_PASSWORD=x \
              HC_CATALOG_DB_PASSWORD=x HC_BOOKING_DB_PASSWORD=x \
              HC_MESSAGING_DB_PASSWORD=x HC_PAYOUT_DB_PASSWORD=x \
            docker compose -f deploy/prod-server/compose.yml config >/dev/null

      # The scripts are the deployment. A syntax error in one is only discovered when somebody tries
      # to deploy, which is the worst possible moment to discover it.
      - name: Shell scripts must parse
        run: |
          # deploy/prod-server/start has NO .sh extension, matching the sibling stacks' `start`
          # scripts, so it has to be named rather than globbed — a glob on *.sh would skip it and
          # report success having checked four of five. It is also the one script here that only
          # ever runs on a host nothing in this workflow can reach, which is precisely why parsing
          # it in CI is the only gate it will ever get.
          for s in deploy/deploy-dev.sh deploy/deploy-prod.sh deploy/sync-appendices.sh \
                   deploy/verify-cycle.sh deploy/verify-outbox-recovery.sh quality/startup.sh \
                   deploy/prod-server/infra.sh deploy/prod-server/backup.sh deploy/prod-server/start \
                   .github/checks/*.sh; do
            bash -n "$s" && echo "ok   $s"
          done

      # The quality vhost's upstream port is written in host-site.conf AND in compose.yml, because
      # nginx cannot read the environment. When they disagree the site returns 502 and nothing else
      # complains.
      - name: The quality vhost and its compose must agree on a port
        run: |
          conf=$(grep -oE 'proxy_pass http://127\.0\.0\.1:[0-9]+' quality/host-site.conf | grep -oE '[0-9]+$' | sort -u)
          compose=$(grep -oE 'GATEWAY_PORT:-[0-9]+' quality/compose.yml | grep -oE '[0-9]+$' | sort -u)
          echo "vhost=$conf compose=$compose"
          test "$conf" = "$compose"

      # The identical hazard, one environment over, and it arrived with deploy/prod-server/.
      #
      # The production edge proxies to the gateway's loopback-published port, written in
      # hc-market-app.conf and in docker-compose.prod.yml because nginx cannot read the environment.
      # When they disagree the site returns 502 for every path and nothing else complains — and on
      # production, unlike quality, nobody is watching a terminal when it happens.
      #
      # `sort -u` on the vhost side is load-bearing: that file names the port TWICE, once in the
      # webhook location and once in `location /`. If those two ever differ this collapses to two
      # values and the comparison fails, which is the right answer — half the site on the wrong
      # upstream is worse than all of it.
      - name: The production vhost and its compose must agree on a port
        run: |
          conf=$(grep -oE 'proxy_pass +http://127\.0\.0\.1:[0-9]+' deploy/prod-server/hc-market-app.conf | grep -oE '[0-9]+$' | sort -u)
          # Matched against the PUBLISH LINE, not against the variable name. The comment above that
          # line quotes the old 0.0.0.0 form verbatim, so a loose `HC_GATEWAY_PORT:-[0-9]+` reads two
          # values out of this file — one of them from prose. A check that a comment can break is a
          # check somebody eventually deletes.
          compose=$(sed -nE "s/^ *- *'127\.0\.0\.1:\\\$\{HC_GATEWAY_PORT:-([0-9]+)\}:8080'.*/\1/p" \
                      deploy/docker/docker-compose.prod.yml | sort -u)
          echo "vhost=$conf compose=$compose"
          test -n "$conf" && test -n "$compose" && test "$conf" = "$compose"

      # And the gateway must be published on LOOPBACK on the production host.
      #
      # `'${HC_GATEWAY_PORT:-8086}:8080'` binds 0.0.0.0, which puts the gateway on the internet
      # beside the nginx that terminates TLS — bypassing TLS, the security headers, the CSP, the
      # robots policy and the webhook rate limit, all of which live at the edge. It is not a routing
      # hole (D28's predicates apply either way) and that is exactly why it is worth a check: every
      # functional test passes, the site works, and the only symptom is that a second, unprotected
      # front door exists. It was written that way in this file until 2026-09-05 (decisions.md D49).
      - name: The production gateway must publish on loopback only
        run: |
          line=$(grep -E "^ *- *'[^']*:8080'" deploy/docker/docker-compose.prod.yml)
          echo "$line"
          if ! printf '%s' "$line" | grep -q "127\.0\.0\.1:"; then
            echo "::error file=deploy/docker/docker-compose.prod.yml::the gateway publishes on every interface — on the production host that is a second, unprotected front door beside nginx. See decisions.md D49."
            exit 1
          fi
          echo "ok   gateway published on 127.0.0.1 only"

      # The webhook location in the production vhost must name the SAME path the gateway routes.
      #
      # This one is silent in the worst way and does not break anything when it drifts: `location /`
      # proxies the callback regardless, so the site keeps working, the provider keeps being
      # answered, and the rate limit, the 64k body cap and the POST restriction have simply stopped
      # applying to the estate's one unauthenticated public write path (decisions.md D43, D45).
      #
      # Compared as a PREFIX of the compose predicate — the vhost has a trailing slash where the
      # predicate has `**` — so a rename of either end fails here rather than in six months.
      - name: The production vhost's webhook location must match the routed path
        run: |
          predicate=$(grep -oE 'Path=/services/healthconnectbooking/webhooks/\*\*' deploy/docker/docker-compose.prod.yml | head -1)
          want="${predicate#Path=}"; want="${want%\*\*}"
          echo "route prefix: $want"
          test -n "$want"
          if ! grep -qF "location $want {" deploy/prod-server/hc-market-app.conf; then
            echo "::error file=deploy/prod-server/hc-market-app.conf::no 'location $want {' — the webhook's rate limit, body cap and POST restriction silently stop applying while the callback keeps being proxied by 'location /'. See decisions.md D45 and D49."
            exit 1
          fi
          echo "ok   location $want matches the routed path"

      # PRODUCTION IS API-ONLY. The prototype is NOT served on the production hostname, and this is
      # the check that stops it coming back — decisions.md D49.
      #
      # quality/host-site.conf serves docs/Abofonsa_BridgeCare_Marketplace.html at /prototype,
      # same-origin, with a deliberately weaker CSP. That page is populated with the seed: 18
      # invented professionals presented as real people, with credentials, association registration
      # numbers and reviews. On a private LAN box that is a demo. On a public health-services domain
      # it is eighteen fabricated practitioner listings published to the internet.
      #
      # The failure this guards is a specific and plausible one: somebody notices the two vhosts
      # differ and "restores parity with quality". Parity is the wrong target — quality exists to
      # rehearse production, not the other way round — so the difference is asserted rather than
      # left to a comment nobody has to read.
      - name: The production vhost must not serve the prototype
        run: |
          fail=0
          for f in deploy/prod-server/market.abofonsa.com.conf deploy/prod-server/hc-market-app.conf; do
            # `location ... /prototype`, an alias to the HTML, or the weaker CSP that page needs.
            if grep -nE "^[^#]*(location[^#]*/prototype|alias[^#]*Abofonsa_BridgeCare_Marketplace\.html|unsafe-inline)" "$f"; then
              echo "::error file=$f::the production edge serves the prototype, or carries the relaxed CSP it needs. It is API-only on purpose — 18 invented professionals must not be published on a public health-services domain. See decisions.md D49."
              fail=1
            else
              echo "ok   $f"
            fi
          done
          exit "$fail"

      # The application stack's datasource URLs name the data tier's containers, and the two files
      # are written by different hands at different times: compose.yml declares the container, and
      # the URL an operator pastes into secrets.env is templated in secrets.env.example.
      #
      # A rename in one and not the other is a five-service outage from a one-word edit, and the
      # error it produces ("UnknownHostException") points at DNS rather than at either file. The
      # values themselves live only on the host, so the template is the only copy CI can see — which
      # makes this the only place the pair can be compared at all.
      - name: The data tier's container names must match the connection template
        run: |
          fail=0
          for ctr in $(grep -oE '^ +container_name: hc-market-[a-z]+-db$' deploy/prod-server/compose.yml \
                       | awk '{print $2}'); do
            if grep -q "$ctr" deploy/prod-server/secrets.env.example; then
              echo "ok   $ctr"
            else
              echo "::error file=deploy/prod-server/secrets.env.example::$ctr is declared in the data tier but appears in no connection string here — an operator would paste a URL naming a host that resolves nowhere. See decisions.md D49."
              fail=1
            fi
          done
          exit "$fail"

      # And nothing in prod-server/ may carry a filled-in secret. This repository is PUBLIC.
      #
      # The template's rule is that every required value is EMPTY, with a generation command beside
      # it — a placeholder that looks real is how a plausible value ends up pasted into production,
      # and a real one is a published secret. secrets.env itself is gitignored; this is the check for
      # the file that is not.
      - name: The connection template must carry no value for any secret
        run: |
          fail=0
          while IFS= read -r line; do
            echo "::error file=deploy/prod-server/secrets.env.example::'$line' has a value. Every secret in the template must be empty. See decisions.md D35 and D49."
            fail=1
          done < <(grep -E '^(JWT_BASE64_SECRET|HC_PRIVACY_PEPPER|HC_MONGO_ROOT_PASSWORD|HC_[A-Z]+_DB_PASSWORD|HC_GATEWAY_MONGODB_URI|HC_[A-Z]+_SECRET)=.+' \
                     deploy/prod-server/secrets.env.example || true)
          [ "$fail" = 0 ] && echo "ok   every secret in the template is empty"
          exit "$fail"

      # The OpenTelemetry wiring lives in pom.xml, and pom.xml is GENERATED — it carries no
      # jhipster-needle markers, so `jhipster jdl` with the force flag rewrites it wholesale and
      # drops every line of this. Losing it is completely silent: the build succeeds, the image is
      # produced, it simply has no agent in it and the service goes quiet on the dashboards.
      #
      # combine.self is checked by name because its absence is the subtler half of the same
      # failure. pluginManagement declares the simple <paths>src/main/docker/jib</paths> form, and
      # without the override Maven keeps that text content instead of the child elements — build
      # green, image built, agent absent. Found exactly that way, by looking inside the image.
      - name: Every pom must still carry the OpenTelemetry wiring
        run: |
          fail=0
          for service in gateway catalog booking messaging payout; do
            for needle in 'opentelemetry-javaagent' 'otel-javaagent.jar' 'combine.self="override"'; do
              if ! grep -qF "$needle" "$service/pom.xml"; then
                echo "::error::$service/pom.xml is missing '$needle' — regeneration drops it. See the checklist in CLAUDE.md."
                fail=1
              fi
            done
            [ "$fail" = 0 ] && echo "ok   $service/pom.xml"
          done
          exit "$fail"

      # catalog's /internal/** answers an UNAUTHENTICATED caller — booking holds no credential of
      # its own, because this estate has no service-to-service authentication (decisions.md D28).
      # The only thing keeping it off the internet is that no gateway route matches it, and that
      # lives in three compose files as four `Path=` predicates each.
      #
      # Widen one back to /services/<service>/** and the endpoint is public. Nothing fails, nothing
      # logs, and every existing check still passes: the public reads work, the private ones work,
      # the stack is green. Measured before the narrowing went in — an ordinary ROLE_CUSTOMER token
      # reached catalog on /services/healthconnectcatalog/internal/professionals/p1/login.
      #
      # So this asserts the shape rather than the count: every route predicate in every compose file
      # must end in /api/**, with ONE named exception.
      #
      # THE EXCEPTION IS booking's PAYMENT WEBHOOK — decisions.md D45. A payment provider cannot hold
      # a token and cannot reach anything under /api, so WP-13 routes
      # /services/healthconnectbooking/webhooks/** as well. It is written out in full here rather
      # than matched loosely, because the dangerous near-miss is
      # /services/healthconnectbooking/** — one character shorter and it publishes every booking,
      # dispute and erasure endpoint booking has to anonymous callers, which is D28's defect arriving
      # through the door D45 opened.
      - name: Every gateway route must stay narrowed, and the one webhook route must stay exact
        run: |
          fail=0
          webhook='ROUTES_[0-9]+_PREDICATES_0: *Path=/services/healthconnectbooking/webhooks/\*\*$'
          for f in quality/compose.yml deploy/docker/docker-compose.dev.yml deploy/docker/docker-compose.prod.yml; do
            n=$(grep -cE 'ROUTES_[0-9]+_PREDICATES_0: *Path=/services/[a-z]+/api/\*\*' "$f" || true)
            w=$(grep -cE "$webhook" "$f" || true)
            bad=$(grep -nE 'ROUTES_[0-9]+_PREDICATES_0: *Path=' "$f" | grep -vE "/api/\*\*$" | grep -vE "$webhook" || true)
            if [ -n "$bad" ]; then
              echo "::error file=$f::a gateway route is neither /api/** nor the one permitted webhook path — this publishes catalog's /internal/** or booking's whole API to the internet. See decisions.md D28 and D45."
              echo "$bad"
              fail=1
            elif [ "$n" != 4 ]; then
              echo "::error file=$f::expected 4 narrowed gateway routes, found $n"
              fail=1
            elif [ "$w" != 1 ]; then
              echo "::error file=$f::expected exactly 1 payment-webhook route, found $w — a provider that cannot reach the webhook cannot confirm a payment. See decisions.md D45."
              fail=1
            else
              echo "ok   $f — 4 routes on /api/**, 1 webhook route"
            fi
          done
          exit "$fail"

      # Routing the webhook is TWO changes and the second one is invisible when it is missing.
      #
      # The gateway's generated security chain ends with
      # `.pathMatchers("/services/**").authenticated()` and authenticates BEFORE routing, so a route
      # without a matching permit is a webhook that returns 401 at the edge: nothing reaches booking,
      # nothing appears in booking's log, and the provider retries until it files the payment as
      # undelivered. That reads as a broken provider integration rather than as a missing line, which
      # is why the pair is asserted here as well as documented in three places (decisions.md D45).
      #
      # The path is compared character for character against the compose predicate above.
      #
      # This is a grep and it only reads the source. It cannot see whether the container ever hears
      # the chain — removing @Configuration, @Bean or @Order leaves this step green and every callback
      # 401 at the edge, measured, all three. PaymentWebhookRoutePermitIT asks the running context
      # instead, and the `test` job runs it; this step stays because it names the string, and it fails
      # in seconds rather than after a Testcontainers boot.
      - name: The gateway must permit the webhook route it is asked to carry
        run: |
          permit=gateway/src/main/java/net/jojoaddison/config/PaymentWebhookRouteConfiguration.java
          if ! grep -qF '"/services/healthconnectbooking/webhooks/**"' "$permit"; then
            echo "::error file=$permit::the gateway does not permit the webhook path the compose files route — every provider callback is 401 at the edge. See decisions.md D45."
            exit 1
          fi
          if ! grep -qF 'HttpMethod.POST' "$permit"; then
            echo "::error file=$permit::the webhook permit is not restricted to POST — a readable path here is an unauthenticated read of what the platform knows about somebody's payment."
            exit 1
          fi
          echo "ok   $permit"

      # A route with the right predicate and the wrong target is the same outage as no route at all,
      # and the check above cannot see it: it reads predicates only. Both mutations are one character.
      #
      # ROUTES_4_URI pointed at catalog: the callback is delivered to a service that maps nothing at
      # /webhooks, so the provider gets a 404 from a URL it was given while the booking sits in
      # PENDING_PAYMENT for ever and the professional is never told there is a booking at all. And the
      # block it lives in already names three other container hostnames, so it is an easy line to
      # mistype. StripPrefix=1 is the same outcome by a different road — booking is handed
      # /healthconnectbooking/webhooks/payments/<provider>, which it maps nothing at either.
      #
      # Asserted relatively rather than against a literal host, because the three files name booking
      # three different ways (a short service alias, a container_name, and a ${HC_BOOKING_HOST}
      # default). Whatever booking's own /api route points at, the webhook route must point at too.
      - name: The webhook route must reach booking itself, and strip the same two segments
        run: |
          fail=0
          for f in quality/compose.yml deploy/docker/docker-compose.dev.yml deploy/docker/docker-compose.prod.yml; do
            hook=$(grep -oE 'ROUTES_[0-9]+_PREDICATES_0: *Path=/services/healthconnectbooking/webhooks/\*\*$' "$f" \
                   | sed -E 's/ROUTES_([0-9]+)_.*/\1/')
            api=$(grep -oE 'ROUTES_[0-9]+_PREDICATES_0: *Path=/services/healthconnectbooking/api/\*\*$' "$f" \
                  | sed -E 's/ROUTES_([0-9]+)_.*/\1/')
            if [ "$(echo "$hook" | wc -w)" != 1 ] || [ "$(echo "$api" | wc -w)" != 1 ]; then
              echo "::error file=$f::expected exactly one webhook route and one booking /api route to compare — see decisions.md D45."
              fail=1
              continue
            fi
            hook_uri=$(sed -nE "s/^ *SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_${hook}_URI: *//p" "$f")
            api_uri=$(sed -nE "s/^ *SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_${api}_URI: *//p" "$f")
            strip=$(sed -nE "s/^ *SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_${hook}_FILTERS_0: *//p" "$f")
            if [ -z "$hook_uri" ] || [ "$hook_uri" != "$api_uri" ]; then
              echo "::error file=$f::the webhook route points at '$hook_uri' and booking's own route at '$api_uri' — a provider's callback would be delivered to the wrong service, which answers 404 while the booking waits in PENDING_PAYMENT. See decisions.md D45."
              fail=1
            elif [ "$strip" != "StripPrefix=2" ]; then
              echo "::error file=$f::the webhook route strips '$strip', not StripPrefix=2 — booking is handed a path it maps nothing at, so the callback is a 404 and the payment is never confirmed. See decisions.md D45."
              fail=1
            else
              echo "ok   $f — webhook route $hook -> $hook_uri, StripPrefix=2"
            fi
          done
          exit "$fail"

      # The dev estate's topic prefix is written TWICE: the compose file configures the apps with it
      # and deploy-dev.sh creates the topics with it (decisions.md D29). They must agree.
      #
      # Disagreeing is silent in the worst way. The apps subscribe to topics nobody publishes to and
      # the publisher creates topics nobody reads; every container is healthy, every health check is
      # green, and the only symptom is that nothing ever happens — which reads as a broken consumer
      # rather than as two halves of one variable drifting apart.
      - name: The dev topic prefix must be the same in the compose file and the script
        run: |
          compose=$(grep -oE 'HEALTHCONNECT_TOPICS_PREFIX: \$\{HC_TOPIC_PREFIX-[^}]*\}' deploy/docker/docker-compose.dev.yml | sed -E 's/.*HC_TOPIC_PREFIX-([^}]*)\}/\1/')
          script=$(grep -oE '^TOPIC_PREFIX="\$\{HC_TOPIC_PREFIX-[^}]*\}"' deploy/deploy-dev.sh | sed -E 's/.*HC_TOPIC_PREFIX-([^}]*)\}"/\1/')
          echo "compose='$compose' script='$script'"
          test -n "$compose" && test -n "$script" && test "$compose" = "$script"

      # Every cross-service base URL a service READS must be SET by every compose file that runs it.
      #
      # booking's CatalogClient defaults to http://healthconnectcatalog, which resolves in no
      # environment. HEALTHCONNECT_CATALOG_BASE_URL was unset in all three compose files, so
      # POST /api/bookings failed closed with 503 everywhere from the moment D22 introduced the
      # client — and nothing was red: the ITs mock CatalogClient, health checks only exercise reads,
      # and the one script that would have caught it needs minted tokens. Found by driving a real
      # booking from the prototype, after the images had already shipped to quality.
      - name: Cross-service base URLs must be set wherever the service runs
        run: |
          fail=0
          for f in quality/compose.yml deploy/docker/docker-compose.dev.yml deploy/docker/docker-compose.prod.yml; do
            for v in HEALTHCONNECT_CATALOG_BASE_URL HEALTHCONNECT_PAYOUT_BASE_URL HEALTHCONNECT_BOOKING_BASE_URL \
                     HEALTHCONNECT_MESSAGING_BASE_URL; do
              if ! grep -q "$v" "$f"; then
                echo "::error file=$f::$v is not set — the service falls back to a hostname that resolves nowhere, and the call fails closed at run time with nothing red in CI."
                fail=1
              fi
            done
            [ "$fail" = 0 ] && echo "ok   $f"
          done
          exit "$fail"

      # The erased-subject alias is derived by THREE copies of the same file, one per service, because
      # there is no shared library here — five standalone Maven projects with no aggregator pom.
      #
      # All three must produce the same alias for the same person: messaging's erased_subject register
      # is keyed by it, and reconciling a redacted booking against a payout ledger row depends on
      # booking and messaging agreeing on the string. Three copy-pasted implementations drifting apart
      # is silent in the worst way — each service keeps working, each redacts its own rows correctly,
      # and only a cross-service lookup comes back empty, months later, with nothing having failed at
      # the time. That is exactly how the three static methods this replaced were living.
      #
      # Byte-identical, not merely equivalent: the file carries the reasoning as well as the code, and
      # a comment that is true in one service and stale in another is its own defect. The known-answer
      # test is checked the same way and pins the derivation itself — see SubjectPseudonymUnitTest.
      #
      # ErasureFanoutToken is here for the same reason and a different failure — decisions.md D38. It
      # states the contract of the token booking mints so that one operator action erases a customer
      # in all three: the claim naming the customer, the subject, and the thirty-second lifetime.
      # Booking writes those claims and catalog and messaging check them, so a claim name that drifts
      # by one character turns every fan-out into a 403 that reads as a permissions problem in the
      # service that is refusing rather than as a typo in the service that is asking. Booking's copy
      # uses only the constants and its check method is unreachable there on purpose, so that all
      # three files can be compared as bytes rather than as behaviour.
      - name: The shared erasure files must be identical in all three services
        run: |
          fail=0
          for f in src/main/java/net/jojoaddison/service/SubjectPseudonym.java \
                   src/test/java/net/jojoaddison/service/SubjectPseudonymUnitTest.java \
                   src/main/java/net/jojoaddison/security/ErasureFanoutToken.java; do
            if ! diff -u "booking/$f" "catalog/$f" || ! diff -u "booking/$f" "messaging/$f"; then
              echo "::error::$f differs between services — booking, catalog and messaging must agree. See decisions.md D35 and D38."
              fail=1
            else
              echo "ok   $f — identical in all three"
            fi
          done
          exit "$fail"

      # The seed calendar is the same arrangement, one service wider — decisions.md D48.
      #
      # Every seeded date in catalog, booking, messaging and payout is moved by ONE number per
      # service, `today - $meta.demoToday`, and the four have to arrive at the same number. Nothing
      # joins them and nothing can: each service owns its own database INSTANCE, so payout's earnings
      # aggregates read payout's own Ledger and nothing else, and booking never asks catalog about a
      # slot. The agreement is enforced by no query and shows up only on a screen — the professional's
      # overview puts sessions read from booking beside earnings read from payout, and a profile shows
      # catalog's availability_slot.slot_date beside the scheduled_date booking holds. A uniform offset
      # in all four is what anchor-dates=false MEANS and is harmless. A one-day disagreement between
      # two of them is corruption nothing here detects, because no count moves and no query spans the
      # pair — which is why fixing one service alone would have been worse than fixing none.
      #
      # So SeedCalendar.java and its known-answer test are copied byte-identically into all four and
      # diffed here. Same reason as SubjectPseudonym: no shared library, and a constant duplicated
      # with nothing comparing the copies is how the next divergence arrives in silence.
      - name: The seed calendar must be identical in all four seeded services
        run: |
          fail=0
          for f in src/main/java/net/jojoaddison/service/seed/SeedCalendar.java \
                   src/test/java/net/jojoaddison/service/seed/SeedCalendarUnitTest.java; do
            ok=1
            for svc in booking messaging payout; do
              diff -u "catalog/$f" "$svc/$f" || ok=0
            done
            if [ "$ok" = 0 ]; then
              echo "::error::$f differs between services — catalog, booking, messaging and payout must agree, or their seeded dates stop lining up. See decisions.md D48."
              fail=1
            else
              echo "ok   $f — identical in all four"
            fi
          done
          exit "$fail"

      # …and nothing in a seed package may read the clock itself.
      #
      # The defect this replaced was a LocalDate.now() in each of the four load() methods — one line,
      # four times, taking the JVM default zone. SeedCalendar is now the only place in any of them
      # that reads the time at all, which is what makes this a grep rather than an argument.
      #
      # It matters more than it looks. Re-reading the clock is not only a zone question: the log line
      # that explains a shift derives the day from the shift for exactly this reason, because two
      # reads either side of Accra midnight print a date the seed was never loaded against.
      #
      # THREE THINGS THE FIRST VERSION OF THIS CHECK GOT WRONG, each found by the NEW-9 review and
      # each a way of failing open — which is the only way a check like this can fail:
      #
      #   1. It banned the TYPE that reads the clock and not the ZONE that interprets one. So
      #      `ChronoUnit.DAYS.between(demoToday, LocalDate.ofInstant(Instant.now(), ZoneId.systemDefault()))`
      #      passed — and that is, character for character, the stand-in D48 quotes as reproducing the
      #      defect. The zone forms are in the list now. Instant.now() ALONE is still legal and still
      #      deliberately so (below); Instant.now() plus an implicit zone is not.
      #   2. The `^[^/*]*` anchor could not cross a `/` or a `*`, so any earlier division, comment
      #      marker inside a string, or multiplication hid the rest of the line. `long pct = amount /
      #      100; LocalDate d = LocalDate.now();` was invisible, and PayoutSeeder does commission
      #      arithmetic. Comment lines are now DROPPED from a full-line match rather than the match
      #      being anchored past them: the filter keeps grep -n's original line numbers and errs
      #      towards reporting, not towards silence.
      #   3. It named the four *Seeder.java files. SeedDataLoader is in the same package, is the
      #      ApplicationRunner that calls load(SeedFile, boolean), and was not covered — and D48's own
      #      named future work (a shared HC_SEED_TODAY) would compute its LocalDate exactly there. So
      #      the check scans the whole package and exempts only SeedCalendar, which is the one file
      #      that is SUPPOSED to read a clock.
      #
      # Instant.now() is deliberately NOT in this list. An Instant carries no calendar, so on its own
      # it cannot be read in the wrong one — CatalogSeeder stamps Favourite.addedAt with one, which is
      # the D21 "when did this happen" category and not a date to be shifted at all (the seed's
      # `favourites` are bare professional refs carrying no date to shift). What is banned is the types
      # that need a zone to mean anything, and every spelling of "and take the JVM's".
      - name: No seed package may read the clock directly
        run: |
          fail=0
          for svc in catalog booking messaging payout; do
            dir="$svc/src/main/java/net/jojoaddison/service/seed"
            # A moved or renamed package would leave the glob unexpanded, grep would error on a
            # literal path, and every file would report "ok" — this check passing on a tree it never
            # looked at is the same failure it was widened to stop. So the directory and the count of
            # files actually scanned are both asserted.
            if [ ! -d "$dir" ]; then
              echo "::error::$dir does not exist — this check would scan nothing and pass. See decisions.md D48."
              fail=1
              continue
            fi
            scanned=0
            for f in "$dir"/*.java; do
              # SeedCalendar is the one file that may: it holds SEED_ZONE and is the seam the tests
              # inject a Clock through. Everything else in the package goes through it.
              case "$f" in */SeedCalendar.java) continue ;; esac
              scanned=$((scanned + 1))
              # Comments may name LocalDate.now() — they explain why it is not there. Code may not.
              # Filtering AFTER the match keeps the real line numbers, and a line that is not a
              # comment survives the filter, so an unusual layout over-reports instead of passing.
              if grep -nE '(LocalDate|LocalDateTime|LocalTime|ZonedDateTime|OffsetDateTime|Year|YearMonth)\.now\(|Clock\.system|ZoneId\.systemDefault|TimeZone\.getDefault|systemDefaultZone' "$f" \
                   | grep -vE '^[0-9]+:[[:space:]]*(//|\*|/\*)'; then
                echo "::error file=$f::a seed class reads the clock or the JVM's zone directly — the shift belongs to SeedCalendar, in the estate's calendar, or the four services stop agreeing on what day it is. See decisions.md D48."
                fail=1
              else
                echo "ok   $f"
              fi
            done
            if [ "$scanned" -eq 0 ]; then
              echo "::error::$dir matched no scannable file — the seeder has moved and this check is now blind. See decisions.md D48."
              fail=1
            fi
          done
          exit "$fail"

      # And the pepper that keys it must be injected everywhere the three services run, and committed
      # nowhere a real deployment reads. Same shape as the JWT signing key, same reason: this
      # repository is public, so a default that works is a secret that does not.
      #
      # Absent, erasure answers 503 rather than writing a re-identifiable alias — so the failure this
      # guards is not a crash, it is a desk that has quietly stopped being able to do the one thing it
      # exists for, on a stack that is green everywhere else.
      # Both halves of this were two greps here until 2026-09-02, and both could pass on a broken
      # state. The first was per FILE — it matched the string anywhere, so moving messaging off the
      # shared YAML anchor (which is how the per-service DISCOVERY_HOSTNAME overrides already work)
      # left it unpeppered while the other four kept the check green. The second matched only the
      # nested `    pepper: v` spelling, and Spring reads the flat `healthconnect.privacy.pepper: v`
      # just as happily — a line beginning with `h`, which the leading-whitespace anchor could not
      # see. Now a script, so it can be run and watched to fail; the test beside it builds both bad
      # states and asserts the old greps passed on them.
      - name: The erasure pepper must be required per service and committed in no runtime profile
        run: ./.github/checks/pepper-wiring.sh

      - name: …and that check must fail on the states its predecessors passed
        run: ./.github/checks/pepper-wiring-test.sh

      # quality/startup.sh took an environment-provided pepper without ever writing it down, so the
      # next run without the variable generated a fresh one against databases keyed to the old.
      # ErasureRegisterGuard cannot see that: it detects an absent pepper, not a changed one.
      - name: quality/startup.sh must not be able to mint a second pepper
        run: ./.github/checks/quality-pepper-persistence-test.sh

      # The image name is written in THREE places: image_for() in deploy-prod.sh, that script's own
      # header, and spec §12's channel table. They disagreed for weeks — header and spec said
      # ghcr.io/<owner>/healthconnect-<service>, the code produced hc-market-<service> — and
      # sync-appendices.sh could not catch it, because the appendix faithfully reproduces the
      # script's header, so both copies were wrong together and matched each other perfectly.
      #
      # A documented image name that cannot exist sends whoever hits a 404 hunting for a registry
      # fault instead of a missing tag, which is the confusion quality/startup.sh warns about.
      - name: The documented image name must match the one the code builds
        run: |
          prefix=$(grep -oE 'IMAGE_PREFIX="ghcr\.io/\$\{GHCR_OWNER\}/[a-z-]+"' deploy/deploy-prod.sh | sed -E 's#.*/([a-z-]+)"#\1#')
          echo "image_for builds: ghcr.io/<owner>/${prefix}-<service>"
          test -n "$prefix"
          fail=0
          grep -q "ghcr.io/<owner>/${prefix}-<service>" deploy/deploy-prod.sh || {
            echo "::error file=deploy/deploy-prod.sh::header does not document ${prefix}-<service>"; fail=1; }
          grep -q "ghcr.io/<owner>/${prefix}-<service>" docs/healthconnect-marketplace.md || {
            echo "::error file=docs/healthconnect-marketplace.md::spec §12 does not document ${prefix}-<service>"; fail=1; }
          [ "$fail" = 0 ] && echo "ok   header and spec both document ${prefix}-<service>"
          exit "$fail"

      # An unparseable rules file is only discovered when Mimir silently declines to load it, and
      # the symptom is an alert that never fires — indistinguishable from a system that is fine.
      - name: The alert rules must parse and stay uniquely named
        run: |
          python3 - <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open('deploy/observability/hc-market-rules.yaml'))
          names = [g['name'] for g in doc['groups']]
          print('groups:', names)
          assert len(names) == len(set(names)), 'duplicate group names within the file'
          # Group names share ONE namespace across every file in Mimir's tenant directory, so a
          # bare name here could collide with the fleet's shared rules and quietly replace them.
          bad = [n for n in names if not n.startswith('hc-market-')]
          assert not bad, f'group names must be prefixed hc-market-: {bad}'
          for g in doc['groups']:
              for r in g['rules']:
                  assert 'alert' in r and 'expr' in r, f'malformed rule in {g["name"]}'
          print('alerts:', sum(len(g['rules']) for g in doc['groups']))
          PY
