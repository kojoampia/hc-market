# Build, test and check hc-market.
#
# There was no CI in this repository before this file. That is how the whole suite came to be
# skipped for a week of work: D9 switched local builds to -DskipTests because Cucumber plus
# Testcontainers cost minutes per app, and nothing else was running them. When they were finally run
# again, booking had 137 failures and two services were violating an architecture rule. Everything
# compiled the entire time.
#
# So the point of this file is narrow and specific: run the things that only fail when somebody
# remembers to look.
#
# Shaped after hc-patient/api/.github/workflows/build.yml. The differences are all consequences of
# hc-market being ONE repository holding FIVE standalone Maven projects with no aggregator pom — so
# the build is a matrix rather than a single ./mvnw, and there are repo-level checks the siblings
# have no equivalent of.
name: Build and check

on:
  push:
    branches: [main]
  # EVERY pull request, not just those targeting main.
  #
  # This carried `branches: [main]`, so a PR based on another branch got NO CHECKS AT ALL — and a PR
  # with no CI is worse than one with failing CI: GitHub shows nothing, which reads as "nothing to
  # worry about" rather than "never ran". Found when a stacked PR sat green-looking and unverified.
  #
  # Stacking is the normal shape here now that work goes on branches: a follow-up based on an open
  # PR should be gated exactly as hard as one based on main.
  #
  # release.yml is deliberately NOT widened. It publishes five images to GHCR and must stay on
  # `push: branches: [main]` — the point of a PR is to get the gate without the publish.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------------
  # The five services. A matrix rather than a reactor because each app is a standalone project with
  # its own ./mvnw — decisions.md D6, matching every sibling product.
  #
  # fail-fast is OFF: when a change breaks more than one service, seeing all of them in one run is
  # worth more than saving a few minutes. The booking/payout/messaging breakage was exactly that
  # shape, and finding it one service at a time would have taken three rounds.
  # ---------------------------------------------------------------------------------------------
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, catalog, booking, messaging, payout]
    steps:
      - uses: actions/checkout@v4

      # Java 25, because that is what the poms target (decisions.md D2) and what the images run.
      # NOT 21, which is what JHipster 9.2.0 generates by default and what a careless regeneration
      # would put back.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # The wrapper fetches Maven itself, and setup-java's `cache: maven` does not cover it: that
      # option caches ~/.m2/repository only, while the distribution lands in ~/.m2/wrapper/dists.
      # So every job downloaded apache-maven-<version>-bin.zip from repo.maven.apache.org — five
      # times a run, with no retry anywhere in the wrapper script.
      #
      # On 2026-08-31 that single fetch failed on one runner and turned a DOCS-ONLY pull request
      # red, seven seconds in, before a line of Java was compiled. A red check that has nothing to
      # do with the change is worse than a slow one: it trains whoever sees it to re-run rather than
      # to read, which is exactly the habit that lets a real failure through.
      #
      # Keyed on maven-wrapper.properties, so a wrapper upgrade misses the cache and fetches once
      # rather than being served a stale distribution.
      - name: Cache the Maven wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('**/maven-wrapper.properties') }}
          restore-keys: maven-wrapper-

      # `verify`, never `test`. Surefire EXCLUDES **/*IT* and failsafe includes it, so `test` runs no
      # integration test at all — and the ITs are where Testcontainers, the ArchUnit layer rule and
      # the Liquibase changelogs actually get exercised. A green `test` proves very little here.
      #
      # The ITs bring up PostgreSQL and Kafka through Testcontainers, so the runner's Docker daemon
      # is the only service dependency.
      - name: Build and test
        working-directory: ${{ matrix.service }}
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # verify also runs spotless, checkstyle and modernizer, and those fire AFTER the tests pass —
      # so a run can read "Tests run: 64, Failures: 0" and still fail. Uploading the reports makes
      # the difference visible without re-running anything.
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  # Checks with no sibling equivalent, because no sibling has these artefacts. Each one guards a
  # class of drift that has already happened in this repository at least once.
  # ---------------------------------------------------------------------------------------------
  consistency:
    name: Seed, appendices and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The seed is REGENERATED from the prototype, never edited (decisions.md D4). The extractor
      # asserts the prototype's own figures — 18 professionals, 52 services, 63 reviews, 256
      # sessions, ₵81,620 — and refuses to write if any of them drift.
      #
      # Running it here catches two different things: a prototype change that moves a figure, and a
      # seed-data.json that was hand-edited despite the rule. The second is why the file is compared
      # afterwards rather than just regenerated.
      - name: Regenerate the seed from the prototype
        run: node deploy/demo/extract-seed.mjs

      - name: The committed seed must match what the extractor produces
        run: |
          if ! git diff --quiet -- deploy/demo/seed-data.json; then
            echo "::error::deploy/demo/seed-data.json differs from what extract-seed.mjs produces."
            echo "The seed is regenerated, never hand-edited — run: node deploy/demo/extract-seed.mjs"
            git --no-pager diff --stat -- deploy/demo/seed-data.json
            exit 1
          fi

      # Spec Appendices A and B ARE deploy-dev.sh and deploy-prod.sh — the same bytes in two places.
      # Two copies drift unless something enforces it, and a spec describing a script that no longer
      # exists is worse than no appendix.
      - name: The spec appendices must match the scripts
        run: ./deploy/sync-appendices.sh --check

      # Both compose files parse, with the variables they demand actually supplied. A missing
      # required variable presents at deploy time as a stack that will not start, and finding that
      # on the quality box rather than here is the whole thing the quality box exists to avoid.
      - name: Compose files must be valid
        run: |
          JWT_BASE64_SECRET=ci-placeholder HC_PRIVACY_PEPPER=ci-placeholder \
            docker compose -f deploy/docker/docker-compose.dev.yml config >/dev/null
          # TAG is normally supplied by quality/startup.sh, which is the only supported entry
          # point. It is required rather than defaulted on purpose — an image tag that silently
          # falls back to `latest` is how a quality box ends up running something nobody chose.
          JWT_BASE64_SECRET=ci-placeholder HC_PRIVACY_PEPPER=ci-placeholder TAG=ci \
            docker compose -f quality/compose.yml config >/dev/null
          env HC_IMAGE_PREFIX=example HC_IMAGE_SEP=/ HC_TAG=ci JWT_BASE64_SECRET=ci-placeholder \
              HC_PRIVACY_PEPPER=ci-placeholder \
              HC_GATEWAY_ADMIN_PASSWORD=ci-placeholder \
              HC_GATEWAY_MONGODB_URI=mongodb://x/y \
              HC_CATALOG_DB_URL=jdbc:x HC_CATALOG_DB_PASSWORD=x \
              HC_BOOKING_DB_URL=jdbc:x HC_BOOKING_DB_PASSWORD=x \
              HC_MESSAGING_DB_URL=jdbc:x HC_MESSAGING_DB_PASSWORD=x \
              HC_PAYOUT_DB_URL=jdbc:x HC_PAYOUT_DB_PASSWORD=x \
            docker compose -f deploy/docker/docker-compose.prod.yml config >/dev/null
          # The production DATA TIER — the four PostgreSQL instances and the gateway's MongoDB,
          # installed on the host once and never rolled by a deploy. A fourth compose file, and the
          # only one that is not a copy of another: nothing in it appears in the application stack
          # and nothing in the application stack appears in it (decisions.md D49).
          #
          # Deliberately NOT added to the gateway-route checks below, which iterate a fixed list of
          # three. It declares no route, no cross-service base URL and no application secret, so it
          # would fail "expected 4 narrowed gateway routes, found 0" — and the reason it would is the
          # reason the split exists: there is exactly ONE place in this repository where a production
          # gateway route is written.
          env HC_MONGO_ROOT_USERNAME=x HC_MONGO_ROOT_PASSWORD=x \
              HC_CATALOG_DB_PASSWORD=x HC_BOOKING_DB_PASSWORD=x \
              HC_MESSAGING_DB_PASSWORD=x HC_PAYOUT_DB_PASSWORD=x \
            docker compose -f deploy/prod-server/compose.yml config >/dev/null

      # The scripts are the deployment. A syntax error in one is only discovered when somebody tries
      # to deploy, which is the worst possible moment to discover it.
      - name: Shell scripts must parse
        run: |
          # deploy/prod-server/start has NO .sh extension, matching the sibling stacks' `start`
          # scripts, so it has to be named rather than globbed — a glob on *.sh would skip it and
          # report success having checked four of five. It is also the one script here that only
          # ever runs on a host nothing in this workflow can reach, which is precisely why parsing
          # it in CI is the only gate it will ever get.
          for s in deploy/deploy-dev.sh deploy/deploy-prod.sh deploy/sync-appendices.sh \
                   deploy/verify-cycle.sh deploy/verify-outbox-recovery.sh \
                   deploy/verify-otel-agent.sh quality/startup.sh \
                   deploy/prod-server/infra.sh deploy/prod-server/backup.sh deploy/prod-server/start \
                   .github/checks/*.sh; do
            bash -n "$s" && echo "ok   $s"
          done

      # The quality vhost's upstream port is written in host-site.conf AND in compose.yml, because
      # nginx cannot read the environment. When they disagree the site returns 502 and nothing else
      # complains.
      - name: The quality vhost and its compose must agree on a port
        run: |
          conf=$(grep -oE 'proxy_pass http://127\.0\.0\.1:[0-9]+' quality/host-site.conf | grep -oE '[0-9]+$' | sort -u)
          compose=$(grep -oE 'GATEWAY_PORT:-[0-9]+' quality/compose.yml | grep -oE '[0-9]+$' | sort -u)
          echo "vhost=$conf compose=$compose"
          test "$conf" = "$compose"

      # The identical hazard, one environment over, and it arrived with deploy/prod-server/.
      #
      # The production edge proxies to the gateway's loopback-published port, written in
      # hc-market-app.conf and in docker-compose.prod.yml because nginx cannot read the environment.
      # When they disagree the site returns 502 for every path and nothing else complains — and on
      # production, unlike quality, nobody is watching a terminal when it happens.
      #
      # `sort -u` on the vhost side is load-bearing: that file names the port TWICE, once in the
      # webhook location and once in `location /`. If those two ever differ this collapses to two
      # values and the comparison fails, which is the right answer — half the site on the wrong
      # upstream is worse than all of it.
      - name: The production vhost and its compose must agree on a port
        run: |
          conf=$(grep -oE 'proxy_pass +http://127\.0\.0\.1:[0-9]+' deploy/prod-server/hc-market-app.conf | grep -oE '[0-9]+$' | sort -u)
          # Matched against the PUBLISH LINE, not against the variable name. The comment above that
          # line quotes the old 0.0.0.0 form verbatim, so a loose `HC_GATEWAY_PORT:-[0-9]+` reads two
          # values out of this file — one of them from prose. A check that a comment can break is a
          # check somebody eventually deletes.
          compose=$(sed -nE "s/^ *- *'127\.0\.0\.1:\\\$\{HC_GATEWAY_PORT:-([0-9]+)\}:8080'.*/\1/p" \
                      deploy/docker/docker-compose.prod.yml | sort -u)
          echo "vhost=$conf compose=$compose"
          test -n "$conf" && test -n "$compose" && test "$conf" = "$compose"

      # And the gateway must be published on LOOPBACK on the production host.
      #
      # `'${HC_GATEWAY_PORT:-8086}:8080'` binds 0.0.0.0, which puts the gateway on the internet
      # beside the nginx that terminates TLS — bypassing TLS, the security headers, the CSP, the
      # robots policy and the webhook rate limit, all of which live at the edge. It is not a routing
      # hole (D28's predicates apply either way) and that is exactly why it is worth a check: every
      # functional test passes, the site works, and the only symptom is that a second, unprotected
      # front door exists. It was written that way in this file until 2026-09-05 (decisions.md D49).
      - name: The production gateway must publish on loopback only
        run: |
          line=$(grep -E "^ *- *'[^']*:8080'" deploy/docker/docker-compose.prod.yml)
          echo "$line"
          if ! printf '%s' "$line" | grep -q "127\.0\.0\.1:"; then
            echo "::error file=deploy/docker/docker-compose.prod.yml::the gateway publishes on every interface — on the production host that is a second, unprotected front door beside nginx. See decisions.md D49."
            exit 1
          fi
          echo "ok   gateway published on 127.0.0.1 only"

      # The webhook location in the production vhost must name the SAME path the gateway routes.
      #
      # This one is silent in the worst way and does not break anything when it drifts: `location /`
      # proxies the callback regardless, so the site keeps working, the provider keeps being
      # answered, and the rate limit, the 64k body cap and the POST restriction have simply stopped
      # applying to the estate's one unauthenticated public write path (decisions.md D43, D45).
      #
      # Compared as a PREFIX of the compose predicate — the vhost has a trailing slash where the
      # predicate has `**` — so a rename of either end fails here rather than in six months.
      - name: The production vhost's webhook location must match the routed path
        run: |
          predicate=$(grep -oE 'Path=/services/healthconnectbooking/webhooks/\*\*' deploy/docker/docker-compose.prod.yml | head -1)
          want="${predicate#Path=}"; want="${want%\*\*}"
          echo "route prefix: $want"
          test -n "$want"
          if ! grep -qF "location $want {" deploy/prod-server/hc-market-app.conf; then
            echo "::error file=deploy/prod-server/hc-market-app.conf::no 'location $want {' — the webhook's rate limit, body cap and POST restriction silently stop applying while the callback keeps being proxied by 'location /'. See decisions.md D45 and D49."
            exit 1
          fi
          echo "ok   location $want matches the routed path"

      # PRODUCTION IS API-ONLY. The prototype is NOT served on the production hostname, and this is
      # the check that stops it coming back — decisions.md D49.
      #
      # quality/host-site.conf serves docs/Abofonsa_BridgeCare_Marketplace.html at /prototype,
      # same-origin, with a deliberately weaker CSP. That page is populated with the seed: 18
      # invented professionals presented as real people, with credentials, association registration
      # numbers and reviews. On a private LAN box that is a demo. On a public health-services domain
      # it is eighteen fabricated practitioner listings published to the internet.
      #
      # The failure this guards is a specific and plausible one: somebody notices the two vhosts
      # differ and "restores parity with quality". Parity is the wrong target — quality exists to
      # rehearse production, not the other way round — so the difference is asserted rather than
      # left to a comment nobody has to read.
      - name: The production vhost must not serve the prototype
        run: |
          fail=0
          for f in deploy/prod-server/market.abofonsa.com.conf deploy/prod-server/hc-market-app.conf; do
            # `location ... /prototype`, an alias to the HTML, or the weaker CSP that page needs.
            if grep -nE "^[^#]*(location[^#]*/prototype|alias[^#]*Abofonsa_BridgeCare_Marketplace\.html|unsafe-inline)" "$f"; then
              echo "::error file=$f::the production edge serves the prototype, or carries the relaxed CSP it needs. It is API-only on purpose — 18 invented professionals must not be published on a public health-services domain. See decisions.md D49."
              fail=1
            else
              echo "ok   $f"
            fi
          done
          exit "$fail"

      # The application stack's datasource URLs name the data tier's containers, and the two files
      # are written by different hands at different times: compose.yml declares the container, and
      # the URL an operator pastes into secrets.env is templated in secrets.env.example.
      #
      # A rename in one and not the other is a five-service outage from a one-word edit, and the
      # error it produces ("UnknownHostException") points at DNS rather than at either file. The
      # values themselves live only on the host, so the template is the only copy CI can see — which
      # makes this the only place the pair can be compared at all.
      - name: The data tier's container names must match the connection template
        run: |
          fail=0
          for ctr in $(grep -oE '^ +container_name: hc-market-[a-z]+-db$' deploy/prod-server/compose.yml \
                       | awk '{print $2}'); do
            if grep -q "$ctr" deploy/prod-server/secrets.env.example; then
              echo "ok   $ctr"
            else
              echo "::error file=deploy/prod-server/secrets.env.example::$ctr is declared in the data tier but appears in no connection string here — an operator would paste a URL naming a host that resolves nowhere. See decisions.md D49."
              fail=1
            fi
          done
          exit "$fail"

      # And nothing in prod-server/ may carry a filled-in secret. This repository is PUBLIC.
      #
      # The template's rule is that every required value is EMPTY, with a generation command beside
      # it — a placeholder that looks real is how a plausible value ends up pasted into production,
      # and a real one is a published secret. secrets.env itself is gitignored; this is the check for
      # the file that is not.
      - name: The connection template must carry no value for any secret
        run: |
          fail=0
          # HC_[A-Z_]+_PASSWORD rather than HC_[A-Z]+_DB_PASSWORD: [A-Z]+ does not match an
          # underscore, so the narrower form covered the four database passwords and HC_MONGO_ROOT_PASSWORD
          # by name, while HC_GATEWAY_ADMIN_PASSWORD (decisions.md D61) could have been committed here
          # with a value and passed. Measured on a three-line fixture: old 2 of 3, this 3 of 3.
          while IFS= read -r line; do
            echo "::error file=deploy/prod-server/secrets.env.example::'$line' has a value. Every secret in the template must be empty. See decisions.md D35 and D49."
            fail=1
          done < <(grep -E '^(JWT_BASE64_SECRET|HC_PRIVACY_PEPPER|HC_[A-Z_]+_PASSWORD|HC_GATEWAY_MONGODB_URI|HC_[A-Z]+_SECRET)=.+' \
                     deploy/prod-server/secrets.env.example || true)
          [ "$fail" = 0 ] && echo "ok   every secret in the template is empty"
          exit "$fail"

      # THE MOST SERIOUS OF WP-19's FIVE DEFECTS WAS THE ONLY ONE WITH NO MECHANICAL GUARD, which is
      # this one — decisions.md D37, D49.
      #
      # deploy-prod.sh's own hint told the operator to install the PLATFORM's signing key, the one
      # hc-admin, hc-patient and hc-professional share. Nothing running could ever have caught it:
      # there is no `iss` and no `aud` validation anywhere in this estate, so a token minted with
      # that key is accepted here and a token minted here is accepted there, silently and for ever.
      # The estate would have come up perfectly, every test green, with a capability boundary the
      # repository documents in two places quietly dissolved.
      #
      # So the guard is on the WORDS, because the words are the only artefact. Watched firing against
      # the original hint (four ways), against a compose message restored to "platform JWT secret is
      # required", and against a runbook line telling somebody to paste the value in.
      - name: No deploy path may point the signing key at the platform's shared key
        run: ./.github/checks/signing-key-severance.sh

      # The OpenTelemetry wiring lives in pom.xml, and pom.xml is GENERATED — it carries no
      # jhipster-needle markers, so `jhipster jdl` with the force flag rewrites it wholesale and
      # drops every line of this. Losing it is completely silent: the build succeeds, the image is
      # produced, it simply has no agent in it and the service goes quiet on the dashboards.
      #
      # combine.self is checked by name because its absence is the subtler half of the same
      # failure. pluginManagement declares the simple <paths>src/main/docker/jib</paths> form, and
      # without the override Maven keeps that text content instead of the child elements — build
      # green, image built, agent absent. Found exactly that way, by looking inside the image.
      - name: Every pom must still carry the OpenTelemetry wiring
        run: |
          fail=0
          for service in gateway catalog booking messaging payout; do
            for needle in 'opentelemetry-javaagent' 'otel-javaagent.jar' 'combine.self="override"'; do
              if ! grep -qF "$needle" "$service/pom.xml"; then
                echo "::error::$service/pom.xml is missing '$needle' — regeneration drops it. See the checklist in CLAUDE.md."
                fail=1
              fi
            done
            [ "$fail" = 0 ] && echo "ok   $service/pom.xml"
          done
          exit "$fail"

      # The step above guards the BUILD half of a runtime path that had executed nowhere. The agent
      # is in all five images and, until decisions.md D63, no JVM in any environment had ever been
      # started with -javaagent — while deploy/observability/hc-market-rules.yaml declared five
      # alerts over metrics only the agent emits, two of them `absent()` queries that would have
      # fired continuously and for ever if the file were installed. Nothing could see it: the rules
      # check below asserts the YAML parses and that group names are unique, which a file
      # describing a signal nobody emits satisfies perfectly.
      #
      # This one asserts the RELATIONSHIP between the rules file and the three compose files, and
      # it reads what `docker compose config` RENDERS rather than the compose text — so the long
      # comment in quality/compose.yml, which names -javaagent:/app/otel-javaagent.jar four times
      # in prose, cannot satisfy it. That is why it needs no comment stripper: a check reading a
      # resolved value has no prose in its subject at all. Its own test mutates each of the four
      # things it guards separately and requires a distinct red for each, plus the two states that
      # must stay green — including the future one, where telemetry is on and the marker is gone.
      - name: The alert rules and the compose files must agree about whether anything reports
        run: ./.github/checks/observability-claims.sh

      - name: That check's own test
        run: ./.github/checks/observability-claims-test.sh

      # The quality stack must sit on the network its collector is on — decisions.md D64, NEW-24.
      #
      # The check above proves the agent is one variable away from being attached. It says nothing
      # about whether that variable would achieve anything, and for most of this repository's life
      # it would not have: `otel-collector` resolves on `qualitynet` and nowhere else, the collector
      # publishes on the HOST's loopback, and this was the only quality stack on jacserver not
      # joined to that network. All three siblings were, and had been for weeks.
      #
      # Losing this again is completely silent in the direction that matters: the five services
      # start, serve and report healthy on two networks exactly as on three, so nothing here or on
      # the box goes red until somebody turns telemetry on and finds an empty dashboard.
      #
      # THE SERVICE LIST IS DERIVED, never enumerated — every enumerated list in this repository's
      # CI has gone stale or failed open. It is the services that render a JAVA_OPTS, which is the
      # same derivation observability-claims.sh uses and picks out exactly the five app services;
      # the five databases have none and must NOT be on a shared plane. A count of zero is refused,
      # because "no service is missing the network" is satisfied perfectly by reading no services.
      #
      # It reads what compose RENDERS, so no comment stripper is needed for that half. The
      # startup.sh half is text and is anchored past `#` comment lines instead.
      - name: The quality stack must sit on the network its collector is on
        run: |
          fail=0
          rendered=$(JWT_BASE64_SECRET=ci-placeholder HC_PRIVACY_PEPPER=ci-placeholder TAG=ci \
            docker compose -f quality/compose.yml config --format json)

          # 1. Every app service joins it.
          apps=$(printf '%s' "$rendered" | jq -r '.services | to_entries[]
                   | select(.value.environment.JAVA_OPTS != null) | .key' | sort)
          n=$(printf '%s\n' "$apps" | grep -c . || true)
          if [ "$n" -eq 0 ]; then
            echo "::error file=quality/compose.yml::no service renders a JAVA_OPTS, so this check established nothing. See decisions.md D64."
            fail=1
          else
            missing=$(printf '%s' "$rendered" | jq -r '.services | to_entries[]
                        | select(.value.environment.JAVA_OPTS != null)
                        | select((.value.networks | keys) | index("qualitynet") | not) | .key' | sort)
            if [ -n "$missing" ]; then
              echo "::error file=quality/compose.yml::these services are not on qualitynet: $(echo $missing). That is the network the quality monitoring stack sits on; off it, otel-collector resolves nowhere and the agent exports into nothing while every service stays healthy. See decisions.md D64 and backlog NEW-24."
              fail=1
            else
              echo "ok   all $n app services join qualitynet"
            fi
            # …and the databases must NOT. A product's Postgres has no business being reachable
            # from another product's stack, which is the same rule that keeps them off hcnet.
            leaked=$(printf '%s' "$rendered" | jq -r '.services | to_entries[]
                       | select(.value.environment.JAVA_OPTS == null)
                       | select((.value.networks | keys) | index("qualitynet")) | .key' | sort)
            if [ -n "$leaked" ]; then
              echo "::error file=quality/compose.yml::these non-application services are on qualitynet: $(echo $leaked). The databases stay on the project's own network. See decisions.md D64."
              fail=1
            else
              echo "ok   no database joins qualitynet"
            fi
          fi

          # 2. External, and named `qualitynet` by default.
          #
          # Without `external:`, ownership of the collector's network becomes a function of start
          # order — measured, and narrower than D64 first claimed. With `name:` kept, as it is here,
          # a non-external declaration ADOPTS a network that already exists and writes no label, so
          # `down` leaves it alone; but on a host where the monitoring project has been downed and
          # the network is absent, compose CREATES it carrying this project's labels, and `down`
          # then removes it — refused while a sibling endpoint is attached, and succeeding the
          # moment the siblings are stopped too, which is what a reboot looks like. `external: true`
          # is what makes the answer the same on every host.
          ext=$(printf '%s' "$rendered" | jq -r '.networks.qualitynet.external // false')
          name=$(printf '%s' "$rendered" | jq -r '.networks.qualitynet.name // ""')
          echo "qualitynet external=$ext name=$name"
          if [ "$ext" != "true" ] || [ "$name" != "qualitynet" ]; then
            echo "::error file=quality/compose.yml::qualitynet must render as external with the name 'qualitynet'; got external=$ext name=$name. See decisions.md D64."
            fail=1
          fi

          # 3. startup.sh creates it, or the stack is unstartable whenever somebody has downed a
          # monitoring project in another repository — measured: `up` exits 1 on a missing external
          # network, while `config` and `down` exit 0.
          #
          # And both sides must read the SAME variable: a variable only the script reads changes
          # which network gets created and inspected while compose keeps joining the default, which
          # is exactly the trap D46 and D50 found twice and which HC_SHARED_NETWORK, HC_SHARED_CONSUL
          # and HC_SHARED_KAFKA had in this very file until D66 closed backlog NEW-25 — the step
          # below is theirs. `env_for_compose` exports it on every action so a `--down` cannot
          # address a different network from the `up` that made the containers, and that property is
          # worth nothing unless compose actually interpolates it.
          #
          # THE COMPOSE HALF IS RENDERED, NOT GREPPED, and that is a correction rather than a
          # preference. This sub-check originally matched `name: ${HC_OTEL_NETWORK:-…}` as text
          # while the two around it read `docker compose config`, and the departure was the defect:
          # commenting the line out left the grep matching the commented text, while an external
          # network with no `name:` renders under its own key — so part 2 stayed green on
          # `name=qualitynet`, both `ok` lines printed, and the step exited 0 with the variable
          # reaching nothing. Reproduced before it was fixed. A second render with the variable SET
          # tests the interpolation instead of its spelling, and no comment can satisfy it.
          #
          # The default is compared against part 2's RENDERED name for the same reason — that is
          # what an operator who sets nothing gets, and it is the name the monitoring stack is on.
          created=$(grep -vE '^[[:space:]]*#' quality/startup.sh \
                     | grep -cE 'docker network create +"\$OTEL_NETWORK"' || true)
          script_default=$(grep -oE '^OTEL_NETWORK="\$\{HC_OTEL_NETWORK:-[a-z0-9_.-]+\}"' quality/startup.sh \
                     | sed -E 's/.*HC_OTEL_NETWORK:-([a-z0-9_.-]+)\}"/\1/')
          probed=$(HC_OTEL_NETWORK=ci-probe JWT_BASE64_SECRET=ci-placeholder \
                     HC_PRIVACY_PEPPER=ci-placeholder TAG=ci \
                     docker compose -f quality/compose.yml config --format json \
                   | jq -r '.networks.qualitynet.name // ""')
          echo "creates=$created script_default='$script_default' HC_OTEL_NETWORK=ci-probe renders name='$probed'"
          if [ "$created" -eq 0 ]; then
            echo "::error file=quality/startup.sh::nothing creates \$OTEL_NETWORK. compose declares it external, so 'up' refuses outright when the monitoring project has been downed. See decisions.md D64."
            fail=1
          fi
          if [ "$probed" != "ci-probe" ]; then
            echo "::error file=quality/compose.yml::with HC_OTEL_NETWORK=ci-probe the qualitynet network still renders as '$probed'. compose must interpolate the same variable startup.sh creates, or the script creates one network and compose joins another — and '--down' then addresses a third. See decisions.md D64 §4."
            fail=1
          fi
          if [ -z "$script_default" ] || [ "$script_default" != "$name" ]; then
            echo "::error::quality/startup.sh defaults HC_OTEL_NETWORK to '$script_default' and quality/compose.yml renders '$name' with it unset. They must be the same name. See decisions.md D64."
            fail=1
          fi
          exit $fail

      # THE OTHER HALF OF THE STEP ABOVE, and the defect its comment points at — decisions.md D66,
      # backlog NEW-25. HC_SHARED_NETWORK, HC_SHARED_CONSUL and HC_SHARED_KAFKA name the one broker
      # and the one Consul four products borrow (D27). quality/startup.sh read all three and
      # quality/compose.yml hardcoded all three, so an override moved which plane was CHECKED and not
      # which plane was JOINED and ADDRESSED: preflight went green against the broker you named while
      # the stack talked to the original one.
      #
      # A script rather than a `run:` block, because it has a test beside it that constructs each
      # broken state — the compose half hardcoded again, a `name:` commented out, a default renamed,
      # the export dropped, the membership refusal deleted — and requires this to go red through the
      # door each one was aimed at. Twenty-two of them.
      #
      # BOTH SCRIPTS since decisions.md D69 (backlog NEW-29). D66 fixed the membership blindness in
      # `check_shared_plane` and left the same four questions unasked in deploy-dev.sh's
      # `shared_plane` — a different NAME, which is why nothing carried across and why this step's
      # part 4 now walks `script:function` pairs rather than a script list. It also asks the one
      # thing that makes a FATAL refusal safe in dev: which of the dev router's actions reach
      # preflight, as an EXACT set — `{up, reseed, restart}`. A deny-list over the teardowns was
      # written first and passed two mutations at review: `up` losing its own preflight, and a new
      # `doctor)` branch gaining one. It counted, it did not attribute.
      - name: Every stack must address the shared plane it preflight-checks
        run: ./.github/checks/shared-plane-wiring.sh

      - name: …and that check must fail on each of the twenty-two states it exists to refuse
        run: ./.github/checks/shared-plane-wiring-test.sh

      # THE SIXTH INSTANCE OF THE SAME FAMILY, AND THE FIRST WITH TWO HOPS IN IT — decisions.md D75,
      # backlog NEW-33. The step above is about a docker read whose refusal asserts an absence; this
      # is the same reading in deploy-prod.sh, across an ssh, where FIVE outcomes reached one
      # message: ssh not reaching the host, ssh being refused, no docker on the host, a daemon that
      # could not be asked, and the network genuinely being absent. `$net_hint` told the reader to
      # create the network or start the stack that owns it, which is the remedy for exactly one of
      # them — and across a network the first two are the likeliest. It ran three times in a loop.
      #
      # WHY THIS CANNOT BE A `run:` GREP. ssh exits 255 when it cannot connect and otherwise exits
      # with the REMOTE command's status, so no expression over the source can establish that the
      # two hops are told apart. The check drives the shipped functions against a stub that RUNS the
      # remote script it is handed — so the sentinel every assertion reads is produced by the code
      # under test, not by the harness. Its own test constructs twenty-two broken states, including the
      # positive controls that a repair collapsing two causes into one would otherwise satisfy.
      #
      # FIVE PARTS, and parts 3 and 4 are D75's review finding rather than its plan: the first version
      # drove ONE of the six call sites and covered the rest textually, which establishes that they
      # cannot report an ssh failure as a fact about the host and nothing about their REMOTE-STATUS
      # arms. Emptying one of those is one line, and the mutant PASSES preflight on a secrets.env it
      # could not read — the only defect in this family that is not a refusal.
      #
      # It needs no docker, no network and no host: `deploy-prod.sh` has never been run against one
      # (decisions.md D49) and nothing here changes that.
      - name: A remote probe must say which hop failed
        run: ./.github/checks/host-probe-attribution.sh

      - name: …and that check must fail on each of the twenty-two states it exists to refuse
        run: ./.github/checks/host-probe-attribution-test.sh

      # "The agent must be verified as INSTRUMENTING, not merely loading" has been in CLAUDE.md
      # since D25 and was a paragraph of prose that had been run once, by hand. It is a script now
      # (deploy/verify-otel-agent.sh) and this holds the two together.
      #
      # It does NOT run the verifier. That needs a 24MB agent download and a JVM, and CI has no
      # running service to point it at; the script is for a workstation. What rots between now and
      # then is the RECIPE — the two environment variables and the span attribute — so the script
      # prints its own live constants with --describe and this compares them against the words in
      # CLAUDE.md. The script side is therefore behavioural rather than textual: a comment in it
      # naming the right variable cannot satisfy this, because --describe echoes the constants the
      # assertions actually use.
      - name: CLAUDE.md's agent recipe and verify-otel-agent.sh must agree
        run: |
          fail=0
          test -x ./deploy/verify-otel-agent.sh || {
            echo "::error::deploy/verify-otel-agent.sh is missing or not executable — the only re-runnable proof that the agent instruments rather than loads. See decisions.md D63."
            exit 1
          }
          described=$(./deploy/verify-otel-agent.sh --describe)
          echo "$described"
          get() { printf '%s\n' "$described" | sed -n "s/^$1=//p"; }
          # EVERY KEY IS VALIDATED HERE, BEFORE ANY NEEDLE IS BUILT, and in THIS shell.
          #
          # `get` was `sed -n "s/^$1=//p"` and nothing else, which returns EMPTY for a key that is
          # gone — and `grep -qF -- ""` matches every line of every file. So the one drift this
          # step exists for, a --describe key being RENAMED rather than revalued, printed `ok` and
          # exited 0. Measured: renaming `span-kind=` to `kind=` passed silently. That is the tenth
          # instance of this repository's most recurrent defect class, inside the commit closing
          # the ninth; decisions.md D63 §9 keeps the lineage.
          #
          # Refusing inside get() would NOT have closed it. get is called from $( ), which is a
          # subshell, so an `exit 1` there ends the substitution and leaves the step running with
          # an empty needle — the same fail-open through its own fix. Hence a loop up here.
          for key in traces-exporter-var traces-exporter-value metrics-exporter-var \
                     metrics-exporter-value span-kind route-attribute agent-jar-in-image; do
            if ! printf '%s\n' "$described" | grep -q "^$key="; then
              echo "::error::deploy/verify-otel-agent.sh --describe reports no '$key=' line, so the needle built from it would be empty and would match every line of CLAUDE.md. The script's contract changed; this step and the guide have to change with it. See decisions.md D63."
              fail=1
            elif [ -z "$(get "$key")" ]; then
              echo "::error::deploy/verify-otel-agent.sh --describe reports '$key=' with an empty value, which as a needle matches every line of CLAUDE.md. See decisions.md D63."
              fail=1
            fi
          done
          [ "$fail" = 0 ] || exit "$fail"
          # HOW SPECIFIC EACH NEEDLE IS, measured against CLAUDE.md rather than asserted. Two are
          # var=value PAIRS because `logging` and `none` alone would match a 900-line guide for
          # ever. `span-kind` is a pair for a stronger reason: it was the bare word SERVER, which
          # matched five lines, and two of them are nothing to do with this — `SERVER_PORT: 8080`
          # in the compose section and OTEL_INSTRUMENTATION_JAVA_HTTP_SERVER_ENABLED in this very
          # paragraph's neighbour. Delete every sentence about spans and it stayed green off a
          # compose port. `SERVER span` matches once, in the recipe.
          #
          # The other three are left bare DELIBERATELY, and measured rather than assumed:
          # `http.route` (2 matches, both in the recipe sections), `/app/otel-javaagent.jar` (3)
          # and the script's own path (1). Each is a dotted attribute name or a path — a token
          # that cannot occur by accident in prose, which is exactly what SERVER was not. Pairing
          # `http.route` into a phrase was tried and rejected: it drops 2 in-context matches to 1
          # and goes red on a harmless rewording, which is a red on correct text rather than
          # margin.
          for needle in \
            "$(get traces-exporter-var)=$(get traces-exporter-value)" \
            "$(get metrics-exporter-var)=$(get metrics-exporter-value)" \
            "$(get span-kind) span" \
            "$(get route-attribute)" \
            "$(get agent-jar-in-image)" \
            "deploy/verify-otel-agent.sh"; do
            if grep -qF -- "$needle" CLAUDE.md; then
              echo "ok   CLAUDE.md names '$needle'"
            else
              echo "::error file=CLAUDE.md::CLAUDE.md no longer names '$needle', which deploy/verify-otel-agent.sh --describe reports as part of the recipe it runs. Either the script changed and the guide did not, or the guide was edited past the script. See decisions.md D63."
              fail=1
            fi
          done
          exit "$fail"

      # catalog's /internal/** answers an UNAUTHENTICATED caller — booking holds no credential of
      # its own, because this estate has no service-to-service authentication (decisions.md D28).
      # The only thing keeping it off the internet is that no gateway route matches it, and that
      # lives in three compose files as four `Path=` predicates each.
      #
      # Widen one back to /services/<service>/** and the endpoint is public. Nothing fails, nothing
      # logs, and every existing check still passes: the public reads work, the private ones work,
      # the stack is green. Measured before the narrowing went in — an ordinary ROLE_CUSTOMER token
      # reached catalog on /services/healthconnectcatalog/internal/professionals/p1/login.
      #
      # So this asserts the shape rather than the count: every route predicate in every compose file
      # must end in /api/**, with ONE named exception.
      #
      # THE EXCEPTION IS booking's PAYMENT WEBHOOK — decisions.md D45. A payment provider cannot hold
      # a token and cannot reach anything under /api, so WP-13 routes
      # /services/healthconnectbooking/webhooks/** as well. It is written out in full here rather
      # than matched loosely, because the dangerous near-miss is
      # /services/healthconnectbooking/** — one character shorter and it publishes every booking,
      # dispute and erasure endpoint booking has to anonymous callers, which is D28's defect arriving
      # through the door D45 opened.
      - name: Every gateway route must stay narrowed, and the one webhook route must stay exact
        run: |
          fail=0
          webhook='ROUTES_[0-9]+_PREDICATES_0: *Path=/services/healthconnectbooking/webhooks/\*\*$'
          for f in quality/compose.yml deploy/docker/docker-compose.dev.yml deploy/docker/docker-compose.prod.yml; do
            n=$(grep -cE 'ROUTES_[0-9]+_PREDICATES_0: *Path=/services/[a-z]+/api/\*\*' "$f" || true)
            w=$(grep -cE "$webhook" "$f" || true)
            bad=$(grep -nE 'ROUTES_[0-9]+_PREDICATES_0: *Path=' "$f" | grep -vE "/api/\*\*$" | grep -vE "$webhook" || true)
            if [ -n "$bad" ]; then
              echo "::error file=$f::a gateway route is neither /api/** nor the one permitted webhook path — this publishes catalog's /internal/** or booking's whole API to the internet. See decisions.md D28 and D45."
              echo "$bad"
              fail=1
            elif [ "$n" != 4 ]; then
              echo "::error file=$f::expected 4 narrowed gateway routes, found $n"
              fail=1
            elif [ "$w" != 1 ]; then
              echo "::error file=$f::expected exactly 1 payment-webhook route, found $w — a provider that cannot reach the webhook cannot confirm a payment. See decisions.md D45."
              fail=1
            else
              echo "ok   $f — 4 routes on /api/**, 1 webhook route"
            fi
          done
          exit "$fail"

      # Routing the webhook is TWO changes and the second one is invisible when it is missing.
      #
      # The gateway's generated security chain ends with
      # `.pathMatchers("/services/**").authenticated()` and authenticates BEFORE routing, so a route
      # without a matching permit is a webhook that returns 401 at the edge: nothing reaches booking,
      # nothing appears in booking's log, and the provider retries until it files the payment as
      # undelivered. That reads as a broken provider integration rather than as a missing line, which
      # is why the pair is asserted here as well as documented in three places (decisions.md D45).
      #
      # The path is compared character for character against the compose predicate above.
      #
      # This is a grep and it only reads the source. It cannot see whether the container ever hears
      # the chain — removing @Configuration, @Bean or @Order leaves this step green and every callback
      # 401 at the edge, measured, all three. PaymentWebhookRoutePermitIT asks the running context
      # instead, and the `test` job runs it; this step stays because it names the string, and it fails
      # in seconds rather than after a Testcontainers boot.
      - name: The gateway must permit the webhook route it is asked to carry
        run: |
          permit=gateway/src/main/java/net/jojoaddison/config/PaymentWebhookRouteConfiguration.java
          if ! grep -qF '"/services/healthconnectbooking/webhooks/**"' "$permit"; then
            echo "::error file=$permit::the gateway does not permit the webhook path the compose files route — every provider callback is 401 at the edge. See decisions.md D45."
            exit 1
          fi
          if ! grep -qF 'HttpMethod.POST' "$permit"; then
            echo "::error file=$permit::the webhook permit is not restricted to POST — a readable path here is an unauthenticated read of what the platform knows about somebody's payment."
            exit 1
          fi
          echo "ok   $permit"

      # A route with the right predicate and the wrong target is the same outage as no route at all,
      # and the check above cannot see it: it reads predicates only. Both mutations are one character.
      #
      # ROUTES_4_URI pointed at catalog: the callback is delivered to a service that maps nothing at
      # /webhooks, so the provider gets a 404 from a URL it was given while the booking sits in
      # PENDING_PAYMENT for ever and the professional is never told there is a booking at all. And the
      # block it lives in already names three other container hostnames, so it is an easy line to
      # mistype. StripPrefix=1 is the same outcome by a different road — booking is handed
      # /healthconnectbooking/webhooks/payments/<provider>, which it maps nothing at either.
      #
      # Asserted relatively rather than against a literal host, because the three files name booking
      # three different ways (a short service alias, a container_name, and a ${HC_BOOKING_HOST}
      # default). Whatever booking's own /api route points at, the webhook route must point at too.
      - name: The webhook route must reach booking itself, and strip the same two segments
        run: |
          fail=0
          for f in quality/compose.yml deploy/docker/docker-compose.dev.yml deploy/docker/docker-compose.prod.yml; do
            hook=$(grep -oE 'ROUTES_[0-9]+_PREDICATES_0: *Path=/services/healthconnectbooking/webhooks/\*\*$' "$f" \
                   | sed -E 's/ROUTES_([0-9]+)_.*/\1/')
            api=$(grep -oE 'ROUTES_[0-9]+_PREDICATES_0: *Path=/services/healthconnectbooking/api/\*\*$' "$f" \
                  | sed -E 's/ROUTES_([0-9]+)_.*/\1/')
            if [ "$(echo "$hook" | wc -w)" != 1 ] || [ "$(echo "$api" | wc -w)" != 1 ]; then
              echo "::error file=$f::expected exactly one webhook route and one booking /api route to compare — see decisions.md D45."
              fail=1
              continue
            fi
            hook_uri=$(sed -nE "s/^ *SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_${hook}_URI: *//p" "$f")
            api_uri=$(sed -nE "s/^ *SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_${api}_URI: *//p" "$f")
            strip=$(sed -nE "s/^ *SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_${hook}_FILTERS_0: *//p" "$f")
            if [ -z "$hook_uri" ] || [ "$hook_uri" != "$api_uri" ]; then
              echo "::error file=$f::the webhook route points at '$hook_uri' and booking's own route at '$api_uri' — a provider's callback would be delivered to the wrong service, which answers 404 while the booking waits in PENDING_PAYMENT. See decisions.md D45."
              fail=1
            elif [ "$strip" != "StripPrefix=2" ]; then
              echo "::error file=$f::the webhook route strips '$strip', not StripPrefix=2 — booking is handed a path it maps nothing at, so the callback is a 404 and the payment is never confirmed. See decisions.md D45."
              fail=1
            else
              echo "ok   $f — webhook route $hook -> $hook_uri, StripPrefix=2"
            fi
          done
          exit "$fail"

      # The gateway discloses one customer's email address to booking — decisions.md D72 §3, D74.
      #
      # WHY A GREP AND NOT ONLY A TEST. Ten mutations of this package were run and eight are red in
      # one suite or the other; TWO are green, and they are the two lines below. Measured, not
      # reasoned:
      #
      #   hasAuthority(ContactLookupToken.AUTHORITY) -> authenticated()   green, 14/14 tests pass
      #   anyExchange().denyAll() deleted                                 green, 14/14 tests pass
      #
      # Neither discloses anything today, and that is precisely why nothing goes red. The first is
      # covered by ContactLookupToken.mayRead in the resource — an ordinary login token's subject is a
      # person, so mayRead refuses it whatever the chain allowed — and the second by reactive Spring
      # Security's own default-deny for an exchange no rule matched, which InternalApiPermitIT pins
      # separately. Both are over-determined, so a test asserting either would be asserting a
      # coincidence and would go red on a correct change. A grep is the right instrument for a line
      # whose value is legibility and depth rather than a behaviour, which is the same division of
      # labour the payment webhook's permit has.
      #
      # THE THIRD ASSERTION IS THE LOAD-BEARING ONE. mayRead is what refuses a token an administrator
      # could actually produce: POST /api/admin/authorities creates an authority by name and
      # UserResource grants it, so ROLE_CUSTOMER_CONTACT_READ can reach a real account, and its
      # ordinary 24-hour token then satisfies hasAuthority. Deleting the call IS red — three cases in
      # InternalCustomerContactResourceIT — and it is greped as well because it costs nothing and this
      # is the one line in the estate standing between a login token and a person's email address.
      #
      # COMMENTS ARE STRIPPED FIRST and the file's own javadoc is why: it quotes `hasAuthority`,
      # `authenticated()`, `denyAll` and `mayRead` at length, precisely because it explains this
      # arrangement.
      #
      # HOW MUCH THAT BUYS TODAY WAS MEASURED, needle by needle, with each line mutated away and the
      # RAW file grepped beside the stripped one — because "the stripper is why this works" is the
      # kind of claim this workflow's history is made of:
      #
      #   hasAuthority(ContactLookupToken.AUTHORITY)   raw 0, stripped 0   stripper NOT load-bearing
      #   .denyAll()                                   raw 1, stripped 0   stripper LOAD-BEARING
      #   ContactLookupToken.mayRead(jwt, login)       raw 0, stripped 0   stripper NOT load-bearing
      #
      # So one of the three would fail open without it, and the other two survive an unstripped grep
      # only because the javadoc happens to spell them without their argument lists — a property of
      # prose, which is exactly what must not be relied on. Reword the comment to say
      # `hasAuthority(ContactLookupToken.AUTHORITY)` and the first becomes load-bearing too. Do not
      # remove the stripper on the strength of the two zeroes.
      - name: The gateway's contact lookup must stay behind the estate's own credential
        run: |
          fail=0
          [ -f .github/checks/strip-comments.awk ] || { echo "::error::.github/checks/strip-comments.awk is missing — this check would read the javadoc that discusses every line it greps for, and pass. See decisions.md D74."; exit 1; }
          chain=gateway/src/main/java/net/jojoaddison/config/InternalApiSecurityConfiguration.java
          resource=gateway/src/main/java/net/jojoaddison/web/rest/InternalCustomerContactResource.java
          for f in "$chain" "$resource"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f does not exist — this check would grep nothing and pass. See decisions.md D74."
              fail=1
            fi
          done
          if [ "$fail" = 0 ]; then
            chain_code=$(awk -f .github/checks/strip-comments.awk "$chain")
            resource_code=$(awk -f .github/checks/strip-comments.awk "$resource")
            if ! printf '%s\n' "$chain_code" | grep -qF 'hasAuthority(ContactLookupToken.AUTHORITY)'; then
              echo "::error file=$chain::the gateway's /internal/** chain no longer requires ContactLookupToken.AUTHORITY. An authority granted by no login is what makes this endpoint reachable by booking and by nothing else; widened to authenticated(), every token the estate accepts reaches the resource and only mayRead stands between a login token and a customer's email address. No test can see this. See decisions.md D74."
              fail=1
            else
              echo "ok   $chain requires the estate's own authority"
            fi
            if ! printf '%s\n' "$chain_code" | grep -qF '.denyAll()'; then
              echo "::error file=$chain::the gateway's /internal/** chain no longer denies everything that is not a GET, so the prefix can acquire a write endpoint without anybody changing this file. It is redundant against the framework's default-deny today, which is why no test can see it go. See decisions.md D74."
              fail=1
            else
              echo "ok   $chain denies everything that is not the one GET"
            fi
            if ! printf '%s\n' "$resource_code" | grep -qF 'ContactLookupToken.mayRead(jwt, login)'; then
              echo "::error file=$resource::the contact lookup no longer checks the token's contract. The filter chain checks the AUTHORITY, and an administrator can grant that to a real account — mayRead is what refuses a person's twenty-four-hour token, and a token naming a second customer. See decisions.md D74."
              fail=1
            else
              echo "ok   $resource checks the token's own contract, not only its authority"
            fi
          fi
          exit "$fail"

      # The SSE fan-out emits from ONE thread into a SERIALIZED sink — decisions.md D79, backlog NEW-37.
      #
      # Two halves of one premise, and neither is visible to any test. `Sinks.many()` is the SAFE spec,
      # which wraps the sink in a SinkManySerialized that DETECTS concurrent access and refuses one
      # caller with FAIL_NON_SERIALIZED — measured on reactor-core 3.8.6: four threads × 200,000 emits
      # gives 561,466 refusals, one thread gives none, and the same sink built through Sinks.unsafe()
      # gives none at 800,000 because the wrapper is the detector. onEstateEvent's failure arm logs
      # that result at DEBUG and no environment here runs at DEBUG, so a second emitting thread would
      # DROP LIVE EVENTS in silence — and not the loss the class javadoc accounts for, which is a
      # subscriber too slow to keep up.
      #
      # WHY A GREP AND NOT A TEST, which is the opposite of D76 §6's answer for the same class. The
      # framework's default concurrency is already 1 (measured off the running KafkaListenerEndpoint-
      # Registry: `concurrency=1 children=1`), so DELETING the annotation changes nothing observable —
      # every test stays green, which is exactly the situation D74 met and answered this way. The pin
      # is what makes the state unreachable rather than merely unlikely: with it in place,
      # `spring.kafka.listener.concurrency=2` in any yml or environment renders `concurrency=1
      # children=1`, because an endpoint's concurrency overrides the factory's
      # (ConcurrentKafkaListenerContainerFactory.initializeContainer). Measured both ways.
      #
      # DELIBERATELY NOT GUARDED HERE: the other premise, one partition per topic. That one is
      # asserted of the BROKER by MarketplaceEventFanoutIT.theBarrierRestsOnOnePartitionPerTopic and
      # is red when wrong, twice measured — the constant raised to 2, and the topics created with 2
      # while the constant said 1 — so a grep would add nothing a test does not do better. Deleting
      # that test is a review obligation, in the same terms D76 §9 recorded for the two methods beside
      # it, and not something a text match should be asked to notice.
      #
      # THE SUBJECT IS DERIVED, NOT NAMED, and that is D52's and D77's lesson rather than tidiness: a
      # file named in a workflow cannot see a SECOND fan-out appear. Services come from `jdl/*.jdl`,
      # the model of record; a subject is any main source whose STRIPPED code both declares a
      # `@KafkaListener` and mentions `Sinks.`. Exactly one exists today, in the gateway. The generated
      # `broker/KafkaConsumer.java` is deliberately not one — it holds a `unicast()` sink and no
      # `@KafkaListener`, being a Spring Cloud Function consumer, and it is the orphaned sample of
      # D59/D62 whose topic has carried nothing in the estate's life.
      #
      # The discriminator is `Sinks.` and NOT `Sinks.many(`, which it was for one draft, and the
      # difference was measured rather than reasoned: a sink switched to `Sinks.unsafe().many()` stops
      # matching `Sinks.many(`, so the file dropped out of the derivation and the check refused with
      # "no subject at all" — fail-closed, and naming the wrong cause, which is this family's own
      # defect one level up. Widened, the same mutation is refused by the sentence about the unsafe
      # spec. Nothing else in the estate is pulled in by the wider match, because the first
      # discriminator is the listener.
      #
      # The requirement is stated so it survives a second subject: pin the concurrency, and do not
      # reach for `Sinks.unsafe()`. The negative half is why the shape generalises — a new fan-out may
      # legitimately want `directAllOrNothing()` or a buffer, and none of that changes the fact that a
      # listener feeding a sink must arrive on one thread.
      #
      # COMMENTS ARE STRIPPED FIRST, and measured rather than assumed, one pattern at a time:
      #   concurrency = "1"    raw 2, stripped 1   stripper LOAD-BEARING
      #   Sinks.unsafe(        raw 0, stripped 0   stripper NOT load-bearing today
      # The first fails open without the stripper: the javadoc argues for the pin and quotes it, so a
      # deleted annotation still matches the prose that explains it — measured, an unstripped grep
      # passes the deletion. The second is a negative assertion, so it cannot be satisfied by prose
      # today and WOULD be the moment somebody writes `Sinks.unsafe()` into a comment explaining why
      # not to; the discovery grep has the same property, which is why it strips too.
      - name: A Kafka listener feeding a reactor sink must stay single-threaded
        run: |
          fail=0
          [ -f .github/checks/strip-comments.awk ] || { echo "::error::.github/checks/strip-comments.awk is missing — this check would read the javadoc that argues for the very line it greps for, and pass. See decisions.md D79."; exit 1; }
          services=$(ls jdl/*.jdl 2>/dev/null | sed -E 's@^jdl/(.+)\.jdl$@\1@' | sort -u)
          if [ -z "$services" ]; then
            echo "::error::no jdl/*.jdl — the service list is derived from the model of record and this check would scan nothing. See decisions.md D79."
            exit 1
          fi
          echo "services from jdl/*.jdl: $(echo $services)"
          subjects=""
          for svc in $services; do
            [ -d "$svc/src/main/java" ] || continue
            for f in $(find "$svc/src/main/java" -name '*.java' -not -path '*/target/*' | sort); do
              code=$(awk -f .github/checks/strip-comments.awk "$f")
              printf '%s\n' "$code" | grep -qF '@KafkaListener' || continue
              printf '%s\n' "$code" | grep -qF 'Sinks.' || continue
              subjects="$subjects $f"
            done
          done
          if [ -z "$subjects" ]; then
            echo "::error::no main source declares a @KafkaListener beside a Sinks.many() sink. The gateway's MarketplaceEventFanout is one, so either it has been renamed out of this derivation or the stripper is eating the code — either way this check has no subject and must not report success. See decisions.md D79."
            exit 1
          fi
          echo "listeners feeding a reactor sink:$subjects"
          for f in $subjects; do
            code=$(awk -f .github/checks/strip-comments.awk "$f")
            if ! printf '%s\n' "$code" | grep -qF 'concurrency = "1"'; then
              echo "::error file=$f::this @KafkaListener feeds a reactor sink and no longer pins concurrency = \"1\". Sinks.many() is the SERIALIZED spec, so a second container thread answers FAIL_NON_SERIALIZED and the emission is DROPPED — in the gateway's fan-out that is a silently lost live event, and not the loss its javadoc accounts for. The framework's default is also 1, so no test in this repository can see this line go. See decisions.md D79."
              fail=1
            else
              echo "ok   $f pins its listener at one consumer thread"
            fi
            if printf '%s\n' "$code" | grep -qF 'Sinks.unsafe('; then
              echo "::error file=$f::this sink is built through Sinks.unsafe(), which removes the SinkManySerialized wrapper that detects concurrent access — measured, 800,000 concurrent emits through the unsafe spec and not one FAIL_NON_SERIALIZED. Concurrent access then stops being refused and becomes an unreported Reactive Streams 1.3 violation on a live client's stream. Single-threaded today, so no test can see this either. See decisions.md D79."
              fail=1
            else
              echo "ok   $f builds its sink through the spec that refuses concurrent access"
            fi
          done
          exit "$fail"

      # A filter chain's precedence must be declared where Spring can READ it — decisions.md D77.
      # That is the @Bean METHOD and never the @Configuration class: Spring hands the comparator the
      # factory method and the bean type as order sources and never the declaring class, so
      # findAnnotationOnBean answers null for a class-level annotation. WP-13 found that on the
      # gateway; D77 RE-MEASURED it in the servlet stack rather than porting it (D52's rule, that a
      # data answer of this kind never transfers). It held, both ways round: inverting catalog's
      # class-level @Order to LOWEST_PRECEDENCE moved nothing at all, and an @Order on the generated
      # chain's @Bean method moved that chain to the front immediately.
      #
      # WHAT A MIS-ORDERING COSTS IS TOTAL, because the generated SecurityConfiguration declares no
      # securityMatcher in any of the four servlet services and therefore claims EVERY request — its
      # /api/**, /v3/api-docs/** and /management/** entries are authorizeHttpRequests rules, which
      # narrow authorization and not the chain. With it in front, catalog's /internal/** lookup and
      # every anonymous marketplace read are 401 and booking's provider callbacks are 401 at booking
      # itself. What was holding the order up was component-scan order: I before M before S in
      # catalog, P before S in booking.
      #
      # THE SERVICE LIST IS DERIVED from jdl/*.jdl, and that is the whole reason this step exists
      # beside the tests. NEW-34 named catalog's one file and said it was "the one place" the
      # gateway's correction had not reached; there were THREE — catalog's two chains and booking's
      # one — because the item's list was trusted rather than derived, which is this repository's
      # oldest failure recurring inside the description of itself. The two FilterChainPrecedenceITs
      # and the gateway's two PermitITs guard the annotation's PRESENCE in the four services that
      # have a hand-written chain today; nothing but a derived sweep can see a FIFTH chain dropped
      # into messaging or payout with the annotation in the wrong place, in a service that has never
      # had one and has no test written to be red about it.
      #
      # PRESENCE IS DELIBERATELY NOT ASSERTED HERE, and the division of labour is stated because the
      # error message below does not imply it. "Must carry an @Order on the method" is not derivable
      # from source: the gateway's generated chain has a securityMatcher AND correctly has no @Order,
      # while catalog's has neither, so no property of the file separates a chain that must declare a
      # precedence from one that must not. The ITs cover deletion; the framework covers the rest —
      # WebSecurityFilterChainValidator throws UnreachableFilterChainException and the context refuses
      # to start when an any-request chain precedes a narrower one, which is measured in D77 §3.
      #
      # COMMENTS ARE STRIPPED FIRST and here that is a requirement rather than a precaution: every
      # one of these files now carries a javadoc paragraph explaining this very arrangement, and each
      # quotes `{@code @Order}` in prose ABOVE the class declaration. Measured — unstripped, this
      # check reports a class-level @Order in six of the seven chain-declaring files, including the
      # three it was just corrected on, so it would fail closed on a correct estate and be reverted.
      #
      # IT REACHES LESS FAR THAN IT READS, IN ONE WAY WORTH KNOWING — the same family as the CRUD
      # gate's documented "counts, does not attribute", and stated rather than fixed. The annotation
      # must be ON ITS OWN LINE to be seen: `@Configuration @Order(5)` on one line does not match
      # `^[[:space:]]*@Order[[:space:]]*\(` and passes as clean. That is fail-OPEN, and it is only
      # consequential in messaging and payout, where no FilterChainPrecedenceIT stands behind it.
      # The converse fails CLOSED and is therefore safe: an @Order on the class-declaration line
      # itself (`@Order(5) public class X {`) makes `decl` that same line, so the annotation is not
      # "above" it, and the file is reported as having no class declaration this check can find —
      # which exits 1. Widening the expression to catch a shared line would mean matching @Order
      # anywhere before the class, which the javadoc quotes on purpose; prettier keeps annotations on
      # their own lines in this repository, so the shape this misses is one nobody writes by accident.
      # Both branches were watched, not reasoned from the expression.
      - name: A filter chain's precedence may not be declared where Spring cannot read it
        run: |
          fail=0
          [ -f .github/checks/strip-comments.awk ] || { echo "::error::.github/checks/strip-comments.awk is missing — every chain would strip to nothing, no class declaration would be found, and this check would report an error it cannot attribute or pass having read nothing. See decisions.md D77."; exit 1; }
          jdls=$(ls jdl/*.jdl 2>/dev/null || true)
          if [ -z "$jdls" ]; then
            echo "::error::jdl/*.jdl matched nothing — this check would scan no service and pass. See decisions.md D77."
            exit 1
          fi
          total=0
          for jdl in $jdls; do
            svc=$(basename "$jdl" .jdl)
            dir="$svc/src/main/java/net/jojoaddison/config"
            if [ ! -d "$dir" ]; then
              echo "::error file=$jdl::$dir does not exist, so no filter chain in $svc can be checked and this step is blind to that service. See decisions.md D77."
              fail=1
              continue
            fi
            found=0
            for f in "$dir"/*.java; do
              code=$(awk -f .github/checks/strip-comments.awk "$f")
              printf '%s\n' "$code" | grep -qE 'Security(Web)?FilterChain +[A-Za-z0-9_]+ *\(' || continue
              found=$((found + 1))
              total=$((total + 1))
              # Line numbering survives the stripper (one blank line out per comment line in), so a
              # line number from the stripped text is the line number in the file.
              decl=$(printf '%s\n' "$code" | grep -nE '^[[:space:]]*(public |final |abstract |sealed |non-sealed )*class +[A-Za-z0-9_]+' | head -1 | cut -d: -f1)
              if [ -z "$decl" ]; then
                echo "::error file=$f::declares a filter chain and no class declaration this check can find, so it cannot tell a class-level @Order from a method-level one. See decisions.md D77."
                fail=1
                continue
              fi
              # The LINE NUMBER of the offending annotation, not a count and not the class
              # declaration's line — the message tells the author to move a specific line, so it has
              # to say which one. `head -n 0` when the class is on line 1 emits nothing, which is the
              # right answer rather than an error.
              early=$(printf '%s\n' "$code" | head -n "$((decl - 1))" | grep -nE '^[[:space:]]*@Order[[:space:]]*\(' | cut -d: -f1 | head -1)
              if [ -n "$early" ]; then
                echo "::error file=$f,line=$early::this class declares a SecurityFilterChain bean and carries @Order on the @Configuration CLASS (line $early, above the class declaration on line $decl), where Spring never reads it — findAnnotationOnBean answers null and the chain's position is component-scan order, which a rename changes. Move it onto the @Bean method. See decisions.md D77."
                fail=1
              else
                echo "ok   $f declares no class-level @Order"
              fi
            done
            if [ "$found" = 0 ]; then
              echo "::error file=$jdl::no file in $dir declares a SecurityFilterChain or SecurityWebFilterChain bean, so this check scanned nothing in $svc. Every service in this estate has at least the generated chain — if the derivation no longer matches it, this step has gone blind rather than clean. See decisions.md D77."
              fail=1
            fi
          done
          echo "scanned $total chain-declaring files across $(echo "$jdls" | wc -w) services"
          exit "$fail"

      # The check above is the only thing in this repository that can see a class-level @Order on a
      # filter chain in messaging or payout, which have never had a hand-written chain and have no
      # test written to be red about one. So it gets driven rather than trusted — and it needed to be:
      # its FIRST version passed while reporting `ok` for all three of the chains it had just been
      # written to guard, because the shared stripper truncated each of them at its own path pattern.
      # A check that cannot see its own subject reports success. Case 0 there asserts the COUNT for
      # that reason, not just the exit status.
      - name: …and that check must fail on each of the six states it exists to refuse
        run: .github/checks/filter-chain-precedence-test.sh

      # ContactLookupToken.java is copied byte-identically into booking and the gateway — the FIFTH
      # verbatim-copy family, decisions.md D74. Booking mints; the gateway accepts and enforces.
      #
      # There is no shared library here (five standalone Maven projects, no aggregator pom), and a
      # claim name, a subject or a lifetime that drifts by one character between the minting service
      # and the accepting one is a 403 on the path where a customer is trying to pay — which reads as
      # a permissions problem, in a service nobody would open, on an estate where no payment provider
      # has ever been enabled.
      #
      # THE REFERENCE IS THE GATEWAY'S, deliberately: it is the copy where the contract is enforced
      # rather than merely promised, so a difference is reported as booking having drifted from the
      # acceptor. The family is DERIVED with `find` rather than listed, exactly as the runtime-calendar
      # diff is (D52's review, the sixth fail-open in that family): a third copy dropped into catalog
      # or messaging the day one of them needs a contact lookup is then checked the moment it exists,
      # and an unchecked copy cannot be created by copying the file somewhere new. A family of ONE is
      # refused — one copy means the acceptor or the minter has been deleted.
      - name: The contact-lookup token contract must be identical in every service that holds one
        run: |
          fail=0
          mapfile -t copies < <(find . -path '*/src/main/java/net/jojoaddison/security/ContactLookupToken.java' | sort)
          reference=gateway/src/main/java/net/jojoaddison/security/ContactLookupToken.java
          echo "found ${#copies[@]} copies: ${copies[*]}"
          if [ "${#copies[@]}" -lt 2 ]; then
            echo "::error::expected at least two copies of ContactLookupToken.java — booking mints the token and the gateway accepts it, so one copy means one of the two halves is gone. See decisions.md D74."
            exit 1
          fi
          if [ ! -f "$reference" ]; then
            echo "::error::$reference is missing — it is the accepting side and the reference this family is diffed against. See decisions.md D74."
            exit 1
          fi
          for copy in "${copies[@]}"; do
            copy=${copy#./}
            [ "$copy" = "$reference" ] && continue
            if ! diff -u "$reference" "$copy"; then
              echo "::error file=$copy::ContactLookupToken.java differs from the gateway's copy. The minting service and the accepting one must agree on the subject, the claim, the authority and the lifetime, comments included — a one-character drift is a 403 on the payment path. See decisions.md D74."
              fail=1
            else
              echo "ok   $copy — identical to $reference"
            fi
          done
          exit "$fail"

      # The dev estate's topic prefix is written TWICE: the compose file configures the apps with it
      # and deploy-dev.sh creates the topics with it (decisions.md D29). They must agree.
      #
      # Disagreeing is silent in the worst way. The apps subscribe to topics nobody publishes to and
      # the publisher creates topics nobody reads; every container is healthy, every health check is
      # green, and the only symptom is that nothing ever happens — which reads as a broken consumer
      # rather than as two halves of one variable drifting apart.
      - name: The dev topic prefix must be the same in the compose file and the script
        run: |
          compose=$(grep -oE 'HEALTHCONNECT_TOPICS_PREFIX: \$\{HC_TOPIC_PREFIX-[^}]*\}' deploy/docker/docker-compose.dev.yml | sed -E 's/.*HC_TOPIC_PREFIX-([^}]*)\}/\1/')
          script=$(grep -oE '^TOPIC_PREFIX="\$\{HC_TOPIC_PREFIX-[^}]*\}"' deploy/deploy-dev.sh | sed -E 's/.*HC_TOPIC_PREFIX-([^}]*)\}"/\1/')
          echo "compose='$compose' script='$script'"
          test -n "$compose" && test -n "$script" && test "$compose" = "$script"

      # Every cross-service base URL a service READS must be SET by every compose file that runs it.
      #
      # booking's CatalogClient defaults to http://healthconnectcatalog, which resolves in no
      # environment. HEALTHCONNECT_CATALOG_BASE_URL was unset in all three compose files, so
      # POST /api/bookings failed closed with 503 everywhere from the moment D22 introduced the
      # client — and nothing was red: the ITs mock CatalogClient, health checks only exercise reads,
      # and the one script that would have caught it needs minted tokens. Found by driving a real
      # booking from the prototype, after the images had already shipped to quality.
      #
      # WHAT IT DOES NOT SEE, said here so nobody credits it with more reach — D74's review, on the
      # occasion of the list growing to five. It greps each FILE for the variable name and never asks
      # which SERVICE carries it: HEALTHCONNECT_GATEWAY_BASE_URL set on catalog's environment block
      # instead of booking's passes, and booking then falls back to `http://healthconnectgateway`,
      # which resolves nowhere. Nor does it check the VALUE — a URL naming the wrong container passes.
      # That is the shape this check has always had (four variables' worth of it), and it is left
      # alone rather than deepened here: reading the merged per-service environment means
      # `docker compose config`, which the pepper check already does and which costs a docker on the
      # runner. What stands behind it for this fifth variable is that booking fails CLOSED — a 502 and
      # no booking, with an ERROR naming the base URL by name since the review — rather than guessing
      # an address.
      - name: Cross-service base URLs must be set wherever the service runs
        run: |
          fail=0
          for f in quality/compose.yml deploy/docker/docker-compose.dev.yml deploy/docker/docker-compose.prod.yml; do
            for v in HEALTHCONNECT_CATALOG_BASE_URL HEALTHCONNECT_PAYOUT_BASE_URL HEALTHCONNECT_BOOKING_BASE_URL \
                     HEALTHCONNECT_MESSAGING_BASE_URL HEALTHCONNECT_GATEWAY_BASE_URL; do
              if ! grep -q "$v" "$f"; then
                echo "::error file=$f::$v is not set — the service falls back to a hostname that resolves nowhere, and the call fails closed at run time with nothing red in CI."
                fail=1
              fi
            done
            [ "$fail" = 0 ] && echo "ok   $f"
          done
          exit "$fail"

      # The founding brokerage terms, and the one check that guards them — decisions.md D57, NEW-18.
      #
      # brokerage_config was empty on every estate that does not seed, which is production. Nothing
      # was red: BookingEventConsumer retried the first booking.completed for ever inside its own log,
      # BrokerageResource answered 503 on every receipt, booking stayed green, and the catalogue smoke
      # test passed. BrokerageBootstrap writes the founding row now, and this asserts the two things
      # about it that no test in payout can see.
      #
      # ONE: the five values are settable wherever payout runs. They are optional — the defaults in
      # FoundingTerms are the prototype's own, so an estate that sets none is priced correctly — which
      # is exactly what makes a missing compose line invisible: `HC_BROKERAGE_COMMISSION_RATE=0.15` in
      # secrets.env would be silently ignored, and the estate would price at 12% while its operator
      # believed otherwise. That is D46's finding about documented-but-uncarried variables, on the one
      # variable that decides what this platform charges. The property name is DERIVED from the
      # variable name rather than listed twice, so the two halves cannot drift apart here.
      #
      # TWO: deploy-prod.sh still asks payout whether it can price anything, AND the surface it asks
      # can still answer. The probe is the whole preflight NEW-18 asked for, it is a few lines inside a
      # function nobody runs locally, and deleting it is invisible — every other gate in that script
      # would still pass on an estate with no commission rate. Matched at its call site with comment
      # lines removed and backslash continuations joined, not as prose: this file's own history is
      # eight fail-opens where a comment naming a call satisfied the check guarding it.
      #
      # The three parts of that probe are checked together because it fails CLOSED, and a smoke test
      # that fails on a healthy estate rolls it back (D49) — so "the endpoint is missing" must not be
      # reachable from a build that passed CI. The contributor is a @Component in a new file, which a
      # regeneration leaves alone; `info` in the exposure list is GENERATED configuration, which a
      # regeneration rewrites, and without it /management/info is 404 and every deploy fails.
      #
      # The probe read /management/health until a real prod boot against an empty database showed the
      # aggregate DOWN on a correct estate, because `binders.kafka` is down with no broker. That would
      # have rolled back a healthy deploy over a broker blip. Hence a single fact on /management/info,
      # and hence this check naming the endpoint rather than only the payout container.
      - name: The founding brokerage terms must be settable, and the deploy must still ask about them
        run: |
          fail=0
          yml=payout/src/main/resources/config/application.yml
          [ -f "$yml" ] || { echo "::error::$yml is missing — this check would match nothing and pass. See decisions.md D57."; exit 1; }
          for v in HC_BROKERAGE_COMMISSION_RATE HC_BROKERAGE_PAYOUT_LAG_DAYS HC_BROKERAGE_FREE_CANCELLATION_HOURS \
                   HC_BROKERAGE_LATE_CANCELLATION_PCT HC_BROKERAGE_CURRENCY; do
            # commission-rate from HC_BROKERAGE_COMMISSION_RATE. Derived, so the two halves of this
            # check cannot name different things.
            prop=$(printf '%s' "${v#HC_BROKERAGE_}" | tr 'A-Z_' 'a-z-')
            if ! grep -q "$prop: \${$v:" "$yml"; then
              echo "::error file=$yml::healthconnect.brokerage.founding.$prop does not read \$$v — the compose files carry a variable that binds to nothing, and the founding rate an operator sets is silently ignored. See decisions.md D57."
              fail=1
            fi
            for f in quality/compose.yml deploy/docker/docker-compose.dev.yml deploy/docker/docker-compose.prod.yml; do
              [ -f "$f" ] || { echo "::error::$f is missing — this check would match nothing and pass."; fail=1; continue; }
              if ! grep -q "$v" "$f"; then
                echo "::error file=$f::$v is not passed to payout — compose does not forward a host variable it is not told about, so setting the founding rate on that estate would do nothing at all and nothing would say so. See decisions.md D46 and D57."
                fail=1
              fi
            done
          done
          contributor=payout/src/main/java/net/jojoaddison/service/BrokerageTermsInfoContributor.java
          [ -f "$contributor" ] || { echo "::error::$contributor is missing — payout would publish no answer for the deploy to read, and smoke_test fails closed, so every production deploy would fail. See decisions.md D57."; fail=1; }
          # `info` is GENERATED configuration and a regeneration rewrites this block. Without it the
          # endpoint is 404, the probe below cannot get an answer, and a perfectly healthy deploy rolls
          # back — which is the outcome the probe exists to avoid, arriving through the probe.
          if ! sed -n '/exposure:/,/endpoint:/p' "$yml" | grep -qE '^ +- info$'; then
            echo "::error file=$yml::payout no longer exposes the 'info' actuator endpoint, so deploy-prod.sh's brokerage probe would 404 and fail every deploy — including of a completely healthy estate. See decisions.md D57."
            fail=1
          fi
          script=deploy/deploy-prod.sh
          [ -f "$script" ] || { echo "::error::$script is missing — this check would match nothing and pass."; exit 1; }
          # Comment lines dropped, then backslash-continued lines JOINED — the probe is written across
          # two of them, so a line-at-a-time grep for the pair matches nothing and this check fails on
          # a script that is perfectly correct. Found by running it, which is the only way this class
          # of defect has ever been found here.
          if ! grep -v '^[[:space:]]*#' "$script" | sed -e ':a' -e '/\\$/N; s/\\\n//; ta' \
               | grep -q 'compose_name payout.*management/info'; then
            echo "::error file=$script::smoke_test no longer asks payout whether it holds brokerage terms in force. An estate that cannot price a single booking would deploy, pass every gate, and answer 503 to every receipt — silently, which is the whole of NEW-18. See decisions.md D57."
            fail=1
          fi
          if ! grep -v '^[[:space:]]*#' "$script" | grep -q 'termsInForce'; then
            echo "::error file=$script::smoke_test asks payout for /management/info but no longer reads termsInForce out of it, so it would pass on any answer at all. See decisions.md D57."
            fail=1
          fi
          [ "$fail" = 0 ] && echo "ok   the founding terms are settable in all three estates, and the deploy asks about them"
          exit "$fail"

      # The erased-subject alias is derived by THREE copies of the same file, one per service, because
      # there is no shared library here — five standalone Maven projects with no aggregator pom.
      #
      # All three must produce the same alias for the same person: messaging's erased_subject register
      # is keyed by it, and reconciling a redacted booking against a payout ledger row depends on
      # booking and messaging agreeing on the string. Three copy-pasted implementations drifting apart
      # is silent in the worst way — each service keeps working, each redacts its own rows correctly,
      # and only a cross-service lookup comes back empty, months later, with nothing having failed at
      # the time. That is exactly how the three static methods this replaced were living.
      #
      # Byte-identical, not merely equivalent: the file carries the reasoning as well as the code, and
      # a comment that is true in one service and stale in another is its own defect. The known-answer
      # test is checked the same way and pins the derivation itself — see SubjectPseudonymUnitTest.
      #
      # ErasureFanoutToken is here for the same reason and a different failure — decisions.md D38. It
      # states the contract of the token booking mints so that one operator action erases a customer
      # in all three: the claim naming the customer, the subject, and the thirty-second lifetime.
      # Booking writes those claims and catalog and messaging check them, so a claim name that drifts
      # by one character turns every fan-out into a 403 that reads as a permissions problem in the
      # service that is refusing rather than as a typo in the service that is asking. Booking's copy
      # uses only the constants and its check method is unreachable there on purpose, so that all
      # three files can be compared as bytes rather than as behaviour.
      - name: The shared erasure files must be identical in all three services
        run: |
          fail=0
          for f in src/main/java/net/jojoaddison/service/SubjectPseudonym.java \
                   src/test/java/net/jojoaddison/service/SubjectPseudonymUnitTest.java \
                   src/main/java/net/jojoaddison/security/ErasureFanoutToken.java; do
            if ! diff -u "booking/$f" "catalog/$f" || ! diff -u "booking/$f" "messaging/$f"; then
              echo "::error::$f differs between services — booking, catalog and messaging must agree. See decisions.md D35 and D38."
              fail=1
            else
              echo "ok   $f — identical in all three"
            fi
          done
          exit "$fail"

      # The seed calendar is the same arrangement, one service wider — decisions.md D48.
      #
      # Every seeded date in catalog, booking, messaging and payout is moved by ONE number per
      # service, `today - $meta.demoToday`, and the four have to arrive at the same number. Nothing
      # joins them and nothing can: each service owns its own database INSTANCE, so payout's earnings
      # aggregates read payout's own Ledger and nothing else, and booking never asks catalog about a
      # slot. The agreement is enforced by no query and shows up only on a screen — the professional's
      # overview puts sessions read from booking beside earnings read from payout, and a profile shows
      # catalog's availability_slot.slot_date beside the scheduled_date booking holds. A uniform offset
      # in all four is what anchor-dates=false MEANS and is harmless. A one-day disagreement between
      # two of them is corruption nothing here detects, because no count moves and no query spans the
      # pair — which is why fixing one service alone would have been worse than fixing none.
      #
      # So SeedCalendar.java and its known-answer test are copied byte-identically into all four and
      # diffed here. Same reason as SubjectPseudonym: no shared library, and a constant duplicated
      # with nothing comparing the copies is how the next divergence arrives in silence.
      - name: The seed calendar must be identical in all four seeded services
        run: |
          fail=0
          for f in src/main/java/net/jojoaddison/service/seed/SeedCalendar.java \
                   src/test/java/net/jojoaddison/service/seed/SeedCalendarUnitTest.java; do
            ok=1
            for svc in booking messaging payout; do
              diff -u "catalog/$f" "$svc/$f" || ok=0
            done
            if [ "$ok" = 0 ]; then
              echo "::error::$f differs between services — catalog, booking, messaging and payout must agree, or their seeded dates stop lining up. See decisions.md D48."
              fail=1
            else
              echo "ok   $f — identical in all four"
            fi
          done
          exit "$fail"

      # …and nothing in a seed package may read the clock itself.
      #
      # The defect this replaced was a LocalDate.now() in each of the four load() methods — one line,
      # four times, taking the JVM default zone. SeedCalendar is now the only place in any of them
      # that reads the time at all, which is what makes this a grep rather than an argument.
      #
      # It matters more than it looks. Re-reading the clock is not only a zone question: the log line
      # that explains a shift derives the day from the shift for exactly this reason, because two
      # reads either side of Accra midnight print a date the seed was never loaded against.
      #
      # THREE THINGS THE FIRST VERSION OF THIS CHECK GOT WRONG, each found by the NEW-9 review and
      # each a way of failing open — which is the only way a check like this can fail:
      #
      #   1. It banned the TYPE that reads the clock and not the ZONE that interprets one. So
      #      `ChronoUnit.DAYS.between(demoToday, LocalDate.ofInstant(Instant.now(), ZoneId.systemDefault()))`
      #      passed — and that is, character for character, the stand-in D48 quotes as reproducing the
      #      defect. The zone forms are in the list now. Instant.now() ALONE is still legal and still
      #      deliberately so (below); Instant.now() plus an implicit zone is not.
      #   2. The `^[^/*]*` anchor could not cross a `/` or a `*`, so any earlier division, comment
      #      marker inside a string, or multiplication hid the rest of the line. `long pct = amount /
      #      100; LocalDate d = LocalDate.now();` was invisible, and PayoutSeeder does commission
      #      arithmetic. Comment lines are now DROPPED from a full-line match rather than the match
      #      being anchored past them: the filter keeps grep -n's original line numbers and errs
      #      towards reporting, not towards silence.
      #   3. It named the four *Seeder.java files. SeedDataLoader is in the same package, is the
      #      ApplicationRunner that calls load(SeedFile, boolean), and was not covered — and D48's own
      #      named future work (a shared HC_SEED_TODAY) would compute its LocalDate exactly there. So
      #      the check scans the whole package and exempts only SeedCalendar, which is the one file
      #      that is SUPPOSED to read a clock.
      #
      # Instant.now() is deliberately NOT in this list. An Instant carries no calendar, so on its own
      # it cannot be read in the wrong one — CatalogSeeder stamps Favourite.addedAt with one, which is
      # the D21 "when did this happen" category and not a date to be shifted at all (the seed's
      # `favourites` are bare professional refs carrying no date to shift). What is banned is the types
      # that need a zone to mean anything, and every spelling of "and take the JVM's".
      - name: No seed package may read the clock directly
        run: |
          fail=0
          for svc in catalog booking messaging payout; do
            dir="$svc/src/main/java/net/jojoaddison/service/seed"
            # A moved or renamed package would leave the glob unexpanded, grep would error on a
            # literal path, and every file would report "ok" — this check passing on a tree it never
            # looked at is the same failure it was widened to stop. So the directory and the count of
            # files actually scanned are both asserted.
            if [ ! -d "$dir" ]; then
              echo "::error::$dir does not exist — this check would scan nothing and pass. See decisions.md D48."
              fail=1
              continue
            fi
            scanned=0
            for f in "$dir"/*.java; do
              # SeedCalendar is the one file that may: it holds SEED_ZONE and is the seam the tests
              # inject a Clock through. Everything else in the package goes through it.
              case "$f" in */SeedCalendar.java) continue ;; esac
              scanned=$((scanned + 1))
              # Comments may name LocalDate.now() — they explain why it is not there. Code may not.
              # Filtering AFTER the match keeps the real line numbers, and a line that is not a
              # comment survives the filter, so an unusual layout over-reports instead of passing.
              if grep -nE '(LocalDate|LocalDateTime|LocalTime|ZonedDateTime|OffsetDateTime|Year|YearMonth)\.now\(|Clock\.system|ZoneId\.systemDefault|TimeZone\.getDefault|systemDefaultZone' "$f" \
                   | grep -vE '^[0-9]+:[[:space:]]*(//|\*|/\*)'; then
                echo "::error file=$f::a seed class reads the clock or the JVM's zone directly — the shift belongs to SeedCalendar, in the estate's calendar, or the four services stop agreeing on what day it is. See decisions.md D48."
                fail=1
              else
                echo "ok   $f"
              fi
            done
            if [ "$scanned" -eq 0 ]; then
              echo "::error::$dir matched no scannable file — the seeder has moved and this check is now blind. See decisions.md D48."
              fail=1
            fi
          done
          exit "$fail"

      # The RUNTIME calendar is the same arrangement again, three services wide — decisions.md D51,
      # widened to catalog by D52.
      #
      # SeedCalendar says what day it is for the seed. MarketCalendar says what day it is for
      # everything else: payout's ledger.earned_on on all three paths that write it, the "today" its
      # month-to-date slice is bounded by, booking's default first day of the schedule window, and
      # catalog's review.published_on plus its three defaulted availability windows.
      # Copied byte-identically into payout, booking and catalog and diffed here, same reason as
      # SubjectPseudonym and SeedCalendar — no shared library, and a constant duplicated with nothing
      # comparing the copies is how the next divergence arrives in silence.
      #
      # SeedAndMarketCalendarsAgreeUnitTest goes with them and is not merely a third copy. Both diffs
      # stay green while one FAMILY says Africa/Accra and the other says UTC — that is a service whose
      # seeded rows and whose live rows are dated in two calendars, which is NEW-10 itself and is what
      # this estate actually had for a week. Neither this check nor the one above can see it; the test
      # can, because it compares the two constants in one build. It matters most in the two services
      # where the two families write the SAME COLUMN: ledger.earned_on in payout, review.published_on
      # in catalog.
      #
      # payout is the reference copy and every other service is compared against it, rather than the
      # copies being compared pairwise. Three services is where "A matches B and B matches C" starts
      # being a longer argument than it is worth, and a missing file fails CLOSED here: diff exits 2
      # on one, which `! diff` catches exactly as it catches a difference.
      #
      # THE SERVICE LIST IS DERIVED, NEVER ENUMERATED — and that is the SIXTH fail-open found in this
      # family, caught by D52's review. The scan below exempts */MarketCalendar.java in EVERY service;
      # this step used to diff a hard-coded `booking catalog`. So a MarketCalendar.java dropped into
      # messaging or gateway was exempt from the scan, absent from the diff, and free to say
      # MARKET_ZONE = UTC and return LocalDate.now(). Verified before the fix: both steps stayed green
      # on exactly that file, reporting `ok messaging — 87 files scanned`.
      #
      # That is not hypothetical. The documented move, the day messaging or gateway acquires a runtime
      # date, is to copy MarketCalendar there — which is precisely the act that would have created an
      # unchecked copy. Deriving the list means a fourth copy is diffed the moment it exists, with no
      # edit to this file, and a rogue one fails on its first CI run.
      #
      # THE TWO STEPS ARE COUPLED BY THIS, and the coupling is what makes the scan's exemption sound:
      # the scan may skip any file named MarketCalendar.java only because this step proves every such
      # file is byte-identical to payout's, which is the one copy the tests actually pin.
      - name: The runtime calendar must be identical in every service that keeps one
        run: |
          fail=0
          # Every service holding a runtime calendar, discovered rather than listed. `target` is
          # excluded so build output cannot invent a service.
          services=$(find . -path '*/src/main/java/net/jojoaddison/service/MarketCalendar.java' \
                       -not -path '*/target/*' | sed -E 's@^\./([^/]+)/.*@\1@' | sort -u)
          if [ -z "$services" ]; then
            echo "::error::no service holds a MarketCalendar.java — this check would compare nothing and pass. See decisions.md D51/D52."
            exit 1
          fi
          echo "services holding a runtime calendar: $(echo $services)"
          # payout is the reference every other copy is compared against, so its absence is fatal
          # rather than merely a smaller comparison.
          if ! echo "$services" | grep -qx payout; then
            echo "::error::payout holds no MarketCalendar.java, and it is the reference copy. See decisions.md D51/D52."
            exit 1
          fi
          # A family of one is not being compared with anything. Three hold one today (D52); the
          # floor is two, so removing a copy is a decision somebody has to take deliberately.
          count=$(echo "$services" | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "::error::only $count service holds a MarketCalendar.java — a copied file with no copy to compare against is not being checked. See decisions.md D51/D52."
            fail=1
          fi
          for svc in $services; do
            [ "$svc" = payout ] && continue
            for f in src/main/java/net/jojoaddison/service/MarketCalendar.java \
                     src/test/java/net/jojoaddison/service/MarketCalendarUnitTest.java \
                     src/test/java/net/jojoaddison/service/seed/SeedAndMarketCalendarsAgreeUnitTest.java; do
              # Named explicitly rather than left to diff's exit 2, so "you copied the class and not
              # its tests" reads as itself instead of as a difference.
              if [ ! -f "$svc/$f" ]; then
                echo "::error::$svc holds a MarketCalendar but not $f — the class travels with its tests. See decisions.md D51/D52."
                fail=1
                continue
              fi
              if ! diff -u "payout/$f" "$svc/$f"; then
                echo "::error::$f differs between services — payout and $svc must agree on what day it is. See decisions.md D51/D52."
                fail=1
              else
                echo "ok   $f — payout and $svc identical"
              fi
            done
          done
          exit "$fail"

      # THE FOURTH VERBATIM-COPY FAMILY IS NOT HERE, deliberately — look for it in "No service may
      # bind the generated Kafka sample supplier" further down. `KafkaSampleSupplierIsNotPolledIT` is
      # copied byte-identically into every service declaring `messageBroker kafka` and diffed inside
      # that step, because the step already derives exactly that service list from `jdl/*.jdl` and
      # duplicating the derivation here is how the two would eventually disagree. Named here so that
      # somebody maintaining the copy families finds all four from one place. See decisions.md D62.

      # …and nothing anywhere in the five services may read a date from an implicit zone.
      #
      # This is D48's seed-package grep widened from a package to five whole services, because NEW-10
      # was five of these outside any seed package: three writes to ledger.earned_on and two rendered
      # "today"s in payout, plus one rendered window default in booking. All five read LocalDate.now(),
      # which takes the JVM's zone — correct in a container with no TZ, correct in CI, and wrong on the
      # workstation this was written on for two hours every summer evening. A stored date that is wrong
      # is wrong for ever, and nothing about it looks wrong: the row is ordinary, no count moves, and
      # lifetime gross — the one figure anybody has an independent copy of — does not budge.
      #
      # WHICH SERVICES, AND WHY — the whole list is argued, not just the exclusion.
      #
      #   payout, booking      NEW-10's six sites. Clean by construction after D51.
      #   messaging, gateway   Clean TODAY and always have been: messaging matches only its own
      #                        exempt SeedCalendar, gateway matches nothing at all. Adding them costs
      #                        nothing and locks the property into two more services BEFORE somebody
      #                        writes the first one — which is the only moment a check like this is
      #                        free. Not scanning a clean service is how catalog's four got in.
      #   catalog              IN since D52, and that is the whole of NEW-12's CI half. It was out
      #                        while its four were open — ReviewWriteResource:115 (which STORED
      #                        review.published_on), MarketplaceResource:132 and ProWorkspaceResource
      #                        twice — because adding it with those three files exempted would have
      #                        produced a check that claims to cover the service while being blind in
      #                        exactly the files most likely to acquire the next one. All four now go
      #                        through MarketCalendar, so no exemption was needed and none was added:
      #                        the two calendars below are the only files skipped, in every service.
      #
      # Every service in the repository is now scanned and no file anywhere carries a per-file
      # exemption. That is the state to keep it in — the moment one file is excused, this check stops
      # being readable as "the estate does not do this" and becomes "the estate does not do this
      # except where it does".
      #
      # The regex inherits D48's three review fixes: it bans the ZONE that interprets a clock and not
      # merely the TYPE that reads one, so LocalDate.ofInstant(Instant.now(), ZoneId.systemDefault())
      # does not sail through; comments are removed rather than the match being anchored past them, so
      # a division or a slash in a log string cannot hide the rest of the line; and directories are
      # scanned with the count of files asserted, so a moved package fails rather than reporting ok on
      # nothing.
      #
      # A FOURTH FAIL-OPEN, inherited from D48 and closed here (D51's review). Dropping any line whose
      # first non-space characters were `//`, `*` or `/*` threw away a line that STARTS with a block
      # comment and then carries code:
      #
      #     /* a note */ LocalDate d = LocalDate.now();     <- passed, silently
      #
      # Same species as the `^[^/*]*` anchor D48 fixed, and the stated property ("a slash cannot hide
      # the rest of the line") was simply not the property the code had. Comments are now STRIPPED —
      # sed removes same-line /* … */ and everything after // — and only then is the line matched. sed
      # is 1:1 on lines so grep -n still reports real line numbers, and the ORIGINAL line is printed
      # from the file rather than the stripped one, so the error shows what is actually written there.
      # The one remaining filter is a leading `*`, which is a javadoc continuation line: those cannot
      # carry code, and this file's own javadoc names LocalDate.now() several times explaining why it
      # is not used.
      #
      # TWO KNOWN GAPS, named rather than contorted around. Both are empty in the tree today.
      #   - grep is line-based, so `LocalDate\n    .now()` split across two lines is invisible.
      #   - Calendar.getInstance() and new Date() are the legacy spelling of the same defect and are
      #     not in the list; nothing in this estate uses either.
      #
      # SQL COUNTS TOO, and that is the point of current_date / current_timestamp / localtimestamp /
      # now()::. A clock read inside a @Query is evaluated in PostgreSQL's session TimeZone, which the
      # JDBC driver sets from the JVM default — the identical defect expressed in SQL and invisible to
      # a Java grep. There are none today in any of the four, which is exactly when to close it. The
      # match is case-insensitive because JPQL is written both ways; the cost is that a Java field
      # named `localTimestamp` would over-report, which is fail-closed and rename-able.
      #
      # Instant.now() is deliberately NOT banned, exactly as in D48. An Instant carries no calendar and
      # cannot be read in the wrong one — ProcessedEvent and AbstractAuditingEntity both use one
      # correctly. ZoneOffset.UTC is likewise absent from the list: a named zone is a decision somebody
      # can disagree with rather than a defect.
      #
      # This comment used to name BookingEventConsumer's effective-dating of the brokerage config as a
      # third correct use, and it was correct AS AN INSTANT and wrong as a moment — it struck the rate
      # when the event was consumed rather than when the booking completed. That was NEW-13 and is
      # D53; nothing on that path reads a clock any more, and the check below cannot see the difference
      # because there is no calendar in it to get wrong. The one after it is the one that can.
      # Four checks below match against source text, and each is only as good as the one stripper
      # they all call. Three carried a private line-based `sed` until D56's review — blind to any
      # block comment spanning more than one line, which is how a comment naming a deleted call came
      # to satisfy the check guarding it. Consolidating fixed that and created a new single point of
      # failure, so it gets a test of its own: it must strip the case its predecessor could not, and
      # must not strip code. The last assertion is the control — every other one is satisfied by a
      # stripper that outputs nothing, which is exactly how a MISSING one made two of the four
      # callers pass. Same shape as the pepper-wiring pair above.
      - name: The shared comment stripper must strip comments and nothing else
        run: ./.github/checks/strip-comments-test.sh

      - name: No runtime class may read a date in an implicit zone
        run: |
          fail=0
          # The shared stripper must EXIST, and the guard is not decoration — measured. Absent,
          # `awk -f` errors, the pipeline below produces no hits, and this check reports `ok` for all
          # five services while reading nothing. Moving the stripper out of the workflow and into a
          # file is what created that, and two of its four callers failed open on it (decisions.md
          # D56's review). Same wording as the other "would scan nothing and pass" guards here.
          [ -f .github/checks/strip-comments.awk ] || { echo "::error::.github/checks/strip-comments.awk is missing — this check would strip nothing, match nothing and pass. See decisions.md D56."; exit 1; }
          for svc in payout booking messaging gateway catalog; do
            dir="$svc/src/main/java/net/jojoaddison"
            if [ ! -d "$dir" ]; then
              echo "::error::$dir does not exist — this check would scan nothing and pass. See decisions.md D51."
              fail=1
              continue
            fi
            scanned=0
            # Per-service, because the summary below must not contradict an error above it. `fail` is
            # the job's exit status and says nothing about WHICH service was dirty, so gating the `ok`
            # line on it would print "ok payout — none reads an implicit zone" directly beneath
            # payout's own violation. That is this check's own subject matter — a report asserting a
            # property the run does not have — and it is fail-CLOSED (the job still exits 1), which is
            # exactly the kind that survives review by being technically harmless.
            svc_fail=0
            while IFS= read -r f; do
              # A `while read` over an empty find is one EMPTY line, not none — grep would then be
              # handed "" , error, and the pipeline's exit status would come from the filter and read
              # as "no match". Same fail-open D48's review found in an unexpanded glob, one shell
              # construct along, so the empty name is dropped before it can be counted as scanned.
              [ -z "$f" ] && continue
              # The two calendars are the files that MAY read a clock: SeedCalendar for the seed's
              # shift, MarketCalendar for everything at run time. Everything else goes through one of
              # them.
              case "$f" in */SeedCalendar.java|*/MarketCalendar.java) continue ;; esac
              scanned=$((scanned + 1))
              # Strip comments, THEN match. Dropping comment lines after the match is what let a
              # leading /* hide the code behind it.
              #
              # The shared awk since D56's review, which found this one's `sed` blind to any block
              # comment spanning more than one line — so a multi-line `/* … */` containing
              # `LocalDate.now()` was invisible here, on the check that exists to find exactly that.
              # The `grep -vE '^[0-9]+:[[:space:]]*\*'` that used to follow is GONE rather than kept
              # as belt and braces: it was the only thing removing javadoc continuation lines, the
              # awk now blanks them properly, and a filter that can only drop matches is a fail-open
              # once the thing it compensated for is fixed.
              hits=$(awk -f .github/checks/strip-comments.awk "$f" \
                       | grep -niE '(LocalDate|LocalDateTime|LocalTime|ZonedDateTime|OffsetDateTime|Year|YearMonth)\.now\(|Clock\.system|ZoneId\.systemDefault|TimeZone\.getDefault|systemDefaultZone|current_date|current_timestamp|localtimestamp|now\(\)[[:space:]]*::' \
                       | cut -d: -f1)
              if [ -n "$hits" ]; then
                for n in $hits; do
                  # The original line, not the stripped one — the error should quote what is written.
                  echo "  $f:$n:$(sed -n "${n}p" "$f")"
                done
                echo "::error file=$f::this reads a date in whatever calendar the container was started in — use MarketCalendar, or an Instant if it is a moment rather than a day. See decisions.md D51."
                fail=1
                svc_fail=1
              fi
              # A here-string is NOT a subshell, so `scanned` and `svc_fail` both survive the loop.
              # Piping find into `while` instead would lose both, silently: `scanned` would read 0 and
              # every service would report itself blind.
            done <<< "$(find "$dir" -name '*.java' -type f | sort)"
            if [ "$scanned" -eq 0 ]; then
              echo "::error::$dir matched no scannable file — this check is now blind. See decisions.md D51."
              fail=1
            elif [ "$svc_fail" -eq 0 ]; then
              echo "ok   $svc — $scanned files scanned, none reads an implicit zone"
            else
              echo "FAIL $svc — $scanned files scanned, see the errors above"
            fi
          done
          exit "$fail"

      # An APPOINTMENT's wall clock belongs to whoever delivers it, so the only zone it may be read in
      # is the booking's own — decisions.md D55 (the ratification) and D58 (the fix), backlog NEW-19.
      #
      # WHAT THIS CATCHES THAT THE TESTS DO NOT. TheAppointmentIsInTheBookingsZoneTest and
      # TheCancellationBoundaryIsInTheBookingsZoneIT both go red if either of D58's two sites
      # regresses, and that was measured one site at a time rather than as a battery. Neither can see
      # a THIRD site: a screen that wants "hours until the appointment" and writes the conversion
      # again is exactly how NEW-19 came to name two lines rather than one, and a test can only cover
      # a call site that exists.
      #
      # It bans MARKET_ZONE beside ZoneOffset, and that is the half worth having. The marketplace's
      # constant behaves identically today and is wrong for the one case the ratification exists for,
      # so a sweep onto it would read as tidying, pass a check that only banned UTC, and undo six
      # packages of keeping the two questions apart.
      #
      # ITS REACH IS ONE LINE, stated rather than implied: splitting the conversion across two
      # statements evades it. The tests are what cover the sites that exist; this covers the shape a
      # new one would take. Comments are stripped first, so the prose at both sites — which now names
      # ZoneOffset.UTC in order to say what the code no longer does — cannot satisfy or fail it.
      - name: An appointment's wall clock may only be read in the booking's own zone
        run: |
          fail=0
          # Same guard as every other caller: absent the stripper, awk errors, nothing is matched and
          # this reports ok having read nothing (decisions.md D56's review).
          [ -f .github/checks/strip-comments.awk ] || { echo "::error::.github/checks/strip-comments.awk is missing — this check would strip nothing, match nothing and pass. See decisions.md D56."; exit 1; }
          # And a guard of its own kind: everything below keys on the accessor's name, so a rename of
          # it leaves this check green and blind. The entity is where that name is decided.
          if ! grep -q 'public LocalTime getScheduledTime()' booking/src/main/java/net/jojoaddison/domain/Booking.java; then
            echo "::error::Booking.getScheduledTime() is gone or renamed — this check keys on that name and would now match nothing. See decisions.md D58."
            exit 1
          fi
          scanned=0
          for svc in payout booking messaging gateway catalog; do
            dir="$svc/src/main/java/net/jojoaddison"
            [ -d "$dir" ] || { echo "::error::$dir does not exist — this check would scan nothing and pass."; fail=1; continue; }
            while IFS= read -r f; do
              # An empty find yields one EMPTY line through a here-string, not none.
              [ -z "$f" ] && continue
              scanned=$((scanned + 1))
              bad=$(awk -f .github/checks/strip-comments.awk "$f" | grep -nE 'getScheduledTime\(\)' | grep -E 'ZoneOffset|MARKET_ZONE' | cut -d: -f1)
              [ -n "$bad" ] || continue
              for n in $bad; do
                # The original line, not the stripped one — quote what is written.
                echo "  $f:$n:$(sed -n "${n}p" "$f")"
              done
              echo "::error file=$f::an appointment's wall clock is read here in a zone that is not the booking's — use booking.getZoneId(), which BookingWorkflow.scheduledAt already does. See decisions.md D58."
              fail=1
            done <<< "$(find "$dir" -name '*.java' -type f | sort)"
          done
          if [ "$scanned" -eq 0 ]; then
            echo "::error::no Java file was scanned — this check is now blind. See decisions.md D58."
            exit 1
          fi
          [ "$fail" -eq 0 ] && echo "ok   $scanned files scanned — every appointment is read in its own booking's zone"
          exit "$fail"

      # …and the other half of the same column: a zone may not be STORED without being parsed —
      # decisions.md D60, backlog NEW-20.
      #
      # The check above says an appointment is read in the booking's own zone. That is only worth
      # having if the column can be read at all: `zone_id` is a varchar(64) with no parse, no check
      # constraint and no enum behind it, and until D60 CustomerBookingResource put whatever string
      # catalog's card carried straight into it. BookingWorkflow.scheduledAt then reads it as
      # Africa/Accra for ever, at WARN, on the boundary that decides a 50% late-cancellation fee.
      #
      # WHAT THIS CATCHES THAT THE TESTS DO NOT. TheZoneACatalogueOffersIsParsedAtCaptureTest and
      # …IT go red if the derivation or the one live capture site regresses, each mutated separately.
      # Neither can see a SECOND writer — and this item exists because the day catalog grows
      # professional onboarding is the day a `.setZoneId(request.zoneId())` appears in a service that
      # has never had one, with no test anywhere yet written to be red about it. NEW-20 names that
      # day as its own trigger, so the check scans CATALOG as well as booking, and all five while it
      # is there: adding a clean service is free, and not scanning one is how catalog's four implicit
      # zones got in (D52).
      #
      # A WRITE, NOT A READ. The pattern is `.zoneId(` with an argument, or `.setZoneId(`. The bare
      # no-argument accessor is how CatalogClient reads the professional's card and is none of this
      # check's business — matching it would make the fix "stop reading the field", which is absurd
      # in a way that gets checks disabled.
      #
      # …AND `.zoneId(` AT END OF LINE, which is the TENTH fail-open in this family and was found by
      # D60's review rather than by writing it. `\.zoneId\([^)]` needs a non-`)` character on the SAME
      # LINE, so a wrapped fluent write is invisible — measured, both spellings:
      #
      #   .zoneId(raw);         matches = 1
      #   .zoneId(\n  raw);     matches = 0        <- planted in catalog, check stayed GREEN at
      #                                              "530 files scanned, 5 zone writes", not even
      #                                              counting the planted write
      #
      # `.setZoneId(` was already immune (no `[^)]` in that half), so this was specific to the builder
      # form — and PRETTIER FORMATS JAVA HERE, so a long argument expression is wrapped into exactly
      # that shape with no intent to evade whatsoever. The third alternation closes it. A legitimately
      # wrapped `.zoneId(\n  CapturedZone.of(...))` is now RED, which is fail-closed and deliberate:
      # keep the write on one line, which every write in the tree already is (the shipped capture site
      # is 82 characters against prettier's printWidth of 140, so nothing here is near wrapping).
      #
      # THE SERVICE LIST IS ENUMERATED, NOT DERIVED, and that is worth saying plainly because the
      # habit in this file is the opposite and a reader will assume it. `for svc in booking catalog
      # messaging payout gateway` is a hardcoded five, so a SIXTH service would be silently unscanned.
      # Accepted rather than fixed: there is no cheap source to derive it from (no aggregator pom, no
      # reactor — the five are standalone Maven projects), and every failure mode that exists TODAY is
      # loud. A missing directory errors per service; `scanned=0` exits 1; `writes=0` exits 1; a
      # missing stripper or a missing CapturedZone.java exits 1. So it cannot pass having scanned
      # nothing — only fail to scan a service that does not exist yet, which is the same bound its
      # siblings here accept.
      #
      # THREE ALLOWANCES, each argued rather than convenient, and each a token that must appear on
      # the SAME line (comments stripped first, so prose naming CapturedZone cannot satisfy it —
      # measured):
      #   CapturedZone     the parse. The only route by which a value off a wire may reach a column.
      #   DEFAULT_ZONE_ID  a seeder's compile-time constant. TheSeededZoneIsAZoneUnitTest, in booking
      #                    AND in catalog, asserts each is a zone tzdb can read — which is what makes
      #                    this an allowance rather than a hole.
      #   this.setZoneId(  the generated entity's own builder delegating to its own setter.
      #
      # AND TWO FAIL-OPENS CLOSED BY HAND, because this family's checks fail by finding nothing:
      # CapturedZone.java must exist (renamed, every error message points at nothing and the
      # allowance quietly stops matching), and the sweep must find at least one write in the whole
      # estate (rename the field and five clean services is indistinguishable from five correct
      # ones). Watched firing six ways: the resource swept back to the raw string, that same line
      # with a comment naming CapturedZone beside it, a new writer planted in catalog, the stripper
      # removed, CapturedZone renamed away, and the accessor renamed across all five files.
      - name: A zone may not be stored without being parsed
        run: |
          fail=0
          # The shared stripper must EXIST, for the reason every other caller here states: absent,
          # `awk -f` errors, nothing is matched, and this reports ok having read nothing (D56's review).
          [ -f .github/checks/strip-comments.awk ] || { echo "::error::.github/checks/strip-comments.awk is missing — this check would strip nothing, match nothing and pass. See decisions.md D56."; exit 1; }
          # The capture parser must exist. This check's whole remedy is "go through it", so a rename
          # would leave every error message pointing at nothing while the allowance silently stopped
          # matching.
          capture=booking/src/main/java/net/jojoaddison/service/CapturedZone.java
          [ -f "$capture" ] || { echo "::error::$capture is gone or renamed — nothing parses a zone at capture any more, and this check keys on that name. See decisions.md D60."; exit 1; }
          # …and the one live capture site must still go through it. The sweep below cannot see this:
          # a resource that resolved the zone into a local variable first would satisfy every
          # allowance while storing whatever the catalogue sent.
          resource=booking/src/main/java/net/jojoaddison/web/rest/CustomerBookingResource.java
          if ! awk -f .github/checks/strip-comments.awk "$resource" | grep -qF 'CapturedZone.of('; then
            echo "::error file=$resource::POST /api/bookings no longer parses the professional's calendar at capture — a zone tzdb cannot read would be stored and misread on the late-cancellation boundary for ever. See decisions.md D60."
            fail=1
          fi
          scanned=0
          writes=0
          for svc in booking catalog messaging payout gateway; do
            dir="$svc/src/main/java/net/jojoaddison"
            [ -d "$dir" ] || { echo "::error::$dir does not exist — this check would scan nothing and pass. See decisions.md D60."; fail=1; continue; }
            while IFS= read -r f; do
              # An empty find yields one EMPTY line through a here-string, not none.
              [ -z "$f" ] && continue
              scanned=$((scanned + 1))
              hits=$(awk -f .github/checks/strip-comments.awk "$f" | grep -nE '\.zoneId\([^)]|\.zoneId\([[:space:]]*$|\.setZoneId\(' | cut -d: -f1)
              for n in $hits; do
                writes=$((writes + 1))
                line=$(awk -f .github/checks/strip-comments.awk "$f" | sed -n "${n}p")
                case "$line" in
                  *CapturedZone*|*DEFAULT_ZONE_ID*|*this.setZoneId\(*) continue ;;
                esac
                # The original line, not the stripped one — quote what is written.
                echo "  $f:$n:$(sed -n "${n}p" "$f")"
                echo "::error file=$f::a zone is written here without being parsed — a varchar(64) that tzdb cannot read is stored once and misread for ever on the late-cancellation boundary. Go through CapturedZone (booking) or a constant a test asserts. See decisions.md D60, backlog NEW-20."
                fail=1
              done
            done <<< "$(find "$dir" -name '*.java' -type f | sort)"
          done
          if [ "$scanned" -eq 0 ]; then
            echo "::error::no Java file was scanned — this check is now blind. See decisions.md D60."
            exit 1
          fi
          # And the sweep itself must still match something. Renaming the field would leave every
          # service clean by finding nothing at all, which is this family's recurring fail-open.
          if [ "$writes" -eq 0 ]; then
            echo "::error::no zone write was found in any service — the accessor has been renamed and this check is scanning for a name nothing uses. See decisions.md D60."
            exit 1
          fi
          [ "$fail" -eq 0 ] && echo "ok   $scanned files scanned, $writes zone writes — every one of them parses or is a checked constant"
          exit "$fail"

      # The moment a rate is struck at travels on the event, so both ends must spell it the same way —
      # decisions.md D53, backlog NEW-13.
      #
      # There is no shared library and no shared schema here: booking WRITES two field names onto the
      # booking payload and payout READS them out of it, in two Maven projects that never see each
      # other. No test in either can span the pair, which is the SubjectPseudonym / SeedCalendar /
      # MarketCalendar situation once more — except that this is not a copied file, so there is nothing
      # to diff. What has to agree is a pair of string literals.
      #
      # WHY IT MATTERS MORE THAN A TYPO USUALLY DOES. Renaming either side does not break anything
      # visible. Payout finds no instant, falls back to the envelope's occurredAt, prices at that, warns
      # once per event in a log nobody is reading during a rename, and writes an entirely ordinary
      # ledger row. Every test in both services stays green — booking's assert what booking publishes,
      # payout's assert what payout consumes, and each is internally consistent with the new name. The
      # fallback is deliberately silent-ish by design (it is a WARN, not a failure) precisely so that
      # old events still price, which is the same property that would hide this.
      #
      # So the check is that the producer still PUTS each key and the consumer still READS it AT ITS
      # CALL SITE. Neither half may be a grep for the name anywhere in the file, and the consumer half
      # WAS one until D53's review caught it — that is the finding worth keeping, because it is this
      # check failing at its own subject matter.
      #
      #   elif ! grep -qF "\"$field\"" "$consumer"        <- the version that shipped
      #
      # BookingEventConsumer's javadoc quotes "bookingCompletedAt" while explaining that a malformed
      # one is refused. So renaming ONLY the call site and leaving the prose exited 0:
      #
      #   ok   bookingCompletedAt — published by booking and read by payout      <- with the call site
      #   ok   bookingCancelledAt — published by booking and read by payout         renamed to
      #   EXIT=0                                                                    "completionInstant"
      #
      # bookingCancelledAt WAS caught, but only because its javadoc happens not to quote it. The
      # check's behaviour depended on PROSE, and it was blind on the field that prices every completed
      # booking — the majority of ledger rows and the whole population NEW-13 exists for. It also
      # explains how "watched firing three ways" looked convincing: renaming both fields exits 1 on the
      # cancelled one while printing `ok` for the completed one on the line above, and the exit status
      # is what an author checks.
      #
      # Two fixes, both applied, because either alone leaves a hole:
      #   - COMMENTS ARE STRIPPED FIRST, borrowing the sed and the javadoc-continuation filter from
      #     "No runtime class may read a date in an implicit zone" above, which had already had this
      #     class of fail-open found in it twice. Prose can no longer satisfy the check.
      #   - THE MATCH IS THE CALL SITE, not the bare literal, so it asserts the act of resolving a
      #     pricing moment from that field rather than the presence of a name. `[^)]*` rather than the
      #     literal argument names, so renaming `envelope` or `p` does not fail this spuriously.
      - name: Booking and payout must name the pricing instants identically
        run: |
          fail=0
          # This one fails CLOSED without the stripper — the greps below find nothing in an empty
          # string and it exits 1. Guarded anyway, so the four callers say the same thing and the
          # error names the cause rather than reporting a field as missing from booking.
          [ -f .github/checks/strip-comments.awk ] || { echo "::error::.github/checks/strip-comments.awk is missing — this check cannot read either file. See decisions.md D56."; exit 1; }
          producer=booking/src/main/java/net/jojoaddison/service/OutboxRecorder.java
          consumer=payout/src/main/java/net/jojoaddison/service/BookingEventConsumer.java
          for f in "$producer" "$consumer"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f does not exist — this check would compare nothing and pass. See decisions.md D53."
              fail=1
            fi
          done
          if [ "$fail" = 0 ]; then
            # Comments removed before either half looks, so no javadoc quoting a field name can
            # satisfy the check for it. The SHARED awk since D56's review — this check invented the
            # rule and then shipped a `sed` that only saw single-line block comments, so a multi-line
            # `/* … */` naming a field could still satisfy it. Half-closing the hole it named.
            producer_code=$(awk -f .github/checks/strip-comments.awk "$producer")
            consumer_code=$(awk -f .github/checks/strip-comments.awk "$consumer")
            for field in bookingCompletedAt bookingCancelledAt; do
              # The producer must PUT it on the payload, not merely mention it.
              if ! printf '%s\n' "$producer_code" | grep -qF "payload.put(\"$field\""; then
                echo "::error file=$producer::booking no longer publishes $field — payout then prices every event at the envelope's occurredAt instead of at the act, warns, and stays green. See decisions.md D53."
                fail=1
              # …and the consumer must resolve its pricing moment FROM it, at the call site.
              elif ! printf '%s\n' "$consumer_code" | grep -qE "pricedAt\([^)]*\"$field\"\)"; then
                echo "::error file=$consumer::payout no longer prices from $field — the field booking publishes is being ignored and every such event falls back to the envelope's occurredAt, warns once, and writes an ordinary ledger row. See decisions.md D53."
                fail=1
              else
                echo "ok   $field — published by booking and priced from by payout"
              fi
            done
          fi
          exit "$fail"

      # The RECEIPT's half of the same question — decisions.md D56, backlog NEW-16.
      #
      # The check above guards a pair of field names on a Kafka payload. This guards a pair of QUERY
      # PARAMETERS on an internal HTTP call, and it is the same hazard for the same reason: booking
      # asks payout for the brokerage split, the two are separate Maven projects that never see each
      # other, and no test in either can span the pair. Both services' suites assert their own end and
      # are internally consistent with any name.
      #
      # WHAT EACH HALF BUYS, because they are not the same failure.
      #
      #   `at` is the MOMENT. Lose it — rename it, or widen the type back to a String — and payout
      #   falls through to `on`, which is the day, and prices a booking completed at 14:00 at the terms
      #   in force at midnight. That is NEW-16 itself, restored, with the ledger row behind the same
      #   booking still priced at the instant (D53) and no row anywhere recording which rate produced
      #   which number.
      #
      #   `on` is the DAY, and it is redundant against the payout in this repository — which is exactly
      #   why somebody will delete it. It is the compatibility half: booking and payout roll
      #   independently (deploy-prod.sh takes --services), so a new booking can call an OLD payout that
      #   ignores `at` as an unknown parameter. With `on` beside it that deployment prices to the day,
      #   which is the defect this package closes and not a new one. Without it, that payout has
      #   nothing at all and falls through to its own Instant.now() — NEW-13 rebuilt in the other
      #   service, on the path where a customer is reading a financial statement. Nothing on either
      #   side of a green build can see that.
      #
      # THE THIRD ASSERTION is that the resource does not read a clock. The implicit-zone check above
      # deliberately does NOT ban Instant.now() — an instant carries no calendar and cannot be read in
      # the wrong one — so a fallback to "now" here is invisible to every other check in this
      # workflow, and it is exactly what `split` did until D56: a request that failed to say when was
      # answered at today's terms, and looked like a correct receipt. BrokerageResource has no other
      # use for a clock; it is handed a moment or it refuses.
      #
      # BOOKINGEVENTCONSUMER IS DELIBERATELY NOT IN THIS BAN, and the first version of this check had
      # it in. It writes ProcessedEvent(eventId, type, Instant.now()) — an idempotency record's
      # "when did we handle this", which is a correct use and the one the comment above the
      # implicit-zone check already names. Banning the call there fails on the honest line while
      # saying nothing about the pricing one. The consumer's pricing moment is already pinned, one
      # check above: D53 requires its call site to be pricedAt(…, "bookingCompletedAt"), so replacing
      # it with a clock is red there. Watching this check run is how that was found — it fired on
      # main, on a line nobody should change.
      #
      # Comments are stripped before anything is matched, D53's review's finding: a check whose reach
      # depends on prose is not a check, and both of these files discuss `at`, `on` and Instant.now()
      # at length in their javadoc.
      #
      # THE STRIPPER IS THE SHARED ONE, and this check shipped with the wrong one. It copied D53's
      # line-based `sed`, which removes only a block comment opening and closing on ONE line — javadoc
      # survived it by accident, because a `grep -v` dropped `*`-prefixed continuation lines, and a
      # non-javadoc multi-line `/* … */` (the house style here) passed through whole. Verified both
      # directions on the two files below: delete `uri.queryParam("at", at)`, leave a block comment
      # mentioning it, and the check printed `ok` for the parameter that was gone. NEW-16 restored on
      # a green build — the EIGHTH fail-open in this family, and the second time the fix was already
      # in this file. D54's stateful awk is now `.github/checks/strip-comments.awk` and all four
      # text-matching checks call it.
      - name: Booking and payout must name the receipt's pricing parameters identically
        run: |
          fail=0
          # Fails closed without it, like D53's above; guarded for the same reason — an error naming
          # the missing stripper beats four errors saying booking stopped sending its parameters.
          [ -f .github/checks/strip-comments.awk ] || { echo "::error::.github/checks/strip-comments.awk is missing — this check cannot read either file. See decisions.md D56."; exit 1; }
          asker=booking/src/main/java/net/jojoaddison/service/BrokerageClient.java
          answerer=payout/src/main/java/net/jojoaddison/web/rest/BrokerageResource.java
          for f in "$asker" "$answerer"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f does not exist — this check would compare nothing and pass. See decisions.md D56."
              fail=1
            fi
          done
          if [ "$fail" = 0 ]; then
            strip() { awk -f .github/checks/strip-comments.awk "$1"; }
            asker_code=$(strip "$asker")
            answerer_code=$(strip "$answerer")

            # Booking must SEND each one, not merely mention it.
            for param in at on; do
              if ! printf '%s\n' "$asker_code" | grep -qF "queryParam(\"$param\""; then
                echo "::error file=$asker::booking no longer sends '$param' to the split endpoint. See decisions.md D56."
                fail=1
              else
                echo "ok   $param — sent by booking"
              fi
            done

            # …and payout must BIND each one, with its type. `Instant at` rather than the bare name:
            # widening it to a String would leave the name present, the value unparsed and every
            # request falling through to the day, which is the defect wearing the right label.
            if ! printf '%s\n' "$answerer_code" | grep -qE 'RequestParam\([^)]*\)[[:space:]]+Instant[[:space:]]+at\b'; then
              echo "::error file=$answerer::payout no longer binds 'at' as an Instant — every split then falls through to the day and a 14:00 completion is priced at midnight's terms. See decisions.md D56."
              fail=1
            else
              echo "ok   at — bound by payout as an Instant"
            fi
            if ! printf '%s\n' "$answerer_code" | grep -qE 'RequestParam\([^)]*\)[[:space:]]+LocalDate[[:space:]]+on\b'; then
              echo "::error file=$answerer::payout no longer binds 'on' as a LocalDate — a booking that has no completion instant, and any older booking service, then has nothing to price with. See decisions.md D56."
              fail=1
            else
              echo "ok   on — bound by payout as a LocalDate"
            fi

            # And the resource may not substitute a clock for the moment it was given.
            if printf '%s\n' "$answerer_code" | grep -qE 'Instant\.now\(\)'; then
              echo "::error file=$answerer::the split prices against a clock instead of the moment it was asked about — the defect D56 removed. A request that failed to say when is not a request about now. See decisions.md D56."
              fail=1
            else
              echo "ok   BrokerageResource — prices at a stated moment, never at now"
            fi
          fi
          exit "$fail"

      # And the pepper that keys it must be injected everywhere the three services run, and committed
      # nowhere a real deployment reads. Same shape as the JWT signing key, same reason: this
      # repository is public, so a default that works is a secret that does not.
      #
      # Absent, erasure answers 503 rather than writing a re-identifiable alias — so the failure this
      # guards is not a crash, it is a desk that has quietly stopped being able to do the one thing it
      # exists for, on a stack that is green everywhere else.
      # Both halves of this were two greps here until 2026-09-02, and both could pass on a broken
      # state. The first was per FILE — it matched the string anywhere, so moving messaging off the
      # shared YAML anchor (which is how the per-service DISCOVERY_HOSTNAME overrides already work)
      # left it unpeppered while the other four kept the check green. The second matched only the
      # nested `    pepper: v` spelling, and Spring reads the flat `healthconnect.privacy.pepper: v`
      # just as happily — a line beginning with `h`, which the leading-whitespace anchor could not
      # see. Now a script, so it can be run and watched to fail; the test beside it builds both bad
      # states and asserts the old greps passed on them.
      - name: The erasure pepper must be required per service and committed in no runtime profile
        run: ./.github/checks/pepper-wiring.sh

      - name: …and that check must fail on the states its predecessors passed
        run: ./.github/checks/pepper-wiring-test.sh

      # quality/startup.sh took an environment-provided pepper without ever writing it down, so the
      # next run without the variable generated a fresh one against databases keyed to the old.
      # ErasureRegisterGuard cannot see that: it detects an absent pepper, not a changed one.
      - name: quality/startup.sh must not be able to mint a second pepper
        run: ./.github/checks/quality-pepper-persistence-test.sh

      # THE QUALITY PROJECT'S CONTAINERS WERE BUILT FROM TWO DIFFERENT CHECKOUTS — decisions.md D67,
      # backlog NEW-28. `docker compose ls` named two config files for the one `hc-market-quality`
      # project: five application containers from the main checkout, five databases from a git
      # worktree that has since been pruned.
      #
      # The label is the evidence; the bind mount is the damage. env_for_compose points SEED_DIR at
      # $ROOT/deploy/demo, so an `up` from a worktree repoints four LIVE containers at a directory
      # that vanishes when it is pruned. And a warning would not have been enough: `compose up`
      # relabels only what it RECREATES, so a wrong-place `up` splits the project rather than moving
      # it, and no later `up` from the right place puts it back. Measured on a throwaway project.
      - name: quality/startup.sh must refuse to start a project another checkout created
        run: ./.github/checks/quality-project-checkout-test.sh

      # verify-outbox-recovery.sh SEVERED booking from hcnet and put back less than it cut —
      # decisions.md D68, backlog NEW-26. `docker network connect` with no --alias restores the
      # connection and not the NAMES: compose publishes a container's service name as a DNS alias
      # when it creates it, a manual reconnect publishes only the container's own name. Measured on
      # the quality box: hc-market-quality-booking carried `Aliases: []` on hcnet while every
      # sibling carried [<container name>, <service name>].
      #
      # It costs nothing today because two OTHER planes still answer the name — the project network
      # for the stack's own five, and since D64 qualitynet for anything outside. Both are facts
      # about today's membership, and neither is a reason for a script to leave an estate different
      # from how it found it.
      #
      # The check asks docker rather than reasoning from the flag's documentation: a throwaway
      # container with a known multi-alias set, severed and reconnected by the SHIPPED function,
      # compared before and after, with a bare connect beside it as the positive control.
      - name: verify-outbox-recovery.sh must restore the aliases it severs
        run: ./.github/checks/outbox-alias-restore-test.sh

      # The SHELL comment stripper's own test — the same argument as "The shared comment stripper must
      # strip comments and nothing else", one language along. The check above is only as good as
      # strip-sh-comments.awk, and the survival properties that awk's header documents
      # (`${#arr[@]}`, `$#`, `${x#pfx}`) were enforced nowhere: verify-outbox-recovery.sh depends on
      # the first of those on a line no assertion greps. "Documented in three places, enforced
      # nowhere" is this repository's named failure mode.
      #
      # Case 8 reproduces WHY there are two strippers rather than five callers of one: the Java
      # stripper leaves shell comments intact AND exits 0 while doing so. Case 9 pins both of the
      # awk's stated limits, so changing either is a decision.
      - name: …and that check's shell comment stripper must strip shell comments and nothing else
        run: ./.github/checks/strip-sh-comments-test.sh

      # THE GATEWAY SEEDED `admin` WITH A PUBLISHED PASSWORD IN EVERY PROFILE, prod included —
      # decisions.md D61, backlog NEW-22. The generated Mongock changeunit had no profile condition
      # and `mongock.migration-scan-package` is in the BASE application.yml with no prod override, so
      # it ran on any fresh Mongo, which is exactly what a first production deploy creates. That
      # account holds ROLE_ADMIN on the gateway that issues the estate's tokens, and all five services
      # accept them.
      #
      # Nothing was red for the whole life of the repository, and nothing would have been: the estate
      # comes up perfectly. The seeder is also a GENERATED file, so the first of this check's four
      # parts is a sweep for a committed bcrypt hash rather than a grep for the logic — a regeneration
      # would put the changeunit back and take the logic with it.
      - name: The gateway must seed no published credential
        run: ./.github/checks/admin-seed-wiring.sh

      - name: …and that check must fail on every state it exists to refuse
        run: ./.github/checks/admin-seed-wiring-test.sh

      # The image name is written in THREE places: image_for() in deploy-prod.sh, that script's own
      # header, and spec §12's channel table. They disagreed for weeks — header and spec said
      # ghcr.io/<owner>/healthconnect-<service>, the code produced hc-market-<service> — and
      # sync-appendices.sh could not catch it, because the appendix faithfully reproduces the
      # script's header, so both copies were wrong together and matched each other perfectly.
      #
      # A documented image name that cannot exist sends whoever hits a 404 hunting for a registry
      # fault instead of a missing tag, which is the confusion quality/startup.sh warns about.
      - name: The documented image name must match the one the code builds
        run: |
          prefix=$(grep -oE 'IMAGE_PREFIX="ghcr\.io/\$\{GHCR_OWNER\}/[a-z-]+"' deploy/deploy-prod.sh | sed -E 's#.*/([a-z-]+)"#\1#')
          echo "image_for builds: ghcr.io/<owner>/${prefix}-<service>"
          test -n "$prefix"
          fail=0
          grep -q "ghcr.io/<owner>/${prefix}-<service>" deploy/deploy-prod.sh || {
            echo "::error file=deploy/deploy-prod.sh::header does not document ${prefix}-<service>"; fail=1; }
          grep -q "ghcr.io/<owner>/${prefix}-<service>" docs/healthconnect-marketplace.md || {
            echo "::error file=docs/healthconnect-marketplace.md::spec §12 does not document ${prefix}-<service>"; fail=1; }
          [ "$fail" = 0 ] && echo "ok   header and spec both document ${prefix}-<service>"
          exit "$fail"

      # THE DELETE TABLE IS THE CONTROL, AND UNTIL NOW NOTHING CHECKED IT — backlog NEW-15, D54.
      #
      # JHipster generates a full CRUD resource for every entity in the JDL, with no authorization on
      # it, and every service's SecurityConfiguration asks only for `/api/**` .authenticated(). The
      # thing that stops one of those shipping is a table in CLAUDE.md naming the ones to delete after
      # a regeneration. It named eight. Nine more were live on main: BrokerageConfig, Ledger, Payout,
      # Credential, AvailabilitySlot, ServiceOffering, Highlight, Message and Conversation — every one
      # answering 200 to a plain ROLE_USER, read and write, and every one gateway-routed. The table did
      # not fail; it was never updated, and no test in the estate could see that.
      #
      # So this check is worth more than the nine deletions, because it is what stops the tenth.
      #
      # THE EXPECTED SET IS DERIVED FROM THE JDL, NEVER ENUMERATED HERE. jdl/*.jdl is the model of
      # record and it is what a regeneration reads, so it is also the only honest source for "which
      # resources would a regeneration create". An enumerated list of nine paths would have been the
      # seventh fail-open in this family: it would go stale the moment somebody adds an entity, which
      # is exactly the moment it needs to fire. Add an entity to a JDL and this step demands an answer
      # for it in the same pull request.
      #
      # Every entity gets one of two answers and there is no third:
      #
      #   DELETED — no <Entity>Resource.java, and CLAUDE.md's delete table names it. The table half is
      #             the point: a deletion that is not written down is one regeneration from being
      #             undone, which is the whole history of this item.
      #   GATED   — the file exists AND carries authorization: either a class-level @PreAuthorize, or
      #             at least as many @PreAuthorize as it has request mappings. "Contains the string
      #             somewhere" would pass a resource that gated its GET and left all four writes open,
      #             which is the shape of half the defects this repository has found.
      #
      # Fail-closed in four places, because a check like this can only fail open: the jdl glob must
      # match, every JDL must name a directory that exists, the estate must yield at least one entity,
      # and the delete table must extract as a non-empty range. Any of those silently empty and the
      # loop below would scan nothing and report success.
      - name: Every entity JHipster generates CRUD for must be deleted or authorized
        run: |
          fail=0
          # Absent, every resource strips to an empty file, so `maps` and `pre` are both 0 and the
          # authorization branch passes on a resource with no annotation at all. Measured, not
          # supposed — decisions.md D56's review.
          [ -f .github/checks/strip-comments.awk ] || { echo "::error::.github/checks/strip-comments.awk is missing — every resource would strip to nothing and this check would pass. See decisions.md D56."; exit 1; }
          jdls=$(ls jdl/*.jdl 2>/dev/null || true)
          if [ -z "$jdls" ]; then
            echo "::error::jdl/*.jdl matched nothing — this check would scan no entity and pass. See decisions.md D54."
            exit 1
          fi
          # The delete table, extracted rather than restated. Between its own heading and the
          # "And their tests." paragraph that closes it, so a row added anywhere in the table counts
          # and a resource merely mentioned in the prose around it does not.
          table=$(awk '/^\*\*Per app — generated classes to delete\.\*\*/{p=1} /^\*\*And their tests\.\*\*/{p=0} p' CLAUDE.md)
          if [ "$(printf '%s' "$table" | wc -l)" -lt 5 ]; then
            echo "::error file=CLAUDE.md::the delete table did not extract — its heading or the 'And their tests.' paragraph that closes it has moved, and every deletion below would report ok against an empty table. See decisions.md D54."
            exit 1
          fi
          total=0
          for jdl in $jdls; do
            svc=$(basename "$jdl" .jdl)
            rest="$svc/src/main/java/net/jojoaddison/web/rest"
            # ^[[:space:]]* and not ^. JDL does not care about leading whitespace and JHipster
            # generates from an indented `entity` exactly as from a flush one, so anchoring at column
            # zero let two spaces hide an entity from this check entirely — verified, exit 0, nobody
            # asked to answer for it. D54's review, and the narrowest fail-open in this step.
            entities=$(grep -oE '^[[:space:]]*entity[[:space:]]+[A-Za-z][A-Za-z0-9]*' "$jdl" | awk '{print $2}')
            if [ -z "$entities" ]; then
              # gateway.jdl declares an application and no entity, so it generates no CRUD at all.
              echo "ok   $jdl declares no entity"
              continue
            fi
            if [ ! -d "$rest" ]; then
              echo "::error file=$jdl::$rest does not exist, but $jdl declares entities — the service has moved and this check is now blind to it. See decisions.md D54."
              fail=1
              continue
            fi
            for e in $entities; do
              total=$((total + 1))
              f="$rest/${e}Resource.java"
              if [ ! -f "$f" ]; then
                # The row must name the resource in the DELETE column *and* this service in the FROM
                # column. A bare grep of the whole table matched the "Replaced by" column too, so
                # `entity Review` added to messaging.jdl was satisfied by CATALOG's ReviewResource row
                # — verified. Every entity sharing a name with a replacement (Messaging, Marketplace,
                # ProWorkspace, Favourites, ProEarnings, VerificationDesk) had the same free pass.
                # -F'|' makes $2 the Delete column and $3 the From column; the separator row and any
                # prose line outside a table row match neither.
                if printf '%s\n' "$table" |
                     awk -F'|' -v e="\`${e}Resource\`" -v svc="$svc" \
                       'index($2, e) > 0 && index($3, svc) > 0 { found = 1 } END { exit !found }'; then
                  echo "ok   $svc/$e — deleted, and CLAUDE.md's delete table says so for $svc"
                else
                  echo "::error file=CLAUDE.md::$svc has no ${e}Resource and the delete table does not name one for $svc — either it was deleted without being written down, or $e is a new entity nobody has answered for yet. Either way the next regeneration creates it with no authorization on it and nothing will say so. Add a row naming the disclosure or forgery it would allow, or gate the resource. See backlog NEW-15 and decisions.md D54."
                  fail=1
                fi
                continue
              fi
              # IT SURVIVES, SO IT MUST BE GATED — and gated means annotated, not mentioned.
              #
              # This branch read raw text until D54's review and was the SEVENTH fail-open in this
              # family. Both halves fell to prose, verified against a restored LedgerResource with no
              # authorization whatsoever: one javadoc line saying "TODO: decide whether this needs a
              # @PreAuthorize" passed it as gated at class level, and eight `// @PreAuthorize left out
              # on purpose` comments passed it as gated per mapping. Exit 0 both times. That is
              # exactly the rule D53 established one check earlier — A CHECK WHOSE REACH DEPENDS ON
              # PROSE IS NOT A CHECK — and it was not applied here.
              #
              # So: strip comments first, then count. The stripper removes /* */ blocks across lines
              # (javadoc included) and then // to end of line, preserving line numbering so the
              # class-declaration comparison still means something.
              #
              # It lived inline here until D56's review, which found the OTHER three checks using a
              # line-based `sed` blind to any block comment spanning more than one line — this one was
              # the only correct copy in the file, and being a copy is why the other three could be
              # wrong beside it. It is `.github/checks/strip-comments.awk` now, called from all four.
              stripped=$(mktemp)
              awk -f .github/checks/strip-comments.awk "$f" > "$stripped"
              clsline=$(grep -nE '^[[:space:]]*(public[[:space:]]+)?(final[[:space:]]+)?(abstract[[:space:]]+)?class[[:space:]]' "$stripped" | head -1 | cut -d: -f1)
              # Handler mappings only — those AFTER the class declaration. The class-level
              # @RequestMapping("/api/ledgers") is a path prefix and not something to authorize, and
              # counting it demanded one more @PreAuthorize than the resource has handlers: a
              # LedgerResource correctly gated on all seven handlers was refused as "7 for 8".
              # Failing closed, but refusing a correct fix is still a defect, and it is the branch
              # the error message tells people to use. Found by re-running D54's own R4 mutation.
              maps=$(awk -v c="${clsline:-0}" 'NR > c && /^[[:space:]]*@(Get|Post|Put|Patch|Delete|Request)Mapping\(/ { n++ } END { print n + 0 }' "$stripped")
              # Anchored at the start of a line, so a @PreAuthorize inside a string literal is not an
              # annotation either.
              pre=$(grep -cE '^[[:space:]]*@PreAuthorize' "$stripped")
              preline=$(grep -nE '^[[:space:]]*@PreAuthorize' "$stripped" | head -1 | cut -d: -f1)
              rm -f "$stripped"
              # An annotation line above the class declaration is necessarily TYPE-level: methods come
              # after it, imports carry no @, and comments are gone. That is what makes "before the
              # class" a sound reading of "in the annotation block" here.
              if [ -n "$preline" ] && [ -n "$clsline" ] && [ "$preline" -lt "$clsline" ]; then
                echo "ok   $svc/$e — kept, gated at class level"
              elif [ "$pre" -gt 0 ] && [ "$pre" -ge "$maps" ]; then
                echo "ok   $svc/$e — kept, $pre @PreAuthorize for $maps mappings"
              else
                echo "::error file=$f::${e}Resource exists with $pre @PreAuthorize for $maps mappings — a generated CRUD resource behind a blanket .authenticated() is readable and writable by any token this estate accepts. Delete it and put it on CLAUDE.md's delete table, or gate it. See backlog NEW-15 and decisions.md D54."
                fail=1
              fi
            done
          done
          if [ "$total" -eq 0 ]; then
            echo "::error::no entity was scanned in any JDL — this check passed having looked at nothing. See decisions.md D54."
            fail=1
          else
            echo "scanned $total entities across the estate"
          fi
          exit "$fail"

      # A SECOND check rather than a wider first one, and that is the whole point of it — backlog
      # NEW-17, decisions.md D59.
      #
      # The check above iterates ENTITIES. JHipster's Kafka sample has no entity behind it: it is
      # generated because the `application` block says `messageBroker kafka`, one class per
      # application, named upperFirst(baseName) + "KafkaResource". No widening of an entity loop
      # reaches something that lives one level up from entities, so the derivation is a different one
      # — `baseName` and `messageBroker`, still from jdl/*.jdl, still never a list in this file.
      #
      # Five resources were live on main carrying `@PostMapping("/publish")` with no @PreAuthorize,
      # under each service's blanket .requestMatchers("/api/**").authenticated() and gateway-routed,
      # so any token the estate accepts published an arbitrary string onto the broker four products
      # borrow (D27). Each also had a passing IT asserting exactly that, which is part of why nobody
      # looked.
      - name: Every generated Kafka sample resource must be deleted or authorized
        run: |
          fail=0
          # Absent, every resource strips to an empty file and the authorization branch passes on a
          # resource with no annotation at all. Measured on this check's siblings, not supposed —
          # decisions.md D56's review.
          [ -f .github/checks/strip-comments.awk ] || { echo "::error::.github/checks/strip-comments.awk is missing — every resource would strip to nothing and this check would pass. See decisions.md D56."; exit 1; }
          jdls=$(ls jdl/*.jdl 2>/dev/null || true)
          if [ -z "$jdls" ]; then
            echo "::error::jdl/*.jdl matched nothing — this check would scan no application and pass. See decisions.md D59."
            exit 1
          fi
          # The same delete table, extracted the same way, so a row added anywhere in it counts and a
          # resource merely mentioned in the prose around it does not.
          table=$(awk '/^\*\*Per app — generated classes to delete\.\*\*/{p=1} /^\*\*And their tests\.\*\*/{p=0} p' CLAUDE.md)
          if [ "$(printf '%s' "$table" | wc -l)" -lt 5 ]; then
            echo "::error file=CLAUDE.md::the delete table did not extract — its heading or the 'And their tests.' paragraph that closes it has moved, and every deletion below would report ok against an empty table. See decisions.md D54."
            exit 1
          fi
          scanned=0
          derived=""
          for jdl in $jdls; do
            svc=$(basename "$jdl" .jdl)
            rest="$svc/src/main/java/net/jojoaddison/web/rest"
            # No kafka, no sample. Leading whitespace tolerated for the reason D54's review found:
            # JDL does not care about it and the generator does not either.
            if ! grep -qE '^[[:space:]]*messageBroker[[:space:]]+kafka([[:space:]]|$)' "$jdl"; then
              echo "ok   $jdl declares no Kafka broker, so it generates no sample"
              continue
            fi
            base=$(grep -oE '^[[:space:]]*baseName[[:space:]]+[A-Za-z][A-Za-z0-9]*' "$jdl" | awk '{print $2}' | head -1)
            if [ -z "$base" ]; then
              echo "::error file=$jdl::$jdl declares messageBroker kafka but no baseName this check can read, so the class it generates cannot be named and this check is blind to it. See decisions.md D59."
              fail=1
              continue
            fi
            if [ ! -d "$rest" ]; then
              echo "::error file=$jdl::$rest does not exist, but $jdl declares an application — the service has moved and this check is now blind to it. See decisions.md D59."
              fail=1
              continue
            fi
            # JHipster names the class upperFirst(baseName) + "KafkaResource": healthconnectGateway
            # gives HealthconnectGatewayKafkaResource. The sweep after this loop is what catches the
            # generator ever spelling it differently.
            cls="$(printf '%s' "$base" | cut -c1 | tr '[:lower:]' '[:upper:]')$(printf '%s' "$base" | cut -c2-)KafkaResource"
            f="$rest/${cls}.java"
            scanned=$((scanned + 1))
            derived="$derived $f"
            if [ ! -f "$f" ]; then
              # The row must name the resource in the DELETE column and this service in the FROM
              # column — a bare grep of the table matched the "Replaced by" column too, which is
              # D54's review, finding 3.
              if printf '%s\n' "$table" |
                   awk -F'|' -v c="\`${cls}\`" -v svc="$svc" \
                     'index($2, c) > 0 && index($3, svc) > 0 { found = 1 } END { exit !found }'; then
                echo "ok   $svc/$cls — deleted, and CLAUDE.md's delete table says so for $svc"
              else
                echo "::error file=CLAUDE.md::$svc has no $cls and the delete table does not name one for $svc — either it was deleted without being written down, or a regeneration has just put an unauthenticated publish endpoint back. Add a row, or gate the resource. See backlog NEW-17 and decisions.md D59."
                fail=1
              fi
              continue
            fi
            # IT SURVIVES, SO IT MUST BE GATED — and gated means annotated, not mentioned. Same rule
            # and same stripper as the entity check above, for the same reason: a check whose reach
            # depends on prose is not a check.
            stripped=$(mktemp)
            awk -f .github/checks/strip-comments.awk "$f" > "$stripped"
            clsline=$(grep -nE '^[[:space:]]*(public[[:space:]]+)?(final[[:space:]]+)?(abstract[[:space:]]+)?class[[:space:]]' "$stripped" | head -1 | cut -d: -f1)
            # Handler mappings only — those after the class declaration. The class-level
            # @RequestMapping("/api/healthconnect-<svc>-kafka") is a path prefix, not something to
            # authorize, and counting it demands one more @PreAuthorize than the resource has
            # handlers, which refuses a correct fix.
            maps=$(awk -v c="${clsline:-0}" 'NR > c && /^[[:space:]]*@(Get|Post|Put|Patch|Delete|Request)Mapping\(/ { n++ } END { print n + 0 }' "$stripped")
            pre=$(grep -cE '^[[:space:]]*@PreAuthorize' "$stripped")
            preline=$(grep -nE '^[[:space:]]*@PreAuthorize' "$stripped" | head -1 | cut -d: -f1)
            rm -f "$stripped"
            if [ -n "$preline" ] && [ -n "$clsline" ] && [ "$preline" -lt "$clsline" ]; then
              echo "ok   $svc/$cls — kept, gated at class level"
            elif [ "$pre" -gt 0 ] && [ "$pre" -ge "$maps" ]; then
              echo "ok   $svc/$cls — kept, $pre @PreAuthorize for $maps mappings"
            else
              echo "::error file=$f::$cls exists with $pre @PreAuthorize for $maps mappings — its POST /publish puts a caller's string on the broker four products borrow, and its GET /register attaches the caller to a fan-out with no per-user filter. Delete it and put it on CLAUDE.md's delete table, or gate it. See backlog NEW-17 and decisions.md D59."
              fail=1
            fi
          done
          # THE DERIVATION'S OWN FAIL-OPEN, CLOSED. Everything above trusts that JHipster spells the
          # class upperFirst(baseName) + "KafkaResource". If it ever spells it otherwise, every loop
          # above reports "deleted, and the table says so" about a file that was never there, while
          # the real resource sits in web/rest answering. So sweep for the family by shape and refuse
          # anything the derivation did not name.
          for found in $(find . -path '*/src/main/java/net/jojoaddison/web/rest/*KafkaResource.java' -not -path './*/target/*' | sed 's|^\./||' | sort); do
            case " $derived " in
              *" $found "*) ;;
              *)
                echo "::error file=$found::$found is a Kafka sample resource this check did not derive from any JDL — the generator's naming has changed, so every 'deleted' verdict above is about a filename that never existed. See decisions.md D59."
                fail=1
                ;;
            esac
          done
          if [ "$scanned" -eq 0 ]; then
            echo "::error::no application declaring messageBroker kafka was scanned — this check passed having looked at nothing. See decisions.md D59."
            fail=1
          else
            echo "scanned $scanned applications declaring messageBroker kafka"
          fi
          exit "$fail"

      # The sibling of the check above, one layer down: D59 closed the sample's DOORS and left its
      # SUPPLIER, which never needed a door. `broker.KafkaProducer` is a generated `Supplier<String>`
      # and Spring Cloud Stream polls a BOUND supplier every second, so while generated
      # `application-kafka.yml` named it in `spring.cloud.function.definition`, all five services put
      # one message a second each onto the broker four products borrow (D27) — measured at 5.9/s and
      # 5.78 million messages, with no consumer registered against the topic on any estate.
      #
      # This is the check the regeneration hazard needs. `application-kafka.yml` is a GENERATED file,
      # so `jhipster jdl ... --force` puts `kafkaProducer` back in all five, and the loss is SILENT:
      # every suite stays green, no log line changes, and the only symptom is a broker filling up
      # somewhere else. See backlog NEW-21 and decisions.md D62.
      - name: No service may bind the generated Kafka sample supplier
        run: |
          fail=0
          # Derived from the same two JDL keys as the check above — `baseName` is not needed here
          # because the config file's path follows the service directory, not the application name.
          # No comment stripper: YAML comments start with `#`, and every expression below anchors at
          # `^[[:space:]]*<key>:`, which a commented line cannot satisfy. The house rule about
          # `.github/checks/strip-comments.awk` is about Java's `//` and `/* … */`, which can sit at
          # the end of a line of real code; this one is measured in the mutation harness beside it.
          jdls=$(ls jdl/*.jdl 2>/dev/null || true)
          if [ -z "$jdls" ]; then
            echo "::error::jdl/*.jdl matched nothing — this check would scan no application and pass. See decisions.md D62."
            exit 1
          fi
          scanned=0
          derived=""
          guards=""
          for jdl in $jdls; do
            svc=$(basename "$jdl" .jdl)
            cfg="$svc/src/main/resources/config/application-kafka.yml"
            guard="$svc/src/test/java/net/jojoaddison/broker/KafkaSampleSupplierIsNotPolledIT.java"
            if ! grep -qE '^[[:space:]]*messageBroker[[:space:]]+kafka([[:space:]]|$)' "$jdl"; then
              echo "ok   $jdl declares no Kafka broker, so it generates no sample supplier"
              continue
            fi
            scanned=$((scanned + 1))
            derived="$derived $cfg"
            # A missing file is not "nothing to bind, so nothing to check". It is the one state in
            # which this check would report ok having read nothing, and it is also a real regression:
            # without the file there is no `definition` at all, and Spring Cloud Function falls back
            # to auto-discovering a lone function bean — which is `KafkaProducer` the moment anything
            # removes `KafkaConsumer`.
            if [ ! -f "$cfg" ]; then
              echo "::error file=$jdl::$cfg does not exist, but $jdl declares messageBroker kafka — this check cannot see what $svc binds. See decisions.md D62."
              fail=1
              continue
            fi
            defs=$(grep -cE '^[[:space:]]*definition:' "$cfg" || true)
            if [ "$defs" -ne 1 ]; then
              echo "::error file=$cfg::$cfg has $defs 'definition:' lines, not 1 — this check reads one and would be blind to the others. See decisions.md D62."
              fail=1
              continue
            fi
            value=$(grep -E '^[[:space:]]*definition:' "$cfg" | head -1 | cut -d: -f2-)
            if printf '%s' "$value" | grep -q 'kafkaProducer'; then
              echo "::error file=$cfg::$svc names kafkaProducer in spring.cloud.function.definition, so the generated Supplier is bound and this service is putting one message a second onto the broker four products borrow, with nothing consuming it. A regeneration puts this back and nothing else goes red. Take the name out; the bean stays. See backlog NEW-21 and decisions.md D62."
              fail=1
              continue
            fi
            # The definition must still NAME something, and naming kafkaConsumer is what it names.
            # An empty or absent definition stops the poller too — and re-opens it by another door,
            # because with one function bean left Spring Cloud Function binds it without being asked.
            if ! printf '%s' "$value" | grep -q 'kafkaConsumer'; then
              echo "::error file=$cfg::$svc does not name kafkaConsumer in spring.cloud.function.definition. An explicit definition is the only thing stopping Spring Cloud Function auto-discovering a lone function bean and binding the supplier again. See decisions.md D62."
              fail=1
              continue
            fi
            # The config is a generated file and the guard IT is not, so after a regeneration the IT
            # is the only thing left that goes red. Losing it is losing the whole runtime half.
            if [ ! -f "$guard" ]; then
              echo "::error file=$jdl::$guard is missing — the config edit above is a regeneration hazard and this IT is the only thing that fails when it is undone. See decisions.md D62."
              fail=1
              continue
            fi
            guards="$guards $guard"
            echo "ok   $svc binds kafkaConsumer and not kafkaProducer, and carries the guard IT"
          done
          # THE FOURTH VERBATIM-COPY FAMILY. `SubjectPseudonym` (D35), `SeedCalendar` (D48) and
          # `MarketCalendar` (D51/D52) are each copied byte-identically across services and DIFFED
          # here; three documents said this guard was too, and nothing compared the copies — the house
          # failure mode, a documented property nothing enforces, inside a package about a defect
          # nothing could see. D62's review.
          #
          # What drifts is not a deletion — that is caught above — but a WEAKENED copy: a lengthened
          # timeout, a gutted assertion, one service whose guard quietly stops guarding while CI stays
          # green. Milder than the other three families, which desynchronise two services; this
          # un-guards one.
          #
          # The reference is DERIVED, not named: the first service in the sorted list the loop above
          # already built from `messageBroker kafka`. D52's review established why — an enumerated
          # list let a rogue copy sit unchecked in a service nobody had listed, so this check must
          # never grow a hard-coded service name.
          count=$(printf '%s\n' $guards | grep -c . || true)
          if [ "$count" -lt 2 ]; then
            echo "::error::only $count service carries the guard IT — a copied file with no copy to compare against is not being compared with anything, and this check would pass having diffed nothing. See decisions.md D62."
            fail=1
          else
            reference=$(printf '%s\n' $guards | head -1)
            echo "guard reference copy: $reference ($count copies)"
            # A copy that is missing has already been reported above and `fail` is already 1, so this
            # cannot pass — but the comparison below would quietly be over fewer files than were
            # scanned, and "diffed 4 of 5" must read as itself rather than as a clean run.
            if [ "$count" -ne "$scanned" ]; then
              echo "::error::$count of $scanned services carry the guard IT, so the identity comparison below covers fewer services than were scanned. See decisions.md D62."
              fail=1
            fi
            for g in $guards; do
              [ "$g" = "$reference" ] && continue
              if ! diff -u "$reference" "$g"; then
                echo "::error file=$g::$g differs from $reference — the guard is copied verbatim into every service declaring messageBroker kafka, so a weakened copy un-guards that service while the others stay green. Edit one, edit them all, comments included. See decisions.md D62."
                fail=1
              else
                echo "ok   $g — identical to the reference copy"
              fi
            done
          fi
          # THE DERIVATION'S FAIL-OPEN, CLOSED, exactly as the check above closes its own. Everything
          # here is reached from a JDL that says `messageBroker kafka`. A service whose JDL loses that
          # line, or one added without a JDL, keeps its config file and its bound supplier while every
          # verdict above stays green about the services it did reach.
          for found in $(find . -path '*/src/main/resources/config/application-kafka.yml' -not -path './*/target/*' | sed 's|^\./||' | sort); do
            case " $derived " in
              *" $found "*) ;;
              *)
                echo "::error file=$found::$found exists but no jdl/*.jdl declaring messageBroker kafka points at it, so nothing above checked what it binds. See decisions.md D62."
                fail=1
                ;;
            esac
          done
          if [ "$scanned" -eq 0 ]; then
            echo "::error::no application declaring messageBroker kafka was scanned — this check passed having looked at nothing. See decisions.md D62."
            fail=1
          else
            echo "scanned $scanned applications declaring messageBroker kafka"
          fi
          exit "$fail"

      # An unparseable rules file is only discovered when Mimir silently declines to load it, and
      # the symptom is an alert that never fires — indistinguishable from a system that is fine.
      - name: The alert rules must parse and stay uniquely named
        run: |
          python3 - <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open('deploy/observability/hc-market-rules.yaml'))
          names = [g['name'] for g in doc['groups']]
          print('groups:', names)
          assert len(names) == len(set(names)), 'duplicate group names within the file'
          # Group names share ONE namespace across every file in Mimir's tenant directory, so a
          # bare name here could collide with the fleet's shared rules and quietly replace them.
          bad = [n for n in names if not n.startswith('hc-market-')]
          assert not bad, f'group names must be prefixed hc-market-: {bad}'
          for g in doc['groups']:
              for r in g['rules']:
                  assert 'alert' in r and 'expr' in r, f'malformed rule in {g["name"]}'
          print('alerts:', sum(len(g['rules']) for g in doc['groups']))
          PY
